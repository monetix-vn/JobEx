fact: steered_auditor_sample
severity: 5
category: integrity
en: 'you tried to steer the auditor towards the clean months'
vi: 'bạn cố dẫn kiểm toán viên tới những tháng sạch'
lesson:
  en: 'Choosing what the auditor sees is not cooperating with the audit. Even when it works, you have made yourself the thing being tested.'
  vi: 'Chọn điều kiểm toán viên được thấy không phải là hợp tác với kiểm toán. Kể cả khi thành công, bạn đã biến mình thành đối tượng bị kiểm tra.'
