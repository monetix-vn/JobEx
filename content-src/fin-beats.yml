fact: accepted_smoothing_condition
severity: 3
category: integrity
en: 'you accepted a promotion without asking what it would cost you'
vi: 'bạn nhận thăng chức mà không hỏi nó sẽ khiến bạn phải đánh đổi gì'
lesson:
  en: 'A promotion with an unspoken condition is a promise made in the dark. The first time it comes up, you will be deciding with less room than you have today.'
  vi: 'Một lần thăng chức với điều kiện không nói ra là lời hứa trong bóng tối. Lần đầu nó xuất hiện, bạn sẽ phải quyết định với ít chỗ xoay xở hơn hôm nay.'
traces:
