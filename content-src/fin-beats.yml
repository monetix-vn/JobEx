fact: backdated_invoice_entry
severity: 8
category: integrity
en: 'you changed the dates on an invoice to make it match'
vi: 'bạn sửa ngày trên hóa đơn cho khớp'
lesson:
  en: 'An invoice date is evidence, not a setting. Changing it after the fact is falsifying a document, however small the difference looks.'
  vi: 'Ngày trên hóa đơn là bằng chứng, không phải một thiết lập. Sửa sau sự việc là làm giả tài liệu, dù chênh lệch trông nhỏ đến đâu.'
traces:
  - { type: document, visibility: 0.8, detectors: [internal_audit, buyer, finance] }
