        vi: 'Công cụ chống thất thoát dữ liệu của IT ghi lại việc sao chép trong một giờ. Chị Thảo và một luật sư đã có mặt trong văn phòng anh/chị trước khi anh/chị báo anh Quang.'
        effects:
          [
            rel hieu trust +1,
            rel thao trust -12,
            rel quang trust -8,
            rep.boss -14,
            stress +9,
            fact leaked_client_list public,
