scene: inv.thao_asks_trades
place: meeting_room
tags: [audit, integrity, dark, consequence]
weight: 6
cooldown: 52
when: [month in 10 11 12, turn >= 40, fact.traded_restricted_security >= 1]
lines:
  - who: char:thao
    en: 'I have a hit on the restricted-list check: a purchase of a restricted security by an account linked to you. I would like you to tell me about it, before I tell the regulator that you have been invited to explain.'
    vi: 'Chị có một kết quả trên đối chiếu danh sách hạn chế: một lần mua chứng khoán bị hạn chế bởi tài khoản liên kết với em. Chị muốn em nói về nó trước khi chị báo cơ quan quản lý rằng em được mời giải trình.'
choices:
  - en: "Tell her everything, give her your statements and the relative's account details, and accept the consequences."
    vi: 'Nói hết với chị, đưa sao kê và thông tin tài khoản của người thân và chấp nhận hậu quả.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Thao is quiet. 'Thank you for being complete.' The firm disciplines you, takes the profit, and reports it to the regulator as a self-report. You keep your career, with a mark on it."
        vi: "Chị Thảo im lặng. 'Cảm ơn em đã đầy đủ.' Công ty kỷ luật anh/chị, thu lợi nhuận và báo cáo cho cơ quan quản lý như một lần tự báo cáo. Anh/chị giữ được sự nghiệp, kèm một vết."
        effects:
          [
            rel thao trust +2,
            rel quang trust -3,
            rep.boss -8,
            stress +7,
            fact came_clean_to_auditor witnessed,
          ]
  - en: 'Say you did not know the stock was restricted, and offer to sell it.'
    vi: 'Nói anh/chị không biết cổ phiếu bị hạn chế và đề nghị bán.'
    outcomes:
      - p: 0.3
        en: 'Thao accepts, for now, and watches the sale. Your emails about the list do not arise, and you do not relax.'
        vi: 'Chị Thảo chấp nhận, tạm thời, và theo dõi việc bán. Các email của anh/chị về danh sách không xuất hiện, và anh/chị không thả lỏng.'
        effects: [rel thao trust -4, stress +5]
      - p: 0.7
        ok: false
        en: "Hieu, asked, produces your message: 'It is probably fine.' Thao reads it, and then reads the restricted-list notice that was in your inbox."
        vi: "Anh Hiếu, được hỏi, đưa ra tin nhắn của anh/chị: 'Chắc ổn.' Chị Thảo đọc nó, rồi đọc thông báo danh sách hạn chế đã nằm trong hộp thư của anh/chị."
        effects:
          [rel thao trust -12, rel hieu trust -8, rel quang trust -6, rep.boss -12, stress +9]
  - en: 'Say you will answer nothing until you have spoken to a lawyer.'
    vi: 'Nói anh/chị sẽ không trả lời gì cho đến khi nói chuyện với luật sư.'
    outcomes:
      - p: 0.5
        en: 'Thao writes down the request calmly. You are suspended while the firm decides, and nobody tells you how long.'
        vi: 'Chị Thảo ghi lại yêu cầu một cách bình tĩnh. Anh/chị bị đình chỉ trong khi công ty quyết định, và không ai nói bao lâu.'
        effects:
          [
            rel thao trust -4,
            rel quang trust -3,
            rep.boss -6,
            stress +6,
            fact refused_to_cooperate private,
          ]
      - p: 0.5
        ok: false
        en: 'The firm treats silence as an answer and tells the regulator it is unable to vouch for you. By Friday, your accounts are frozen pending review.'
        vi: 'Công ty coi im lặng là một câu trả lời và báo cơ quan quản lý rằng không thể bảo đảm cho anh/chị. Đến thứ Sáu, tài khoản của anh/chị bị đóng băng chờ xem xét.'
        effects:
          [
            rel thao trust -10,
            rel quang trust -8,
            rep.boss -12,
            stress +9,
            fact refused_to_cooperate public,
          ]
