scene: inv.late_edit
place: meeting_room
tags: [integrity, pressure, dark]
weight: 1.2
cooldown: 20
when: [turn >= 10]
lines:
  - who: char:trang
    en: "The deck needs a slide that shows the client's earnings are growing steadily. The numbers show a dip in the third quarter. I want the slide to tell the story, not the dip. Can you smooth it? Call it 'normalised'."
    vi: "Hồ sơ cần một trang cho thấy lợi nhuận của khách tăng đều. Số liệu cho thấy một chỗ lõm ở quý ba. Chị muốn trang đó kể câu chuyện, không phải chỗ lõm. Em làm mượt được không? Gọi là 'đã chuẩn hóa'."
choices:
  - en: 'Show the dip, explain it with the one-off cause, and normalise only for that cause, with the adjustment disclosed on the slide.'
    vi: 'Cho thấy chỗ lõm, giải thích bằng nguyên nhân một lần và chỉ chuẩn hóa cho nguyên nhân đó, với điều chỉnh được công bố ngay trên trang.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.75
        en: "Trang looks at the slide. 'That is a stronger story, actually.' The adjusted line is honest, and the dip is explained. The client's CFO says it is the cleanest deck he has seen."
        vi: "Chị Trang nhìn trang. 'Thực ra đó là câu chuyện mạnh hơn.' Dòng đã điều chỉnh trung thực, và chỗ lõm được giải thích. Giám đốc tài chính của khách nói đây là hồ sơ sạch nhất ông từng thấy."
        effects: [rel trang trust +3, rel quang trust +2, stress +2]
      - p: 0.25
        ok: false
        en: 'Trang says the explanation takes too much space. She cuts it herself, leaving the adjusted line without the note. You told her, and it went anyway.'
        vi: 'Chị Trang nói lời giải thích chiếm quá nhiều chỗ. Chị tự cắt nó, để dòng điều chỉnh mà không có ghi chú. Anh/chị đã nói với chị, và nó vẫn đi.'
        effects:
          [
            rel trang trust -1,
            rel quang trust +1,
            stress +3,
            fact objected_to_assumptions witnessed,
          ]
  - en: 'Say you will smooth only what a footnote can justify, and send her both versions.'
    vi: 'Nói anh/chị chỉ làm mượt phần một chú thích biện minh được và gửi chị cả hai phiên bản.'
    outcomes:
      - p: 1
        en: 'Trang picks the footnoted version. It is a middle path, and the footnote is small but present.'
        vi: 'Chị Trang chọn phiên bản có chú thích. Một con đường trung gian, và chú thích nhỏ nhưng có.'
        effects: [rel trang trust +1, stress +2]
  - en: "Smooth the quarter and label the series 'normalised' without saying what was normalised."
    vi: "Làm mượt quý đó và ghi chuỗi số là 'đã chuẩn hóa' mà không nói điều gì đã được chuẩn hóa."
    outcomes:
      - p: 0.65
        en: "The slide is beautiful. Trang uses it in the pitch, and the client signs. The word 'normalised' stands for a lot."
        vi: "Trang rất đẹp. Chị Trang dùng nó trong buổi chào và khách ký. Từ 'đã chuẩn hóa' đại diện cho rất nhiều điều."
        effects: [rel trang trust +5, rep.boss +2, stress +1, fact smoothed_earnings_slide private]
      - p: 0.35
        ok: false
        en: 'An investor asks for the unadjusted series. It is sent. The two lines are compared in a meeting, and nobody quite looks at you.'
        vi: 'Một nhà đầu tư xin chuỗi số chưa điều chỉnh. Nó được gửi. Hai đường được so trong một cuộc họp, và không ai thật sự nhìn anh/chị.'
        effects:
          [
            rel trang trust -3,
            rel quang trust -5,
            rep.boss -9,
            stress +6,
            fact smoothed_earnings_slide public,
          ]
