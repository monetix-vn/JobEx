fact: traded_restricted_security
severity: 7
category: integrity
en: "you bought a security on the restricted list through an account in a relative's name"
vi: 'bạn mua một chứng khoán trong danh sách hạn chế qua tài khoản mang tên người thân'
lesson:
  en: 'A restricted list is a list of companies you know too much about. It is only effective if nobody decides it does not apply to them this once.'
  vi: 'Danh sách hạn chế là danh sách các công ty bạn biết quá nhiều. Nó chỉ có hiệu lực nếu không ai tự quyết rằng lần này nó không áp dụng với mình.'
