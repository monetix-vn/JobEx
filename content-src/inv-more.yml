scene: inv.scapegoat_meeting
place: meeting_room
tags: [audit, pressure, consequence]
weight: 6
cooldown: 52
when: [month in 11 12, turn >= 44, fact.misled_investor >= 2]
lines:
  - who: char:trang
    en: 'The regulator has opened an inquiry into the IPO documents. The question is who prepared the growth assumptions and who told the client what to say to investors. The partners will meet tomorrow. I need to hear what you will say.'
    vi: 'Cơ quan quản lý đã mở điều tra tài liệu IPO. Câu hỏi là ai chuẩn bị các giả định tăng trưởng và ai bảo khách nói gì với nhà đầu tư. Các đối tác sẽ họp ngày mai. Chị cần nghe em sẽ nói gì.'
choices:
  - en: 'Say what you did: the assumption you built, what you were asked to do, what you objected to and what you did not.'
    vi: 'Nói điều anh/chị đã làm: giả định anh/chị dựng, điều được yêu cầu, điều anh/chị phản biện và điều không.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Trang listens, and says, finally: 'It is more than I expected from anyone.' The partners treat it as a firm-level failure, not a personal one. You are suspended, and eventually cleared with a formal reprimand."
        vi: "Chị Trang lắng nghe và cuối cùng nói: 'Nhiều hơn chị mong từ bất cứ ai.' Các đối tác coi đó là thất bại cấp công ty, không phải cá nhân. Anh/chị bị đình chỉ và cuối cùng được xác nhận với khiển trách chính thức."
        effects:
          [
            rel trang trust +2,
            rel quang trust +3,
            rep.boss -6,
            stress +7,
            fact came_clean_to_auditor witnessed,
          ]
  - en: 'Say that you built the model as instructed and that the client and Trang chose the assumptions.'
    vi: 'Nói rằng anh/chị dựng mô hình theo chỉ đạo và khách cùng chị Trang chọn các giả định.'
    outcomes:
      - p: 0.4
        en: 'The partners nod. Trang takes the weight of it, quietly, and never staffs you on a deal again.'
        vi: 'Các đối tác gật đầu. Chị Trang gánh phần nặng, lặng lẽ, và không bao giờ xếp anh/chị vào thương vụ nào nữa.'
        effects:
          [
            rel trang trust -15,
            rel quang trust -3,
            rep.boss -6,
            stress +6,
            fact blamed_the_md private,
          ]
      - p: 0.6
        ok: false
        en: "Trang has your emails, including the one that says 'built to match forty'. She reads it aloud."
        vi: "Chị Trang có email của anh/chị, kể cả cái ghi 'dựng cho khớp bốn mươi'. Chị đọc to lên."
        effects:
          [
            rel trang trust -15,
            rel quang trust -8,
            rep.boss -14,
            stress +10,
            fact blamed_the_md public,
          ]
