# Investment Banking Analyst: the pitch error arc, random incidents, consequences and facts (pack industry-securities).
# Import with: pnpm author content-src/inv-more.yml --pack industry-securities  (after inv-beats.yml and inv-arcs.yml)
arc: pitch_error
title:
  en: 'The error in the pitch'
  vi: 'Lỗi trong hồ sơ chào'
stages:
  - { id: found, event: inv.error_found }
  - { id: decide, event: inv.fix_or_hide, delay: 1-2 }
  - { id: client, event: inv.client_notices, delay: 3-6 }
---
scene: inv.error_found
arc: pitch_error
place: meeting_room
tags: [integrity, pressure]
weight: 2.5
cooldown: 40
when: [turn >= 12, turn <= 40]
lines:
  - who: char:hieu
    en: "Bad news. I was checking last week's pitch book against the source data, and the comparable companies page is wrong. We used the wrong year for two of the multiples. The book went to the client on Monday. On the corrected numbers, their valuation is eleven percent lower than we said."
    vi: 'Tin xấu. Em đang kiểm hồ sơ chào tuần trước với dữ liệu gốc, và trang công ty so sánh sai. Mình dùng nhầm năm cho hai bội số. Hồ sơ gửi cho khách hôm thứ Hai. Với số đã sửa, định giá của họ thấp hơn mười một phần trăm so với mình nói.'
choices:
  - en: 'Tell Quang today, prepare the corrected page, and propose how to tell the client.'
    vi: 'Báo anh Quang hôm nay, chuẩn bị trang đã sửa và đề xuất cách báo khách.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: "Quang winces, and then says: 'Thank you. Now we have a day to do this properly.' The client is told the same evening, with the corrected page. They are not pleased, and they remain a client."
        vi: "Anh Quang nhăn mặt rồi nói: 'Cảm ơn. Giờ mình có một ngày để làm cho đúng.' Khách được báo ngay tối đó, kèm trang đã sửa. Họ không hài lòng, và vẫn là khách."
        effects:
          [
            rel quang trust +5,
            rel hieu trust +2,
            rel phong trust -2,
            stress +4,
            arc pitch_error end,
          ]
      - p: 0.2
        ok: false
        en: "The client has already circulated the old book to its board. The correction is awkward, and the board is told. Trang says: 'It would have been worse later.'"
        vi: "Khách đã gửi hồ sơ cũ cho hội đồng của họ. Việc sửa lúng túng, và hội đồng được báo. Chị Trang nói: 'Để sau còn tệ hơn.'"
        effects:
          [
            rel quang trust +3,
            rel trang trust -1,
            rel phong trust -5,
            stress +6,
            arc pitch_error end,
          ]
  - en: 'Ask Hieu to check it again with you tonight, before deciding who to tell.'
    vi: 'Nhờ anh Hiếu cùng kiểm lại tối nay trước khi quyết định báo ai.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'You confirm the error at midnight. It is real. You have lost a day, and you now both know.'
        vi: 'Anh/chị xác nhận lỗi lúc nửa đêm. Là thật. Anh/chị mất một ngày, và cả hai đều đã biết.'
        effects: [rel hieu trust +3, stress +4, arc pitch_error decide]
  - en: 'Tell Hieu it is probably fine, the client has not noticed, and the next book can be right.'
    vi: 'Nói với anh Hiếu chắc ổn, khách chưa để ý và hồ sơ sau có thể đúng.'
    outcomes:
      - p: 0.7
        en: 'Hieu looks relieved and a little troubled. The next book is right. The client keeps the old figure in its head, and in its board paper.'
        vi: 'Anh Hiếu nhẹ nhõm và hơi băn khoăn. Hồ sơ sau đúng. Khách giữ con số cũ trong đầu, và trong tài liệu hội đồng.'
        effects:
          [
            rel hieu trust +1,
            stress +2,
            fact left_pitch_error_uncorrected private,
            arc pitch_error client,
          ]
      - p: 0.3
        ok: false
        en: "The client's analyst compares the two books side by side, and sends a polite note asking which numbers are correct."
        vi: 'Chuyên viên của khách so hai hồ sơ cạnh nhau và gửi một ghi chú lịch sự hỏi con số nào đúng.'
        effects:
          [
            rel hieu trust -2,
            rel quang trust -5,
            rel phong trust -5,
            stress +5,
            fact left_pitch_error_uncorrected witnessed,
            arc pitch_error client,
          ]
---
scene: inv.fix_or_hide
weight: 0
place: meeting_room
tags: [integrity, pressure, dark, arc]
lines:
  - who: char:quang
    en: 'Hieu told me there is an error in the pitch. I am not going to ask you to hide it. But the MD is at the client dinner tonight and I do not want to ruin it. Can we tell the client tomorrow, rather than tonight, with the corrected numbers ready?'
    vi: 'Anh Hiếu nói với anh có lỗi trong hồ sơ chào. Anh sẽ không nhờ em giấu. Nhưng chị giám đốc đang ở bữa tối với khách tối nay và anh không muốn phá hỏng. Mình báo khách ngày mai thay vì tối nay, với số liệu đã sửa sẵn, được không?'
choices:
  - en: 'Say yes to tomorrow morning, in writing, with the corrected numbers and a short explanation, sent before the client starts work.'
    vi: 'Đồng ý sáng mai bằng văn bản, kèm số liệu đã sửa và lời giải thích ngắn, gửi trước khi khách bắt đầu làm việc.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'The note goes at 7 a.m. Phong calls Trang at 7:20, annoyed, and by 9 he is asking how to fix the structure. The dinner went well, and the correction did not spoil it.'
        vi: 'Ghi chú gửi lúc bảy giờ sáng. Ông Phong gọi chị Trang lúc bảy giờ hai mươi, bực bội, và đến chín giờ ông hỏi cách sửa cấu trúc. Bữa tối diễn ra tốt, và việc sửa không làm hỏng nó.'
        effects:
          [
            rel quang trust +3,
            rel trang trust +2,
            rel phong trust +1,
            stress +3,
            arc pitch_error end,
          ]
  - en: 'Say no: the client should know tonight, before Trang eats with them.'
    vi: 'Nói không: khách nên biết tối nay, trước khi chị Trang ăn cùng họ.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.7
        en: 'Quang calls Trang. She excuses herself and tells Phong at the table. It is a terrible dinner and a very trusting client the next day.'
        vi: 'Anh Quang gọi chị Trang. Chị xin phép ra ngoài và nói với ông Phong ngay bàn ăn. Một bữa tối tệ và một khách rất tin tưởng ngày hôm sau.'
        effects:
          [
            rel quang trust +1,
            rel trang trust -1,
            rel phong trust +3,
            stress +4,
            arc pitch_error end,
          ]
      - p: 0.3
        ok: false
        en: 'Trang is angry that she was not asked. She tells you so, afterwards. She is also, a week later, the one who quotes the episode to a new analyst.'
        vi: 'Chị Trang giận vì không được hỏi. Chị nói với anh/chị sau đó. Một tuần sau, chị cũng là người kể lại chuyện này cho một chuyên viên mới.'
        effects:
          [
            rel quang trust +1,
            rel trang trust -3,
            rel phong trust +3,
            stress +4,
            arc pitch_error end,
          ]
  - en: "Change the page in the shared drive before the client opens it, and keep the old version's date, so the book looks as if it was always right."
    vi: 'Đổi trang trong ổ chung trước khi khách mở và giữ ngày của bản cũ để hồ sơ trông như luôn đúng.'
    outcomes:
      - p: 0.55
        en: 'The page now says the corrected numbers. The client does not know that it has changed. You have corrected the error and hidden that it existed.'
        vi: 'Trang giờ ghi số liệu đã sửa. Khách không biết nó đã thay đổi. Anh/chị đã sửa lỗi và giấu việc nó từng tồn tại.'
        effects:
          [rel quang trust +2, stress +2, fact hid_model_error private, arc pitch_error client]
      - p: 0.45
        ok: false
        en: "The client downloaded the book on Monday. The two versions differ, and the file's modification time is a Tuesday midnight."
        vi: 'Khách đã tải hồ sơ hôm thứ Hai. Hai phiên bản khác nhau, và thời gian sửa tệp là nửa đêm thứ Ba.'
        effects:
          [
            rel quang trust -4,
            rel phong trust -8,
            rep.boss -6,
            stress +6,
            fact hid_model_error public,
            arc pitch_error client,
          ]
---
scene: inv.client_notices
weight: 0
place: meeting_room
tags: [integrity, client, dark, consequence, arc]
lines:
  - who: char:phong
    en: 'My CFO compared the book you sent on Monday with the numbers your team gave us in the meeting. There is an eleven percent difference. I would like an explanation, and I would like it to be true.'
    vi: 'Giám đốc tài chính của tôi so hồ sơ gửi hôm thứ Hai với số liệu nhóm anh/chị đưa trong cuộc họp. Có chênh lệch mười một phần trăm. Tôi muốn một lời giải thích, và tôi muốn nó là sự thật.'
choices:
  - en: 'Tell him: there was a data error, how it happened, when you found it, and that you should have told him at once.'
    vi: 'Nói với ông: có một lỗi dữ liệu, nó xảy ra thế nào, khi nào phát hiện và rằng lẽ ra phải báo ngay.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Phong is cold for a minute, then says: 'At least you told me before the investors did.' The relationship survives, with a note on file."
        vi: "Ông Phong lạnh một phút rồi nói: 'Ít nhất anh/chị nói với tôi trước nhà đầu tư.' Quan hệ vẫn còn, kèm một ghi chú trong hồ sơ."
        effects:
          [
            rel phong trust +1,
            rel quang trust +2,
            rel trang trust -1,
            stress +5,
            fact corrected_the_model witnessed,
            arc pitch_error end,
          ]
  - en: "Say the difference was caused by a change in the data provider's definitions."
    vi: 'Nói chênh lệch do nhà cung cấp dữ liệu đổi định nghĩa.'
    outcomes:
      - p: 0.4
        en: "Phong accepts. His CFO does not, and asks for the provider's notice. There is no notice."
        vi: 'Ông Phong chấp nhận. Giám đốc tài chính của ông thì không và yêu cầu thông báo của nhà cung cấp. Không có thông báo.'
        effects: [rel phong trust -4, stress +5, fact misled_investor private, arc pitch_error end]
      - p: 0.6
        ok: false
        en: 'The CFO calls the data provider. The provider says nothing changed. Phong calls Trang, and does not use his polite voice.'
        vi: 'Giám đốc tài chính gọi nhà cung cấp dữ liệu. Họ nói không có gì đổi. Ông Phong gọi chị Trang, và không dùng giọng lịch sự.'
        effects:
          [
            rel phong trust -10,
            rel trang trust -6,
            rel quang trust -5,
            rep.boss -9,
            stress +8,
            fact misled_investor public,
            arc pitch_error end,
          ]
  - en: 'Say you will look into it and come back, and use the time to prepare a story.'
    vi: 'Nói anh/chị sẽ xem xét và quay lại và dùng thời gian đó để chuẩn bị một câu chuyện.'
    outcomes:
      - p: 0.4
        en: 'The story is plausible. The client has moved on to the next question. You carry the lie around like a stone in a shoe.'
        vi: 'Câu chuyện nghe hợp lý. Khách đã chuyển sang câu hỏi tiếp theo. Anh/chị mang lời nói dối như hòn sỏi trong giày.'
        effects: [rel phong trust -2, stress +5, fact misled_investor private, arc pitch_error end]
      - p: 0.6
        ok: false
        en: 'The CFO has the version history. He reads out the times, and the names, in the meeting.'
        vi: 'Giám đốc tài chính có lịch sử phiên bản. Ông đọc to các thời điểm và tên ngay trong cuộc họp.'
        effects:
          [
            rel phong trust -12,
            rel trang trust -8,
            rel quang trust -6,
            rep.boss -12,
            stress +9,
            fact misled_investor public,
            arc pitch_error end,
          ]
---
scene: inv.client_dinner
place: meeting_room
tags: [people, integrity, dark]
weight: 1.5
cooldown: 14
when: [turn >= 8]
lines:
  - who: char:quang
    en: "Phong wants to take the team to a club on Friday. It is his company's account that pays, and he has made it clear that being there matters to him. Have a drink, be seen. And do not tell Compliance. Nobody ever does."
    vi: 'Ông Phong muốn đưa nhóm đến một câu lạc bộ vào thứ Sáu. Tài khoản công ty ông trả, và ông đã nói rõ việc có mặt có ý nghĩa với ông. Uống một ly, để người ta thấy. Và đừng báo bộ phận Tuân thủ. Chẳng ai báo cả.'
choices:
  - en: 'Go for an hour, log the entertainment with Compliance beforehand, and keep to soft drinks and conversation.'
    vi: 'Đi một giờ, đăng ký việc tiếp khách với bộ phận Tuân thủ trước và chỉ uống nước ngọt và trò chuyện.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.85
        en: 'Thao approves the entry the same day. Phong is a little offended by the soft drink. He talks to you for an hour about his children, and trusts you more for it.'
        vi: 'Chị Thảo duyệt mục đăng ký ngay trong ngày. Ông Phong hơi phật ý về ly nước ngọt. Ông nói với anh/chị một giờ về các con của ông, và tin anh/chị hơn vì điều đó.'
        effects: [rel thao trust +3, rel phong trust +3, rel quang trust +1, stress +2]
      - p: 0.15
        ok: false
        en: "Phong notices that you left early, and takes it personally. Quang says: 'You did it right, and you will pay for it with him.'"
        vi: "Ông Phong nhận ra anh/chị về sớm và cho là nhắm vào ông. Anh Quang nói: 'Em làm đúng, và em sẽ phải trả giá với ông ấy.'"
        effects: [rel thao trust +3, rel phong trust -4, rel quang trust +1, stress +3]
  - en: 'Skip it politely, and offer Phong a working breakfast instead.'
    vi: 'Từ chối lịch sự và đề nghị ông Phong một bữa sáng làm việc.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'Phong shrugs. He takes the breakfast. It is less fun for him, and cleaner for everybody.'
        vi: 'Ông Phong nhún vai. Ông nhận bữa sáng. Ít vui hơn với ông, và sạch hơn cho mọi người.'
        effects: [rel phong trust -1, stress +1]
  - en: "Go, drink, and charge your share to the client's account as a 'working dinner'."
    vi: "Đi, uống và tính phần của mình vào tài khoản khách như một 'bữa tối làm việc'."
    outcomes:
      - p: 0.65
        en: "A very good night. Phong is delighted. The expense line reads 'strategy session'. You do not remember the strategy."
        vi: "Một đêm rất vui. Ông Phong rất hài lòng. Dòng chi phí ghi 'buổi chiến lược'. Anh/chị không nhớ chiến lược nào."
        effects:
          [
            rel phong trust +6,
            rel quang trust +2,
            stress -1,
            fact padded_client_entertainment private,
          ]
      - p: 0.35
        ok: false
        en: "The club's receipt and the 'working dinner' time stamp disagree by four hours. Thao reads both in the same week."
        vi: "Hóa đơn của câu lạc bộ và dấu thời gian 'bữa tối làm việc' lệch nhau bốn giờ. Chị Thảo đọc cả hai trong cùng tuần."
        effects:
          [
            rel phong trust +4,
            rel thao trust -7,
            rel quang trust -3,
            rep.boss -4,
            stress +4,
            fact padded_client_entertainment witnessed,
          ]
---
scene: inv.personal_trade
place: meeting_room
tags: [integrity, dark]
weight: 1.2
cooldown: 20
when: [turn >= 8]
terms: [chinese_wall]
lines:
  - who: char:hieu
    en: 'I want to buy shares in the company we pitched last week. No inside information involved, just a feeling. It is on the restricted list, but the list is only updated on Mondays and I do not think it matters. Do you?'
    vi: 'Em muốn mua cổ phiếu công ty mình vừa chào tuần trước. Không có thông tin nội bộ, chỉ là cảm giác. Nó nằm trong danh sách hạn chế, nhưng danh sách chỉ cập nhật vào thứ Hai và em không nghĩ nó quan trọng. Anh/chị nghĩ sao?'
choices:
  - en: 'Tell Hieu that restricted means restricted, including between updates, and that he should not buy and should check with Thao.'
    vi: 'Nói với anh Hiếu hạn chế nghĩa là hạn chế, kể cả giữa các lần cập nhật, và anh không nên mua và nên hỏi chị Thảo.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.85
        en: "Hieu sighs, 'You are right.' He asks Thao, who says: 'Thank you for asking, and no.' He grumbles, and does not do it."
        vi: "Anh Hiếu thở dài, 'Anh/chị đúng.' Anh hỏi chị Thảo, chị nói: 'Cảm ơn đã hỏi, và không.' Anh càu nhàu, và không làm."
        effects: [rel hieu trust -1, rel thao trust +3, stress +1]
      - p: 0.15
        ok: false
        en: 'Hieu does it anyway. You know, and it is not your account. You decide whether it is your business.'
        vi: 'Anh Hiếu vẫn làm. Anh/chị biết, và đó không phải tài khoản của anh/chị. Anh/chị quyết xem đó có phải việc của mình không.'
        effects: [rel hieu trust -3, stress +4]
  - en: 'Say you are not sure and suggest Hieu ask Compliance without naming you.'
    vi: 'Nói anh/chị không chắc và gợi ý anh Hiếu hỏi bộ phận Tuân thủ mà không nêu tên anh/chị.'
    outcomes:
      - p: 1
        en: 'Hieu laughs, but he asks. The answer is no. He does not thank you, and does not blame you either.'
        vi: 'Anh Hiếu cười, nhưng anh hỏi. Câu trả lời là không. Anh không cảm ơn, và cũng không trách anh/chị.'
        effects: [rel thao trust +1, stress +1]
  - en: 'Say it is probably fine, and buy some yourself.'
    vi: 'Nói chắc ổn và tự mua một ít.'
    outcomes:
      - p: 0.6
        en: "The shares rise eight percent. You sell on Monday. Nothing happens. You open a small account in a relative's name for next time."
        vi: 'Cổ phiếu tăng tám phần trăm. Anh/chị bán vào thứ Hai. Không có gì xảy ra. Anh/chị mở một tài khoản nhỏ bằng tên người thân cho lần sau.'
        effects:
          [rel hieu trust +4, cash +12000000, stress +1, fact traded_restricted_security private]
      - p: 0.4
        ok: false
        en: "Thao's restricted-list check runs against the exchange records at the weekend. Two names come up, and one is yours."
        vi: 'Việc đối chiếu danh sách hạn chế của chị Thảo chạy với hồ sơ sở giao dịch vào cuối tuần. Hai cái tên hiện lên, và một là của anh/chị.'
        effects:
          [
            rel hieu trust +3,
            rel thao trust -10,
            rep.boss -8,
            cash +12000000,
            stress +7,
            fact traded_restricted_security public,
          ]
---
scene: inv.headhunter
place: meeting_room
tags: [people, integrity, dark]
weight: 1.2
cooldown: 30
when: [turn >= 14]
lines:
  - who: char:hieu
    en: 'A headhunter called me. A rival firm will pay you twice what you earn here, if you can bring your client list and the model templates. It is just a spreadsheet, they say. Nobody will know. They need an answer by Friday.'
    vi: 'Một headhunter gọi cho em. Công ty đối thủ sẽ trả anh/chị gấp đôi lương hiện tại nếu anh/chị mang theo danh sách khách hàng và mẫu mô hình. Chỉ là một bảng tính, họ nói. Không ai biết. Họ cần câu trả lời trước thứ Sáu.'
choices:
  - en: "Tell the headhunter you are interested in the job, and that you will bring your skills, not the firm's files."
    vi: 'Nói với headhunter anh/chị quan tâm công việc và sẽ mang kỹ năng, không mang hồ sơ của công ty.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.7
        en: "The headhunter says: 'Fair. Most people say yes to everything.' The offer comes back, smaller, with a lawyer's letter about confidentiality. You decide whether you want it."
        vi: "Headhunter nói: 'Công bằng. Phần lớn mọi người nói có với tất cả.' Lời đề nghị quay lại, nhỏ hơn, kèm thư của luật sư về bảo mật. Anh/chị quyết xem có muốn không."
        effects: [rel hieu trust +1, stress +2]
      - p: 0.3
        ok: false
        en: 'The headhunter goes silent. You hear later that they hired someone who agreed. You did the right thing, and you do not feel like it.'
        vi: 'Headhunter im lặng. Sau đó anh/chị nghe họ thuê một người đã đồng ý. Anh/chị làm đúng, và không cảm thấy thế.'
        effects: [rel hieu trust +1, stress +3]
  - en: 'Decline politely and stay.'
    vi: 'Từ chối lịch sự và ở lại.'
    outcomes:
      - p: 1
        en: 'Nothing changes. You think about the double salary for about a week.'
        vi: 'Không có gì thay đổi. Anh/chị nghĩ về mức lương gấp đôi khoảng một tuần.'
        effects: [stress +1]
  - en: 'Say yes, and start copying the client list and the templates to a personal drive.'
    vi: 'Nói có và bắt đầu sao chép danh sách khách hàng và mẫu mô hình sang ổ cá nhân.'
    outcomes:
      - p: 0.6
        en: 'You move on. The new firm is delighted with the list. Your old firm does not notice for three weeks, and then it does.'
        vi: 'Anh/chị chuyển đi. Công ty mới rất hài lòng với danh sách. Công ty cũ không để ý trong ba tuần, rồi để ý.'
        effects:
          [
            rel hieu trust +3,
            rel quang trust -4,
            cash +20000000,
            stress +3,
            fact leaked_client_list private,
          ]
      - p: 0.4
