severity: 6
category: integrity
en: "you smoothed a client's earnings in a presentation and called it normalised without saying how"
vi: 'bạn làm mượt lợi nhuận của khách trong bài trình bày và gọi đó là chuẩn hóa mà không nói cách nào'
