scene: purch.scapegoat_meeting
place: meeting_room
tags: [audit, pressure, consequence]
weight: 6
cooldown: 52
when: [month in 11 12, turn >= 44, fact.blamed_manager >= 2]
lines:
  - who: char:duc
    en: 'Tam has told me his version of the single-supplier decision. You told me yours. They do not match. The directors will decide tomorrow whose version they believe. Is there anything you want to add?'
    vi: 'Anh Tâm đã nói với anh phiên bản của anh ấy về quyết định chọn một nhà cung cấp. Em đã nói phiên bản của em. Chúng không khớp. Ngày mai ban giám đốc sẽ quyết tin phiên bản của ai. Em có muốn nói thêm gì không?'
choices:
  - en: 'Say that you gave Duc a version that blamed Tam, and that the emails show your own recommendation. Correct the record.'
    vi: 'Nói rằng anh/chị đã đưa cho anh Đức một phiên bản đổ lỗi cho anh Tâm và email cho thấy đề xuất của chính anh/chị. Sửa lại hồ sơ.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Duc is silent, then says: 'That is the first honest thing anyone has said about this.' You keep your job, with a formal warning. Tam never quite forgives you, but he respects the correction."
        vi: "Anh Đức im lặng rồi nói: 'Đó là điều trung thực đầu tiên ai đó nói về chuyện này.' Anh/chị giữ được việc, kèm cảnh cáo chính thức. Anh Tâm không bao giờ hoàn toàn tha thứ, nhưng tôn trọng việc sửa sai."
        effects:
          [
            rel duc trust +3,
            rel tam trust +2,
            rep.boss -5,
            stress +6,
            fact came_clean_to_auditor witnessed,
          ]
  - en: 'Stand by your version, and say the emails were taken out of context.'
    vi: 'Giữ nguyên phiên bản của anh/chị và nói các email bị trích ngoài ngữ cảnh.'
    outcomes:
      - p: 0.3
        en: 'The directors split, and give Tam a warning too. Both of you are damaged, and neither is believed.'
        vi: 'Ban giám đốc chia rẽ và cũng cảnh cáo anh Tâm. Cả hai đều bị tổn hại, và không ai được tin.'
        effects: [rel tam trust -10, rep.boss -6, stress +5]
      - p: 0.7
        ok: false
        en: 'The directors read the emails in full. Context is not kind to you. Tam is cleared, and you are dismissed.'
        vi: 'Ban giám đốc đọc trọn các email. Ngữ cảnh không có lợi cho anh/chị. Anh Tâm được minh oan, và anh/chị bị cho thôi việc.'
        effects: [rel tam trust -15, rel duc trust -10, rep.boss -14, stress +9]
