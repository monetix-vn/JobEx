scene: purch.invoice_mismatch
place: finance_office
tags: [process, money]
weight: 1.2
cooldown: 20
when: [turn >= 10]
lines:
  - who: char:hanh
    en: 'A supplier invoice does not match the purchase order: they have charged four percent more, for a surcharge nobody agreed. I have put it on hold. The supplier is calling you every day. What do you want me to do?'
    vi: 'Một hóa đơn nhà cung cấp không khớp với đơn đặt hàng: họ tính cao hơn bốn phần trăm cho một khoản phụ phí không ai thỏa thuận. Chị đã giữ lại. Nhà cung cấp gọi em mỗi ngày. Em muốn chị làm gì?'
choices:
  - en: 'Query the surcharge with the supplier in writing, and ask Finance to pay only the agreed amount until it is settled.'
    vi: 'Hỏi nhà cung cấp về phụ phí bằng văn bản và nhờ Tài chính chỉ trả số đã thỏa thuận cho đến khi giải quyết xong.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.8
        en: 'The supplier withdraws the surcharge with an apology about their billing system. Hanh pays the agreed amount, and notes your name on the file.'
        vi: 'Nhà cung cấp rút phụ phí kèm lời xin lỗi về hệ thống tính tiền. Chị Hạnh trả số đã thỏa thuận và ghi tên anh/chị vào hồ sơ.'
        effects: [rel hanh trust +4, rel tam trust +1, stress +1]
      - p: 0.2
        ok: false
        en: 'The supplier insists and threatens to delay the next delivery. Tam backs you, and the next delivery is two days late.'
        vi: 'Nhà cung cấp khăng khăng và dọa chậm đợt giao tiếp theo. Anh Tâm ủng hộ anh/chị, và đợt giao tiếp theo trễ hai ngày.'
        effects: [rel hanh trust +3, rel tam trust +2, stress +3]
  - en: 'Ask Finance to pay the full invoice and raise the surcharge in the next negotiation.'
    vi: 'Nhờ Tài chính trả đủ hóa đơn và nêu phụ phí trong cuộc đàm phán tiếp theo.'
    outcomes:
      - p: 1
        en: 'Hanh pays, with a note, and frowns. The surcharge is raised later, and it is a weaker position.'
        vi: 'Chị Hạnh trả, kèm ghi chú, và cau mày. Phụ phí được nêu sau, và vị thế yếu hơn.'
        effects: [rel hanh trust -2, stress +1]
  - en: 'Tell Finance to release payment, and ask the supplier for a small personal discount as a thank-you for the quick payment.'
    vi: 'Bảo Tài chính thanh toán và xin nhà cung cấp một khoản giảm giá cá nhân nhỏ như lời cảm ơn vì thanh toán nhanh.'
    outcomes:
      - p: 0.6
        en: 'The supplier agrees, quietly. Your personal discount arrives as a voucher. The company pays the full four percent.'
        vi: 'Nhà cung cấp đồng ý, lặng lẽ. Khoản giảm giá cá nhân của anh/chị đến dưới dạng phiếu mua hàng. Công ty trả đủ bốn phần trăm.'
        effects:
          [rel hanh trust -2, cash +1500000, stress +1, fact accepted_supplier_rebate private]
      - p: 0.4
        ok: false
        en: "The voucher is traced to the supplier's account. Hanh puts the surcharge, the payment and the voucher in one row on her sheet."
        vi: 'Phiếu mua hàng được truy về tài khoản nhà cung cấp. Chị Hạnh đặt phụ phí, khoản thanh toán và phiếu vào một dòng trong bảng của chị.'
        effects:
          [
            rel hanh trust -10,
            rel tam trust -6,
            rep.boss -8,
            cash +1500000,
            stress +6,
            fact accepted_supplier_rebate witnessed,
          ]
