scene: purch.vy_asks_rebate
place: meeting_room
tags: [audit, dark, consequence]
weight: 6
cooldown: 52
when: [month in 10 11, turn >= 38, fact.accepted_supplier_rebate >= 1]
lines:
  - who: char:vy
    en: 'I have been comparing your supplier prices to the market. A few suppliers charge us above market, and I notice that the same suppliers appear in an anonymous note about personal payments. I would like to hear your account of your dealings with them.'
    vi: 'Tôi đã so giá nhà cung cấp của anh/chị với thị trường. Vài nhà cung cấp tính cao hơn thị trường, và tôi để ý chính các nhà cung cấp đó xuất hiện trong một ghi chú nặc danh về các khoản thanh toán cá nhân. Tôi muốn nghe lời kể của anh/chị về việc làm việc với họ.'
choices:
  - en: 'Tell her everything: what was offered, what you accepted, the amounts, and offer your bank records.'
    vi: 'Nói hết với chị: điều được đề nghị, điều anh/chị nhận, số tiền và đưa sao kê ngân hàng của anh/chị.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Vy is quiet. The finding is serious but is recorded as 'self-reported'. The company recovers the amounts, you are dismissed with a reference limited to dates, and you avoid the authorities."
        vi: "Chị Vy im lặng. Kết luận nghiêm trọng nhưng được ghi nhận là 'tự báo cáo'. Công ty thu hồi số tiền, anh/chị bị cho thôi việc với thư xác nhận chỉ ghi ngày tháng và tránh được cơ quan chức năng."
        effects:
          [
            rel vy trust +1,
            rel tam trust -3,
            rep.boss -10,
            stress +8,
            fact came_clean_to_auditor witnessed,
          ]
  - en: "Say the suppliers' prices were agreed on the quotes, and offer the quote files."
    vi: 'Nói giá của các nhà cung cấp được thỏa thuận theo báo giá và đưa hồ sơ báo giá.'
    outcomes:
      - p: 0.3
        en: 'Vy reads the quote files. They are in order. She notes that the anonymous note is unsubstantiated, and moves on.'
        vi: 'Chị Vy đọc hồ sơ báo giá. Chúng đúng quy trình. Chị ghi nhận ghi chú nặc danh chưa có căn cứ và chuyển tiếp.'
        effects: [rel vy trust -2, stress +4]
      - p: 0.7
        ok: false
        en: "Vy has already spoken to a supplier's accountant, who has the payment schedule. It shows monthly transfers to an account with your relative's name."
        vi: 'Chị Vy đã nói chuyện với kế toán của một nhà cung cấp, người có lịch thanh toán. Nó cho thấy các khoản chuyển hằng tháng vào một tài khoản mang tên người thân của anh/chị.'
        effects: [rel vy trust -12, rel tam trust -8, rep.boss -12, stress +9]
  - en: 'Say you will answer nothing until you have spoken to a lawyer.'
    vi: 'Nói anh/chị sẽ không trả lời gì cho đến khi nói chuyện với luật sư.'
    outcomes:
      - p: 0.5
        en: 'Vy writes the request down calmly. You are suspended while the company decides, and nobody tells you how long.'
        vi: 'Chị Vy ghi lại yêu cầu một cách bình tĩnh. Anh/chị bị đình chỉ trong khi công ty quyết định, và không ai nói bao lâu.'
        effects:
          [
            rel vy trust -4,
            rel tam trust -3,
            rep.boss -6,
            stress +6,
            fact refused_to_cooperate private,
          ]
      - p: 0.5
        ok: false
        en: 'The company treats silence as an answer. By Friday, the supplier has been told, and the bank is asked for your records.'
        vi: 'Công ty coi im lặng là một câu trả lời. Đến thứ Sáu, nhà cung cấp đã được báo, và ngân hàng được hỏi hồ sơ của anh/chị.'
        effects:
          [
            rel vy trust -10,
            rel tam trust -8,
            rep.boss -12,
            stress +9,
            fact refused_to_cooperate public,
          ]
