scene: purch.conflict_of_interest
place: sales_office
tags: [process, integrity, dark]
weight: 1.2
cooldown: 30
when: [turn >= 12]
lines:
  - who: char:tam
    en: 'I noticed one of the shortlisted packaging suppliers is owned by your cousin. It might be nothing. It might be the best offer. But I want to hear from you before anyone else raises it.'
    vi: 'Anh để ý một trong các nhà cung cấp bao bì lọt vào danh sách ngắn do em họ của em làm chủ. Có thể không có gì. Có thể là đề nghị tốt nhất. Nhưng anh muốn nghe từ em trước khi ai khác nêu lên.'
choices:
  - en: 'Declare the relationship in writing, ask Tam to take the decision, and step out of that evaluation.'
    vi: 'Khai báo mối quan hệ bằng văn bản, nhờ anh Tâm quyết định và rút khỏi phần đánh giá đó.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.85
        en: "Tam records the declaration and runs the evaluation himself. Your cousin's firm wins, fairly, and everyone knows it was not you."
        vi: 'Anh Tâm ghi nhận khai báo và tự điều hành đánh giá. Công ty của em họ anh/chị thắng, công bằng, và ai cũng biết không phải do anh/chị.'
        effects: [rel tam trust +5, rep.boss +3, fact declared_conflict_of_interest witnessed]
      - p: 0.15
        ok: false
        en: "Your cousin's firm loses. Your cousin is hurt, and says so at the next family dinner. You made the right decision and it costs you at home."
        vi: 'Công ty của em họ anh/chị thua. Em họ tổn thương và nói ra trong bữa cơm gia đình tới. Anh/chị quyết đúng và phải trả giá ở nhà.'
        effects:
          [rel tam trust +5, rep.boss +2, stress +3, fact declared_conflict_of_interest witnessed]
  - en: 'Say the relationship is distant and will not affect your judgement, and offer to keep your scoring sheet open for review.'
    vi: 'Nói mối quan hệ xa và sẽ không ảnh hưởng phán đoán của anh/chị và đề nghị để bảng chấm điểm mở cho người khác xem xét.'
    outcomes:
      - p: 1
        en: 'Tam says he will review the scores himself. It is an acceptable halfway: declared, but not fully removed.'
        vi: 'Anh Tâm nói anh sẽ tự xem điểm. Một nửa chặng chấp nhận được: đã khai báo, nhưng chưa hoàn toàn rút lui.'
        effects: [rel tam trust +1, stress +1]
  - en: "Say you did not know, and quietly steer the scoring so your cousin's firm wins."
    vi: 'Nói anh/chị không biết và lặng lẽ điều chỉnh việc chấm điểm để công ty em họ thắng.'
    outcomes:
      - p: 0.6
        en: "Your cousin's firm wins by two points. Your cousin thanks you at the next family dinner, loudly. The score sheet is neater than the real discussion was."
        vi: 'Công ty của em họ anh/chị thắng hai điểm. Em họ cảm ơn anh/chị trong bữa cơm gia đình, to tiếng. Bảng điểm gọn gàng hơn cuộc thảo luận thật.'
        effects: [rel tam trust -2, stress +2, fact hid_conflict_of_interest private]
      - p: 0.4
        ok: false
        en: "Dung mentions, innocently, that your cousin's firm has your phone number on speed dial. Duc asks to see the scoring."
        vi: 'Anh Dũng nhắc, ngây thơ, rằng công ty em họ anh/chị lưu số điện thoại của anh/chị ở quay số nhanh. Anh Đức xin xem bảng chấm điểm.'
        effects:
          [
            rel tam trust -8,
            rel duc trust -6,
            rep.boss -8,
            stress +6,
            fact hid_conflict_of_interest public,
          ]
