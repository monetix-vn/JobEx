scene: purch.small_supplier
place: sales_office
tags: [supplier, people, pressure]
weight: 1.3
cooldown: 30
when: [turn >= 8]
lines:
  - who: char:linh
    en: 'I am sorry to ask. Our biggest customer has paid us late for ninety days and I cannot pay my own steel suppliers. If you could pay our invoice early, even a few weeks, I can keep the doors open. I know there are rules.'
    vi: 'Em xin lỗi vì phải hỏi. Khách hàng lớn nhất của em trả muộn chín mươi ngày và em không thể trả tiền thép cho các nhà cung cấp của mình. Nếu anh/chị thanh toán hóa đơn của em sớm, dù chỉ vài tuần, em có thể giữ cửa hàng mở. Em biết có quy tắc.'
choices:
  - en: 'Explain the payment terms, ask Finance whether an early-payment arrangement is possible, and offer a small discount in return.'
    vi: 'Giải thích điều khoản thanh toán, hỏi Tài chính xem có thể thỏa thuận thanh toán sớm không và đề nghị chiết khấu nhỏ đổi lại.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.7
        en: 'Hanh approves early payment at a one percent discount. Linh gets cash in ten days, and the company gets a fair price. It is an honest, written arrangement.'
        vi: 'Chị Hạnh duyệt thanh toán sớm với chiết khấu một phần trăm. Chị Linh có tiền trong mười ngày, và công ty có giá hợp lý. Một thỏa thuận trung thực bằng văn bản.'
        effects: [rel linh trust +6, rel hanh trust +3, rel tam trust +1, stress +1]
      - p: 0.3
        ok: false
        en: 'Finance says no exception can be made this month. Linh thanks you quietly and says she will manage. She does not look as if she will.'
        vi: 'Tài chính nói không có ngoại lệ trong tháng này. Chị Linh cảm ơn khẽ và nói chị sẽ xoay xở. Chị không có vẻ sẽ xoay xở được.'
        effects: [rel linh trust +3, stress +3]
  - en: 'Tell her the rules do not allow it, and wish her well.'
    vi: 'Nói với chị quy tắc không cho phép và chúc chị may mắn.'
    outcomes:
      - p: 1
        en: 'Linh nods. She is not angry. Three weeks later, her cutting line is for sale, and the second-source option goes with it.'
        vi: 'Chị Linh gật đầu. Chị không giận. Ba tuần sau, chuyền cắt của chị được rao bán, và phương án nguồn thứ hai đi theo.'
        effects: [rel linh trust -3, stress +1]
  - en: 'Pay her invoice a month early without telling Finance, and ask her to keep it quiet.'
    vi: 'Thanh toán hóa đơn của chị sớm một tháng mà không báo Tài chính và nhờ chị giữ kín.'
    outcomes:
      - p: 0.6
        en: 'Linh keeps her business alive and is grateful beyond words. You have broken a payment control for a good reason, and nobody knows.'
        vi: 'Chị Linh giữ được cửa hàng và biết ơn không lời nào tả. Anh/chị đã phá một kiểm soát thanh toán vì lý do tốt, và không ai biết.'
        effects:
          [
            rel linh trust +8,
            rel linh owed +2,
            stress +1,
            fact paid_supplier_early_unauthorised private,
          ]
      - p: 0.4
        ok: false
        en: "Hanh sees a payment outside the run. She asks who authorised it, and what the supplier's relationship to you is. The good reason is not on file."
        vi: 'Chị Hạnh thấy một khoản thanh toán ngoài đợt chi. Chị hỏi ai ủy quyền và quan hệ của nhà cung cấp với anh/chị là gì. Lý do tốt không có trong hồ sơ.'
        effects:
          [
            rel linh trust +5,
            rel hanh trust -9,
            rel tam trust -5,
            rep.boss -6,
            stress +5,
            fact paid_supplier_early_unauthorised witnessed,
          ]
