# Purchasing Buyer (docs/story/purchasing.md): cast and beats. Tam (boss), Hung (supplier), Khoa, Lan, Duc, Hanh and Vy already exist.
char: linh
department: supplier
traits: [honest, small_business, overstretched]
start: { trust: 10 }
en: { name: 'Ms Linh', title: 'Owner, small steel trader' }
vi: { name: 'Chị Linh', title: 'Chủ cơ sở kinh doanh thép nhỏ' }
---
char: dung
department: warehouse
group: production
traits: [careful, quiet, keeps_a_count]
start: { trust: 10, loyalty: 5 }
