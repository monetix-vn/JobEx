fact: backfilled_quotes
severity: 7
category: integrity
en: 'you added quotes to the files after the fact to make the three-quote rule look followed'
vi: 'bạn thêm báo giá vào hồ sơ sau sự việc để quy tắc ba báo giá trông như được tuân thủ'
lesson:
  en: 'The three-quote rule exists to test the price. Quotes written afterwards test nothing, and they are a falsified record.'
  vi: 'Quy tắc ba báo giá có để kiểm tra giá. Báo giá viết sau không kiểm tra gì, và chúng là hồ sơ làm giả.'
