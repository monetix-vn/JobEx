scene: mkt.lam_asks_substantiation
place: meeting_room
tags: [audit, regulator, dark, consequence]
weight: 6
cooldown: 52
when: [month in 10 11, turn >= 40]
when_any:
  [
    fact.overclaimed_on_packaging >= 1,
    fact.shipped_with_known_false_claim >= 1,
    fact.bought_fake_reviews >= 1,
    fact.greenwashed_claim >= 1,
    fact.undisclosed_influencer >= 1,
  ]
lines:
  - who: char:lam
    en: 'I have received complaints from customers and from a competitor. They say that the coating claim on the packaging is not supported, that product reviews were posted by accounts connected to the agency, and that an environmental claim covers products that contain no recycled material. I would like to see the evidence, and hear from the person who prepared the content.'
    vi: 'Tôi nhận được khiếu nại từ khách hàng và từ một đối thủ. Họ nói lời về lớp phủ trên bao bì không được ủng hộ, các đánh giá sản phẩm được đăng bởi tài khoản liên quan đến agency và một lời về môi trường bao trùm cả sản phẩm không chứa vật liệu tái chế. Tôi muốn xem bằng chứng và nghe từ người đã chuẩn bị nội dung.'
choices:
  - en: 'Tell him what happened: who asked, what you agreed, what the evidence showed and what you are already correcting. Give him the register and the reports.'
    vi: 'Kể ông nghe chuyện đã xảy ra: ai nhờ, anh/chị đã đồng ý gì, bằng chứng cho thấy gì và anh/chị đang sửa gì. Đưa ông sổ đăng ký và các báo cáo.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Lam writes it all down. The finding is serious, but it is recorded as 'self-reported and corrected'. The claims are withdrawn, the reviews are deleted, and you receive a formal warning."
        vi: "Anh Lâm ghi lại tất cả. Phát hiện nghiêm trọng, nhưng được ghi nhận là 'tự báo cáo và đã sửa'. Các lời quảng cáo bị rút, các đánh giá bị xóa, và anh/chị nhận cảnh cáo chính thức."
        effects:
          [
            rel lam trust +2,
            rel quyen trust -2,
            rel khoa trust +3,
            rep.boss -5,
            stress +6,
            fact came_clean_to_auditor witnessed,
          ]
  - en: "Give him the files and say that the claims were approved by Bao and Mr Cuong, and that the reviews were the agency's work."
    vi: 'Đưa ông các hồ sơ và nói các lời quảng cáo do anh Bảo và anh Cường duyệt và các đánh giá là việc của agency.'
    outcomes:
      - p: 0.4
        en: 'Lam notes that the register has your name on each claim. He writes it down, carefully.'
        vi: 'Anh Lâm ghi rằng sổ đăng ký có tên anh/chị trên từng lời quảng cáo. Anh ghi lại, cẩn thận.'
        effects: [rel lam trust -5, rel quyen trust -4, rep.boss -4, stress +4]
      - p: 0.6
        ok: false
        en: 'Khoa and Dat are both asked. Khoa has the reports with the dates, and Dat has the emails with your approvals. Lam lays the two sets on the table.'
        vi: 'Anh Khoa và anh Đạt đều được hỏi. Anh Khoa có các báo cáo kèm ngày và anh Đạt có các email kèm phê duyệt của anh/chị. Anh Lâm đặt hai bộ lên bàn.'
        effects:
          [
            rel lam trust -10,
            rel khoa trust -8,
            rel dat trust -8,
            rel quyen trust -8,
            rep.boss -10,
            stress +8,
          ]
  - en: 'Say you do not recall the details, and offer to look.'
    vi: 'Nói anh/chị không nhớ chi tiết và đề nghị đi tìm.'
    outcomes:
      - p: 0.4
        en: 'Lam gives you a week. You find the files and hand them over. It is not the whole truth, but it is something.'
        vi: 'Anh Lâm cho anh/chị một tuần. Anh/chị tìm thấy hồ sơ và nộp. Không phải toàn bộ sự thật, nhưng là một phần.'
        effects: [rel lam trust -4, stress +4, fact stalled_the_regulator private]
      - p: 0.6
        ok: false
        en: "The marketplace's records, the web archive and Khoa's report log arrive on the same afternoon. Lam has them on the table next to your notes."
        vi: 'Hồ sơ của sàn, kho lưu trữ web và nhật ký báo cáo của anh Khoa đến cùng một buổi chiều. Anh Lâm để chúng trên bàn cạnh ghi chú của anh/chị.'
        effects:
          [
            rel lam trust -10,
            rel khoa trust -6,
            rep.boss -8,
            stress +7,
            fact stalled_the_regulator witnessed,
          ]
