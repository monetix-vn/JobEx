scene: mkt.green_claim
place: meeting_room
tags: [claims, sustainability, dark]
weight: 2
cooldown: 40
when: [turn >= 12]
lines:
  - who: char:cuong
    en: "Buyers in Europe are asking about sustainability. We use twenty percent recycled aluminium in one line. I want the whole brand to say 'eco-friendly' and to have a green leaf on every box. It is good for the story, and the competition has leaves too."
    vi: "Khách châu Âu đang hỏi về tính bền vững. Mình dùng hai mươi phần trăm nhôm tái chế ở một dòng. Anh muốn cả thương hiệu ghi 'thân thiện môi trường' và có chiếc lá xanh trên mọi hộp. Tốt cho câu chuyện, và đối thủ cũng có lá."
choices:
  - en: "Say exactly what is true: 'twenty percent recycled aluminium in the Terra line', with the source, and offer a plan to raise it, labelled as a plan."
    vi: "Nói đúng điều là thật: 'hai mươi phần trăm nhôm tái chế ở dòng Terra' kèm nguồn và đề xuất kế hoạch nâng lên, ghi nhãn là kế hoạch."
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: "Mr Cuong says it is modest. Anders's buyer says it is the only environmental claim they could verify, and asks for the supplier certificates. You have them."
        vi: 'Anh Cường nói khiêm tốn. Khách của ông Anders nói đó là lời môi trường duy nhất họ kiểm chứng được và xin giấy chứng nhận của nhà cung cấp. Anh/chị có chúng.'
        effects: [rel cuong trust -1, rel quyen trust +3, rep.buyer +3, rep.boss +1, stress +3]
      - p: 0.3
        ok: false
        en: "Mr Cuong dismisses the plan as small. He asks you to 'think bigger'. You offer the plan again with the numbers, and he keeps it on the table."
        vi: "Anh Cường gạt kế hoạch là nhỏ. Anh bảo anh/chị 'nghĩ lớn hơn'. Anh/chị đưa lại kế hoạch kèm số liệu, và anh để nó trên bàn."
        effects: [rel cuong trust -3, rel quyen trust +2, stress +4]
  - en: "Use 'responsibly made' with a small leaf and a link to the recycled-content page for the Terra line."
    vi: "Dùng 'sản xuất có trách nhiệm' với một chiếc lá nhỏ và liên kết đến trang hàm lượng tái chế cho dòng Terra."
    outcomes:
      - p: 1
        en: "The phrase is vague, and the link is exact. A buyer asks what 'responsibly' means, and the page answers."
        vi: "Cụm từ mơ hồ, và liên kết chính xác. Một khách hỏi 'có trách nhiệm' nghĩa là gì, và trang trả lời."
        effects: [rel cuong trust +1, rel quyen trust +1, stress +2]
  - en: "Put 'eco-friendly' and a large leaf on every box in every range, as Mr Cuong asks."
    vi: "In 'thân thiện môi trường' và một chiếc lá lớn lên mọi hộp ở mọi dòng như anh Cường yêu cầu."
    outcomes:
      - p: 0.7
        en: 'The boxes look green and confident. The claim covers eight lines that contain no recycled material at all.'
        vi: 'Các hộp trông xanh và tự tin. Lời quảng cáo bao trùm tám dòng không chứa vật liệu tái chế nào.'
        effects:
          [
            rel cuong trust +5,
            rel quyen trust -2,
            rep.buyer +1,
            stress +1,
            fact greenwashed_claim private,
          ]
      - p: 0.3
        ok: false
        en: "A buyer's sustainability team asks for the evidence for 'eco-friendly' on the standard line. You have nothing to send, and the answer goes to Mr Cuong too."
        vi: "Nhóm bền vững của khách xin bằng chứng cho 'thân thiện môi trường' ở dòng tiêu chuẩn. Anh/chị không có gì để gửi, và câu trả lời cũng đến anh Cường."
        effects:
          [
            rel cuong trust +2,
            rel quyen trust -6,
            rep.boss -5,
            rep.buyer -7,
            stress +6,
            fact greenwashed_claim witnessed,
          ]
