fact: staged_testimonial
severity: 5
category: integrity
en: 'you ran paid actors as real customers in a testimonial'
vi: 'bạn cho diễn viên trả phí đóng vai khách hàng thật trong một lời chứng thực'
lesson:
  en: "A testimonial from a customer who does not exist is a lie with a face. Actors are recognised, and a name like 'the Tran family' invites a search."
  vi: "Lời chứng thực từ một khách hàng không tồn tại là lời dối có gương mặt. Diễn viên bị nhận ra, và một cái tên như 'gia đình ông bà Trần' mời gọi tìm kiếm."
traces:
  - { type: witness, visibility: 0.6, detectors: [buyer, boss] }
witnessed:
  boss: -6
  buyer: -6
public:
  boss: -12
  buyer: -14
