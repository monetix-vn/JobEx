fact: paid_for_award
severity: 4
category: integrity
en: 'you displayed a paid-entry magazine award as if it were an independent honour'
vi: 'bạn trưng bày giải thưởng tạp chí trả phí như một vinh dự độc lập'
lesson:
  en: 'An award that you bought and present as earned spends the credibility of every genuine award you will ever win.'
  vi: 'Một giải thưởng bạn mua và trình bày như đã giành được tiêu hao uy tín của mọi giải thưởng thật bạn sẽ giành được.'
traces:
  - { type: payment, visibility: 0.5, detectors: [buyer, finance, boss] }
witnessed:
  boss: -4
  buyer: -5
public:
  boss: -8
  buyer: -10
