fact: stalled_the_regulator
severity: 5
category: integrity
en: 'you told a consumer-protection inspector that you did not recall details that you did'
vi: 'bạn nói với thanh tra bảo vệ người tiêu dùng rằng bạn không nhớ những chi tiết mà bạn nhớ'
lesson:
  en: "'I do not recall' is a decision when it is not true. The web archive and the lab's report log do not need your memory."
  vi: "'Tôi không nhớ' là một quyết định khi nó không đúng. Kho lưu trữ web và nhật ký báo cáo của phòng thí nghiệm không cần trí nhớ của bạn."
traces:
  - { type: witness, visibility: 0.6, detectors: [boss, qc, internal_audit] }
witnessed:
  boss: -6
  qc: -4
public:
  boss: -10
  qc: -8
