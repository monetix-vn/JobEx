scene: mkt.spend_the_budget
place: finance_office
tags: [budget, spending, dark]
weight: 2
cooldown: 52
when: [month in 11 12, turn >= 40]
lines:
  - who: char:quyen
    en: "We have twenty million left in this year's budget. If we do not spend it by the thirty-first, finance takes it back, and next year's budget will be set on what we spent. I would like you to find a good use for it. Fast, and invoiced this year."
    vi: 'Mình còn hai mươi triệu trong ngân sách năm nay. Nếu không chi trước ngày ba mươi mốt, tài chính thu lại và ngân sách năm sau sẽ lập dựa trên số đã chi. Chị muốn em tìm một cách dùng tốt. Nhanh, và xuất hóa đơn trong năm nay.'
choices:
  - en: 'Spend it on something with value: a customer research survey, a product photography set, or the content library, with deliverables before year end.'
    vi: 'Chi vào thứ có giá trị: một khảo sát nghiên cứu khách hàng, một bộ ảnh sản phẩm hoặc thư viện nội dung, với sản phẩm bàn giao trước cuối năm.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: 'The photography set is delivered on the twentieth. It is used for the next two years. Quyen approves it with a nod.'
        vi: 'Bộ ảnh sản phẩm được giao ngày hai mươi. Nó được dùng hai năm tới. Chị Quyên duyệt bằng một cái gật đầu.'
        effects: [rel quyen trust +3, rep.finance +1, stress +3]
      - p: 0.2
        ok: false
        en: 'The studio cannot deliver before the thirty-first. You spend the money on a smaller, less ideal set, and write down why.'
        vi: 'Studio không giao kịp trước ngày ba mươi mốt. Anh/chị chi vào một bộ nhỏ hơn, kém lý tưởng và ghi lại vì sao.'
        effects: [rel quyen trust +1, stress +4]
  - en: 'Spend what you can use well, return the rest, and tell Quyen the case for budgeting on need rather than on spend.'
    vi: 'Chi phần dùng tốt được, trả lại phần còn lại và nói với chị Quyên lý do nên lập ngân sách theo nhu cầu chứ không theo số đã chi.'
    outcomes:
      - p: 1
        en: 'You return eight million. Quyen sighs and agrees. Duc notices, and notes that marketing was the only department that returned anything.'
        vi: 'Anh/chị trả lại tám triệu. Chị Quyên thở dài và đồng ý. Anh Đức để ý và ghi nhận marketing là phòng duy nhất trả lại bất cứ khoản nào.'
        effects: [rel quyen trust -1, rel duc trust +4, rep.finance +3, stress +2]
  - en: "Ask the agency to invoice twenty million for 'autumn campaign extension', to be delivered next year."
    vi: "Nhờ agency xuất hóa đơn hai mươi triệu cho 'gia hạn chiến dịch mùa thu', giao trong năm sau."
    outcomes:
      - p: 0.7
        en: 'The invoice arrives on the twenty-ninth. The budget is spent. Dat is happy. The extension is a set of ideas that nobody asked for.'
        vi: 'Hóa đơn đến ngày hai mươi chín. Ngân sách được chi hết. Anh Đạt vui. Phần gia hạn là một tập ý tưởng không ai yêu cầu.'
        effects:
          [rel quyen trust +3, rel dat trust +3, stress +1, fact wasteful_year_end_spend private]
      - p: 0.3
        ok: false
        en: "Duc's team sees an invoice for a service that starts after the invoice date. Thu asks you politely which deliverable is due this year."
        vi: 'Nhóm anh Đức thấy một hóa đơn cho dịch vụ bắt đầu sau ngày xuất hóa đơn. Thư hỏi anh/chị lịch sự sản phẩm nào đến hạn trong năm nay.'
        effects:
          [
            rel quyen trust +1,
            rel dat trust +2,
            rel duc trust -5,
            rel thu trust -4,
            rep.finance -5,
            stress +5,
            fact wasteful_year_end_spend witnessed,
          ]
---
scene: mkt.bought_list
place: meeting_room
tags: [data, privacy, dark]
weight: 3
cooldown: 40
when: [turn >= 10]
lines:
  - who: char:dat
    en: 'A data vendor has a list of eighty thousand home cooks in the region, with emails and phone numbers. It is very cheap. If we send them the launch offer, we will triple our reach this month. They have not agreed to hear from us, but they are all potential customers.'
    vi: 'Một nhà cung cấp dữ liệu có danh sách tám mươi nghìn người nấu ăn tại nhà trong khu vực kèm email và số điện thoại. Rất rẻ. Nếu gửi họ ưu đãi ra mắt, mình sẽ tăng gấp ba lượng tiếp cận tháng này. Họ chưa đồng ý nhận tin từ mình, nhưng đều là khách hàng tiềm năng.'
choices:
  - en: 'Decline the list, and build the audience from opt-in sign-ups: a recipe email, a warranty registration, and a clear unsubscribe.'
    vi: 'Từ chối danh sách và xây tệp khán giả từ đăng ký tự nguyện: email công thức nấu ăn, đăng ký bảo hành và nút hủy đăng ký rõ ràng.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: "The sign-up list grows slowly. After three months it has six thousand names, and they open the emails. Quyen says: 'Smaller, and ours.'"
        vi: "Danh sách đăng ký tăng chậm. Sau ba tháng có sáu nghìn tên, và họ mở email. Chị Quyên nói: 'Nhỏ hơn, và là của mình.'"
        effects: [rel quyen trust +3, rel dat trust -2, rep.buyer +2, stress +3]
      - p: 0.2
        ok: false
        en: "Bao says six thousand is not a business, and that the agency's list would have paid for itself. You show him the open rates, and he keeps his silence."
        vi: 'Anh Bảo nói sáu nghìn không phải một doanh nghiệp và danh sách của agency sẽ tự hoàn vốn. Anh/chị cho xem tỷ lệ mở và anh im lặng.'
        effects: [rel quyen trust +2, rel bao trust -3, stress +4]
  - en: 'Send a single message to the list that asks for consent, with an easy unsubscribe, and delete anyone who does not reply.'
    vi: 'Gửi một tin nhắn duy nhất cho danh sách xin sự đồng ý, kèm hủy đăng ký dễ dàng và xóa bất kỳ ai không trả lời.'
    outcomes:
      - p: 1
        en: "Six hundred people say yes. The others are deleted. It is not a bad start, and not a clean one: the vendor's source of the list is unclear."
        vi: 'Sáu trăm người đồng ý. Những người khác bị xóa. Không phải khởi đầu tệ, và không sạch: nguồn danh sách của nhà cung cấp không rõ.'
        effects: [rel dat trust -1, stress +2]
  - en: 'Buy the list and send the launch offer to all eighty thousand.'
    vi: 'Mua danh sách và gửi ưu đãi ra mắt cho cả tám mươi nghìn người.'
    outcomes:
      - p: 0.7
        en: 'Reach triples, and sales go up for two weeks. The unsubscribe link sends a complaint to an address that nobody checks.'
        vi: 'Lượng tiếp cận tăng gấp ba và doanh số tăng hai tuần. Đường dẫn hủy đăng ký gửi khiếu nại đến một địa chỉ không ai kiểm tra.'
        effects:
          [
            rel dat trust +4,
            rel quyen trust -1,
            rep.buyer -2,
            stress +1,
            fact emailed_without_consent private,
          ]
      - p: 0.3
        ok: false
        en: "Several hundred recipients report the email to the data authority. Nga's phone does not stop for three days, and a letter arrives asking where the list came from."
        vi: 'Vài trăm người nhận báo email cho cơ quan bảo vệ dữ liệu. Điện thoại chị Nga không ngừng ba ngày, và một công văn đến hỏi danh sách từ đâu ra.'
        effects:
          [
            rel dat trust +2,
            rel nga trust -5,
            rel quyen trust -6,
            rep.boss -6,
            rep.cs -6,
            stress +7,
            fact emailed_without_consent public,
          ]
---
scene: mkt.paid_award
place: meeting_room
tags: [credibility, awards, dark]
weight: 2
cooldown: 40
when: [turn >= 12]
lines:
  - who: char:dat
    en: "A trade magazine has a 'Best Cookware Brand' award. It costs eight million to enter and fifteen to receive the trophy and a feature. Everyone knows how it works. The trophy will look wonderful on the website and the box."
    vi: "Một tạp chí ngành có giải 'Thương hiệu đồ gia dụng tốt nhất'. Dự thi tốn tám triệu và nhận cúp kèm bài viết tốn mười lăm. Ai cũng biết cách nó vận hành. Chiếc cúp sẽ rất đẹp trên trang web và trên hộp."
choices:
  - en: 'Skip it, and spend the money on independent testing that you can cite, with the results published.'
    vi: 'Bỏ qua và dùng tiền cho kiểm nghiệm độc lập mà anh/chị có thể trích dẫn, công bố kết quả.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.8
        en: "An independent lab rates the pan in the top quartile, and the result is cited on the page with the lab's name. It is less glamorous, and more believable."
        vi: 'Một phòng thí nghiệm độc lập xếp chảo vào nhóm một phần tư đầu, và kết quả được dẫn trên trang kèm tên phòng thí nghiệm. Kém hào nhoáng hơn, và đáng tin hơn.'
        effects: [rel quyen trust +3, rep.qc +2, rep.buyer +2, stress +2]
      - p: 0.2
        ok: false
        en: 'The independent test puts the pan in the middle of the group. You do not publish it, and use it internally. It stings, and it is useful.'
        vi: 'Bài kiểm nghiệm độc lập xếp chảo ở giữa nhóm. Anh/chị không công bố mà dùng nội bộ. Hơi đau, và hữu ích.'
        effects: [rel quyen trust +2, rep.qc +2, stress +3]
  - en: 'Enter, and state on the website that the award is a paid entry from the magazine.'
    vi: 'Dự thi và ghi trên trang web rằng giải là một suất dự thi trả phí của tạp chí.'
    outcomes:
      - p: 1
        en: "The trophy appears with a line saying 'Magazine award (paid entry)'. It is honest, and a little embarrassing. A visitor asks about it, and the answer is already on the page."
        vi: "Chiếc cúp xuất hiện kèm dòng 'Giải thưởng của tạp chí (suất dự thi trả phí)'. Trung thực, và hơi ngượng. Một khách hỏi, và câu trả lời đã có trên trang."
        effects: [rel dat trust +1, stress +1]
  - en: "Pay for the award, and show it on the box and the website as 'Best Cookware Brand' with no further detail."
    vi: "Trả tiền cho giải thưởng và hiển thị nó trên hộp và trang web là 'Thương hiệu đồ gia dụng tốt nhất' không thêm chi tiết."
    outcomes:
      - p: 0.7
        en: 'The trophy looks wonderful. Sales go up two percent. Bao tells every buyer.'
        vi: 'Chiếc cúp trông tuyệt vời. Doanh số tăng hai phần trăm. Anh Bảo kể với mọi khách.'
        effects: [rel dat trust +3, rel bao trust +3, stress +1, fact paid_for_award private]
      - p: 0.3
        ok: false
        en: "A consumer blog compares the 'winners' of the last three years and finds that each had bought a feature. The company's name is in the second paragraph."
        vi: "Một blog người tiêu dùng so sánh các 'người thắng' ba năm qua và thấy mỗi người đã mua một bài viết. Tên công ty nằm ở đoạn thứ hai."
        effects:
          [
            rel dat trust +1,
            rel bao trust +1,
            rel quyen trust -5,
            rep.boss -4,
            rep.buyer -5,
            stress +5,
            fact paid_for_award witnessed,
          ]
---
scene: mkt.fake_urgency
place: meeting_room
tags: [advertising, pressure, dark]
weight: 3
cooldown: 30
when: [turn >= 10, month in 10 11 12]
lines:
  - who: char:bao
    en: "Black Friday is next week. Put a countdown timer on the page that resets every time somebody visits, and a banner saying 'Only 7 left!' It is the stock number that makes people click. We have five thousand in the warehouse, of course. But nobody has to know that."
    vi: "Black Friday tuần sau. Đặt bộ đếm ngược trên trang mà reset mỗi khi có người vào và biểu ngữ 'Chỉ còn 7 sản phẩm!' Con số tồn kho khiến người ta nhấp. Tất nhiên kho có năm nghìn. Nhưng không ai cần biết."
choices:
  - en: 'Run a real offer with a real end date and a stock number that reflects the actual allocation for this promotion.'
    vi: 'Chạy ưu đãi thật có ngày kết thúc thật và con số tồn kho phản ánh phân bổ thật cho đợt khuyến mãi này.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.7
        en: "The offer has a true end date and a promotional allocation of five hundred. It sells out in six days, and the timer is honest. Bao says 'It worked'."
        vi: "Ưu đãi có ngày kết thúc thật và phân bổ khuyến mãi năm trăm. Bán hết trong sáu ngày, và bộ đếm trung thực. Anh Bảo nói 'Có hiệu quả'."
        effects: [rel bao trust +1, rel quyen trust +2, rep.buyer +1, stress +2]
      - p: 0.3
        ok: false
        en: 'The offer sells half its allocation. Bao grumbles that a bluff would have done better. You say, quietly, that a bluff would have been paid for later.'
        vi: 'Ưu đãi bán được nửa phân bổ. Anh Bảo càu nhàu rằng nói dối sẽ hiệu quả hơn. Anh/chị nói, khẽ, rằng nói dối sẽ phải trả giá sau.'
        effects: [rel bao trust -3, rel quyen trust +2, stress +3]
  - en: 'Use a real countdown to the real end of the offer, and skip the stock banner.'
