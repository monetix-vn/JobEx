# Brand and Digital Marketing Executive: everyday incidents and consequences (docs/story/marketing.md).
scene: mkt.borrowed_photo
place: meeting_room
tags: [content, copyright, dark]
weight: 3
cooldown: 26
when: [turn >= 8]
lines:
  - who: char:dat
    en: "We are two days from the post and the photographer's shots of the kitchen are not ready. I found a beautiful picture of a family cooking with a pan very like ours. It is from a European brand's website. Nobody will notice. Shall we use it?"
    vi: 'Còn hai ngày là đến bài đăng mà ảnh của nhiếp ảnh gia về nhà bếp chưa xong. Em tìm thấy một bức ảnh đẹp về một gia đình nấu ăn với chiếc chảo rất giống của mình. Nó từ trang web của một thương hiệu châu Âu. Không ai nhận ra đâu. Mình dùng không?'
choices:
  - en: "Use a licensed stock image or reshoot with the team's own kitchen, and move the post by a day."
    vi: 'Dùng một ảnh stock có bản quyền hoặc quay lại với căn bếp của chính nhóm và dời bài đăng một ngày.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.85
        en: 'The licensed photo costs three hundred thousand dong and looks nearly as good. The post goes out a day late, and no one is unhappy.'
        vi: 'Ảnh có bản quyền tốn ba trăm nghìn đồng và trông gần như đẹp bằng. Bài đăng đi trễ một ngày, và không ai không vui.'
        effects: [rel quyen trust +2, rel dat trust -1, stress +2]
      - p: 0.15
        ok: false
        en: 'The licence terms do not allow use in paid ads. You find out on the second day, and renegotiate it for a small extra fee.'
        vi: 'Điều khoản bản quyền không cho dùng trong quảng cáo trả phí. Anh/chị biết vào ngày thứ hai và thương lượng lại với một khoản phí nhỏ.'
        effects: [rel quyen trust +1, stress +4]
  - en: 'Ask the European brand for permission, and use the picture only if they agree.'
    vi: 'Xin phép thương hiệu châu Âu và chỉ dùng ảnh nếu họ đồng ý.'
    outcomes:
      - p: 1
        en: 'The brand says no, politely, in two days. The post uses a different picture. You lost a day and gained a line in the register.'
        vi: 'Thương hiệu từ chối, lịch sự, trong hai ngày. Bài đăng dùng ảnh khác. Anh/chị mất một ngày và có thêm một dòng trong sổ.'
        effects: [rel dat trust -1, stress +2]
  - en: 'Use the picture, and crop the logo out of the corner.'
    vi: 'Dùng ảnh và cắt logo ở góc.'
    outcomes:
      - p: 0.7
        en: 'The post does very well. Nobody notices for three weeks.'
        vi: 'Bài đăng rất thành công. Ba tuần không ai nhận ra.'
        effects: [rel dat trust +2, stress +1, fact used_unlicensed_image private]
      - p: 0.3
        ok: false
        en: "The brand's agency finds it with an image search, and sends a letter with a licence fee ten times what a stock photo would have cost, copied to Mr Cuong."
        vi: 'Agency của thương hiệu tìm ra bằng tìm kiếm ảnh và gửi thư kèm phí bản quyền gấp mười lần ảnh stock, đồng gửi anh Cường.'
        effects:
          [
            rel dat trust +2,
            rel quyen trust -5,
            rep.boss -4,
            stress +5,
            fact used_unlicensed_image witnessed,
          ]
---
scene: mkt.comparative_ad
place: meeting_room
tags: [advertising, rival, dark]
weight: 3
cooldown: 30
when: [turn >= 10]
lines:
  - who: char:bao
    en: 'I want an ad that says our pan heats up twice as fast as the leading rival. We tested it in the lab with our pan on a gas ring and theirs on an induction hob. The numbers are real. The comparison is a little creative, but who is going to check?'
    vi: 'Anh muốn một quảng cáo nói chảo mình nóng nhanh gấp đôi đối thủ dẫn đầu. Mình thử trong phòng lab với chảo mình trên bếp gas và của họ trên bếp từ. Con số là thật. So sánh hơi sáng tạo, nhưng ai kiểm tra chứ?'
choices:
  - en: 'Ask Khoa to rerun the test on the same hob under the same conditions, and run the ad only with the result that holds.'
    vi: 'Nhờ anh Khoa chạy lại bài kiểm tra trên cùng loại bếp với cùng điều kiện và chỉ chạy quảng cáo với kết quả đứng vững.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: "On the same hob, the pan heats thirty percent faster. The ad says thirty percent and cites the test. Bao says 'It is less exciting', and the number is defensible in any room."
        vi: "Trên cùng loại bếp, chảo nóng nhanh hơn ba mươi phần trăm. Quảng cáo ghi ba mươi phần trăm và dẫn bài kiểm nghiệm. Anh Bảo nói 'Kém hấp dẫn hơn', và con số bảo vệ được ở bất cứ phòng nào."
        effects: [rel bao trust -2, rel khoa trust +3, rel quyen trust +2, rep.qc +2, stress +3]
      - p: 0.3
        ok: false
        en: 'On the same hob the difference is nine percent. The ad is shelved. Bao says it was a waste of three days, and Khoa quietly says it was worth it.'
        vi: 'Trên cùng loại bếp chênh lệch chỉ chín phần trăm. Quảng cáo bị gác lại. Anh Bảo nói phí ba ngày và anh Khoa khẽ nói đáng.'
        effects: [rel bao trust -4, rel khoa trust +3, rep.qc +2, stress +4]
  - en: 'Run the ad with the real test conditions stated in small print under the claim.'
    vi: 'Chạy quảng cáo với điều kiện kiểm nghiệm thật ghi bằng chữ nhỏ dưới lời quảng cáo.'
    outcomes:
      - p: 1
        en: "The claim is large, and the small print is accurate, and readable with a magnifying glass. A competitor's lawyer reads it, and takes no action."
        vi: 'Lời quảng cáo lớn, chữ nhỏ chính xác và đọc được bằng kính lúp. Luật sư của đối thủ đọc và không hành động.'
        effects: [rel bao trust +1, rel quyen trust -1, stress +2]
  - en: "Run the ad as Bao asked, 'twice as fast', with no conditions."
    vi: "Chạy quảng cáo như anh Bảo yêu cầu, 'nhanh gấp đôi', không điều kiện."
    outcomes:
      - p: 0.7
        en: 'The ad runs. Bao is delighted, and sales go up four percent. A reviewer buys both pans and posts the cooking test with the two hobs in the same shot.'
        vi: 'Quảng cáo chạy. Anh Bảo rất vui, và doanh số tăng bốn phần trăm. Một người đánh giá mua cả hai chảo và đăng bài thử với hai bếp trong cùng khung hình.'
        effects:
          [
            rel bao trust +5,
            rel khoa trust -4,
            rep.buyer -2,
            stress +1,
            fact unfair_comparison_ad private,
          ]
      - p: 0.3
        ok: false
        en: "The rival's lawyer sends a letter with the test conditions, the hob types and a demand to withdraw. The ad is pulled, and the statement is in the trade press."
        vi: 'Luật sư của đối thủ gửi thư kèm điều kiện kiểm nghiệm, loại bếp và yêu cầu gỡ. Quảng cáo bị gỡ, và tuyên bố có trên báo ngành.'
        effects:
          [
            rel bao trust +2,
            rel khoa trust -6,
            rel quyen trust -6,
            rep.boss -6,
            rep.buyer -6,
            stress +6,
            fact unfair_comparison_ad public,
          ]
