fact: emailed_without_consent
severity: 5
category: integrity
en: 'you emailed a purchased list of people who had not agreed to hear from the company'
vi: 'bạn gửi email cho một danh sách mua về gồm những người chưa đồng ý nhận tin từ công ty'
lesson:
  en: 'A list that people did not choose to join is a list of people to annoy. It also turns every unsubscribe into a complaint, and a regulator reads the complaints.'
  vi: 'Danh sách mà người ta không chọn tham gia là danh sách những người để làm phiền. Nó cũng biến mọi lần hủy đăng ký thành khiếu nại, và cơ quan quản lý đọc các khiếu nại.'
traces:
  - { type: message, visibility: 0.7, detectors: [buyer, boss, internal_audit] }
witnessed:
  boss: -6
  cs: -6
public:
  boss: -12
  buyer: -8
  cs: -10
