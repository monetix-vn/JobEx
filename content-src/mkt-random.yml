fact: greenwashed_claim
severity: 6
category: integrity
en: "you put an 'eco-friendly' claim on products that contain no recycled material"
vi: "bạn ghi lời 'thân thiện môi trường' lên sản phẩm không chứa vật liệu tái chế"
lesson:
  en: "A green claim must be as specific as the evidence. 'Eco-friendly' on eight lines that have nothing recycled is the sort of sentence a buyer's sustainability team is paid to check."
  vi: "Lời quảng cáo xanh phải cụ thể như bằng chứng. 'Thân thiện môi trường' trên tám dòng không có gì tái chế là loại câu mà nhóm bền vững của khách được trả tiền để kiểm tra."
traces:
  - { type: document, visibility: 0.8, detectors: [buyer, qc, internal_audit, boss] }
witnessed:
  boss: -8
  buyer: -8
public:
  boss: -14
  buyer: -16
