scene: mkt.blame_meeting
place: meeting_room
tags: [pressure, consequence]
weight: 6
cooldown: 52
when: [month in 11 12, turn >= 44]
when_any:
  [
    fact.sabotaged_rival_reviews >= 1,
    fact.approved_invoice_for_undelivered_work >= 1,
    fact.blamed_customers_for_defect >= 1,
    fact.emailed_without_consent >= 1,
    fact.paid_for_award >= 1,
  ]
lines:
  - who: char:cuong
    en: "A lawyer's letter arrived this morning, a data authority letter yesterday, and Duc has a note about the agency's invoices. The directors will decide tomorrow what to tell the board. I want to know who in marketing is responsible, and I want it from you first."
    vi: 'Sáng nay có thư của luật sư, hôm qua có thư của cơ quan bảo vệ dữ liệu và anh Đức có ghi chú về hóa đơn của agency. Ngày mai các giám đốc quyết định nói gì với hội đồng. Anh muốn biết ai ở marketing chịu trách nhiệm, và muốn nghe từ em trước.'
choices:
  - en: 'Tell him the real account: what each person asked, what you agreed, and your own part. Show him the emails.'
    vi: 'Nói với anh bản tường trình thật: ai nhờ gì, anh/chị đồng ý gì và phần của chính mình. Cho anh xem các email.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Mr Cuong listens, and calls the lawyer. The company's answer is an offer to correct everything. You are moved off agency management, and keep your job and, eventually, your name."
        vi: 'Anh Cường lắng nghe và gọi luật sư. Câu trả lời của công ty là đề nghị sửa tất cả. Anh/chị bị chuyển khỏi quản lý agency, và giữ được việc và về sau là cả danh tiếng.'
        effects:
          [
            rel cuong trust -1,
            rel quyen trust +2,
            rel nga trust +3,
            rep.boss -8,
            stress +7,
            fact came_clean_to_auditor witnessed,
          ]
  - en: 'Say that each of those decisions was taken on the instruction of Bao, Mr Cuong or the agency, and that marketing followed instructions.'
    vi: 'Nói mỗi quyết định đó được đưa ra theo chỉ đạo của anh Bảo, anh Cường hoặc agency và marketing làm theo chỉ đạo.'
    outcomes:
      - p: 0.4
        en: 'Mr Cuong treats it as shared fault. Nobody leaves the room liked.'
        vi: 'Anh Cường coi đó là lỗi chung. Không ai rời phòng với thiện cảm.'
        effects: [rel cuong trust -3, rel quyen trust -4, rel bao trust -5, rep.boss -4, stress +4]
      - p: 0.6
        ok: false
        en: 'Quyen has the original emails with your replies. She reads two of them aloud, without raising her voice.'
        vi: 'Chị Quyên có các email gốc kèm trả lời của anh/chị. Chị đọc to hai cái, không to tiếng.'
        effects: [rel cuong trust -4, rel quyen trust -10, rep.boss -10, stress +8]
  - en: 'Say that the agency took the decisions, and that you only forwarded their proposals.'
    vi: 'Nói agency đưa ra các quyết định và anh/chị chỉ chuyển tiếp đề xuất của họ.'
    outcomes:
      - p: 0.3
        en: 'Mr Cuong nods, and the agency is dropped. Dat keeps his silence in the room, and not outside it.'
        vi: 'Anh Cường gật đầu và agency bị loại. Anh Đạt giữ im lặng trong phòng, và không ngoài phòng.'
        effects:
          [
            rel dat trust -20,
            rel quyen trust -4,
            rep.boss -4,
            stress +5,
            fact blamed_the_agency private,
          ]
      - p: 0.7
        ok: false
        en: "Dat has your approvals in writing, and the dates. He puts them on the table with one line: 'These are ours, and these are yours.'"
        vi: "Anh Đạt có các phê duyệt của anh/chị bằng văn bản và ngày tháng. Anh đặt chúng lên bàn kèm một câu: 'Những cái này là của bọn em, và những cái này là của anh/chị.'"
        effects:
          [
            rel dat trust -20,
            rel quyen trust -8,
            rep.boss -14,
            stress +9,
            fact blamed_the_agency public,
          ]
