fact: fake_urgency_timer
severity: 4
category: integrity
en: 'you built a countdown timer and stock banner that were false'
vi: 'bạn làm bộ đếm ngược và biểu ngữ tồn kho giả'
lesson:
  en: "A false 'only 7 left' is a lie told to every visitor. It works until one visitor takes a screenshot, and then it is the story."
  vi: "'Chỉ còn 7' giả là lời dối nói với mọi khách truy cập. Nó hiệu quả cho đến khi một khách chụp màn hình, và khi đó nó là câu chuyện."
traces:
  - { type: record, visibility: 0.7, detectors: [buyer, boss, internal_audit] }
witnessed:
  boss: -6
  buyer: -6
  cs: -4
public:
  boss: -10
  buyer: -12
  cs: -8
