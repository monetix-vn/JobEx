scene: mkt.staged_testimonial
place: meeting_room
tags: [content, testimonials, dark]
weight: 2
cooldown: 40
when: [turn >= 12]
lines:
  - who: char:dat
    en: "For the new landing page we need a family testimonial with a photo. Real customers are slow to reply. We have a lovely actor family on file, and they can say what a customer would say. Nobody has to know that they were paid. We can call them the 'Tran family from Binh Duong'."
    vi: "Cho trang đích mới mình cần lời chứng thực của một gia đình kèm ảnh. Khách thật trả lời chậm. Bọn em có một gia đình diễn viên rất dễ thương trong hồ sơ, và họ có thể nói điều một khách hàng sẽ nói. Không ai cần biết họ được trả tiền. Mình có thể gọi họ là 'gia đình ông bà Trần ở Bình Dương'."
choices:
  - en: 'Contact real customers who have already praised the pan in reviews, ask for permission to quote them, and run the page a week later.'
    vi: 'Liên hệ với khách thật đã khen chảo trong đánh giá, xin phép trích dẫn và chạy trang sau một tuần.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: 'Four customers agree, and one sends a photo of her kitchen. The page launches a week late, with quotes that are real, mildly critical and believable.'
        vi: 'Bốn khách đồng ý và một người gửi ảnh bếp của chị. Trang ra mắt trễ một tuần với các lời trích có thật, hơi phê bình và đáng tin.'
        effects: [rel quyen trust +3, rel nga trust +2, rep.buyer +2, rep.cs +2, stress +3]
      - p: 0.2
        ok: false
        en: 'Only one customer replies, and her quote is a little negative about the lid. You use it, with her permission, and the page launches with one real voice.'
        vi: 'Chỉ một khách trả lời, và lời của chị hơi tiêu cực về cái nắp. Anh/chị dùng, với sự cho phép của chị, và trang ra mắt với một tiếng nói thật.'
        effects: [rel quyen trust +2, rep.buyer +1, stress +3]
  - en: "Use the actors, but label the page 'illustrative customer stories' and keep the quotes generic."
    vi: "Dùng các diễn viên nhưng gắn nhãn trang 'câu chuyện khách hàng minh họa' và giữ lời trích chung chung."
    outcomes:
      - p: 1
        en: 'The page is warm, and clearly labelled. Conversion is slightly lower. Nobody is misled.'
        vi: 'Trang ấm áp và được gắn nhãn rõ. Tỷ lệ chuyển đổi thấp hơn một chút. Không ai bị đánh lừa.'
        effects: [rel dat trust +1, stress +2]
  - en: "Run the actors as the 'Tran family from Binh Duong', with a specific quote about the pan changing their cooking."
    vi: "Chạy diễn viên là 'gia đình ông bà Trần ở Bình Dương' kèm lời trích cụ thể về chiếc chảo thay đổi việc nấu ăn của họ."
    outcomes:
      - p: 0.7
        en: 'The page converts nineteen percent better than the last. The Tran family is lovely, and exists only on the page.'
        vi: 'Trang chuyển đổi tốt hơn trang trước mười chín phần trăm. Gia đình ông bà Trần rất dễ thương và chỉ tồn tại trên trang.'
        effects: [rel dat trust +4, rel quyen trust -1, stress +1, fact staged_testimonial private]
      - p: 0.3
        ok: false
        en: "A viewer recognises the 'Tran family' from a bank advertisement, and posts the two clips side by side. By evening, the comment section has three thousand replies."
        vi: "Một người xem nhận ra 'gia đình ông bà Trần' từ một quảng cáo ngân hàng và đăng hai đoạn cạnh nhau. Đến tối phần bình luận có ba nghìn trả lời."
        effects:
          [
            rel dat trust +2,
            rel quyen trust -6,
            rep.boss -5,
            rep.buyer -7,
            rep.cs -4,
            stress +6,
            fact staged_testimonial witnessed,
          ]
