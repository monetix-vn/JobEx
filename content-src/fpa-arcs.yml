scene: fpa.phat_asks
weight: 0
place: finance_office
tags: [bank, disclosure, dark, consequence, arc]
lines:
  - who: char:phat
    en: 'Thank you for the quarter figures. The committee would like to see the forecast for the next four quarters, with the assumptions, the downside case and what you would do if steel rises a further ten percent. I would prefer the working version, not the board version.'
    vi: 'Cảm ơn số liệu quý. Hội đồng tín dụng muốn xem dự báo bốn quý tới kèm giả định, kịch bản xấu và việc anh/chị sẽ làm nếu thép tăng thêm mười phần trăm. Tôi muốn bản làm việc, không phải bản cho hội đồng.'
choices:
  - en: 'Send the working forecast with its assumptions, the downside case and a recovery plan, and flag where you are least sure.'
    vi: 'Gửi bản dự báo làm việc kèm giả định, kịch bản xấu và kế hoạch phục hồi và đánh dấu chỗ anh/chị kém chắc chắn nhất.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: "Mr Phat reads for two days and replies: 'This is more than we usually get. We will watch monthly, and we will not reprice.' Khang forwards his reply with one word: 'Good.'"
        vi: "Anh Phát đọc hai ngày và trả lời: 'Đây là nhiều hơn mức chúng tôi thường nhận. Chúng tôi sẽ theo dõi hằng tháng và sẽ không tính lại lãi.' Anh Khang chuyển thư kèm một chữ: 'Tốt.'"
        effects:
          [
            rel phat trust +5,
            rel khang trust +4,
            rel duc trust +1,
            rep.finance +3,
            stress +3,
            arc the_covenant end,
          ]
      - p: 0.2
        ok: false
        en: 'The committee finds the downside case uncomfortable and reprices the loan by half a point. Duc is unhappy. The bank still trusts the numbers it was given.'
        vi: 'Hội đồng tín dụng thấy kịch bản xấu đáng lo và tính lại lãi tăng nửa điểm. Anh Đức không vui. Ngân hàng vẫn tin các con số được cung cấp.'
        effects:
          [
            rel phat trust +3,
            rel khang trust +3,
            rel duc trust -2,
            rep.finance +1,
            stress +5,
            arc the_covenant end,
          ]
  - en: 'Send the base case with caveats, and say the downside case is still being prepared.'
    vi: 'Gửi kịch bản cơ sở kèm lưu ý và nói kịch bản xấu vẫn đang được chuẩn bị.'
    outcomes:
      - p: 1
        en: 'Mr Phat accepts it politely and asks again in a month. You have a month to build the downside case you should have sent.'
        vi: 'Anh Phát chấp nhận một cách lịch sự và hỏi lại sau một tháng. Anh/chị có một tháng để dựng kịch bản xấu lẽ ra nên gửi.'
        effects: [rel phat trust -1, rel khang trust +1, stress +3, arc the_covenant end]
  - en: 'Send the management case with the optimistic assumptions, leave out the downside, and describe it as the base case.'
    vi: 'Gửi kịch bản của ban điều hành với giả định lạc quan, bỏ kịch bản xấu và mô tả nó là kịch bản cơ sở.'
    outcomes:
      - p: 0.6
        en: 'Mr Phat thanks you and the committee approves a standstill. Duc is delighted. You sent the bank a number that you would not take to the board.'
        vi: 'Anh Phát cảm ơn và hội đồng tín dụng duyệt giữ nguyên. Anh Đức rất vui. Anh/chị đã gửi cho ngân hàng một con số mà anh/chị sẽ không mang lên hội đồng của chính mình.'
        effects:
          [
            rel phat trust +2,
            rel duc trust +5,
            rel khang trust -3,
            rep.finance +2,
            stress +1,
            fact misled_the_bank private,
            arc the_covenant end,
          ]
      - p: 0.4
        ok: false
        en: 'Mr Phat compares your forecast with the monthly management accounts you also send him. The gap between them is visible on one page, and he writes to Duc, politely.'
        vi: 'Anh Phát đối chiếu dự báo của anh/chị với báo cáo quản trị hằng tháng cũng gửi cho anh. Khoảng cách giữa chúng hiện rõ trên một trang, và anh viết thư cho anh Đức, lịch sự.'
        effects:
          [
            rel phat trust -10,
            rel duc trust -4,
            rel khang trust -8,
            rep.boss -8,
            rep.finance -8,
            stress +8,
            fact misled_the_bank public,
            arc the_covenant end,
          ]
