arc: the_kpi_pack
title:
  en: 'The KPI pack'
  vi: 'Bộ KPI'
stages:
  - { id: definition, event: fpa.kpi_definition }
  - { id: chart, event: fpa.cherry_picked_chart, delay: 2-3 }
  - { id: challenge, event: fpa.kpi_challenge, delay: 2-4 }
---
scene: fpa.kpi_definition
arc: the_kpi_pack
place: meeting_room
tags: [kpi, reporting, dark]
weight: 3
cooldown: 40
when: [turn >= 10, turn <= 40]
lines:
  - who: char:lan
    en: 'On-time delivery is eighty-one percent. We are measured against the date we first promised the buyer. But the buyer agrees new dates all the time, usually because sales asks. If you measure against the revised dates, we are at ninety-four. That is the number that reflects what the buyer experiences.'
    vi: 'Giao hàng đúng hạn là tám mươi mốt phần trăm. Mình bị đo theo ngày hứa lần đầu với khách. Nhưng khách đồng ý ngày mới liên tục, thường vì kinh doanh xin. Nếu đo theo ngày đã sửa thì mình đạt chín mươi tư. Đó là con số phản ánh điều khách trải nghiệm.'
choices:
  - en: 'Publish both figures, with the method for each, and explain that the gap is mostly caused by date changes requested after the order.'
    vi: 'Công bố cả hai con số kèm phương pháp cho từng cái và giải thích rằng khoảng cách chủ yếu do các lần đổi ngày được yêu cầu sau khi đặt hàng.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.7
        en: 'The pack shows eighty-one and ninety-four, side by side. Lan is not thrilled, and Bao is less thrilled. The question becomes why dates move, which is the real question.'
        vi: 'Bộ báo cáo hiện tám mươi mốt và chín mươi tư cạnh nhau. Chị Lan không hào hứng, và anh Bảo còn kém hơn. Câu hỏi trở thành vì sao ngày dịch chuyển, đó mới là câu hỏi thật.'
        effects:
          [
            rel lan trust -1,
            rel bao trust -3,
            rel khang trust +3,
            rep.finance +3,
            stress +3,
            fact published_kpi_with_method witnessed,
            arc the_kpi_pack chart,
          ]
      - p: 0.3
        ok: false
        en: "Mr Cuong reads the two figures and asks which one is correct. You say both are, with different questions. He says 'I want one number', and you hold your position, politely."
        vi: "Anh Cường đọc hai con số và hỏi cái nào đúng. Anh/chị nói cả hai đúng, cho các câu hỏi khác nhau. Anh nói 'Anh muốn một con số', và anh/chị giữ quan điểm, lịch sự."
        effects:
          [
            rel lan trust -1,
            rel cuong trust -3,
            rel khang trust +3,
            stress +4,
            fact published_kpi_with_method witnessed,
            arc the_kpi_pack chart,
          ]
  - en: 'Publish the revised-date figure as the headline and the original-date figure in a footnote.'
    vi: 'Công bố con số theo ngày đã sửa làm tiêu đề và con số theo ngày gốc trong chú thích.'
    outcomes:
      - p: 1
        en: 'The pack shows ninety-four. Lan is satisfied and the footnote is in six-point type. The directors read the headline.'
        vi: 'Bộ báo cáo hiện chín mươi tư. Chị Lan hài lòng và chú thích in cỡ chữ sáu. Các giám đốc đọc tiêu đề.'
        effects: [rel lan trust +3, rel bao trust +1, stress +2, arc the_kpi_pack chart]
  - en: 'Change the KPI definition to the revised dates from the start of the year and restate the earlier months.'
    vi: 'Đổi định nghĩa KPI sang ngày đã sửa từ đầu năm và trình bày lại các tháng trước.'
    outcomes:
      - p: 0.7
        en: 'The trend now looks as if it has always been above ninety. Lan and Bao are delighted. The old reports, which Khoa still has, say something else.'
        vi: 'Xu hướng giờ trông như luôn trên chín mươi. Chị Lan và anh Bảo rất vui. Các báo cáo cũ, mà anh Khoa vẫn giữ, nói điều khác.'
        effects:
          [
            rel lan trust +5,
            rel bao trust +4,
            rel khang trust -3,
            stress +1,
            fact redefined_kpi_to_look_better private,
            arc the_kpi_pack chart,
          ]
      - p: 0.3
        ok: false
        en: "Khang compares last quarter's pack with this quarter's and sees that the earlier months have changed without a note. He asks why, in front of the team."
        vi: 'Anh Khang so bộ báo cáo quý trước với quý này và thấy các tháng trước đã đổi mà không có ghi chú. Anh hỏi vì sao, trước mặt cả nhóm.'
        effects:
          [
            rel lan trust +2,
            rel bao trust +2,
            rel khang trust -7,
            rep.finance -4,
            stress +5,
            fact redefined_kpi_to_look_better witnessed,
            arc the_kpi_pack chart,
          ]
---
scene: fpa.cherry_picked_chart
weight: 0
place: meeting_room
tags: [kpi, board, dark, arc]
lines:
  - who: char:cuong
    en: 'For the board I need one chart that shows the factory improving. The trend line starting in March looks very good. January and February were bad because of the storms. Can the chart start in March?'
    vi: 'Cho hội đồng anh cần một biểu đồ cho thấy nhà máy đang cải thiện. Đường xu hướng bắt đầu từ tháng Ba trông rất đẹp. Tháng Một và tháng Hai tệ vì bão. Biểu đồ bắt đầu từ tháng Ba được không?'
choices:
  - en: 'Show the full year, with the storm months marked and explained, and an additional view that excludes them, labelled as such.'
    vi: 'Cho xem cả năm, các tháng bão được đánh dấu và giải thích, và thêm một góc nhìn loại trừ chúng, có ghi nhãn rõ.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.8
        en: "Mr Cuong looks at the two charts, and says 'Fine, use both.' Giang asks about the storm months at the board, and the answer is already on the page."
        vi: "Anh Cường nhìn hai biểu đồ và nói 'Được, dùng cả hai.' Chị Giang hỏi về các tháng bão ở hội đồng, và câu trả lời đã có sẵn trên trang."
        effects:
          [
            rel cuong trust -1,
            rel giang trust +3,
            rel khang trust +3,
            rep.boss +2,
            stress +2,
            arc the_kpi_pack challenge,
          ]
      - p: 0.2
        ok: false
        en: 'Mr Cuong says the board does not read two charts. You send both, with the full-year one on the second page.'
        vi: 'Anh Cường nói hội đồng không đọc hai biểu đồ. Anh/chị gửi cả hai, biểu đồ cả năm ở trang hai.'
        effects: [rel cuong trust -2, rel khang trust +1, stress +3, arc the_kpi_pack challenge]
  - en: 'Start the chart in March with a footnote saying the series starts in March, and offer the full series on request.'
    vi: 'Cho biểu đồ bắt đầu từ tháng Ba kèm chú thích chuỗi bắt đầu từ tháng Ba và đề nghị cung cấp chuỗi đầy đủ nếu được yêu cầu.'
    outcomes:
      - p: 1
        en: 'The chart is accurate and incomplete. Nobody asks for the full series. You keep it in a folder in case they do.'
        vi: 'Biểu đồ chính xác và không đầy đủ. Không ai xin chuỗi đầy đủ. Anh/chị giữ nó trong một thư mục phòng khi họ hỏi.'
        effects: [rel cuong trust +2, rel khang trust -1, stress +2, arc the_kpi_pack challenge]
  - en: 'Start the chart in March, leave the footnote out, and rescale the axis so that the improvement looks steeper.'
    vi: 'Cho biểu đồ bắt đầu từ tháng Ba, bỏ chú thích và đổi tỷ lệ trục để cải thiện trông dốc hơn.'
    outcomes:
      - p: 0.7
        en: 'The chart looks excellent. Mr Cuong beams, the board nods, and Giang looks at the axis for a little longer than the others.'
        vi: 'Biểu đồ trông tuyệt vời. Anh Cường rạng rỡ, hội đồng gật đầu, và chị Giang nhìn trục lâu hơn những người khác một chút.'
        effects:
          [
            rel cuong trust +5,
            rel giang trust -3,
            rel khang trust -2,
            rep.boss +3,
            stress +1,
            fact cherry_picked_chart private,
            arc the_kpi_pack challenge,
          ]
      - p: 0.3
        ok: false
        en: 'Giang asks for the data behind the chart and redraws it on a napkin with the full year. She says nothing, and the napkin is placed in the board minutes.'
        vi: 'Chị Giang xin dữ liệu đằng sau biểu đồ và vẽ lại trên khăn giấy với cả năm. Chị không nói gì, và chiếc khăn giấy được đưa vào biên bản hội đồng.'
        effects:
          [
            rel cuong trust +2,
            rel giang trust -9,
            rel khang trust -6,
            rep.boss -6,
            rep.finance -5,
            stress +6,
            fact cherry_picked_chart witnessed,
            arc the_kpi_pack challenge,
          ]
---
scene: fpa.kpi_challenge
weight: 0
place: meeting_room
tags: [kpi, reporting, consequence, arc]
lines:
  - who: char:khoa
    en: 'I have my own on-time figure for Line 3 from the dispatch log, and it does not match the pack. I am not accusing anyone. I would like us to sit down and agree on one definition, and write it on the first page.'
    vi: 'Anh có con số giao đúng hạn của riêng anh cho chuyền 3 từ nhật ký xuất hàng và nó không khớp bộ báo cáo. Anh không buộc tội ai. Anh muốn mình ngồi xuống thống nhất một định nghĩa và ghi nó vào trang đầu.'
choices:
  - en: 'Sit down with Khoa and Lan, reconcile the sources line by line, and publish the agreed definition and the reconciliation.'
    vi: 'Ngồi xuống với anh Khoa và chị Lan, đối chiếu các nguồn từng dòng và công bố định nghĩa đã thống nhất cùng bản đối chiếu.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "It takes two hours and a whiteboard. The three of you agree a definition. Khoa says: 'This is the first time FP&A and QC have the same number.' The pack carries a page on method."
