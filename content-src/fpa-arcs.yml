scene: fpa.quarter_end_timing
weight: 0
place: meeting_room
tags: [bank, timing, dark, arc]
lines:
  - who: char:bao
    en: 'Ten days to the quarter end. If we ship and invoice the Anders order on the twenty-eighth instead of the fifth, the revenue falls in this quarter. The goods are ready. It is only a date.'
    vi: 'Còn mười ngày đến cuối quý. Nếu mình giao và xuất hóa đơn đơn ông Anders vào ngày hai mươi tám thay vì mùng năm thì doanh thu rơi vào quý này. Hàng đã sẵn sàng. Chỉ là một ngày.'
  - who: char:duc
    en: 'And if we hold the steel invoices for ten days, the payables go out of this quarter. Thu can do it. Nobody has to know.'
    vi: 'Và nếu mình giữ hóa đơn thép mười ngày thì khoản phải trả ra khỏi quý này. Thư làm được. Không ai phải biết.'
choices:
  - en: 'Say that normal shipping and invoice dates stay as they are, report the true figures to the bank, and let the quarter be what it is.'
    vi: 'Nói ngày giao hàng và xuất hóa đơn bình thường giữ nguyên, báo số liệu thật cho ngân hàng và để quý là như nó vốn có.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'Bao shrugs. Duc looks tired. The numbers stay what they are, and you have a clean story for the bank call, which is that you did nothing to the dates.'
        vi: 'Anh Bảo nhún vai. Anh Đức trông mệt mỏi. Các con số vẫn như cũ, và anh/chị có một câu chuyện sạch cho cuộc gọi với ngân hàng, là anh/chị đã không đụng đến ngày tháng.'
        effects:
          [
            rel bao trust -3,
            rel duc trust -2,
            rel khang trust +4,
            rep.finance +3,
            stress +3,
            arc the_covenant bank_call,
          ]
  - en: 'Allow the Anders shipment on the date it is genuinely ready, with the delivery documents, and say nothing about the invoices.'
    vi: 'Cho phép giao đơn ông Anders vào ngày hàng thực sự sẵn sàng, kèm chứng từ giao hàng, và không nói gì về các hóa đơn.'
    outcomes:
      - p: 1
        en: 'The goods ship when they are ready, which happens to be the twenty-eighth. The delivery documents are real. The invoices are not touched. Hanh checks the cut-off, and signs.'
        vi: 'Hàng giao khi sẵn sàng, tình cờ là ngày hai mươi tám. Chứng từ giao hàng là thật. Hóa đơn không bị đụng đến. Chị Hạnh kiểm tra cut-off và ký.'
        effects: [rel bao trust +1, rel hanh trust +1, stress +3, arc the_covenant bank_call]
  - en: 'Pull the Anders invoice into this quarter and ask Thu to hold the steel invoices, without a note.'
    vi: 'Kéo hóa đơn ông Anders vào quý này và nhờ Thư giữ hóa đơn thép, không ghi chú gì.'
    outcomes:
      - p: 0.7
        en: 'The ratio reads two point eight-two. Duc and Bao are delighted. Thu holds the invoices and looks at you for a long moment before she agrees.'
        vi: 'Tỷ lệ là hai phẩy tám hai. Anh Đức và anh Bảo rất vui. Thư giữ hóa đơn và nhìn anh/chị một lúc lâu trước khi đồng ý.'
        effects:
          [
            rel bao trust +5,
            rel duc trust +5,
            rel thu trust -6,
            rep.finance +2,
            stress +1,
            fact moved_invoices_across_quarter_end private,
            arc the_covenant bank_call,
          ]
      - p: 0.3
        ok: false
        en: "The supplier's statement shows invoices dated the twentieth that are posted on the fifth. Thu is asked by the supplier, and tells the truth."
        vi: 'Sao kê của nhà cung cấp cho thấy hóa đơn ngày hai mươi được hạch toán ngày mùng năm. Thư được nhà cung cấp hỏi và nói sự thật.'
        effects:
          [
            rel bao trust +2,
            rel duc trust +2,
            rel thu trust -8,
            rel hanh trust -6,
            rep.boss -5,
            rep.finance -6,
            stress +6,
            fact moved_invoices_across_quarter_end witnessed,
            arc the_covenant bank_call,
          ]
