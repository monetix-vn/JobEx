fact: disclosed_covenant_risk_early
severity: 2
category: integrity
en: 'you told the finance director and the bank early that the covenant was at risk'
vi: 'bạn báo sớm cho giám đốc tài chính và ngân hàng rằng điều khoản cam kết có nguy cơ vi phạm'
lesson:
  en: 'A covenant risk raised early is a negotiation; raised late it is a default. Banks forgive a bad number far more easily than a surprise.'
  vi: 'Rủi ro cam kết được nêu sớm là một cuộc thương lượng; nêu muộn là vỡ nợ. Ngân hàng tha thứ cho con số xấu dễ hơn nhiều so với bất ngờ.'
