# FP&A Analyst storylines (docs/story/fpa.md): The Budget, The Covenant, The KPI Pack.
arc: the_budget
title:
  en: 'The budget'
  vi: 'Ngân sách'
stages:
  - { id: kickoff, event: fpa.budget_kickoff }
  - { id: sandbag, event: fpa.sandbagged_targets, delay: 1-2 }
  - { id: cut, event: fpa.directors_cut, delay: 2-3 }
  - { id: pack, event: fpa.board_pack_plug, delay: 1-2 }
---
scene: fpa.budget_kickoff
arc: the_budget
place: finance_office
tags: [budget, pressure, dark]
weight: 3
cooldown: 52
when: [month in 8 9 10, turn >= 30]
lines:
  - who: char:khang
    en: 'Budget season. Every department sends its numbers in two weeks. Bao will send a sales target that is half of what he knows he can do, and Lan will send costs with a nice cushion of contingency. Everybody games it, and everybody expects us to know. How do you want to run it?'
    vi: 'Mùa ngân sách. Mỗi phòng nộp số liệu trong hai tuần. Anh Bảo sẽ gửi chỉ tiêu bán hàng bằng nửa điều anh biết mình làm được, và chị Lan sẽ gửi chi phí kèm một lớp dự phòng đẹp. Ai cũng chơi trò đó, và ai cũng mong mình biết. Em muốn chạy nó thế nào?'
choices:
  - en: "Set one method for every department: a template, the evidence behind each number, last year's actuals and the market, and the same questions for everybody."
    vi: 'Đặt một phương pháp cho mọi phòng ban: một mẫu, bằng chứng đằng sau từng con số, số thực của năm ngoái và thị trường, và cùng một bộ câu hỏi cho tất cả.'
    cost: { hours: 4 }
    outcomes:
      - p: 0.75
        en: 'The first submissions come with evidence, and some with embarrassment. Bao and Lan grumble about the template, and fill it in. The numbers are still padded, and now you can see where.'
        vi: 'Các bản nộp đầu tiên đến kèm bằng chứng, một số kèm sự ngượng ngùng. Anh Bảo và chị Lan càu nhàu về mẫu rồi điền. Các con số vẫn bị đệm, và giờ anh/chị thấy được chỗ nào.'
        effects:
          [
            rel khang trust +3,
            rel bao trust -2,
            rel lan trust -2,
            rep.finance +2,
            stress +4,
            arc the_budget sandbag,
          ]
      - p: 0.25
        ok: false
        en: "Bao calls the template 'bureaucracy' in front of Mr Cuong. Khang answers calmly that the template is the same for everybody, and that it will stay."
        vi: "Anh Bảo gọi mẫu là 'quan liêu' trước mặt anh Cường. Anh Khang trả lời bình tĩnh rằng mẫu giống nhau cho mọi người và sẽ giữ nguyên."
        effects:
          [
            rel khang trust +3,
            rel bao trust -5,
            rel cuong trust -1,
            stress +5,
            arc the_budget sandbag,
          ]
  - en: 'Take the submissions as a first pass and challenge them afterwards, one by one, where the gap is biggest.'
    vi: 'Nhận các bản nộp như vòng đầu và thách thức sau, từng cái một, ở chỗ chênh lớn nhất.'
    outcomes:
      - p: 1
        en: 'The submissions arrive on time and soft. You have four weeks and a long list of challenges.'
        vi: 'Các bản nộp đến đúng hạn và mềm. Anh/chị có bốn tuần và một danh sách thách thức dài.'
        effects: [rel khang trust +1, stress +3, arc the_budget sandbag]
  - en: 'Agree the targets privately with Bao and Lan before they submit, to avoid a fight later.'
    vi: 'Thỏa thuận chỉ tiêu riêng với anh Bảo và chị Lan trước khi họ nộp để tránh cãi nhau về sau.'
    outcomes:
      - p: 0.7
        en: "The budget is quiet and fast. It is also the product of three phone calls that nobody wrote down, and everyone's number has a small cushion."
        vi: 'Ngân sách yên ả và nhanh. Nó cũng là sản phẩm của ba cuộc gọi không ai ghi lại, và con số của ai cũng có một lớp đệm nhỏ.'
        effects:
          [
            rel bao trust +4,
            rel lan trust +3,
            rel khang trust -2,
            stress +1,
            fact pre_agreed_budget_deals private,
            arc the_budget sandbag,
          ]
      - p: 0.3
        ok: false
        en: 'Huy mentions the private call in a meeting, innocently. Khang asks who else was consulted, and you find you have no list.'
        vi: 'Huy vô tư nhắc cuộc gọi riêng trong một cuộc họp. Anh Khang hỏi ai khác đã được tham vấn, và anh/chị nhận ra mình không có danh sách.'
        effects:
          [
            rel bao trust +2,
            rel lan trust +2,
            rel khang trust -6,
            rep.finance -3,
            stress +4,
            fact pre_agreed_budget_deals witnessed,
            arc the_budget sandbag,
          ]
---
scene: fpa.sandbagged_targets
weight: 0
place: meeting_room
tags: [budget, targets, dark, arc]
lines:
  - who: char:bao
    en: 'Six percent growth is a realistic number. The market is uncertain, and Anders is not a promise. If I commit to twelve, and miss, I will be punished for ever. Six, and I can beat it, and everyone is happy.'
    vi: 'Tăng trưởng sáu phần trăm là con số thực tế. Thị trường bất định, và ông Anders không phải lời hứa. Nếu anh cam kết mười hai rồi hụt, anh sẽ bị phạt mãi. Sáu thì anh vượt được, và ai cũng vui.'
  - who: char:lan
    en: 'My costs have nine percent contingency because steel and power are volatile. If you cut it, I will come to you every month to ask for more.'
    vi: 'Chi phí của chị có chín phần trăm dự phòng vì thép và điện biến động. Nếu em cắt, mỗi tháng chị sẽ đến xin thêm.'
choices:
  - en: 'Show Bao the pipeline and the market growth, show Lan the commodity ranges, and agree defensible midpoints with the assumptions written down.'
    vi: 'Cho anh Bảo xem đường ống đơn hàng và tăng trưởng thị trường, cho chị Lan xem khoảng giá hàng hóa và thống nhất mức giữa có thể bảo vệ, kèm giả định viết ra.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: 'Bao argues for an hour and agrees to ten percent. Lan agrees to a four percent contingency and a monthly review of steel. The numbers are lower for them and truer for everyone.'
        vi: 'Anh Bảo tranh luận một giờ và đồng ý mười phần trăm. Chị Lan đồng ý bốn phần trăm dự phòng và xem lại giá thép hằng tháng. Các con số khó hơn cho họ và đúng hơn cho mọi người.'
        effects:
          [
            rel bao trust -3,
            rel lan trust -1,
            rel khang trust +3,
            rep.finance +3,
            stress +3,
            fact documented_budget_assumptions witnessed,
            arc the_budget cut,
          ]
      - p: 0.3
        ok: false
        en: "Bao goes to Mr Cuong, who tells you to 'be reasonable'. You hold the midpoint and ask Khang to confirm it. He does, with a note of his own."
        vi: "Anh Bảo đi gặp anh Cường, người bảo anh/chị 'hợp lý một chút'. Anh/chị giữ mức giữa và nhờ anh Khang xác nhận. Anh xác nhận, kèm một ghi chú riêng."
        effects:
          [
            rel bao trust -5,
            rel lan trust -1,
            rel khang trust +4,
            rep.finance +2,
            stress +5,
            fact documented_budget_assumptions witnessed,
            arc the_budget cut,
          ]
  - en: 'Split the difference quietly, add a stretch overlay of three percent, and tell neither of them.'
    vi: 'Chia đôi chênh lệch lặng lẽ, thêm lớp chỉ tiêu cao ba phần trăm và không báo cho ai trong hai người.'
    outcomes:
      - p: 1
        en: 'The budget lands between sandbagged and honest. Bao beats his number and takes the credit, and Lan finds her cushion has been trimmed and says nothing.'
        vi: 'Ngân sách nằm giữa đệm và trung thực. Anh Bảo vượt con số của mình và nhận công, còn chị Lan thấy lớp dự phòng bị cắt và không nói gì.'
        effects: [rel bao trust +1, rel lan trust -1, stress +2, arc the_budget cut]
  - en: 'Accept both numbers as submitted, and keep the gap as a contingency line in the consolidated budget.'
    vi: 'Chấp nhận cả hai con số như đã nộp và giữ phần chênh làm dòng dự phòng trong ngân sách hợp nhất.'
    outcomes:
      - p: 0.75
        en: 'Everybody is pleased. The consolidated budget is quietly soft by about eight percent of EBITDA, and the contingency line is named something else.'
        vi: 'Ai cũng hài lòng. Ngân sách hợp nhất lặng lẽ mềm khoảng tám phần trăm EBITDA, và dòng dự phòng được đặt tên khác.'
        effects:
          [
            rel bao trust +5,
            rel lan trust +4,
            rel khang trust -2,
            stress +1,
            fact accepted_sandbagged_targets private,
            arc the_budget cut,
          ]
      - p: 0.25
        ok: false
        en: 'Giang asks why the sales target is half the pipeline. You do not have the pipeline in front of you, and Huy does.'
        vi: 'Chị Giang hỏi vì sao chỉ tiêu bán hàng chỉ bằng nửa đường ống đơn hàng. Anh/chị không có đường ống trước mặt, còn Huy thì có.'
        effects:
          [
            rel bao trust +2,
            rel khang trust -5,
            rep.boss -3,
            rep.finance -3,
            stress +5,
            fact accepted_sandbagged_targets witnessed,
            arc the_budget cut,
          ]
---
scene: fpa.directors_cut
weight: 0
place: meeting_room
tags: [budget, pressure, dark, arc]
lines:
  - who: char:cuong
    en: 'The board wants EBITDA up twenty percent. That is the number I have promised. I do not want a discussion about how. I want the budget to say twenty. You are good with the model. Make it work.'
    vi: 'Hội đồng muốn EBITDA tăng hai mươi phần trăm. Đó là con số anh đã hứa. Anh không muốn bàn về cách làm. Anh muốn ngân sách ghi hai mươi. Em giỏi mô hình. Làm cho nó chạy.'
choices:
  - en: 'Show Mr Cuong what must be true for twenty percent: price, volume, cost, each with its risk, and propose twelve percent with a named list of initiatives for the rest.'
    vi: 'Cho anh Cường xem điều gì phải đúng để đạt hai mươi phần trăm: giá, khối lượng, chi phí, mỗi thứ kèm rủi ro, và đề xuất mười hai phần trăm với danh sách sáng kiến có tên cho phần còn lại.'
    cost: { hours: 4 }
    outcomes:
      - p: 0.65
        en: "Mr Cuong reads the bridge. 'So twenty needs a price rise that nobody has agreed.' He takes fifteen to the board, with the initiatives named and the risk flagged. It is less than he wanted."
        vi: "Anh Cường đọc cầu nối. 'Vậy hai mươi cần một đợt tăng giá chưa ai đồng ý.' Anh đưa mười lăm lên hội đồng, với sáng kiến có tên và rủi ro được ghi. Ít hơn anh muốn."
        effects:
          [
            rel cuong trust -1,
            rel khang trust +4,
            rep.boss +2,
            rep.finance +3,
            stress +4,
            arc the_budget pack,
          ]
      - p: 0.35
        ok: false
        en: 'Mr Cuong says the board will not accept a number with a footnote. Khang backs your bridge in the meeting, and asks him to give the board both.'
        vi: 'Anh Cường nói hội đồng sẽ không chấp nhận một con số có chú thích. Anh Khang ủng hộ cầu nối của anh/chị trong cuộc họp và đề nghị anh đưa cho hội đồng cả hai.'
        effects:
          [rel cuong trust -3, rel khang trust +4, rep.finance +2, stress +5, arc the_budget pack]
  - en: 'Give the board fifteen percent, with the identified initiatives and a flagged risk, and say twenty needs a decision on prices.'
    vi: 'Đưa hội đồng mười lăm phần trăm kèm các sáng kiến đã xác định và rủi ro được ghi, và nói hai mươi cần một quyết định về giá.'
    outcomes:
      - p: 1
        en: 'Mr Cuong takes fifteen and the price question to the board. It is a compromise that keeps the numbers attached to their reasons.'
        vi: 'Anh Cường đưa mười lăm và câu hỏi về giá lên hội đồng. Một thỏa hiệp giữ các con số gắn với lý do của chúng.'
        effects: [rel cuong trust +1, rel khang trust +1, stress +3, arc the_budget pack]
  - en: "Add an 'unallocated savings' line to the budget that brings EBITDA to twenty percent, and tell Mr Cuong that the savings will come from somewhere."
    vi: "Thêm dòng 'tiết kiệm chưa phân bổ' vào ngân sách để đưa EBITDA lên hai mươi phần trăm và nói với anh Cường rằng khoản tiết kiệm sẽ đến từ đâu đó."
    outcomes:
      - p: 0.7
        en: 'The budget says twenty. Mr Cuong is delighted. The unallocated line is eight percent of the total, and there is nothing under it.'
        vi: 'Ngân sách ghi hai mươi. Anh Cường rất hài lòng. Dòng chưa phân bổ chiếm tám phần trăm tổng, và bên dưới nó không có gì.'
        effects:
          [
            rel cuong trust +5,
            rel khang trust -4,
            rep.boss +3,
            stress +1,
            fact plugged_the_board_pack private,
            arc the_budget pack,
          ]
      - p: 0.3
        ok: false
        en: "Khang sees the unallocated line in the draft pack and calls you to his desk. 'What is under this?' he asks. You say 'Savings.' He asks for the list."
        vi: "Anh Khang thấy dòng chưa phân bổ trong bản nháp và gọi anh/chị đến bàn. 'Dưới này là gì?' anh hỏi. Anh/chị nói 'Tiết kiệm.' Anh xin danh sách."
        effects:
          [
            rel cuong trust +3,
            rel khang trust -8,
            rep.boss -3,
            rep.finance -4,
            stress +5,
            fact plugged_the_board_pack witnessed,
            arc the_budget pack,
          ]
---
scene: fpa.board_pack_plug
weight: 0
place: meeting_room
tags: [budget, board, consequence, arc]
lines:
  - who: char:giang
    en: "I read footnotes, Mr Khang. This line says 'unallocated improvements' and the sensitivity table does not match the headline. Could someone explain to me, simply, where the last five points of EBITDA come from, and how confident we are?"
    vi: "Tôi đọc chú thích, anh Khang. Dòng này ghi 'cải thiện chưa phân bổ' và bảng độ nhạy không khớp tiêu đề. Ai đó giải thích giúp tôi, đơn giản, năm điểm EBITDA cuối cùng đến từ đâu, và mình tự tin đến mức nào?"
  - who: char:khang
    en: 'The analyst who built the bridge can answer that better than I can.'
    vi: 'Người phân tích dựng cầu nối trả lời việc đó tốt hơn anh.'
choices:
  - en: 'Explain plainly: what is committed, what is only an initiative, what depends on a price decision, and the range of outcomes. Give her the sensitivity table.'
    vi: 'Giải thích rõ ràng: điều gì đã cam kết, điều gì mới chỉ là sáng kiến, điều gì phụ thuộc quyết định giá và khoảng kết quả. Đưa chị bảng độ nhạy.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Giang listens, and asks two sharp questions that you can answer. 'Thank you. That is the first time I have understood this slide.' The board approves fifteen with a quarterly review of the three initiatives."
        vi: "Chị Giang lắng nghe và hỏi hai câu sắc mà anh/chị trả lời được. 'Cảm ơn. Đây là lần đầu tôi hiểu slide này.' Hội đồng duyệt mười lăm kèm xem lại ba sáng kiến mỗi quý."
        effects:
          [
            rel giang trust +6,
            rel khang trust +3,
            rep.boss +3,
            rep.finance +3,
            stress +3,
            arc the_budget end,
          ]
  - en: 'Say the remaining points are initiatives still being detailed, and that the detail will follow.'
    vi: 'Nói các điểm còn lại là sáng kiến đang được chi tiết hóa và chi tiết sẽ đến sau.'
    outcomes:
      - p: 0.6
        en: "Giang nods slowly and writes 'detail to follow' in her notes. The board approves, on a promise, and the promise is in the minutes."
        vi: "Chị Giang gật đầu chậm và ghi 'chi tiết sẽ đến sau' vào ghi chú. Hội đồng duyệt dựa trên một lời hứa, và lời hứa đó có trong biên bản."
        effects: [rel giang trust -1, rel khang trust -1, stress +3, arc the_budget end]
      - p: 0.4
        ok: false
        en: 'Giang asks for the detail in two weeks. You do not have it, and neither does anyone else.'
        vi: 'Chị Giang xin chi tiết sau hai tuần. Anh/chị không có, và không ai khác có.'
        effects:
          [rel giang trust -4, rel khang trust -4, rep.boss -3, stress +5, arc the_budget end]
  - en: 'Say the remaining points come from procurement savings that Tam has already confirmed.'
    vi: 'Nói các điểm còn lại đến từ khoản tiết kiệm mua hàng mà anh Tâm đã xác nhận.'
    outcomes:
      - p: 0.5
        en: 'Giang accepts it and moves on. Tam, who has not confirmed anything, is asked about it by Mr Cuong the next week, and looks at you from across the room.'
        vi: 'Chị Giang chấp nhận và chuyển sang việc khác. Anh Tâm, người chưa xác nhận gì, được anh Cường hỏi tuần sau và nhìn anh/chị từ phía bên kia phòng.'
        effects:
          [
            rel giang trust +1,
            rel tam trust -8,
            rel khang trust -4,
            stress +2,
            fact misled_the_board private,
            arc the_budget end,
          ]
      - p: 0.5
        ok: false
        en: "Giang writes 'Tam?' in the margin and asks him in the corridor, after the meeting. Tam says he has confirmed nothing. Giang does not raise her voice."
        vi: "Chị Giang ghi 'Tâm?' bên lề và hỏi anh ngoài hành lang, sau cuộc họp. Anh Tâm nói anh chưa xác nhận gì. Chị Giang không to tiếng."
        effects:
          [
            rel giang trust -10,
            rel tam trust -10,
            rel khang trust -8,
            rep.boss -8,
            rep.finance -6,
            stress +8,
            fact misled_the_board public,
            arc the_budget end,
          ]
---
arc: the_covenant
title:
  en: 'The covenant'
  vi: 'Điều khoản cam kết'
stages:
  - { id: target, event: fpa.bank_covenant_twist }
  - { id: reclass, event: fpa.reclassify_ask, delay: 1-2 }
  - { id: timing, event: fpa.quarter_end_timing, delay: 2-3 }
  - { id: bank_call, event: fpa.phat_asks, delay: 1-2 }
---
scene: fpa.reclassify_ask
weight: 0
place: finance_office
tags: [bank, accounting, dark, arc]
lines:
  - who: char:duc
    en: "There is a hundred and twenty million of maintenance in this quarter's costs. Some of it is major overhauls that extend the life of the presses. If we classify it as capital expenditure, EBITDA goes up and we are under three. Hanh says it is arguable. Can you prepare the reclassification?"
    vi: 'Trong chi phí quý này có một trăm hai mươi triệu bảo trì. Một phần là đại tu kéo dài tuổi thọ máy ép. Nếu phân loại là chi đầu tư, EBITDA tăng và mình dưới ba. Chị Hạnh nói là có thể tranh luận. Em chuẩn bị việc phân loại lại được không?'
choices:
  - en: 'Decline to reclassify routine maintenance, review the overhaul items individually with Hanh against the capitalisation policy, and recalculate on that basis only.'
    vi: 'Từ chối phân loại lại bảo trì thường xuyên, rà soát từng hạng mục đại tu cùng chị Hạnh theo chính sách vốn hóa và tính lại chỉ trên cơ sở đó.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: "Hanh finds eighteen million that qualify, with invoices and engineers' notes. It moves the ratio from three point two to three point one-eight. It is not enough, and it is true."
        vi: 'Chị Hạnh tìm ra mười tám triệu đủ điều kiện, có hóa đơn và ghi chú của kỹ sư. Nó đưa tỷ lệ từ ba phẩy hai xuống ba phẩy mười tám. Không đủ, và là sự thật.'
        effects:
          [
            rel duc trust -1,
            rel hanh trust +4,
            rel khang trust +3,
            rep.finance +3,
            stress +4,
            arc the_covenant timing,
          ]
      - p: 0.3
        ok: false
        en: 'Duc says the policy is a guideline. You show him the page, and the policy says what it says. He is not pleased, and does not push.'
        vi: 'Anh Đức nói chính sách chỉ là hướng dẫn. Anh/chị cho anh xem trang giấy, và chính sách nói đúng điều nó nói. Anh không vui và không ép.'
        effects:
          [
            rel duc trust -3,
            rel hanh trust +3,
            rel khang trust +3,
            stress +5,
            arc the_covenant timing,
          ]
  - en: "Reclassify the clear overhaul items with Hanh's agreement and the invoices attached, and say that the rest stays in costs."
    vi: 'Phân loại lại các hạng mục đại tu rõ ràng với sự đồng ý của chị Hạnh và hóa đơn đính kèm và nói phần còn lại vẫn nằm trong chi phí.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'Forty million is reclassified, with the paper to support it. Duc accepts that it is not the whole amount.'
        vi: 'Bốn mươi triệu được phân loại lại, có giấy tờ chứng minh. Anh Đức chấp nhận rằng không phải toàn bộ số tiền.'
        effects: [rel duc trust +1, rel hanh trust +1, stress +3, arc the_covenant timing]
  - en: "Reclassify the whole hundred and twenty million as capital expenditure, with a short memo that calls it 'major overhaul programme'."
    vi: "Phân loại lại toàn bộ một trăm hai mươi triệu thành chi đầu tư kèm một bản ghi nhớ ngắn gọi nó là 'chương trình đại tu lớn'."
    outcomes:
      - p: 0.7
        en: 'The covenant ratio reads two point eight-five. Duc is relieved. Hanh signs because you asked, and writes her own note about the classification on her copy.'
        vi: 'Tỷ lệ cam kết là hai phẩy tám lăm. Anh Đức nhẹ nhõm. Chị Hạnh ký vì anh/chị nhờ và viết ghi chú riêng về việc phân loại trên bản của chị.'
        effects:
          [
            rel duc trust +5,
            rel hanh trust -6,
            rep.finance +2,
            stress +1,
            fact reclassified_costs_to_meet_covenant private,
            arc the_covenant timing,
          ]
      - p: 0.3
        ok: false
        en: "Quoc, the internal auditor, reads the memo and the invoices and asks which of the hundred and twenty million is actually an overhaul. The list of the others is on Hanh's copy."
        vi: 'Anh Quốc, kiểm toán nội bộ, đọc bản ghi nhớ và hóa đơn và hỏi trong một trăm hai mươi triệu thì khoản nào thực sự là đại tu. Danh sách các khoản còn lại nằm trên bản của chị Hạnh.'
        effects:
          [
            rel duc trust +2,
            rel hanh trust -8,
            rel quoc trust -8,
            rep.boss -4,
            rep.finance -6,
            stress +6,
            fact reclassified_costs_to_meet_covenant witnessed,
            arc the_covenant timing,
          ]
