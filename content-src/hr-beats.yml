scene: hr.first_week
place: hr_office
tags: [onboarding, people, beat]
beat: 1-3
lines:
  - who: char:oanh
    en: 'Welcome. You are the business partner for sales, quality and the floor. Every manager will say their hire is urgent. Your KPIs are time to hire and cases closed. Remember that a bad hire costs more than an empty chair, and a bad case costs more than both.'
    vi: 'Chào mừng em. Em là HR business partner cho kinh doanh, chất lượng và xưởng. Quản lý nào cũng sẽ nói tuyển người của họ là gấp. KPI của em là thời gian tuyển và số vụ việc được đóng. Hãy nhớ một người tuyển sai tốn hơn một cái ghế trống, và một vụ việc xử lý sai tốn hơn cả hai.'
  - who: char:loan
    en: 'The personnel files are in the grey cabinet. I keep the originals and a copy of every signature. Some files are not complete, and nobody has asked me about that yet.'
    vi: 'Hồ sơ nhân sự ở tủ xám. Em giữ bản gốc và một bản sao mọi chữ ký. Có vài hồ sơ chưa đủ, và chưa ai hỏi em về chuyện đó.'
choices:
  - en: 'Sit with Loan and check ten files at random against the checklist: contract, ID copy, insurance enrolment, signatures. Note every gap.'
    vi: 'Ngồi với Loan kiểm tra ngẫu nhiên mười hồ sơ theo danh mục: hợp đồng, bản sao CCCD, đăng ký bảo hiểm, chữ ký. Ghi lại mọi chỗ thiếu.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Three files miss a signature and one has no insurance enrolment. Loan has the originals in a folder for exactly this. She says quietly: 'Nobody has checked with me before.' Oanh reads your list and says only 'Good. Fix them before the inspector asks.'"
        vi: "Ba hồ sơ thiếu chữ ký và một hồ sơ chưa đăng ký bảo hiểm. Loan có bản gốc trong một cặp cho đúng việc này. Cô khẽ nói: 'Chưa ai kiểm tra cùng em.' Chị Oanh đọc danh sách của anh/chị và chỉ nói 'Tốt. Sửa trước khi thanh tra hỏi.'"
        effects: [rel loan trust +5, rel oanh trust +3, stress +1]
  - en: 'Read the policies and the labour code summary first, and look at the files next week.'
    vi: 'Đọc quy định và bản tóm tắt bộ luật lao động trước, tuần sau mới xem hồ sơ.'
    outcomes:
      - p: 1
        en: 'You learn the rules quickly. A manager asks about a contract in the second week and you answer from the policy, not from the file. It is slightly wrong.'
        vi: 'Anh/chị học quy định nhanh. Tuần thứ hai một quản lý hỏi về một hợp đồng và anh/chị trả lời theo quy định, không theo hồ sơ. Hơi sai.'
        effects: [rel oanh trust +1, stress +1]
  - en: 'Trust the HR system. It says the files are complete, and you have requests to answer.'
    vi: 'Tin hệ thống nhân sự. Nó báo hồ sơ đầy đủ và anh/chị còn nhiều yêu cầu phải trả lời.'
    outcomes:
      - p: 0.7
        en: 'The system says complete because the field says complete. Loan says nothing, and keeps her copies.'
        vi: 'Hệ thống báo đầy đủ vì ô đó ghi là đầy đủ. Loan không nói gì và giữ các bản sao của mình.'
        effects: [rel loan trust -3, stress +1]
      - p: 0.3
        ok: false
        en: 'A manager asks for a contract copy for a dispute. It has no signature. Oanh asks, mildly, whether you looked at the file.'
        vi: 'Một quản lý xin bản sao hợp đồng cho một vụ tranh chấp. Nó không có chữ ký. Chị Oanh hỏi, nhẹ nhàng, em đã xem hồ sơ chưa.'
        effects: [rel loan trust -3, rel oanh trust -4, rep.boss -2, stress +3]
---
scene: hr.midyear_review
place: meeting_room
tags: [people, review, beat]
beat: 24-28
lines:
  - who: char:oanh
    en: 'Half a year. Your time to hire is slow, but the people you hired are staying, and the two cases you handled have not come back. Mr Cuong only looks at the time to hire. How do you want to handle that?'
    vi: 'Nửa năm rồi. Thời gian tuyển của em chậm, nhưng người em tuyển ở lại và hai vụ việc em xử lý chưa quay lại. Anh Cường chỉ nhìn thời gian tuyển. Em muốn xử lý chuyện đó thế nào?'
choices:
  - en: 'Show the quality of hire: first-year retention, manager satisfaction, and the cost of the two bad hires you prevented. Propose a second KPI.'
    vi: 'Cho xem chất lượng tuyển dụng: tỷ lệ giữ chân năm đầu, mức hài lòng của quản lý và chi phí hai lần tuyển sai mà anh/chị đã tránh được. Đề xuất một KPI thứ hai.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.7
        en: "Oanh takes the page to Mr Cuong. 'Ninety-day retention' is added to the review next to time to hire. A small change, and it changes what recruiters are rewarded for."
        vi: "Chị Oanh mang trang giấy lên anh Cường. 'Tỷ lệ giữ chân 90 ngày' được thêm vào đánh giá cạnh thời gian tuyển. Một thay đổi nhỏ, và nó đổi điều nhà tuyển dụng được thưởng."
        effects: [rel oanh trust +4, rep.boss +3, stress +1]
      - p: 0.3
        ok: false
        en: "Mr Cuong says that retention is a number he can only measure next year. Oanh shrugs: 'I tried.' Your time to hire stays slow."
        vi: "Anh Cường nói giữ chân là con số anh chỉ đo được năm sau. Chị Oanh nhún vai: 'Chị đã thử.' Thời gian tuyển của em vẫn chậm."
        effects: [rel oanh trust +2, stress +2]
  - en: 'Say you will speed up the easy roles and ask to keep the senior ones slow.'
    vi: 'Nói anh/chị sẽ tăng tốc các vị trí dễ và xin giữ các vị trí cấp cao chậm hơn.'
    outcomes:
      - p: 1
        en: 'Oanh agrees. Your numbers improve a little, and nobody notices the senior roles.'
        vi: 'Chị Oanh đồng ý. Con số của anh/chị cải thiện chút ít và không ai để ý các vị trí cấp cao.'
        effects: [rel oanh trust +2, stress +2]
  - en: 'Say you will hit the number whatever it takes.'
    vi: 'Nói anh/chị sẽ đạt con số đó bằng mọi giá.'
    outcomes:
      - p: 0.6
        en: "Oanh smiles. 'Good attitude.' A week later she hands you a list of twelve roles that must close in a month, and you realise what 'whatever it takes' means for reference checks."
        vi: "Chị Oanh cười. 'Thái độ tốt.' Một tuần sau chị đưa danh sách mười hai vị trí phải đóng trong một tháng, và anh/chị nhận ra 'bằng mọi giá' nghĩa gì với việc kiểm tra tham chiếu."
        effects: [rel oanh trust +3, stress +3]
      - p: 0.4
        ok: false
        en: "Two managers hear about your 'whatever it takes' and ask for faster, shorter interviews. One of the hires leaves in the first month."
        vi: "Hai quản lý nghe chuyện 'bằng mọi giá' và xin phỏng vấn nhanh hơn, ngắn hơn. Một người được tuyển nghỉ ngay tháng đầu."
        effects: [rel oanh trust -2, rep.boss -2, stress +3]
---
scene: hr.cost_cut_twist
arc: the_list
place: meeting_room
tags: [pressure, layoff, beat]
beat: 29-32
lines:
  - who: char:cuong
    en: 'Orders are down eleven percent and the steel price is up. I need headcount down ten percent by the end of next month. Oanh tells me you are the one who knows the files. I want a list, and I want it fast.'
    vi: 'Đơn hàng giảm mười một phần trăm và giá thép tăng. Anh cần giảm mười phần trăm nhân sự trước cuối tháng sau. Chị Oanh bảo em là người nắm hồ sơ. Anh muốn một danh sách, và muốn nhanh.'
  - who: char:oanh
    en: 'The law gives us notice periods, severance and consultation. If the list is wrong, we pay twice. Tell Mr Cuong what is possible.'
    vi: 'Luật quy định thời hạn báo trước, trợ cấp và tham vấn. Nếu danh sách sai, mình trả hai lần. Em nói với anh Cường điều gì khả thi.'
choices:
  - en: 'Propose a staged plan: freeze hiring, voluntary leave, end the temps, and only then a short list chosen on written, role-based criteria, with the notice and severance costed.'
    vi: 'Đề xuất kế hoạch từng bước: ngừng tuyển, nghỉ tự nguyện, chấm dứt người thời vụ và chỉ sau đó mới có danh sách ngắn chọn theo tiêu chí viết rõ gắn với vị trí, có tính chi phí báo trước và trợ cấp.'
    cost: { hours: 4 }
    outcomes:
      - p: 0.7
        en: "Mr Cuong frowns at the timeline, then at the severance number, then agrees. 'Six percent by the deadline, the rest by quarter end.' You have a plan that can be defended."
        vi: "Anh Cường cau mày vì lộ trình, rồi vì con số trợ cấp, rồi đồng ý. 'Sáu phần trăm đúng hạn, phần còn lại cuối quý.' Anh/chị có một kế hoạch bảo vệ được."
        effects: [rel oanh trust +4, rel cuong trust +2, rep.boss +3, stress +4, arc the_list names]
      - p: 0.3
        ok: false
        en: 'Mr Cuong says that is too slow and gives you three weeks. Oanh tells you afterwards that she backs the staged plan and has said so.'
        vi: 'Anh Cường nói vậy là quá chậm và cho ba tuần. Sau đó chị Oanh nói chị ủng hộ kế hoạch từng bước và đã nói như vậy.'
        effects: [rel oanh trust +3, rel cuong trust -2, stress +5, arc the_list names]
  - en: 'Say you can have a list in a week, from performance ratings and attendance, and review it with Oanh and the line managers.'
    vi: 'Nói anh/chị có thể có danh sách trong một tuần, dựa trên đánh giá hiệu suất và chuyên cần, và rà soát cùng chị Oanh và các quản lý.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: 'Mr Cuong nods. It is quicker, and the ratings are the only data you have. You also know the ratings were written by managers with their own reasons.'
        vi: 'Anh Cường gật đầu. Nhanh hơn, và đánh giá hiệu suất là dữ liệu duy nhất anh/chị có. Anh/chị cũng biết các đánh giá do quản lý viết với lý do riêng của họ.'
        effects: [rel cuong trust +2, stress +3, arc the_list names]
  - en: 'Say you will have the list tomorrow, and that it will be based on cost to the company.'
    vi: 'Nói ngày mai anh/chị sẽ có danh sách và nó dựa trên chi phí cho công ty.'
    outcomes:
      - p: 0.7
        en: 'Mr Cuong smiles for the first time this year. A cost-based list will include the highest paid, the people on leave and the ones who have complained. You know that, and you say nothing.'
        vi: 'Anh Cường cười lần đầu trong năm nay. Một danh sách theo chi phí sẽ gồm người lương cao nhất, người đang nghỉ phép và người đã khiếu nại. Anh/chị biết vậy và không nói gì.'
        effects: [rel cuong trust +4, rel oanh trust -3, stress +2, arc the_list names]
      - p: 0.3
        ok: false
        en: "Oanh hears about the 'cost to the company' list and asks to see the method. She does not look at you for the rest of the meeting."
        vi: "Chị Oanh nghe về danh sách 'chi phí cho công ty' và xin xem phương pháp. Chị không nhìn anh/chị suốt phần còn lại của cuộc họp."
        effects: [rel cuong trust +2, rel oanh trust -8, rep.boss -3, stress +4, arc the_list names]
---
scene: hr.labour_inspection
place: hr_office
tags: [audit, labour, beat]
beat: 41-44
lines:
  - who: char:sang
    en: 'I am here for the labour inspection. I would like to see the contracts of all employees hired in the last two years, the overtime records for the last six months, and the social insurance declarations. I start with the files, not with a tour.'
    vi: 'Tôi đến thanh tra lao động. Tôi muốn xem hợp đồng của tất cả nhân viên được tuyển trong hai năm qua, hồ sơ giờ làm thêm sáu tháng qua và các kê khai bảo hiểm xã hội. Tôi bắt đầu từ hồ sơ, không phải đi tham quan.'
  - who: char:oanh
    en: 'Give him what he asks for. Do not guess. If we do not know, we say we will find out.'
    vi: 'Đưa ông ấy những gì ông ấy yêu cầu. Đừng đoán. Nếu không biết thì nói sẽ tìm hiểu.'
choices:
  - en: 'Put the real files on the table, including the gaps and the late renewals, and say what you are doing about each.'
    vi: 'Đặt hồ sơ thật lên bàn, kể cả chỗ thiếu và các lần gia hạn muộn, và nói anh/chị đang làm gì với từng chỗ.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Sang reads for three hours and writes five observations. None is serious. 'Files that match the payroll. I wish that were less unusual.' Loan nods at you across the room."
        vi: "Ông Sáng đọc ba giờ và ghi năm nhận xét. Không cái nào nghiêm trọng. 'Hồ sơ khớp với bảng lương. Tôi ước điều đó bớt hiếm.' Loan gật đầu với anh/chị từ phía bên kia phòng."
        effects: [rel sang trust +5, rel loan trust +4, rel oanh trust +3, rep.boss +3, stress +2]
  - en: 'Fix the obvious problems honestly, answer his questions, and produce the records he asks for.'
    vi: 'Sửa các vấn đề rõ ràng một cách trung thực, trả lời câu hỏi và đưa các hồ sơ ông yêu cầu.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "A routine inspection. Sang notes two items, both already on Oanh's list. You come out with nothing to hide and no credit either."
        vi: 'Một buổi thanh tra thường lệ. Ông Sáng ghi hai mục, cả hai đã có trong danh sách của chị Oanh. Anh/chị ra về không có gì phải giấu và cũng không được tiếng khen.'
        effects: [rel sang trust +1, rel oanh trust +1]
  - en: 'Prepare the files: sign the missing signatures with the original dates, align the overtime sheets to the legal cap, and make the insurance figures look complete.'
    vi: 'Chuẩn bị hồ sơ: bổ sung các chữ ký còn thiếu với ngày gốc, chỉnh bảng giờ làm thêm cho khớp mức trần luật định và làm số liệu bảo hiểm trông đầy đủ.'
    outcomes:
      - p: 0.45
        en: 'Sang reads a perfect set of files. He holds a contract up to the light and asks why the ink on the signature is newer than the ink on the page, and accepts the explanation.'
        vi: 'Ông Sáng đọc một bộ hồ sơ hoàn hảo. Ông giơ một hợp đồng lên ánh sáng và hỏi sao mực chữ ký mới hơn mực trên trang, rồi chấp nhận lời giải thích.'
        effects:
          [rel sang trust -2, rel loan trust -6, stress -1, fact backdated_hr_records private]
      - p: 0.55
        ok: false
        en: "Loan's own copies show the original dates, and the payroll shows the real overtime. Sang puts the two sets side by side on the table and says nothing for a long time."
        vi: 'Bản sao của chính Loan cho thấy ngày gốc và bảng lương cho thấy giờ làm thêm thật. Ông Sáng đặt hai bộ cạnh nhau trên bàn và im lặng rất lâu.'
        effects:
          [
            rel sang trust -10,
            rel loan trust -8,
            rel oanh trust -6,
            rep.boss -6,
            stress +6,
            fact backdated_hr_records public,
          ]
---
scene: hr.year_end_review
place: meeting_room
tags: [people, review, beat]
beat: 49-50
lines:
  - who: char:oanh
    en: 'Annual review. Before I give you my view, tell me how you would rate your own year, and what you would handle differently.'
    vi: 'Đánh giá cuối năm. Trước khi chị cho ý kiến, em hãy tự chấm năm của mình và nói em sẽ xử lý khác đi điều gì.'
choices:
  - en: 'Give an honest account, including the hire you pushed through, the case that was slow, and the moments you wished you had said no.'
    vi: 'Kể thật lòng, kể cả người anh/chị đã đẩy cho được tuyển, vụ việc chậm và những lúc anh/chị ước mình đã nói không.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "Oanh is quiet for a long moment. She writes: 'Says what the manager does not want to hear, early.' It is the best thing you have read about yourself."
        vi: "Chị Oanh im lặng một lúc lâu. Chị viết: 'Nói điều quản lý không muốn nghe, từ sớm.' Đó là lời hay nhất anh/chị từng đọc về mình."
        effects: [rel oanh trust +5, rep.boss +4, stress -2]
  - en: 'Stay modest: list the wins and one thing to improve.'
    vi: 'Khiêm tốn: nêu các thắng lợi và một điều cần cải thiện.'
    outcomes:
      - p: 1
        en: 'A safe review. Oanh nods and moves to the next topic.'
        vi: 'Một buổi đánh giá an toàn. Chị Oanh gật đầu và chuyển chủ đề.'
        effects: [rel oanh trust +1, rep.boss +1]
  - en: 'Present the year as a success and leave out the cases that were handled quietly.'
    vi: 'Trình bày cả năm như một thành công và bỏ qua những vụ việc được xử lý lặng lẽ.'
    outcomes:
      - p: 0.65
        en: 'It lands well. You leave with a good rating and a small weight in your chest.'
        vi: 'Được đón nhận tốt. Anh/chị ra về với điểm cao và một chút nặng nề trong lòng.'
        effects: [rel oanh trust +2, rep.boss +4, stress +1, fact polished_hr_review private]
      - p: 0.35
        ok: false
        en: 'Oanh has the case log open on her desk, with the dates. She turns it towards you without a word.'
        vi: 'Chị Oanh có sổ theo dõi vụ việc mở sẵn trên bàn, có cả ngày tháng. Chị xoay nó về phía anh/chị mà không nói một lời.'
        effects: [rel oanh trust -8, rep.boss -5, stress +4, fact polished_hr_review witnessed]
---
scene: hr.manager_offer
place: meeting_room
tags: [people, promotion, beat]
beat: 51-52
when: [rel.oanh.trust >= 25, rep.boss >= 58]
lines:
  - who: char:oanh
    en: 'I am moving to group HR at the end of the year. Mr Cuong asked me who should lead HR here. I named you. One condition: every month, a director will ask you to do something quick that the policy does not allow. I need to know what you will say.'
    vi: 'Cuối năm chị chuyển sang nhân sự tập đoàn. Anh Cường hỏi chị ai nên phụ trách nhân sự ở đây. Chị nêu tên em. Một điều kiện: mỗi tháng sẽ có giám đốc nhờ em làm điều gì đó nhanh mà quy định không cho phép. Chị cần biết em sẽ nói gì.'
choices:
  - en: 'Accept, and say plainly which things you will not do, and that the directors will hear it from you first, in writing.'
    vi: 'Nhận lời và nói rõ những điều anh/chị sẽ không làm và ban giám đốc sẽ nghe điều đó từ anh/chị trước, bằng văn bản.'
    outcomes:
      - p: 1
        en: "Oanh smiles. 'Then it is yours. Put the list on the first page of the HR manual.' You take over HR with the limits in writing."
        vi: "Chị Oanh cười. 'Vậy là của em. Đưa danh sách đó lên trang đầu cẩm nang nhân sự.' Anh/chị tiếp quản phòng nhân sự với các giới hạn đã viết ra giấy."
        effects: [rel oanh trust +5, rep.boss +5, end promoted]
  - en: 'Thank her, but decline: you prefer partnering with managers to carrying the pressure of the directors.'
    vi: 'Cảm ơn chị nhưng từ chối: anh/chị muốn làm đối tác với các quản lý hơn là gánh áp lực từ ban giám đốc.'
    outcomes:
      - p: 1
        en: "Oanh looks disappointed, then understanding. 'The next manager may not be as careful as you.'"
        vi: "Chị Oanh có vẻ thất vọng rồi thông cảm. 'Người quản lý tiếp theo có thể không cẩn thận như em.'"
        effects: [rel oanh trust +2, stress -3]
  - en: 'Accept without asking what the condition means in practice.'
    vi: 'Nhận lời mà không hỏi điều kiện đó thực tế nghĩa là gì.'
    outcomes:
      - p: 1
        en: 'Oanh nods slowly and Mr Cuong congratulates you a little too warmly. You realise you agreed to something you did not ask about.'
        vi: 'Chị Oanh gật đầu chậm và anh Cường chúc mừng anh/chị hơi quá nồng nhiệt. Anh/chị nhận ra mình đã đồng ý với điều mình không hỏi.'
        effects: [rep.boss +4, fact accepted_hr_condition private, end promoted]
---
scene: hr.resignation_thought
place: hr_office
tags: [people, pressure]
weight: 2
cooldown: 26
when: [stress >= 75, turn >= 12]
lines:
  - who: char:loan
    en: 'You look like you have not slept. With respect: I have seen business partners take every case home, and leave by the summer. Are you all right?'
    vi: 'Anh/chị trông như chưa ngủ. Xin phép nói thẳng: em từng thấy các bạn HRBP mang mọi vụ việc về nhà và nghỉ vào mùa hè. Anh/chị ổn không?'
choices:
  - en: 'Talk to Oanh about the caseload, and ask her to take the two heaviest cases off your plate.'
    vi: 'Nói với chị Oanh về khối lượng vụ việc và xin chị nhận giúp hai vụ nặng nhất.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.8
        en: 'Oanh listens, takes the two cases herself, and says she should have noticed sooner.'
        vi: 'Chị Oanh lắng nghe, tự nhận hai vụ và nói lẽ ra chị phải để ý sớm hơn.'
        effects: [rel oanh trust +4, rel loan trust +2, stress -6, rep.boss +1]
      - p: 0.2
        ok: false
        en: 'Oanh nods and says everyone is stretched this quarter. You leave with sympathy and the same caseload.'
        vi: 'Chị Oanh gật đầu và nói quý này ai cũng căng. Anh/chị ra về với sự cảm thông và khối lượng cũ.'
        effects: [rel oanh trust +1, stress -1]
  - en: 'Hand in your resignation, politely, with the notice the contract requires.'
    vi: 'Nộp đơn xin nghỉ, lịch sự, báo trước đúng như hợp đồng quy định.'
    outcomes:
      - p: 1
        en: 'Oanh reads it twice and does not argue. You sign your own exit checklist and walk out lighter than you walked in.'
        vi: 'Chị Oanh đọc hai lần và không phản đối. Anh/chị tự ký bảng bàn giao nghỉ việc của mình và bước ra nhẹ nhõm hơn lúc bước vào.'
        effects: [rel oanh trust +2, end walked_away]
  - en: 'Tell Loan you are fine and keep going.'
    vi: 'Nói với Loan là anh/chị ổn và tiếp tục.'
    outcomes:
      - p: 1
        en: 'Loan nods and does not push. You feel slightly worse afterwards for having said it.'
        vi: 'Loan gật đầu và không gặng hỏi. Sau đó anh/chị thấy hơi tệ hơn vì đã nói vậy.'
        effects: [rel loan trust -1, stress +2]
