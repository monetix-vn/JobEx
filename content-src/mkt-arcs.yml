# Brand and Digital Marketing Executive storylines (docs/story/marketing.md): The Claim, The Reviews, The Agency.
arc: the_claim
title:
  en: 'The claim'
  vi: 'Lời quảng cáo'
stages:
  - { id: launch, event: mkt.launch_twist }
  - { id: proof, event: mkt.khoa_data, delay: 2-3 }
  - { id: ship, event: mkt.ship_or_reprint, delay: 1-2 }
  - { id: complaint, event: mkt.claim_complaint, delay: 8-12 }
---
scene: mkt.khoa_data
weight: 0
place: qc_lab
tags: [claims, evidence, dark, arc]
lines:
  - who: char:khoa
    en: 'The final coating tests are in. Three thousand cycles: eighty-eight percent of the non-stick effect remains. Five thousand cycles: sixty-two percent. And batch C failed the adhesion test, so the coating can flake in some pans. Whatever the box says, this is what the evidence says. What do you want to do with it?'
    vi: 'Kết quả kiểm nghiệm lớp phủ cuối cùng đã có. Ba nghìn chu kỳ: còn tám mươi tám phần trăm hiệu quả chống dính. Năm nghìn chu kỳ: sáu mươi hai phần trăm. Và lô C trượt bài kiểm tra độ bám dính, nên lớp phủ có thể bong ở một số chảo. Hộp ghi gì thì ghi, đây là điều bằng chứng nói. Em muốn làm gì với nó?'
choices:
  - en: 'Update the claims register and the website straight away, check the box against the results, and tell Bao and Quyen which claims no longer hold, and what batch C means.'
    vi: 'Cập nhật sổ đăng ký tuyên bố và trang web ngay, đối chiếu hộp với kết quả và nói với anh Bảo và chị Quyên lời nào không còn đứng vững và lô C nghĩa là gì.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Quyen reads the results twice. 'Thank you for not waiting.' Batch C is held, the register is corrected, and Bao is angry with the evidence, not with you."
        vi: "Chị Quyên đọc kết quả hai lần. 'Cảm ơn em đã không chờ.' Lô C bị giữ, sổ đăng ký được sửa, và anh Bảo giận bằng chứng, không giận anh/chị."
        effects:
          [
            rel khoa trust +4,
            rel quyen trust +4,
            rel bao trust -3,
            rep.qc +3,
            rep.boss +2,
            stress +4,
            fact corrected_the_claim witnessed,
            arc the_claim ship,
          ]
  - en: 'Thank Khoa, note the results in the register, and wait for the launch review to decide what to change.'
    vi: 'Cảm ơn anh Khoa, ghi kết quả vào sổ đăng ký và chờ buổi rà soát ra mắt quyết định cần đổi gì.'
    outcomes:
      - p: 1
        en: 'The register has the results. The box, the website and the sales deck have not changed yet. The launch review is in three weeks.'
        vi: 'Sổ đăng ký có kết quả. Hộp, trang web và bộ slide bán hàng chưa đổi. Buổi rà soát ra mắt sau ba tuần.'
        effects: [rel khoa trust +1, stress +2, arc the_claim ship]
  - en: 'Keep the results to yourself until after the launch, and tell Khoa you will deal with it.'
    vi: 'Giữ kết quả cho riêng mình đến sau khi ra mắt và nói với anh Khoa em sẽ xử lý.'
    outcomes:
      - p: 0.7
        en: 'Khoa nods, with a look. The launch goes ahead on the original copy. The report sits in your drawer, and in his system.'
        vi: 'Anh Khoa gật đầu, kèm một cái nhìn. Đợt ra mắt đi tiếp với nội dung gốc. Báo cáo nằm trong ngăn kéo của anh/chị, và trong hệ thống của anh.'
        effects: [rel khoa trust -6, stress +1, fact hid_test_result private, arc the_claim ship]
      - p: 0.3
        ok: false
        en: 'Khoa sends the report to Quyen himself, with a polite note asking whether marketing has seen it. Quyen asks you in the corridor.'
        vi: 'Anh Khoa tự gửi báo cáo cho chị Quyên kèm một ghi chú lịch sự hỏi marketing đã xem chưa. Chị Quyên hỏi anh/chị ngoài hành lang.'
        effects:
          [
            rel khoa trust -8,
            rel quyen trust -7,
            rep.boss -4,
            rep.qc -4,
            stress +5,
            fact hid_test_result witnessed,
            arc the_claim ship,
          ]
---
scene: mkt.ship_or_reprint
weight: 0
place: factory_floor
tags: [claims, packaging, dark, arc]
lines:
  - who: char:bao
    en: "A thousand sets are on pallets with the printed boxes. Anders's trucks come on Monday. If we reprint the boxes, it costs eighteen million and ten days. If we put a sticker over the claim, it looks cheap. If we ship, we ship. Tell me what we do."
    vi: 'Một nghìn bộ đã nằm trên pallet với hộp in sẵn. Xe của ông Anders đến thứ Hai. Nếu in lại hộp thì tốn mười tám triệu và mười ngày. Nếu dán nhãn đè lên lời quảng cáo thì trông rẻ tiền. Nếu giao thì giao. Nói anh nghe mình làm gì.'
choices:
  - en: "Hold the pallets, reprint the boxes with a claim the evidence supports, and tell Anders's team the truth about the new date."
    vi: 'Giữ các pallet, in lại hộp với lời quảng cáo bằng chứng ủng hộ và nói với nhóm ông Anders sự thật về ngày mới.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: "The reprint costs eighteen million and ten days. Anders says the delay is 'irritating, and better than a recall'. Bao says nothing for two days, and then sends a note that says 'fair'."
        vi: "In lại tốn mười tám triệu và mười ngày. Ông Anders nói sự trì hoãn 'khó chịu, và tốt hơn thu hồi'. Anh Bảo im lặng hai ngày rồi gửi một ghi chú chỉ ghi 'công bằng'."
        effects:
          [
            rel bao trust -4,
            rel quyen trust +3,
            rel khoa trust +4,
            rep.buyer +2,
            rep.qc +3,
            stress +5,
            arc the_claim complaint,
          ]
      - p: 0.3
        ok: false
        en: "Anders's promotion window closes before the reprint is ready, and he reduces the order by a third. Mr Cuong asks why the box had to change. Quyen answers, calmly, with Khoa's report."
        vi: 'Cửa sổ khuyến mãi của ông Anders đóng trước khi in lại xong, và ông giảm đơn một phần ba. Anh Cường hỏi vì sao hộp phải đổi. Chị Quyên trả lời, bình tĩnh, bằng báo cáo của anh Khoa.'
        effects:
          [
            rel bao trust -6,
            rel quyen trust +3,
            rel khoa trust +4,
            rel cuong trust -3,
            rep.buyer -2,
            rep.qc +2,
            stress +6,
            arc the_claim complaint,
          ]
  - en: 'Ship with a neat sticker over the claim that is not supported, and put the corrected text on the website.'
    vi: 'Giao với nhãn dán gọn đè lên lời quảng cáo không được ủng hộ và đưa nội dung đã sửa lên trang web.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Anders's team puts the stickers on the first display, and mutters about it. The claim on the box is covered, and the website tells the truth. It is a cheap fix with a visible edge."
        vi: 'Nhóm ông Anders dán nhãn lên mẫu trưng bày đầu tiên và lẩm bẩm. Lời trên hộp được che, và trang web nói đúng. Một cách sửa rẻ với một mép nhìn thấy được.'
        effects: [rel bao trust -1, rel khoa trust +2, stress +3, arc the_claim complaint]
  - en: 'Ship the pallets as printed, and fix the next batch.'
    vi: 'Giao các pallet như đã in và sửa lô sau.'
    outcomes:
      - p: 0.7
        en: 'The trucks leave on Monday with a claim that you know the evidence does not support. Bao thanks you. A thousand customers read it in the next two weeks.'
        vi: 'Các xe rời đi vào thứ Hai với một lời mà anh/chị biết bằng chứng không ủng hộ. Anh Bảo cảm ơn. Một nghìn khách hàng đọc nó trong hai tuần tới.'
        effects:
          [
            rel bao trust +5,
            rel khoa trust -6,
            rel quyen trust -3,
            rep.qc -3,
            stress +1,
            fact shipped_with_known_false_claim private,
            arc the_claim complaint,
          ]
      - p: 0.3
        ok: false
        en: "A buyer's quality team opens a box and compares the claim with the technical sheet they were sent. Anders's email arrives that evening, with the two pages attached."
        vi: 'Nhóm chất lượng của khách mở một hộp và so lời quảng cáo với tờ kỹ thuật họ được gửi. Email của ông Anders đến tối đó, kèm hai trang giấy.'
        effects:
          [
            rel bao trust +2,
            rel khoa trust -8,
            rel quyen trust -6,
            rep.boss -5,
            rep.buyer -6,
            rep.qc -5,
            stress +7,
            fact shipped_with_known_false_claim witnessed,
            arc the_claim complaint,
          ]
---
scene: mkt.claim_complaint
weight: 0
place: meeting_room
tags: [claims, complaint, consequence, arc]
lines:
  - who: char:nga
    en: 'Customer service has had forty-one calls this month about the new pan: the coating is flaking after a few weeks. Some are angry, some are posting photos. People quote the box. What should we tell them?'
    vi: 'Chăm sóc khách hàng nhận bốn mươi mốt cuộc gọi tháng này về chiếc chảo mới: lớp phủ bong sau vài tuần. Một số giận dữ, một số đăng ảnh. Mọi người trích lời trên hộp. Mình nên nói với họ thế nào?'
choices:
  - en: 'Agree a clear, honest message with Nga and Khoa: acknowledge the problem, offer a replacement or refund, quarantine the affected batch, and correct the claim publicly.'
    vi: 'Thống nhất cùng chị Nga và anh Khoa một thông điệp rõ ràng, trung thực: thừa nhận vấn đề, đề nghị đổi hoặc hoàn tiền, cách ly lô bị ảnh hưởng và sửa lời quảng cáo công khai.'
    cost: { hours: 4 }
    outcomes:
      - p: 0.8
        en: "The message costs money and goodwill in the first week, and earns some back in the second. Nga says: 'Finally, something I can say to them that is true.' The complaints fall by half."
        vi: "Thông điệp tốn tiền và thiện cảm tuần đầu, và lấy lại một phần vào tuần hai. Chị Nga nói: 'Cuối cùng, có điều chị nói được với họ mà là thật.' Số khiếu nại giảm một nửa."
        effects:
          [
            rel nga trust +5,
            rel khoa trust +3,
            rel quyen trust +2,
            rep.cs +4,
            rep.buyer +2,
            rep.qc +2,
            stress +5,
            fact corrected_the_claim witnessed,
            arc the_claim end,
          ]
      - p: 0.2
        ok: false
        en: 'Mr Cuong says a public correction will be remembered longer than the flaking. The replacements cost more than he expected, and he says it three times. You keep the message.'
        vi: 'Anh Cường nói một lời cải chính công khai sẽ được nhớ lâu hơn việc bong tróc. Chi phí đổi hàng nhiều hơn anh dự kiến và anh nói ba lần. Anh/chị giữ thông điệp.'
        effects:
          [
            rel nga trust +4,
            rel khoa trust +3,
            rel cuong trust -4,
            rep.cs +3,
            stress +6,
            arc the_claim end,
          ]
  - en: 'Have Nga handle each complaint individually with a replacement, without a public statement.'
    vi: 'Để chị Nga xử lý từng khiếu nại riêng bằng đổi hàng, không có tuyên bố công khai.'
    outcomes:
      - p: 1
        en: 'The customers who call are helped. Those who post are answered one by one. The claim stays on the box and the website.'
        vi: 'Khách gọi được giúp. Khách đăng bài được trả lời từng người. Lời quảng cáo vẫn ở trên hộp và trang web.'
        effects: [rel nga trust +1, rep.cs +1, stress +4, arc the_claim end]
  - en: 'Tell Nga that the flaking is caused by misuse, and that customers should be told to use wooden spoons.'
    vi: 'Nói với chị Nga rằng bong tróc là do dùng sai cách và khách nên được bảo dùng muỗng gỗ.'
    outcomes:
      - p: 0.5
        en: 'The reply goes out. Some customers accept it. The ones who do not forward it to a consumer forum, with your words and the box side by side.'
        vi: 'Câu trả lời được gửi đi. Một số khách chấp nhận. Những người không chấp nhận chuyển nó lên diễn đàn người tiêu dùng, kèm lời của anh/chị và cái hộp cạnh nhau.'
        effects:
          [
            rel nga trust -6,
            rel khoa trust -5,
            rep.cs -5,
            rep.buyer -3,
            stress +3,
            fact blamed_customers_for_defect private,
            arc the_claim end,
          ]
      - p: 0.5
        ok: false
        en: "Khoa's lab confirms the flaking is a coating adhesion failure on batch C, and the confirmation is dated before your reply. Nga forwards it to Quyen, with a polite question."
        vi: 'Phòng thí nghiệm của anh Khoa xác nhận bong tróc là lỗi bám dính lớp phủ ở lô C, và xác nhận đề ngày trước câu trả lời của anh/chị. Chị Nga chuyển nó cho chị Quyên kèm một câu hỏi lịch sự.'
        effects:
          [
            rel nga trust -8,
            rel khoa trust -8,
            rel quyen trust -7,
            rep.boss -6,
            rep.cs -8,
            rep.qc -5,
            stress +7,
            fact blamed_customers_for_defect witnessed,
            arc the_claim end,
          ]
---
arc: the_reviews
title:
  en: 'The reviews'
  vi: 'Đánh giá'
stages:
  - { id: slow, event: mkt.slow_launch }
  - { id: batch, event: mkt.review_batch, delay: 1-2 }
  - { id: post, event: mkt.influencer_post, delay: 2-3 }
  - { id: exposed, event: mkt.review_exposed, delay: 4-6 }
---
scene: mkt.slow_launch
arc: the_reviews
place: meeting_room
tags: [reviews, launch, dark]
weight: 3
cooldown: 40
when: [turn >= 12, turn <= 40]
lines:
  - who: char:bao
    en: "The Eterna pan has eleven reviews on the marketplace, and the average is three point eight. The rival's is four point six with four hundred. Nobody buys a three point eight. Do something."
    vi: 'Chảo Eterna có mười một đánh giá trên sàn và điểm trung bình ba phẩy tám. Của đối thủ là bốn phẩy sáu với bốn trăm đánh giá. Không ai mua ba phẩy tám. Làm gì đi.'
choices:
  - en: 'Email real buyers a polite request for an honest review, fix the two issues that the low reviews mention, and answer every negative review publicly.'
    vi: 'Gửi email cho khách thật một lời mời đánh giá trung thực, sửa hai vấn đề các đánh giá thấp nhắc tới và trả lời mọi đánh giá tiêu cực công khai.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: 'In three weeks there are sixty reviews and the average is four point one. It is slower than Bao wanted, and the reviews are real.'
        vi: 'Sau ba tuần có sáu mươi đánh giá và điểm trung bình bốn phẩy một. Chậm hơn anh Bảo muốn, và các đánh giá là thật.'
        effects:
          [
            rel bao trust -2,
            rel quyen trust +3,
            rel nga trust +3,
            rep.buyer +2,
            rep.cs +3,
            stress +3,
            arc the_reviews batch,
          ]
      - p: 0.3
        ok: false
        en: 'Two of the new reviews are harsh and fair. Bao reads them aloud in the meeting. You answer them in public, and one of the reviewers raises the score.'
        vi: 'Hai trong số các đánh giá mới gay gắt và công bằng. Anh Bảo đọc to trong cuộc họp. Anh/chị trả lời công khai, và một người đánh giá nâng điểm.'
        effects:
          [
            rel bao trust -4,
            rel quyen trust +3,
            rel nga trust +3,
            rep.cs +2,
            stress +4,
            arc the_reviews batch,
          ]
  - en: 'Offer a discount to buyers who write a review, with a note that the review must be honest and disclose the discount.'
    vi: 'Tặng giảm giá cho người mua viết đánh giá, kèm lưu ý đánh giá phải trung thực và nêu rõ việc giảm giá.'
    outcomes:
      - p: 1
        en: 'Reviews rise, and the average rises with them, to four point two. The disclosure line is in every one. A few commentators say incentivised reviews are never quite neutral, and they are right.'
        vi: 'Đánh giá tăng, điểm trung bình tăng theo, lên bốn phẩy hai. Dòng công bố có trong từng cái. Một vài người bình luận nói đánh giá có khuyến khích không bao giờ hoàn toàn trung lập, và họ đúng.'
        effects:
          [rel bao trust +1, rel quyen trust +1, rep.buyer +1, stress +2, arc the_reviews batch]
  - en: "Ask Dat's agency to seed the page with reviews, and do not ask how."
    vi: 'Nhờ agency của anh Đạt gieo đánh giá lên trang và không hỏi cách làm.'
    outcomes:
      - p: 0.7
        en: "Dat says 'Leave it to us.' Two hundred reviews appear in four days. Bao is delighted. The reviewers' accounts are each three days old."
        vi: "Anh Đạt nói 'Cứ để bọn em.' Hai trăm đánh giá xuất hiện trong bốn ngày. Anh Bảo rất vui. Các tài khoản người đánh giá mỗi cái mới ba ngày tuổi."
        effects:
          [
            rel bao trust +5,
            rel dat trust +4,
            rel nga trust -3,
            stress +1,
            fact bought_fake_reviews private,
            arc the_reviews post,
          ]
      - p: 0.3
        ok: false
        en: "The marketplace flags the pattern and removes a hundred and eighty reviews, along with the page's badge. Nga sees customers asking about it, and tells Quyen."
        vi: 'Sàn đánh dấu mẫu hình này và xóa một trăm tám mươi đánh giá, cùng huy hiệu của trang. Chị Nga thấy khách hỏi về chuyện đó và báo chị Quyên.'
        effects:
          [
            rel bao trust +2,
            rel dat trust +2,
            rel nga trust -5,
            rel quyen trust -6,
            rep.boss -4,
            rep.cs -4,
            stress +6,
            fact bought_fake_reviews witnessed,
            arc the_reviews post,
          ]
---
scene: mkt.review_batch
weight: 0
place: meeting_room
tags: [reviews, agency, dark, arc]
lines:
  - who: char:dat
    en: "Quick idea for the weekend. We have a network of accounts that can post positive comments and reviews at scale. A hundred a day, with real photos. It is how everybody in the category does it. We can also take down a few of the rival's reviews, if you want, with a report to the marketplace."
    vi: 'Một ý nhanh cho cuối tuần. Bọn em có một mạng tài khoản có thể đăng bình luận và đánh giá tích cực quy mô lớn. Một trăm cái mỗi ngày, kèm ảnh thật. Trong ngành ai cũng làm vậy. Bọn em cũng có thể gỡ vài đánh giá của đối thủ, nếu anh/chị muốn, bằng cách báo cáo lên sàn.'
choices:
  - en: 'Decline both, and ask Dat for a proposal on real customer content: unboxing videos from actual buyers, a review request in the pack, and a helpful answers page.'
    vi: 'Từ chối cả hai và nhờ anh Đạt đề xuất nội dung từ khách hàng thật: video mở hộp từ người mua thật, lời mời đánh giá trong hộp và một trang trả lời hữu ích.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Dat sighs, and says 'Slower, but cleaner.' His proposal arrives on Monday, and it is good. Quyen reads it and says 'This is the one.'"
        vi: "Anh Đạt thở dài và nói 'Chậm hơn, nhưng sạch hơn.' Đề xuất của anh đến vào thứ Hai, và nó hay. Chị Quyên đọc và nói 'Cái này đó.'"
        effects:
          [rel dat trust -1, rel quyen trust +3, rep.buyer +2, stress +2, arc the_reviews post]
  - en: 'Accept a small batch of testimonials from real employees and friends of the company, clearly marked as such.'
    vi: 'Chấp nhận một số ít lời chứng thực từ nhân viên thật và bạn bè của công ty, có ghi rõ như vậy.'
    outcomes:
      - p: 1
        en: "Forty reviews appear with a line saying 'posted by a member of the team'. They are warm, and some people discount them. It is not deceptive."
        vi: "Bốn mươi đánh giá xuất hiện kèm dòng 'đăng bởi một thành viên của đội'. Chúng ấm áp, và một số người giảm giá trị. Không lừa dối."
        effects: [rel dat trust +1, rel quyen trust +1, stress +2, arc the_reviews post]
  - en: 'Accept both, and keep it between the two of you.'
    vi: 'Chấp nhận cả hai và giữ giữa hai người.'
    outcomes:
      - p: 0.7
