scene: mkt.review_exposed
weight: 0
place: meeting_room
tags: [reviews, exposure, consequence, arc]
lines:
  - who: char:quyen
    en: 'A consumer blog has published a piece about the reviews of the category. It does not name us, but it describes a pattern of accounts, review dates and an influencer, that fit us exactly. A journalist has asked for comment. Tell me what we say, and tell me what is true.'
    vi: 'Một blog người tiêu dùng đăng bài về các đánh giá trong ngành. Bài không nêu tên mình, nhưng mô tả một mẫu hình tài khoản, ngày đánh giá và một người có ảnh hưởng, khớp đúng với mình. Một nhà báo xin bình luận. Nói chị nghe mình nói gì, và nói chị nghe điều gì là thật.'
choices:
  - en: 'Tell Quyen exactly what was done and by whom, draft a short public statement that corrects the record, and ask the marketplace to review any content you cannot stand behind.'
    vi: 'Nói với chị Quyên chính xác điều đã làm và ai làm, soạn một tuyên bố công khai ngắn chỉnh lại thông tin và nhờ sàn rà soát mọi nội dung anh/chị không bảo vệ được.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Quyen reads the draft and says 'This will hurt for a month.' The statement goes out. The journalist writes 'the company moved before being asked'. The reviews that remain are real, and there are fewer of them."
        vi: "Chị Quyên đọc bản nháp và nói 'Cái này sẽ đau một tháng.' Tuyên bố được đưa ra. Nhà báo viết 'công ty hành động trước khi bị hỏi'. Các đánh giá còn lại là thật, và ít hơn."
        effects:
          [
            rel quyen trust +3,
            rel nga trust +3,
            rep.boss -2,
            rep.buyer +2,
            rep.cs +2,
            stress +6,
            fact came_clean_to_auditor witnessed,
            arc the_reviews end,
          ]
  - en: 'Say the company has a review policy and has not been contacted by the marketplace, and give the journalist no further comment.'
    vi: 'Nói công ty có chính sách đánh giá và chưa được sàn liên hệ và không bình luận thêm với nhà báo.'
    outcomes:
      - p: 0.6
        en: "The journalist writes 'the company declined to comment on the pattern'. It is not a headline, and the question remains."
        vi: "Nhà báo viết 'công ty từ chối bình luận về mẫu hình đó'. Không phải một tiêu đề, và câu hỏi vẫn còn."
        effects: [rel quyen trust -1, stress +4, arc the_reviews end]
      - p: 0.4
        ok: false
        en: "The journalist contacts My and Dat's former colleague. A second article appears with names, and Quyen asks, quietly, what the policy actually was."
        vi: 'Nhà báo liên hệ với My và một đồng nghiệp cũ của anh Đạt. Bài thứ hai xuất hiện kèm tên, và chị Quyên hỏi, khẽ, chính sách thực sự là gì.'
        effects:
          [
            rel quyen trust -6,
            rel my trust -4,
            rep.boss -6,
            rep.buyer -5,
            stress +6,
            arc the_reviews end,
          ]
  - en: 'Say that the agency acted on its own initiative and that the company knew nothing about it.'
    vi: 'Nói agency tự ý hành động và công ty không biết gì.'
    outcomes:
      - p: 0.4
        en: 'The statement holds for a day. Dat says nothing in public, and a great deal in private.'
        vi: 'Tuyên bố giữ được một ngày. Anh Đạt không nói gì công khai và rất nhiều điều riêng tư.'
        effects:
          [
            rel dat trust -15,
            rel quyen trust -2,
            rep.boss -3,
            stress +5,
            fact blamed_the_agency private,
            arc the_reviews end,
          ]
      - p: 0.6
        ok: false
        en: "Dat has the emails. He puts three of them in the journalist's inbox before lunch, with your replies in them."
        vi: 'Anh Đạt có các email. Anh để ba cái vào hộp thư của nhà báo trước bữa trưa, kèm trả lời của anh/chị trong đó.'
        effects:
          [
            rel dat trust -15,
            rel quyen trust -9,
            rep.boss -10,
            rep.buyer -8,
            stress +9,
            fact blamed_the_agency public,
            arc the_reviews end,
          ]
