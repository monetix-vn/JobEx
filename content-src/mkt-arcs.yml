scene: mkt.influencer_post
weight: 0
place: meeting_room
tags: [influencer, disclosure, dark, arc]
lines:
  - who: char:my
    en: "I love the pan and I will post about it. The agency said that the fee is for 'content creation', and that I do not need the paid-partnership label because my followers prefer it natural. I will do whatever you tell me. I just want to know what you want."
    vi: "Em thích chiếc chảo và em sẽ đăng bài về nó. Agency nói phí là cho 'sáng tạo nội dung' và em không cần nhãn hợp tác trả phí vì người theo dõi thích tự nhiên. Em sẽ làm theo bất cứ điều gì anh/chị bảo. Em chỉ muốn biết anh/chị muốn gì."
choices:
  - en: 'Ask My to use the paid-partnership label and a plain line saying that she was paid, and let her say honestly what she likes and what she does not.'
    vi: 'Nhờ My dùng nhãn hợp tác trả phí và một dòng rõ ràng nói chị được trả tiền và để chị nói thật điều chị thích và không thích.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.8
        en: 'My posts that she loves the grip and finds the lid a little heavy. The label is on. Engagement is lower than the last paid post, and the comments are more curious than cynical.'
        vi: 'My đăng rằng chị thích tay cầm và thấy nắp hơi nặng. Nhãn được gắn. Tương tác thấp hơn bài trả phí trước, và các bình luận tò mò hơn là hoài nghi.'
        effects:
          [
            rel my trust +4,
            rel quyen trust +2,
            rep.buyer +3,
            stress +1,
            fact disclosed_sponsorship witnessed,
            arc the_reviews exposed,
          ]
      - p: 0.2
        ok: false
        en: "Dat is annoyed that the agency's script was changed. He tells you 'It works better without the label.' You tell him it works for the rules better with it."
        vi: "Anh Đạt khó chịu vì kịch bản của agency bị đổi. Anh nói 'Không có nhãn thì hiệu quả hơn.' Anh/chị nói có nhãn thì hợp quy định hơn."
        effects:
          [
            rel my trust +4,
            rel dat trust -4,
            rep.buyer +2,
            stress +3,
            fact disclosed_sponsorship witnessed,
            arc the_reviews exposed,
          ]
  - en: 'Let My post in her own way, and ask her to mention in the caption that the brand sent the pan.'
    vi: 'Để My đăng theo cách của chị và nhờ chị nhắc trong chú thích rằng thương hiệu đã gửi chảo.'
    outcomes:
      - p: 1
        en: "The post says 'thanks to the brand for sending this'. It is half-honest, and it does not say that My was paid. A commentator asks, and My answers truthfully."
        vi: "Bài đăng ghi 'cảm ơn thương hiệu đã gửi'. Nửa trung thực, và không nói My được trả tiền. Một người bình luận hỏi, và My trả lời thành thật."
        effects: [rel my trust +1, stress +2, arc the_reviews exposed]
  - en: 'Tell My to post it naturally, with no label and no mention of payment, as the agency said.'
