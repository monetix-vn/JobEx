        vi: "Một người theo dõi thấy mã hóa đơn trong ảnh chụp một email mà My chia sẻ, vô tư, trong một bài khác. Chuỗi bình luận hỏi liệu công ty có trả tiền cho tình yêu 'tự nhiên' không."
        effects:
          [
