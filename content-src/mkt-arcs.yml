scene: mkt.invoice_mismatch
weight: 0
place: finance_office
tags: [agency, invoice, dark, arc]
lines:
  - who: char:dat
    en: "Our invoice for the autumn campaign is in your inbox. I know the shoot was cut from three days to two, and the second video was never made. But we kept the crew booked, and cancellations cost us money. Could you approve it as it is? If it is easier, I can put the difference down as 'production contingency'."
    vi: "Hóa đơn chiến dịch mùa thu của bọn em đã trong hộp thư của anh/chị. Em biết buổi quay bị cắt từ ba ngày xuống hai, và video thứ hai chưa từng làm. Nhưng bọn em giữ đoàn quay, và hủy tốn tiền. Anh/chị duyệt như vậy được không? Nếu dễ hơn, em ghi phần chênh là 'dự phòng sản xuất'."
choices:
  - en: 'Ask for a revised invoice for the work delivered, and agree a fair cancellation fee for the crew with written evidence.'
    vi: 'Yêu cầu một hóa đơn sửa cho công việc đã giao và thống nhất phí hủy hợp lý cho đoàn quay kèm chứng từ.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.8
        en: "Dat grumbles, and sends a revised invoice, with a modest cancellation fee. It is eighteen percent lower. He says 'Fair enough' in the tone of a man recalculating."
        vi: "Anh Đạt càu nhàu và gửi hóa đơn sửa với một khoản phí hủy khiêm tốn. Thấp hơn mười tám phần trăm. Anh nói 'Cũng công bằng' bằng giọng của người đang tính lại."
        effects:
          [
            rel dat trust -2,
            rel quyen trust +2,
            rel duc trust +3,
            rep.finance +3,
            stress +3,
            arc the_agency gift,
          ]
      - p: 0.2
        ok: false
        en: 'Dat says the contract has no cancellation clause, and that he will talk to Long. Long phones you the next morning, and you hold the line, politely.'
        vi: 'Anh Đạt nói hợp đồng không có điều khoản hủy và anh sẽ nói chuyện với anh Long. Sáng hôm sau anh Long gọi anh/chị, và anh/chị giữ vững lập trường, lịch sự.'
        effects:
          [
            rel dat trust -4,
            rel long trust -3,
            rel duc trust +3,
            rep.finance +2,
            stress +5,
            arc the_agency gift,
          ]
  - en: 'Approve the invoice for the delivered work plus a smaller cancellation fee that you can justify with the booking confirmation.'
    vi: 'Duyệt hóa đơn cho công việc đã giao cộng một khoản phí hủy nhỏ hơn mà anh/chị chứng minh được bằng xác nhận đặt chỗ.'
    outcomes:
      - p: 1
        en: 'The invoice is reduced by eight percent, with a note. Dat accepts. It is a compromise that Duc can read in one page.'
        vi: 'Hóa đơn giảm tám phần trăm kèm ghi chú. Anh Đạt chấp nhận. Một thỏa hiệp mà anh Đức đọc được trong một trang.'
        effects: [rel dat trust +1, rel duc trust +1, stress +2, arc the_agency gift]
  - en: "Approve the invoice as it is, with 'production contingency' for the difference."
    vi: "Duyệt hóa đơn nguyên như vậy, với 'dự phòng sản xuất' cho phần chênh."
    outcomes:
      - p: 0.7
        en: 'Dat thanks you warmly. The invoice goes to payment. It includes a day of crew and a video that do not exist.'
        vi: 'Anh Đạt cảm ơn nồng nhiệt. Hóa đơn được chuyển thanh toán. Nó gồm một ngày đoàn quay và một video không tồn tại.'
        effects:
          [
            rel dat trust +5,
            rel quyen trust -2,
            stress +1,
            fact approved_invoice_for_undelivered_work private,
            arc the_agency gift,
          ]
      - p: 0.3
        ok: false
        en: 'Thu, in accounts payable, compares the invoice with the delivery list and finds a video missing. She asks you politely, and writes your answer down.'
        vi: 'Thư, ở bộ phận phải trả, đối chiếu hóa đơn với danh sách bàn giao và thấy thiếu một video. Chị hỏi anh/chị lịch sự và ghi lại câu trả lời.'
        effects:
          [
            rel dat trust +2,
            rel thu trust -5,
            rel duc trust -5,
            rep.boss -4,
            rep.finance -5,
            stress +5,
            fact approved_invoice_for_undelivered_work witnessed,
            arc the_agency gift,
          ]
