scene: mkt.agency_pitch
arc: the_agency
place: meeting_room
tags: [agency, procurement, dark]
weight: 3
cooldown: 52
when: [turn >= 10, turn <= 38]
lines:
  - who: char:long
    en: 'My cousin has just started an agency. Very creative. I think we should give her the autumn campaign, and she will do it at a good price. You know how it is in a family company. Just put her in the proposal list, at the top.'
    vi: 'Em họ anh vừa mở một agency. Rất sáng tạo. Anh nghĩ mình nên giao cho cô ấy chiến dịch mùa thu, và cô ấy sẽ làm với giá tốt. Em biết đó, công ty gia đình mà. Cứ đưa cô ấy vào danh sách đề xuất, ở đầu.'
choices:
  - en: "Invite three agencies including Long's cousin to pitch against the same brief, score them on written criteria with Quyen, and tell Long she is welcome to compete."
    vi: 'Mời ba agency, kể cả em họ anh Long, đề xuất theo cùng một bản yêu cầu, chấm theo tiêu chí viết cùng chị Quyên và nói với anh Long rằng cô ấy cứ tham gia cạnh tranh.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: "Long's cousin comes second, with a lively idea and a weak plan. Dat's agency wins on price and delivery. Long is polite and slightly cold. The scoring sheet is on the file."
        vi: 'Em họ anh Long đứng thứ hai, với một ý tưởng sống động và một kế hoạch yếu. Agency của anh Đạt thắng nhờ giá và tiến độ. Anh Long lịch sự và hơi lạnh. Bảng chấm điểm nằm trong hồ sơ.'
        effects:
          [
            rel long trust -3,
            rel quyen trust +3,
            rel dat trust +2,
            rep.finance +2,
            stress +3,
            fact ran_competitive_pitch witnessed,
            arc the_agency invoice,
          ]
      - p: 0.3
        ok: false
        en: "Long's cousin wins on score. It is a fair result, and the agency is a very small one. You spend a month making sure it can deliver."
        vi: 'Em họ anh Long thắng theo điểm. Một kết quả công bằng, và agency rất nhỏ. Anh/chị mất một tháng để chắc nó làm được.'
        effects:
          [
            rel long trust +3,
            rel quyen trust +2,
            rep.finance +1,
            stress +5,
            fact ran_competitive_pitch witnessed,
            arc the_agency invoice,
          ]
  - en: "Add Long's cousin as a fourth option at the top of the list, and say the final decision will be made by Quyen."
    vi: 'Đưa em họ anh Long vào làm lựa chọn thứ tư ở đầu danh sách và nói quyết định cuối cùng do chị Quyên đưa ra.'
    outcomes:
      - p: 1
        en: "Quyen picks Dat's agency and gives no reason. Long assumes that you did not push hard enough."
        vi: 'Chị Quyên chọn agency của anh Đạt và không nêu lý do. Anh Long cho rằng anh/chị không cố đủ mạnh.'
        effects: [rel long trust -1, rel quyen trust +1, stress +2, arc the_agency invoice]
  - en: "Give the campaign to Long's cousin without a pitch, and tell Quyen it was a directors' decision."
    vi: 'Giao chiến dịch cho em họ anh Long mà không đề xuất và nói với chị Quyên đó là quyết định của ban giám đốc.'
    outcomes:
      - p: 0.7
        en: 'Long beams. Quyen does not argue, and writes the date in her notebook. Dat hears about it, and asks nothing.'
        vi: 'Anh Long rạng rỡ. Chị Quyên không tranh cãi và ghi ngày vào sổ tay. Anh Đạt nghe chuyện và không hỏi gì.'
        effects:
          [
            rel long trust +6,
            rel quyen trust -5,
            rel dat trust -4,
            stress +1,
            fact steered_contract_to_connection private,
            arc the_agency invoice,
          ]
      - p: 0.3
        ok: false
        en: 'Duc asks for the procurement file for the campaign, and finds one page. He asks Quyen. Quyen asks you.'
        vi: 'Anh Đức xin hồ sơ mua sắm của chiến dịch và thấy một trang. Anh hỏi chị Quyên. Chị Quyên hỏi anh/chị.'
        effects:
          [
            rel long trust +3,
            rel quyen trust -8,
            rel duc trust -5,
            rep.boss -4,
            rep.finance -4,
            stress +5,
            fact steered_contract_to_connection witnessed,
            arc the_agency invoice,
          ]
