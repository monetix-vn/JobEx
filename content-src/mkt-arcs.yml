scene: mkt.agency_gift
weight: 0
place: meeting_room
tags: [agency, gift, dark, arc]
lines:
  - who: char:dat
    en: "To thank you for a great autumn, the agency would like to send you and a guest to a resort for the long weekend, all paid. We do it for all our clients' key people. It is not connected to the contract. Though of course, we would love to talk about next year."
    vi: 'Để cảm ơn một mùa thu tuyệt vời, agency muốn gửi anh/chị và một người bạn đi nghỉ dưỡng dịp cuối tuần dài, mọi chi phí đã trả. Bọn em làm với tất cả người chủ chốt của khách hàng. Nó không liên quan đến hợp đồng. Dù tất nhiên, bọn em rất muốn nói về năm sau.'
choices:
  - en: "Decline politely, explain the company's gift policy, and suggest that any thanks take the form of a campaign report, a lunch that you pay for yourself, or nothing."
    vi: 'Từ chối lịch sự, giải thích chính sách quà tặng của công ty và gợi ý mọi lời cảm ơn nên là một báo cáo chiến dịch, một bữa trưa tự trả hoặc không gì cả.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "Dat laughs, and says 'You are the first one who ever refused.' He does not seem offended. The renewal conversation takes place in an office, with Quyen present."
        vi: "Anh Đạt cười và nói 'Anh/chị là người đầu tiên từ chối.' Anh có vẻ không phật ý. Cuộc nói chuyện gia hạn diễn ra trong văn phòng, có chị Quyên."
        effects:
          [
            rel dat trust +1,
            rel quyen trust +3,
            rep.finance +2,
            rep.boss +2,
            stress +2,
            fact reported_agency_gift witnessed,
            arc the_agency reckoning,
          ]
  - en: 'Say you can only accept a small, ordinary gift under the policy limit, and declare it in the gift register.'
    vi: 'Nói anh/chị chỉ nhận một món quà nhỏ, bình thường dưới hạn mức chính sách và khai báo vào sổ quà tặng.'
