fact: substantiated_claims
severity: 1
category: integrity
en: 'you checked every claim against its evidence before it went public'
vi: 'bạn kiểm tra từng lời quảng cáo với bằng chứng trước khi công bố'
lesson:
  en: 'A claims register is a slow process that prevents a rare, expensive embarrassment. The claim that the test can support is the only one a buyer, a regulator and a journalist will leave alone.'
  vi: 'Sổ đăng ký tuyên bố là một quy trình chậm ngăn một sự bối rối hiếm và đắt đỏ. Lời quảng cáo mà bài kiểm nghiệm ủng hộ được là lời duy nhất khách, cơ quan quản lý và nhà báo để yên.'
witnessed:
  boss: 2
  qc: 3
public:
  boss: 3
  buyer: 3
