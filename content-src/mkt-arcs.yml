fact: overclaimed_on_packaging
severity: 7
category: integrity
en: 'you printed a lifetime claim on the packaging that the tests did not support'
vi: 'bạn in lên bao bì một lời hứa tuổi thọ mà các bài kiểm nghiệm không ủng hộ'
lesson:
  en: 'A claim on a box is a promise to every buyer. Printing one the tests do not support, because a competitor does, is borrowing a risk that the company, not the competitor, will repay.'
  vi: 'Lời quảng cáo trên hộp là lời hứa với mọi người mua. In một lời bài kiểm nghiệm không ủng hộ, vì đối thủ cũng làm vậy, là vay một rủi ro mà công ty, không phải đối thủ, sẽ trả.'
