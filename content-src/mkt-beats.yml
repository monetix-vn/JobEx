scene: mkt.manager_offer
place: meeting_room
tags: [people, promotion, beat]
beat: 51-52
when: [rel.quyen.trust >= 12, rep.boss >= 58]
lines:
  - who: char:quyen
    en: 'I am moving to group brand at the end of the year. Mr Cuong asked me who should lead marketing here. I named you. One condition: every month, a director will ask you to say something on the box that the evidence does not quite support. I need to know what you will say.'
    vi: 'Cuối năm chị chuyển sang thương hiệu tập đoàn. Anh Cường hỏi chị ai nên dẫn dắt marketing ở đây. Chị nêu tên em. Một điều kiện: mỗi tháng sẽ có giám đốc nhờ em ghi lên hộp điều mà bằng chứng không hẳn ủng hộ. Chị cần biết em sẽ nói gì.'
choices:
  - en: 'Accept, and say plainly which claims you will not make, and that the directors will hear it from you first, with the evidence.'
    vi: 'Nhận lời và nói rõ những lời quảng cáo anh/chị sẽ không nói và ban giám đốc sẽ nghe điều đó từ anh/chị trước, kèm bằng chứng.'
    outcomes:
      - p: 1
        en: "Quyen smiles. 'Then it is yours. Put the list on the first page of the claims register.' You take over marketing with the limits in writing."
        vi: "Chị Quyên cười. 'Vậy là của em. Đưa danh sách đó lên trang đầu của sổ đăng ký tuyên bố.' Anh/chị tiếp quản marketing với các giới hạn đã viết ra giấy."
        effects: [rel quyen trust +5, rep.boss +5, end promoted]
  - en: 'Thank her, but decline: you prefer making the campaigns to defending them to the directors.'
    vi: 'Cảm ơn chị nhưng từ chối: anh/chị muốn làm chiến dịch hơn là bảo vệ chúng trước ban giám đốc.'
    outcomes:
      - p: 1
        en: "Quyen looks disappointed, then understanding. 'The next manager may not be as careful as you.'"
        vi: "Chị Quyên có vẻ thất vọng rồi thông cảm. 'Người quản lý tiếp theo có thể không cẩn thận như em.'"
        effects: [rel quyen trust +2, stress -3]
  - en: 'Accept without asking what the condition means in practice.'
    vi: 'Nhận lời mà không hỏi điều kiện đó thực tế nghĩa là gì.'
    outcomes:
      - p: 1
        en: 'Quyen nods slowly and Mr Cuong congratulates you a little too warmly. You realise you agreed to something you did not ask about.'
        vi: 'Chị Quyên gật đầu chậm và anh Cường chúc mừng anh/chị hơi quá nồng nhiệt. Anh/chị nhận ra mình đã đồng ý với điều mình không hỏi.'
        effects: [rep.boss +4, fact accepted_marketing_condition private, end promoted]
