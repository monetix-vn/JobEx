scene: mkt.first_week
place: meeting_room
tags: [onboarding, people, beat]
beat: 1-3
lines:
  - who: char:quyen
    en: 'Welcome. Our brand is simple: honest cookware that lasts. Every claim on a box, a page or a post goes in the claims register with its source, and QC signs the technical ones. I know it is slower. It is also what stops us from being laughed at in public.'
    vi: 'Chào mừng em. Thương hiệu của mình đơn giản: đồ gia dụng trung thực và bền. Mọi lời quảng cáo trên bao bì, trang web hay bài đăng đều vào sổ đăng ký tuyên bố kèm nguồn, và QC ký những mục kỹ thuật. Chị biết nó chậm hơn. Nhưng đó cũng là điều giúp mình không bị cười chê công khai.'
  - who: char:khoa
    en: 'If you want to say a number about the coating, I have the test reports. Come to the lab and I will show you what they actually say.'
    vi: 'Nếu em muốn nói một con số về lớp phủ, anh có các báo cáo kiểm nghiệm. Đến phòng thí nghiệm anh cho em xem chúng thực sự nói gì.'
choices:
  - en: 'Go to the QC lab with Khoa, read the coating reports with him, and start the claims register with the three claims already on the website.'
    vi: 'Đến phòng thí nghiệm QC với anh Khoa, đọc các báo cáo lớp phủ cùng anh và bắt đầu sổ đăng ký tuyên bố với ba lời quảng cáo đã có trên trang web.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "One website claim has a report, one has a note, and one has nothing. Khoa says: 'Nobody has asked me before.' Quyen reads your register and says only 'Good. Fix the third before anyone asks.'"
        vi: "Một lời trên trang web có báo cáo, một có ghi chú và một không có gì. Anh Khoa nói: 'Chưa ai hỏi anh trước đây.' Chị Quyên đọc sổ của anh/chị và chỉ nói 'Tốt. Sửa cái thứ ba trước khi có người hỏi.'"
        effects: [rel khoa trust +5, rel quyen trust +3, rep.qc +2, stress +1]
  - en: 'Read the brand guidelines first, and build the claims register later in the month.'
    vi: 'Đọc hướng dẫn thương hiệu trước và lập sổ đăng ký tuyên bố vào cuối tháng.'
    outcomes:
      - p: 1
        en: 'You learn the tone of voice quickly. A sales email goes out with a claim that the register does not have yet.'
        vi: 'Anh/chị học giọng điệu nhanh. Một email bán hàng gửi đi với một lời mà sổ đăng ký chưa có.'
        effects: [rel quyen trust +1, stress +1]
  - en: 'Trust that the existing copy was checked, and start on the campaign calendar.'
    vi: 'Tin rằng nội dung hiện có đã được kiểm tra và bắt đầu lịch chiến dịch.'
    outcomes:
      - p: 0.7
        en: 'The calendar is on time. Nobody asks about the old claims, until a customer does.'
        vi: 'Lịch đúng hạn. Không ai hỏi về các lời quảng cáo cũ, cho đến khi một khách hàng hỏi.'
        effects: [rel khoa trust -2, stress +1]
      - p: 0.3
        ok: false
        en: "A buyer's email quotes a website claim and asks for the test report. You do not have it, and neither does anyone you ask."
        vi: 'Email của một khách hàng trích một lời trên trang web và xin báo cáo kiểm nghiệm. Anh/chị không có, và không ai anh/chị hỏi có.'
        effects: [rel quyen trust -3, rep.buyer -2, stress +3]
---
scene: mkt.midyear_review
place: meeting_room
tags: [people, review, beat]
beat: 24-28
lines:
  - who: char:quyen
    en: 'Half a year. Your reach is lower than the target, but the leads you generated convert better than any other channel, and nobody has complained about a claim. The directors only look at reach. How do you want to handle that?'
    vi: 'Nửa năm rồi. Lượng tiếp cận của em thấp hơn chỉ tiêu, nhưng khách tiềm năng em tạo ra chuyển đổi tốt hơn mọi kênh khác và không ai khiếu nại về lời quảng cáo nào. Ban giám đốc chỉ nhìn lượng tiếp cận. Em muốn xử lý chuyện đó thế nào?'
choices:
  - en: 'Show the full funnel: reach, leads, conversion, cost per sale and returns, and propose that cost per sale, not reach, is the measure.'
    vi: 'Cho xem toàn bộ phễu: tiếp cận, khách tiềm năng, chuyển đổi, chi phí mỗi đơn và hàng trả lại, và đề xuất lấy chi phí mỗi đơn, không phải lượng tiếp cận, làm thước đo.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.7
        en: "Quyen takes the page to Mr Cuong. 'Cost per sale' is added to the review next to reach. A small change, and it changes what campaigns are rewarded for."
        vi: "Chị Quyên mang trang giấy lên anh Cường. 'Chi phí mỗi đơn' được thêm vào đánh giá cạnh lượng tiếp cận. Một thay đổi nhỏ, và nó đổi điều chiến dịch được thưởng."
        effects: [rel quyen trust +4, rep.boss +3, stress +1]
      - p: 0.3
        ok: false
        en: "Mr Cuong says reach is what the board understands. Quyen shrugs: 'I tried.' Your reach number stays modest."
        vi: "Anh Cường nói lượng tiếp cận là điều hội đồng hiểu. Chị Quyên nhún vai: 'Chị đã thử.' Con số tiếp cận của em vẫn khiêm tốn."
        effects: [rel quyen trust +2, stress +2]
  - en: 'Say you will lift reach with a paid campaign that stays inside the spend limit, and ask for a month.'
    vi: 'Nói anh/chị sẽ nâng lượng tiếp cận bằng một chiến dịch trả phí trong hạn mức chi và xin một tháng.'
    outcomes:
      - p: 1
        en: 'Quyen agrees, and writes the limit next to the plan. Your reach rises by a third, and so does the cost per lead.'
        vi: 'Chị Quyên đồng ý và ghi hạn mức bên cạnh kế hoạch. Lượng tiếp cận của anh/chị tăng một phần ba, và chi phí mỗi khách tiềm năng cũng vậy.'
        effects: [rel quyen trust +2, stress +2]
  - en: 'Say you will hit the reach number whatever it takes.'
    vi: 'Nói anh/chị sẽ đạt con số tiếp cận đó bằng mọi giá.'
    outcomes:
      - p: 0.6
        en: "Quyen smiles. 'Good attitude.' A week later you notice that the cheapest way to reach a million people is a giveaway, a controversy or a claim that is a little too big."
        vi: "Chị Quyên cười. 'Thái độ tốt.' Một tuần sau anh/chị nhận ra cách rẻ nhất để tiếp cận một triệu người là tặng quà, gây tranh cãi hoặc một lời quảng cáo hơi quá lớn."
        effects: [rel quyen trust +3, stress +3]
      - p: 0.4
        ok: false
        en: "Dat hears about 'whatever it takes' and sends over three ideas, one of which you would not like to see in the newspaper."
        vi: "Anh Đạt nghe chuyện 'bằng mọi giá' và gửi sang ba ý tưởng, trong đó có một ý anh/chị không muốn thấy trên báo."
        effects: [rel quyen trust +1, rel dat trust +3, stress +3]
---
scene: mkt.launch_twist
arc: the_claim
place: meeting_room
tags: [pressure, launch, beat]
beat: 29-32
lines:
  - who: char:bao
    en: "Mr Anders wants the new Eterna range in his stores for the autumn promotion, three weeks earlier than we planned. The packaging has to go to print on Friday. Khoa's final coating test is not finished. I need your word that the box can say what we want it to say."
    vi: 'Ông Anders muốn dòng Eterna mới có mặt trong cửa hàng cho đợt khuyến mãi mùa thu, sớm hơn kế hoạch ba tuần. Bao bì phải đi in vào thứ Sáu. Bài kiểm nghiệm lớp phủ cuối cùng của anh Khoa chưa xong. Anh cần lời của em rằng cái hộp có thể ghi điều mình muốn.'
  - who: char:quyen
    en: 'Decide what the box can say with the evidence we have on Friday, not with the evidence we hope for.'
    vi: 'Quyết định cái hộp ghi được gì với bằng chứng mình có vào thứ Sáu, không phải bằng chứng mình hy vọng.'
choices:
  - en: "Write the box copy only from the finished tests, leave the lifetime claim out, say 'tested to three thousand cycles' with the test reference, and add the long-life claim later if the final test supports it."
    vi: "Viết nội dung hộp chỉ từ các bài kiểm nghiệm đã xong, bỏ lời hứa tuổi thọ, ghi 'đã kiểm nghiệm ba nghìn chu kỳ' kèm mã báo cáo và thêm lời về độ bền sau nếu bài kiểm nghiệm cuối ủng hộ."
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: "Bao complains that it is flat. The box goes to print on Friday with a number that Khoa has signed. Anders's team says the claim is 'credible', which they say about very few boxes."
        vi: "Anh Bảo phàn nàn rằng nó nhạt. Hộp đi in vào thứ Sáu với một con số anh Khoa đã ký. Nhóm ông Anders nói lời quảng cáo 'đáng tin', điều họ nói về rất ít hộp."
        effects:
          [
            rel bao trust -2,
            rel khoa trust +4,
            rel quyen trust +3,
            rep.qc +3,
            rep.buyer +2,
            stress +4,
            fact substantiated_claims witnessed,
            arc the_claim proof,
          ]
      - p: 0.3
        ok: false
        en: "Anders's team wants the lifetime claim the competitor uses. Bao says that without it the range will not be listed. You hold the line, and the listing is delayed by two weeks."
        vi: 'Nhóm ông Anders muốn lời hứa tuổi thọ mà đối thủ dùng. Anh Bảo nói không có nó thì dòng hàng sẽ không được niêm yết. Anh/chị giữ ranh giới, và việc niêm yết bị trễ hai tuần.'
        effects:
          [
            rel bao trust -5,
            rel khoa trust +4,
            rel quyen trust +3,
            rep.buyer -1,
            stress +5,
            arc the_claim proof,
          ]
  - en: 'Put the strongest claim that the interim results do not contradict on the box, and ask Khoa to confirm it by Thursday.'
    vi: 'Đưa lên hộp lời mạnh nhất mà kết quả tạm thời không mâu thuẫn và nhờ anh Khoa xác nhận trước thứ Năm.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Khoa confirms a softer version on Thursday. The box says 'long-lasting non-stick' with a reference to the interim test. It is more than he wanted, and less than Bao did."
        vi: "Anh Khoa xác nhận một phiên bản mềm hơn vào thứ Năm. Hộp ghi 'chống dính bền lâu' kèm tham chiếu bài kiểm nghiệm tạm thời. Nhiều hơn anh muốn, và ít hơn anh Bảo muốn."
        effects: [rel bao trust +1, rel khoa trust +1, stress +3, arc the_claim proof]
  - en: "Put 'non-stick for life' on the box, because the competitor does, and sort out the evidence after the launch."
    vi: "Ghi 'chống dính trọn đời' lên hộp vì đối thủ cũng ghi và xử lý bằng chứng sau khi ra mắt."
    outcomes:
      - p: 0.7
        en: "The box goes to print. Bao is delighted, and Anders's team sends a thumbs up. Khoa's test is still running. Nobody tells you what it will say."
        vi: 'Hộp đi in. Anh Bảo rất vui, và nhóm ông Anders gửi một biểu tượng ngón tay cái. Bài kiểm nghiệm của anh Khoa vẫn đang chạy. Không ai nói với anh/chị nó sẽ ra sao.'
        effects:
          [
            rel bao trust +5,
            rel khoa trust -4,
            rel quyen trust -2,
            stress +1,
            fact overclaimed_on_packaging private,
            arc the_claim proof,
          ]
      - p: 0.3
        ok: false
        en: "Khoa sees the printer's proof on Thursday, and goes straight to Quyen with the interim results. The proof is stopped, and a reprint costs eight million."
        vi: 'Anh Khoa thấy bản in thử vào thứ Năm và đi thẳng đến chị Quyên với kết quả tạm thời. Bản in bị dừng, và in lại tốn tám triệu.'
        effects:
          [
            rel bao trust +3,
            rel khoa trust -5,
            rel quyen trust -8,
            rep.boss -5,
            rep.qc -4,
            stress +6,
            fact overclaimed_on_packaging witnessed,
            arc the_claim proof,
          ]
---
scene: mkt.consumer_inspection
place: meeting_room
tags: [audit, regulator, beat]
beat: 41-44
lines:
  - who: char:lam
    en: 'I am carrying out a routine consumer-protection inspection of advertising. I would like to see the claims register, the evidence for the technical claims on the packaging and the website, the process for product reviews and any paid or sponsored content. I start with the evidence, not with the creative.'
    vi: 'Tôi tiến hành thanh tra định kỳ về bảo vệ người tiêu dùng đối với quảng cáo. Tôi muốn xem sổ đăng ký tuyên bố, bằng chứng cho các lời kỹ thuật trên bao bì và trang web, quy trình đánh giá sản phẩm và mọi nội dung trả phí hay tài trợ. Tôi bắt đầu từ bằng chứng, không phải từ sáng tạo.'
  - who: char:quyen
    en: 'Show him what he asks for. Do not guess. If we do not know, we say we will find out.'
    vi: 'Cho ông ấy xem những gì ông ấy yêu cầu. Đừng đoán. Nếu không biết thì nói sẽ tìm hiểu.'
choices:
  - en: 'Give him the register with every claim and its source, the test reports, the review policy, and the list of sponsored posts with their disclosures, including the gaps you know about.'
    vi: 'Đưa ông sổ đăng ký với từng lời quảng cáo và nguồn, các báo cáo kiểm nghiệm, chính sách đánh giá và danh sách bài tài trợ kèm công bố, kể cả những chỗ thiếu mà anh/chị biết.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Lam reads for three hours and writes four observations. None is serious. 'A register that matches the packaging. I wish that were less unusual.' Khoa nods across the room."
        vi: "Anh Lâm đọc ba giờ và ghi bốn nhận xét. Không cái nào nghiêm trọng. 'Một sổ đăng ký khớp với bao bì. Tôi ước điều đó bớt hiếm.' Anh Khoa gật đầu từ phía bên kia phòng."
        effects:
          [
            rel lam trust +5,
            rel khoa trust +4,
            rel quyen trust +3,
            rep.boss +3,
            rep.buyer +2,
            stress +2,
          ]
  - en: 'Answer his questions and give him the documents he asks for, without volunteering anything.'
    vi: 'Trả lời câu hỏi và đưa các tài liệu ông yêu cầu, không chủ động nói thêm gì.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "A routine inspection. Lam notes two items, both already on Quyen's list. You come out with nothing to hide and no credit either."
        vi: 'Một buổi thanh tra thường lệ. Anh Lâm ghi hai mục, cả hai đã có trong danh sách của chị Quyên. Anh/chị ra về không có gì phải giấu và cũng không được tiếng khen.'
        effects: [rel lam trust +1, rel quyen trust +1]
  - en: 'Prepare the files: write source references into the register for claims that have none, and remove the reviews and posts that might raise questions.'
    vi: 'Chuẩn bị hồ sơ: viết tham chiếu nguồn vào sổ đăng ký cho các lời chưa có và xóa các đánh giá và bài đăng có thể gây thắc mắc.'
    outcomes:
      - p: 0.45
        en: 'Lam sees a complete register. He asks where the reference for the lifetime claim came from, since the report is dated after the packaging print date, and accepts the explanation.'
        vi: 'Anh Lâm thấy một sổ đăng ký đầy đủ. Anh hỏi tham chiếu cho lời hứa tuổi thọ lấy từ đâu vì báo cáo đề ngày sau ngày in bao bì, và chấp nhận lời giải thích.'
        effects:
          [rel lam trust -2, rel khoa trust -6, stress -1, fact backdated_claim_evidence private]
      - p: 0.55
        ok: false
        en: "Khoa's report log shows the date each test was requested. The web archive shows the deleted reviews. Lam places the two side by side, and says nothing for a long time."
        vi: 'Nhật ký báo cáo của anh Khoa cho thấy ngày yêu cầu từng bài kiểm nghiệm. Kho lưu trữ web cho thấy các đánh giá đã xóa. Anh Lâm đặt hai thứ cạnh nhau và im lặng rất lâu.'
        effects:
          [
            rel lam trust -10,
            rel khoa trust -8,
            rel quyen trust -6,
            rep.boss -6,
            rep.buyer -4,
            stress +6,
            fact backdated_claim_evidence public,
          ]
---
scene: mkt.year_end_review
place: meeting_room
tags: [people, review, beat]
beat: 49-50
lines:
  - who: char:quyen
    en: 'Annual review. Before I give you my view, tell me how you would rate your own year, and what you would say differently on the box.'
    vi: 'Đánh giá cuối năm. Trước khi chị cho ý kiến, em hãy tự chấm năm của mình và nói em sẽ ghi khác đi điều gì trên hộp.'
choices:
  - en: 'Give an honest account, including the claim you stretched, the post that should have been labelled, and what it would have cost to be careful earlier.'
    vi: 'Kể thật lòng, kể cả lời quảng cáo em đã nới, bài đăng lẽ ra phải được gắn nhãn và cái giá của việc cẩn thận sớm hơn.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "Quyen is quiet for a long moment. She writes: 'Makes the brand say what the product can do.' It is the best thing you have read about yourself."
        vi: "Chị Quyên im lặng một lúc lâu. Chị viết: 'Làm cho thương hiệu nói điều sản phẩm làm được.' Đó là lời hay nhất anh/chị từng đọc về mình."
        effects: [rel quyen trust +5, rep.boss +4, stress -2]
  - en: 'Stay modest: list the wins and one thing to improve.'
    vi: 'Khiêm tốn: nêu các thắng lợi và một điều cần cải thiện.'
    outcomes:
      - p: 1
        en: 'A safe review. Quyen nods and moves to the next topic.'
        vi: 'Một buổi đánh giá an toàn. Chị Quyên gật đầu và chuyển chủ đề.'
        effects: [rel quyen trust +1, rep.boss +1]
  - en: 'Present the year as a success and leave out the claims and posts that were close to the line.'
    vi: 'Trình bày cả năm như một thành công và bỏ qua những lời quảng cáo và bài đăng sát ranh giới.'
    outcomes:
      - p: 0.65
        en: 'It lands well. You leave with a good rating and a small weight in your chest.'
        vi: 'Được đón nhận tốt. Anh/chị ra về với điểm cao và một chút nặng nề trong lòng.'
        effects:
          [rel quyen trust +2, rep.boss +4, stress +1, fact polished_marketing_review private]
      - p: 0.35
        ok: false
        en: 'Quyen has the claims register open on her desk, with the revision dates. She turns the screen towards you without a word.'
        vi: 'Chị Quyên có sổ đăng ký tuyên bố mở sẵn trên bàn, kèm ngày sửa. Chị xoay màn hình về phía anh/chị mà không nói một lời.'
        effects:
          [rel quyen trust -8, rep.boss -5, stress +4, fact polished_marketing_review witnessed]
