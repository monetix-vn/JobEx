scene: mkt.resignation_thought
place: meeting_room
tags: [people, pressure]
weight: 2
cooldown: 26
when: [stress >= 75, turn >= 12]
lines:
  - who: char:nga
    en: 'You look like you have not slept. With respect: I have seen marketing people refresh the numbers every five minutes for a month, and leave by the summer. Are you all right?'
    vi: 'Anh/chị trông như chưa ngủ. Xin phép nói thẳng: chị từng thấy dân marketing làm mới số liệu mỗi năm phút suốt một tháng và nghỉ vào mùa hè. Anh/chị ổn không?'
choices:
  - en: 'Talk to Quyen about the load, and ask her to take the agency calls off your plate for a month.'
    vi: 'Nói với chị Quyên về khối lượng công việc và xin chị nhận giúp các cuộc gọi với agency trong một tháng.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.8
        en: 'Quyen listens, takes the agency calls herself, and says she should have noticed sooner.'
        vi: 'Chị Quyên lắng nghe, tự nhận các cuộc gọi với agency và nói lẽ ra chị phải để ý sớm hơn.'
        effects: [rel quyen trust +4, rel nga trust +2, stress -6, rep.boss +1]
      - p: 0.2
        ok: false
        en: 'Quyen nods and says everyone is stretched at launch time. You leave with sympathy and the same load.'
        vi: 'Chị Quyên gật đầu và nói đến lúc ra mắt ai cũng căng. Anh/chị ra về với sự cảm thông và khối lượng cũ.'
        effects: [rel quyen trust +1, stress -1]
  - en: 'Hand in your resignation, politely, with the notice the contract requires.'
    vi: 'Nộp đơn xin nghỉ, lịch sự, báo trước đúng như hợp đồng quy định.'
    outcomes:
      - p: 1
        en: 'Quyen reads it twice and does not argue. You hand over the claims register and walk out lighter than you walked in.'
        vi: 'Chị Quyên đọc hai lần và không phản đối. Anh/chị bàn giao sổ đăng ký tuyên bố và bước ra nhẹ nhõm hơn lúc bước vào.'
        effects: [rel quyen trust +2, end walked_away]
  - en: 'Tell Nga you are fine and keep going.'
    vi: 'Nói với chị Nga là anh/chị ổn và tiếp tục.'
    outcomes:
      - p: 1
        en: 'Nga nods and does not push. You feel slightly worse afterwards for having said it.'
        vi: 'Chị Nga gật đầu và không gặng hỏi. Sau đó anh/chị thấy hơi tệ hơn vì đã nói vậy.'
        effects: [rel nga trust -1, stress +2]
