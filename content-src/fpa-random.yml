scene: fpa.capex_split
place: finance_office
tags: [capex, approvals, dark]
weight: 2
cooldown: 40
when: [turn >= 12]
lines:
  - who: char:lan
    en: 'I need a new hydraulic unit for press 2: ninety million. Approval above fifty million goes to the board and takes six weeks. If you raise it as two purchase requests of forty-five million each, I can have it in a fortnight. They are two parts. Almost.'
    vi: 'Chị cần một bộ thủy lực mới cho máy ép 2: chín mươi triệu. Phê duyệt trên năm mươi triệu phải lên hội đồng và mất sáu tuần. Nếu em lập hai đề nghị mua bốn mươi lăm triệu mỗi cái, chị có trong hai tuần. Chúng là hai bộ phận. Gần như vậy.'
choices:
  - en: 'Raise one request for ninety million, with a business case for urgency, and ask Duc for an emergency approval.'
    vi: 'Lập một đề nghị chín mươi triệu kèm lý do khẩn cấp và nhờ anh Đức duyệt khẩn.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.7
        en: 'Duc approves an emergency request in four days, with the board informed after. Lan gets the unit, and is not thrilled with the form.'
        vi: 'Anh Đức duyệt khẩn trong bốn ngày, báo hội đồng sau. Chị Lan có bộ thủy lực, và không hài lòng với thủ tục.'
        effects: [rel lan trust -1, rel duc trust +3, rep.finance +2, stress +3]
      - p: 0.3
        ok: false
        en: 'Duc says there is no emergency route this month and the board will meet in four weeks. The press runs at half load.'
        vi: 'Anh Đức nói tháng này không có đường khẩn cấp và hội đồng họp sau bốn tuần. Máy ép chạy nửa tải.'
        effects: [rel lan trust -4, rel duc trust +1, stress +4]
  - en: 'Raise the two parts as separate requests only if the supplier will quote them as separate, genuinely independent items.'
    vi: 'Chỉ lập hai bộ phận thành hai đề nghị riêng nếu nhà cung cấp báo giá chúng là hai hạng mục thực sự độc lập.'
    outcomes:
      - p: 1
        en: 'The supplier quotes a pump and a valve block as separate items, with separate part numbers. It is a legitimate split, and Duc confirms that. It saves a fortnight.'
        vi: 'Nhà cung cấp báo giá bơm và khối van thành các hạng mục riêng, có mã riêng. Đó là việc tách hợp lệ, và anh Đức xác nhận. Tiết kiệm hai tuần.'
        effects: [rel lan trust +1, rel duc trust +1, stress +2]
  - en: 'Raise two requests of forty-five million for one unit, to stay under the approval limit.'
    vi: 'Lập hai đề nghị bốn mươi lăm triệu cho một bộ để nằm dưới hạn mức phê duyệt.'
    outcomes:
      - p: 0.7
        en: 'The requests go through in a day each. Lan has the unit in a fortnight and thanks you with a smile. The two requests have the same supplier, the same date and consecutive numbers.'
        vi: 'Các đề nghị qua trong một ngày mỗi cái. Chị Lan có bộ thủy lực trong hai tuần và cảm ơn bằng một nụ cười. Hai đề nghị cùng nhà cung cấp, cùng ngày và số liên tiếp.'
        effects:
          [rel lan trust +5, rel duc trust -1, stress +1, fact split_purchase_under_limit private]
      - p: 0.3
        ok: false
        en: "Quoc's quarterly test looks for consecutive purchases to the same supplier under the limit. He finds your two, and asks Khang to explain."
        vi: 'Phép kiểm tra hằng quý của anh Quốc tìm các lần mua liên tiếp từ cùng nhà cung cấp dưới hạn mức. Anh tìm ra hai đề nghị của anh/chị và nhờ anh Khang giải thích.'
        effects:
          [
            rel lan trust +2,
            rel duc trust -5,
            rel khang trust -6,
            rel quoc trust -6,
            rep.boss -4,
            rep.finance -5,
            stress +5,
            fact split_purchase_under_limit witnessed,
          ]
