scene: fpa.rolling_forecast_sweeten
place: meeting_room
tags: [forecast, sales, dark]
weight: 3
cooldown: 26
when: [turn >= 14, month in 3 6 9 12]
lines:
  - who: char:bao
    en: 'My team has fourteen deals in the pipeline that we have just started talking to. I want the forecast to count them at sixty percent. We close more than that, I promise. If it only counts at twenty, my quarter looks bad and the directors will ask hard questions.'
    vi: 'Nhóm anh có mười bốn thương vụ trong đường ống vừa mới bắt đầu nói chuyện. Anh muốn dự báo tính chúng ở sáu mươi phần trăm. Mình chốt nhiều hơn thế, anh hứa. Nếu chỉ tính hai mươi thì quý của anh trông tệ và ban giám đốc sẽ hỏi khó.'
choices:
  - en: 'Weight the pipeline by stage and by the historical conversion rate, show Bao the evidence, and offer a separate upside line for his optimism.'
    vi: 'Gán trọng số cho đường ống theo giai đoạn và tỷ lệ chuyển đổi lịch sử, cho anh Bảo xem bằng chứng và đề xuất một dòng kịch bản tốt riêng cho sự lạc quan của anh.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.7
        en: 'Bao argues, then sees the conversion history. The forecast carries a base and an upside, and the quarter closes between them. Bao concedes that his judgement was a little generous.'
        vi: 'Anh Bảo tranh luận rồi thấy lịch sử chuyển đổi. Dự báo có kịch bản cơ sở và kịch bản tốt, và quý đóng ở giữa. Anh Bảo thừa nhận phán đoán của mình hơi hào phóng.'
        effects: [rel bao trust -2, rel khang trust +3, rep.finance +3, stress +3]
      - p: 0.3
        ok: false
        en: "Bao takes the matter to Mr Cuong, who asks you to 'work with sales'. You show Mr Cuong the conversion history, and he keeps the base case with a smile that does not reach his eyes."
        vi: "Anh Bảo đưa chuyện lên anh Cường, người bảo anh/chị 'hợp tác với kinh doanh'. Anh/chị cho anh Cường xem lịch sử chuyển đổi, và anh giữ kịch bản cơ sở với một nụ cười không tới mắt."
        effects:
          [rel bao trust -5, rel cuong trust -2, rel khang trust +3, rep.finance +2, stress +5]
  - en: "Count them at forty percent, halfway between the evidence and Bao's number, and say the forecast has been adjusted for sales' view."
    vi: 'Tính ở bốn mươi phần trăm, giữa bằng chứng và con số của anh Bảo, và nói dự báo đã được điều chỉnh theo quan điểm của kinh doanh.'
    outcomes:
      - p: 1
        en: 'Bao is satisfied. The forecast is a little optimistic. The shortfall appears the following quarter, as a surprise.'
        vi: 'Anh Bảo hài lòng. Dự báo hơi lạc quan. Phần hụt xuất hiện quý sau, như một bất ngờ.'
        effects: [rel bao trust +2, rel khang trust -1, stress +2]
  - en: "Count them at sixty percent as Bao asks, and write 'per sales' in the footnote."
    vi: "Tính ở sáu mươi phần trăm như anh Bảo yêu cầu và ghi 'theo kinh doanh' trong chú thích."
    outcomes:
      - p: 0.7
        en: 'The forecast looks excellent for a quarter. Bao is a friend. The directors plan hiring and an expansion on the number.'
        vi: 'Dự báo trông tuyệt vời một quý. Anh Bảo là bạn. Ban giám đốc lên kế hoạch tuyển dụng và mở rộng dựa trên con số.'
        effects:
          [
            rel bao trust +5,
            rel khang trust -3,
            rep.finance +1,
            stress +1,
            fact sweetened_pipeline_forecast private,
          ]
      - p: 0.3
        ok: false
        en: "The quarter closes at the weighted number. Khang asks why the forecast was sixty percent when the history says twenty-five, and the footnote says 'per sales'."
        vi: "Quý đóng ở mức có trọng số. Anh Khang hỏi vì sao dự báo là sáu mươi phần trăm khi lịch sử nói hai mươi lăm và chú thích ghi 'theo kinh doanh'."
        effects:
          [
            rel bao trust +2,
            rel khang trust -8,
            rep.boss -4,
            rep.finance -5,
            stress +5,
            fact sweetened_pipeline_forecast witnessed,
          ]
---
scene: fpa.roi_pet_project
place: meeting_room
tags: [investment, roi, dark]
weight: 2
cooldown: 40
when: [turn >= 12]
lines:
  - who: char:cuong
    en: 'I want a new coating line. It is a personal conviction. I need an investment case that shows a payback inside three years, so that the board approves it. The volumes are what they are, but you can be a little creative with the price premium and the yield.'
    vi: 'Anh muốn một dây chuyền phủ mới. Đó là niềm tin cá nhân. Anh cần một hồ sơ đầu tư cho thấy hoàn vốn trong ba năm để hội đồng duyệt. Khối lượng thì vậy, nhưng em có thể sáng tạo một chút với mức giá cao hơn và năng suất.'
choices:
  - en: 'Build the case on evidence, show the payback range, and tell Mr Cuong what would have to be true for three years, and what the downside looks like.'
    vi: 'Dựng hồ sơ trên bằng chứng, cho xem khoảng thời gian hoàn vốn và nói với anh Cường điều gì phải đúng để đạt ba năm và kịch bản xấu trông thế nào.'
    cost: { hours: 4 }
    outcomes:
      - p: 0.6
        en: 'The honest payback is four years, and three if the price premium holds. Mr Cuong reads it, grumbles, and takes it to the board anyway with the range. The board approves a smaller first phase.'
        vi: 'Thời gian hoàn vốn trung thực là bốn năm, và ba năm nếu mức giá cao được giữ. Anh Cường đọc, càu nhàu và vẫn đưa lên hội đồng kèm khoảng giá trị. Hội đồng duyệt một giai đoạn đầu nhỏ hơn.'
        effects:
          [rel cuong trust -1, rel khang trust +4, rel giang trust +2, rep.finance +3, stress +4]
      - p: 0.4
        ok: false
        en: 'Mr Cuong says the board will not read a range. He shelves the project for the year, and tells you that you have a talent for finding reasons not to.'
        vi: 'Anh Cường nói hội đồng sẽ không đọc một khoảng giá trị. Anh gác dự án một năm và nói với anh/chị rằng anh/chị có tài tìm lý do để không làm.'
        effects: [rel cuong trust -4, rel khang trust +3, rep.finance +2, stress +4]
  - en: 'Build the case with the optimistic end of the evidence, and mark each assumption as optimistic.'
    vi: 'Dựng hồ sơ với đầu lạc quan của bằng chứng và đánh dấu từng giả định là lạc quan.'
    outcomes:
      - p: 1
        en: 'The payback reads two point eight years, and every optimistic assumption has a tag. The board approves it, and the tags are in the appendix.'
        vi: 'Thời gian hoàn vốn là hai phẩy tám năm, và mọi giả định lạc quan đều có nhãn. Hội đồng duyệt, và các nhãn nằm trong phụ lục.'
        effects: [rel cuong trust +2, rel khang trust +1, stress +3]
  - en: 'Build the case with a price premium and yield that give a two-year payback, and do not label them.'
    vi: 'Dựng hồ sơ với mức giá cao hơn và năng suất cho hoàn vốn hai năm và không gắn nhãn.'
    outcomes:
      - p: 0.7
        en: 'The board approves it on the spot. Mr Cuong shakes your hand. The price premium that the case assumes has never been quoted to a buyer.'
        vi: 'Hội đồng duyệt ngay tại chỗ. Anh Cường bắt tay anh/chị. Mức giá cao mà hồ sơ giả định chưa từng được báo giá cho khách.'
        effects:
          [
            rel cuong trust +6,
            rel khang trust -4,
            rep.boss +3,
            stress +1,
            fact inflated_roi_case private,
          ]
      - p: 0.3
        ok: false
        en: 'Giang asks Bao whether any buyer has agreed to the price premium. Bao says no. The question goes back to FP&A with a date.'
        vi: 'Chị Giang hỏi anh Bảo liệu có khách nào đồng ý mức giá cao đó chưa. Anh Bảo nói chưa. Câu hỏi quay lại FP&A kèm một ngày hạn.'
        effects:
          [
            rel cuong trust +2,
            rel giang trust -7,
            rel khang trust -7,
            rep.boss -5,
            rep.finance -6,
            stress +6,
            fact inflated_roi_case witnessed,
          ]
