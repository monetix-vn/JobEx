fact: hid_spreadsheet_error
severity: 6
category: integrity
en: 'you fixed an error in a forecast that had already gone to the directors and did not say so'
vi: 'bạn sửa một lỗi trong dự báo đã gửi cho ban giám đốc và không nói gì'
lesson:
  en: 'The error was small. The silence is not. The old number is still being used, and the person who found the problem learns that errors are to be kept quiet.'
  vi: 'Lỗi thì nhỏ. Sự im lặng thì không. Con số cũ vẫn đang được dùng, và người tìm ra vấn đề biết rằng lỗi cần được giữ im.'
traces:
