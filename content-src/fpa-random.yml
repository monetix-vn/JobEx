# FP&A Analyst: everyday incidents and consequences (docs/story/fpa.md).
scene: fpa.variance_explain
place: finance_office
tags: [variance, reporting, dark]
weight: 3
cooldown: 20
when: [turn >= 8]
lines:
  - who: char:duc
    en: "Cost of goods is eleven percent over budget this month. Most of it is a steel price effect and a yield problem on Line 3. Mr Cuong reads the variance page first. I would prefer the explanation to say 'timing and other'. Can you write the commentary?"
    vi: "Giá vốn tháng này vượt ngân sách mười một phần trăm. Phần lớn do giá thép và vấn đề năng suất ở chuyền 3. Anh Cường đọc trang chênh lệch đầu tiên. Anh muốn phần giải thích ghi 'thời điểm và khác'. Em viết phần bình luận được không?"
choices:
  - en: 'Write the commentary with the real split: price, volume, yield, and what is expected to reverse and what is not.'
    vi: 'Viết bình luận với cách chia thật: giá, khối lượng, năng suất và điều gì dự kiến đảo chiều, điều gì không.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: "Duc reads it twice. 'This is uncomfortable, and this is useful.' Mr Cuong asks about the yield problem for the first time in a year, and Lan gets the time to fix it."
        vi: "Anh Đức đọc hai lần. 'Cái này khó chịu, và cái này hữu ích.' Anh Cường hỏi về vấn đề năng suất lần đầu trong một năm, và chị Lan có thời gian để sửa."
        effects: [rel duc trust +2, rel lan trust +2, rep.finance +3, stress +3]
      - p: 0.2
        ok: false
        en: 'Mr Cuong says the page is too negative for the board and asks Duc to soften it. Duc does, and tells you he did.'
        vi: 'Anh Cường nói trang này quá tiêu cực cho hội đồng và nhờ anh Đức làm nhẹ. Anh Đức làm và nói với anh/chị là anh đã làm.'
        effects: [rel duc trust +1, rel lan trust +1, stress +4]
  - en: 'Write the commentary with the main driver stated plainly and the smaller ones grouped, and flag the yield issue for a separate note.'
    vi: 'Viết bình luận nêu rõ nguyên nhân chính và gộp các nguyên nhân nhỏ hơn và đánh dấu vấn đề năng suất cho một ghi chú riêng.'
    outcomes:
      - p: 1
        en: 'A balanced page. Duc accepts it, and the yield note sits in his inbox for two weeks.'
        vi: 'Một trang cân đối. Anh Đức chấp nhận, và ghi chú về năng suất nằm trong hộp thư của anh hai tuần.'
        effects: [rel duc trust +1, stress +2]
  - en: "Write 'timing and other' for most of the variance, as asked."
    vi: "Viết 'thời điểm và khác' cho phần lớn chênh lệch như được yêu cầu."
    outcomes:
      - p: 0.7
        en: "The page reads calmly. Mr Cuong nods at it. Next month the same variance comes back, and 'timing' has not reversed."
        vi: "Trang đọc êm dịu. Anh Cường gật đầu. Tháng sau chênh lệch cũ quay lại, và 'thời điểm' không đảo chiều."
        effects:
          [rel duc trust +4, rel lan trust -2, stress +1, fact buried_variance_in_other private]
      - p: 0.3
        ok: false
        en: "Lan reads the variance page and sees 'timing' on a yield problem she has been reporting for six weeks. She asks Khang who wrote it."
        vi: "Chị Lan đọc trang chênh lệch và thấy 'thời điểm' đặt trên vấn đề năng suất chị báo cáo sáu tuần nay. Chị hỏi anh Khang ai viết."
        effects:
          [
            rel duc trust +2,
            rel lan trust -6,
            rel khang trust -5,
            rep.finance -3,
            stress +4,
            fact buried_variance_in_other witnessed,
          ]
