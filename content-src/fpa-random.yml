fact: buried_variance_in_other
severity: 4
category: integrity
en: "you wrote a real cost problem into the variance commentary as 'timing and other'"
vi: "bạn ghi một vấn đề chi phí thật vào bình luận chênh lệch là 'thời điểm và khác'"
lesson:
  en: "A variance explanation exists so someone can act. Putting a real driver under 'other' removes the one person who is trying to fix it from the conversation."
  vi: "Giải thích chênh lệch tồn tại để ai đó hành động. Đặt nguyên nhân thật dưới 'khác' loại người đang cố sửa nó ra khỏi cuộc trò chuyện."
traces:
  - { type: document, visibility: 0.5, detectors: [finance, boss] }
witnessed:
  boss: -4
  production: -6
  finance: -4
public:
  boss: -8
