scene: fpa.excel_error
place: finance_office
tags: [model, error, honesty, dark]
weight: 3
cooldown: 30
when: [turn >= 10]
lines:
  - who: char:huy
    en: 'I was checking your forecast for the sales plan and I think a formula is double counting the Anders order in two months. It is about forty million. You already sent it to the directors on Monday.'
    vi: 'Em đang kiểm tra dự báo của anh/chị cho kế hoạch bán hàng và em nghĩ có công thức đếm hai lần đơn ông Anders ở hai tháng. Khoảng bốn mươi triệu. Anh/chị đã gửi cho ban giám đốc hôm thứ Hai.'
choices:
  - en: 'Check the formula now, confirm the error, tell Khang immediately, and send a corrected version with a short note on what changed.'
    vi: 'Kiểm tra công thức ngay, xác nhận lỗi, báo anh Khang ngay và gửi bản đã sửa kèm ghi chú ngắn về điều đã đổi.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.85
        en: "The error is real, and small. Khang says: 'Good. Errors happen. Hiding them is the problem.' The directors see a correction and a change log. Huy gets a thank-you."
        vi: "Lỗi có thật, và nhỏ. Anh Khang nói: 'Tốt. Lỗi thì ai cũng có. Giấu lỗi mới là vấn đề.' Các giám đốc thấy bản sửa và nhật ký thay đổi. Huy được cảm ơn."
        effects:
          [
            rel khang trust +4,
            rel huy trust +4,
            rep.finance +3,
            stress +3,
            fact disclosed_spreadsheet_error witnessed,
          ]
      - p: 0.15
        ok: false
        en: 'Mr Cuong has already used the old number in a meeting with the bank. Khang calls Mr Phat himself to update it, and tells you that you did the right thing.'
        vi: 'Anh Cường đã dùng con số cũ trong một cuộc họp với ngân hàng. Anh Khang tự gọi anh Phát để cập nhật và nói với anh/chị rằng anh/chị đã làm đúng.'
        effects:
          [
            rel khang trust +3,
            rel huy trust +3,
            rel cuong trust -2,
            rep.finance +1,
            stress +5,
            fact disclosed_spreadsheet_error witnessed,
          ]
  - en: "Correct the formula in the model, and include the corrected number in next week's forecast with a one-line note."
    vi: 'Sửa công thức trong mô hình và đưa con số đã sửa vào dự báo tuần sau với ghi chú một dòng.'
    outcomes:
      - p: 1
        en: 'The error is fixed and mentioned. The Monday number is never formally withdrawn, and a director quotes it twice.'
        vi: 'Lỗi được sửa và có nhắc tới. Con số hôm thứ Hai không bao giờ được chính thức rút và một giám đốc trích dẫn nó hai lần.'
        effects: [rel khang trust +1, rel huy trust +1, stress +3]
  - en: 'Fix the formula quietly, and thank Huy, and ask him to keep it to himself because it is small.'
    vi: 'Sửa công thức lặng lẽ, cảm ơn Huy và nhờ cậu giữ kín vì nó nhỏ.'
    outcomes:
      - p: 0.7
        en: "Huy agrees. The Monday number stays in the directors' decks, and the corrected number appears in the next version without a note. Nothing happens."
        vi: 'Huy đồng ý. Con số hôm thứ Hai vẫn nằm trong slide của các giám đốc, và con số đã sửa xuất hiện trong phiên bản sau không có ghi chú. Không có chuyện gì xảy ra.'
        effects:
          [rel huy trust -2, rel khang trust -1, stress +1, fact hid_spreadsheet_error private]
      - p: 0.3
        ok: false
        en: 'Giang asks why the forecast dropped forty million between two versions with no explanation. Khang opens the change log and finds a blank.'
        vi: 'Chị Giang hỏi vì sao dự báo giảm bốn mươi triệu giữa hai phiên bản mà không giải thích. Anh Khang mở nhật ký thay đổi và thấy một chỗ trống.'
        effects:
          [
            rel huy trust -4,
            rel khang trust -7,
            rel giang trust -4,
            rep.boss -4,
            rep.finance -5,
            stress +5,
            fact hid_spreadsheet_error witnessed,
          ]
