scene: fpa.cost_allocation
place: meeting_room
tags: [costing, allocation, dark]
weight: 2
cooldown: 40
when: [turn >= 14]
lines:
  - who: char:bao
    en: 'The new premium range loses money on your allocation. You are charging it a full share of the factory overhead. If you allocate overhead by revenue instead of by machine hours, the premium range makes a margin, and the directors keep funding it. It is only a method.'
    vi: 'Dòng cao cấp mới lỗ theo cách phân bổ của em. Em tính cho nó đầy đủ phần chi phí chung của nhà máy. Nếu phân bổ chi phí chung theo doanh thu thay vì theo giờ máy thì dòng cao cấp có biên lợi nhuận và ban giám đốc tiếp tục đầu tư. Chỉ là một phương pháp thôi.'
choices:
  - en: 'Keep the allocation by machine hours, show the true margin, and offer a sensitivity page that shows both methods and what each would change.'
    vi: 'Giữ phân bổ theo giờ máy, cho xem biên lợi nhuận thật và đưa trang độ nhạy hiển thị cả hai phương pháp và điều mỗi cái thay đổi.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: 'The premium range is shown at a loss of three percent, with a path to break-even at volume. The directors keep funding it with open eyes, and Bao says it is the first fair hearing it has had.'
        vi: 'Dòng cao cấp được thể hiện lỗ ba phần trăm kèm lộ trình hòa vốn ở mức sản lượng. Ban giám đốc tiếp tục đầu tư với con mắt mở, và anh Bảo nói đây là lần đầu nó được xét công bằng.'
        effects: [rel bao trust +1, rel khang trust +3, rep.finance +3, stress +3]
      - p: 0.3
        ok: false
        en: 'The directors read the loss and stop the premium range. Bao is angry, and tells you that you killed it. You wrote the truth, and it still feels like that.'
        vi: 'Ban giám đốc đọc con số lỗ và dừng dòng cao cấp. Anh Bảo giận và nói anh/chị đã giết nó. Anh/chị đã viết sự thật, và vẫn cảm thấy như vậy.'
        effects: [rel bao trust -6, rel khang trust +3, rep.finance +2, stress +5]
  - en: "Switch to a blended allocation, half machine hours and half revenue, and document the reason as 'transition'."
    vi: "Chuyển sang phân bổ kết hợp, nửa giờ máy nửa doanh thu, và ghi lý do là 'chuyển tiếp'."
    outcomes:
      - p: 1
        en: "The premium range shows break-even. The allocation note says 'transition'. Nobody asks what the transition is to."
        vi: "Dòng cao cấp hiện hòa vốn. Ghi chú phân bổ ghi 'chuyển tiếp'. Không ai hỏi chuyển tiếp sang đâu."
        effects: [rel bao trust +2, rel khang trust -1, stress +2]
  - en: 'Allocate overhead by revenue for the premium range only, and keep the other ranges on machine hours.'
    vi: 'Phân bổ chi phí chung theo doanh thu chỉ cho dòng cao cấp và giữ các dòng khác theo giờ máy.'
    outcomes:
      - p: 0.7
        en: 'The premium range earns a nice margin. The standard range, which bears the extra overhead, quietly looks worse. Lan notices that her costs have gone up by no reason she can find.'
        vi: 'Dòng cao cấp có biên lợi nhuận đẹp. Dòng tiêu chuẩn, gánh thêm chi phí chung, lặng lẽ trông tệ hơn. Chị Lan nhận ra chi phí của chị tăng mà chị không tìm được lý do.'
        effects:
          [
            rel bao trust +5,
            rel lan trust -5,
            rel khang trust -3,
            stress +1,
            fact skewed_cost_allocation private,
          ]
      - p: 0.3
        ok: false
        en: "Quoc's review compares allocation methods across product lines, and finds two. He asks Khang for the decision paper, and there is none."
        vi: 'Buổi rà soát của anh Quốc so các phương pháp phân bổ giữa các dòng sản phẩm và thấy có hai. Anh xin anh Khang giấy quyết định, và không có.'
        effects:
          [
            rel bao trust +2,
            rel lan trust -5,
            rel khang trust -7,
            rel quoc trust -6,
            rep.boss -4,
            rep.finance -6,
            stress +6,
            fact skewed_cost_allocation witnessed,
          ]
