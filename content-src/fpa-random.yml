scene: fpa.commission_baseline
place: finance_office
tags: [commission, targets, dark]
weight: 2
cooldown: 40
when: [turn >= 14]
lines:
  - who: char:bao
    en: "Sales commission is calculated against the baseline you publish for each team. My team's baseline is above what we actually did last year because of the one big order. Could you reset it to the average? It is only a baseline. Nobody will be paid more than they earned."
    vi: 'Hoa hồng bán hàng tính theo mức cơ sở em công bố cho từng nhóm. Mức cơ sở của nhóm anh cao hơn thực tế năm ngoái vì một đơn lớn. Em đặt lại về mức trung bình được không? Chỉ là mức cơ sở thôi. Không ai nhận nhiều hơn họ xứng đáng.'
choices:
  - en: 'Keep the baseline and propose a rule that normalises one-off orders for everyone, applied the same way to every team.'
    vi: 'Giữ mức cơ sở và đề xuất quy tắc chuẩn hóa các đơn đột xuất cho tất cả, áp dụng như nhau cho mọi nhóm.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: 'Bao sulks, and accepts. The normalisation rule is approved for next year, and two other managers thank you privately for it.'
        vi: 'Anh Bảo hờn dỗi và chấp nhận. Quy tắc chuẩn hóa được duyệt cho năm sau, và hai quản lý khác cảm ơn anh/chị riêng vì điều đó.'
        effects: [rel bao trust -3, rel khang trust +3, rep.finance +3, stress +3]
      - p: 0.3
        ok: false
        en: "Bao argues that a rule for next year does not help this year's team. He has a point, and nobody has an answer for it."
        vi: 'Anh Bảo lập luận một quy tắc cho năm sau không giúp nhóm năm nay. Anh có lý, và không ai có câu trả lời.'
        effects: [rel bao trust -4, rel khang trust +2, stress +4]
  - en: 'Reset the baseline to the average only if Duc and Khang approve in writing, with the reason.'
    vi: 'Chỉ đặt lại mức cơ sở về trung bình nếu anh Đức và anh Khang duyệt bằng văn bản, kèm lý do.'
    outcomes:
      - p: 1
        en: 'Duc approves, with a note that the reset applies to any team in the same position. The paper trail exists, and so does a precedent.'
        vi: 'Anh Đức duyệt kèm ghi chú rằng việc đặt lại áp dụng cho mọi nhóm cùng hoàn cảnh. Có dấu vết giấy tờ, và có một tiền lệ.'
        effects: [rel bao trust +1, rel duc trust +1, stress +2]
  - en: 'Reset the baseline quietly, and do not mention it to the other teams.'
    vi: 'Đặt lại mức cơ sở lặng lẽ và không nhắc với các nhóm khác.'
    outcomes:
      - p: 0.7
        en: "Bao's team gets a larger commission. Nobody notices for a quarter. Bao thanks you with lunch."
        vi: 'Nhóm anh Bảo nhận hoa hồng lớn hơn. Một quý không ai nhận ra. Anh Bảo cảm ơn bằng một bữa trưa.'
        effects:
          [
            rel bao trust +5,
            rel khang trust -2,
            stress +1,
            fact adjusted_commission_baseline private,
          ]
      - p: 0.3
        ok: false
        en: "Another team lead compares baselines in the canteen. He asks Khang why one team's baseline fell by eleven percent in March."
        vi: 'Một trưởng nhóm khác so các mức cơ sở ở căng tin. Anh hỏi anh Khang vì sao mức cơ sở của một nhóm giảm mười một phần trăm vào tháng Ba.'
        effects:
          [
            rel bao trust +2,
            rel khang trust -7,
            rep.boss -4,
            rep.finance -5,
            stress +5,
            fact adjusted_commission_baseline witnessed,
          ]
---
scene: fpa.early_board_numbers
place: finance_office
tags: [confidentiality, board, dark]
weight: 2
cooldown: 40
when: [turn >= 14, month in 3 6 9 12]
lines:
  - who: char:huy
    en: "Could you show me the board pack numbers a couple of days before they go out? The owner family has a friend who trades in our supplier's shares, and Bao says that if the numbers are good, we should tell our friends at the steel company, to keep the relationship warm."
    vi: 'Anh/chị cho em xem số liệu bộ báo cáo hội đồng trước vài ngày khi gửi được không? Gia đình chủ sở hữu có một người bạn giao dịch cổ phiếu nhà cung cấp của mình, và anh Bảo nói nếu số tốt thì mình nên báo bạn bên công ty thép để giữ quan hệ.'
choices:
  - en: 'Decline, explain that the board numbers are confidential until released, and offer the published figures from last quarter.'
    vi: 'Từ chối, giải thích số liệu hội đồng là bảo mật đến khi được công bố và đưa số liệu đã công bố của quý trước.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'Huy blushes, and says he did not think of it that way. He thanks you for saying it without a lecture. Bao grumbles.'
        vi: 'Huy đỏ mặt và nói em không nghĩ như vậy. Cậu cảm ơn anh/chị vì đã nói mà không giảng đạo lý. Anh Bảo càu nhàu.'
        effects: [rel huy trust +4, rel bao trust -2, rel khang trust +2, rep.finance +2, stress +1]
  - en: 'Say you will think about it, and give him only the headline direction, up or down.'
    vi: 'Nói anh/chị sẽ suy nghĩ và chỉ cho cậu hướng chung, tăng hay giảm.'
    outcomes:
      - p: 1
        en: "Huy says 'Up', and repeats it to Bao. A conversation happens at lunch that you wish you had prevented."
        vi: "Huy nói 'Tăng' và nhắc lại với anh Bảo. Một cuộc trò chuyện diễn ra vào bữa trưa mà anh/chị ước mình đã ngăn."
        effects: [rel huy trust +1, rel bao trust +2, rel khang trust -2, stress +2]
  - en: 'Send Huy the draft pack, and tell him not to share it.'
    vi: 'Gửi Huy bản nháp bộ báo cáo và bảo cậu đừng chia sẻ.'
    outcomes:
      - p: 0.6
        en: 'Huy reads it, and tells Bao on the stairs. Bao makes a phone call that evening, which you do not hear about.'
        vi: 'Huy đọc và nói với anh Bảo trên cầu thang. Tối đó anh Bảo gọi một cuộc điện thoại mà anh/chị không nghe nói.'
        effects:
          [
            rel huy trust +4,
            rel bao trust +4,
            rel khang trust -3,
            stress +1,
            fact leaked_board_numbers private,
          ]
      - p: 0.4
        ok: false
        en: "The supplier's shares move on the Monday before the board pack goes out. A regulator's letter asks the company who had access to the draft. Your name is on the access log."
        vi: 'Cổ phiếu nhà cung cấp biến động vào thứ Hai trước khi bộ báo cáo hội đồng được gửi. Một công văn của cơ quan quản lý hỏi công ty ai được truy cập bản nháp. Tên anh/chị có trong nhật ký truy cập.'
        effects:
          [
            rel huy trust +1,
            rel bao trust +2,
            rel khang trust -9,
            rep.boss -10,
            rep.finance -8,
            stress +9,
            fact leaked_board_numbers public,
          ]
