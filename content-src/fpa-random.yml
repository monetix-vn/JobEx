scene: fpa.board_blame
place: meeting_room
tags: [pressure, consequence]
weight: 6
cooldown: 52
when: [month in 11 12, turn >= 44]
when_any:
  [
    fact.misled_the_bank >= 1,
    fact.misled_the_board >= 1,
    fact.sweetened_forecast >= 1,
    fact.inflated_roi_case >= 1,
  ]
lines:
  - who: char:giang
    en: 'The board has received a letter from the bank. It questions the forecast it was given in the autumn, and asks who prepared it. The board is meeting tomorrow, and I would like to know, before it does, who in finance is responsible for the numbers. I would like to hear it from you first.'
    vi: 'Hội đồng nhận được thư của ngân hàng. Thư đặt câu hỏi về dự báo được gửi hồi mùa thu và hỏi ai chuẩn bị. Hội đồng họp ngày mai, và tôi muốn biết, trước khi họp, ai ở tài chính chịu trách nhiệm về các con số. Tôi muốn nghe từ anh/chị trước.'
choices:
  - en: 'Tell her the real account: what you were asked, what you agreed to change, and your own part. Show her the version history.'
    vi: 'Nói với chị bản tường trình thật: anh/chị được yêu cầu gì, đồng ý đổi gì và phần của chính mình. Cho chị xem lịch sử phiên bản.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'Giang reads it slowly, and takes your account to the board with her own note beside it. You are moved off bank reporting and keep your job and, eventually, your name.'
        vi: 'Chị Giang đọc chậm và mang bản tường trình của anh/chị đến hội đồng kèm ghi chú của chính chị. Anh/chị bị chuyển khỏi báo cáo cho ngân hàng và giữ được việc và về sau là cả danh tiếng.'
        effects:
          [
            rel giang trust +3,
            rel khang trust +2,
            rep.boss -8,
            rep.finance -3,
            stress +7,
            fact came_clean_to_auditor witnessed,
          ]
  - en: "Say the forecast was Duc's and Mr Cuong's, and that you only prepared the model."
    vi: 'Nói dự báo là của anh Đức và anh Cường và anh/chị chỉ chuẩn bị mô hình.'
    outcomes:
      - p: 0.4
        en: 'The board treats it as shared responsibility. Nobody leaves the room liked, and Duc stops speaking to you.'
        vi: 'Hội đồng coi đó là trách nhiệm chung. Không ai rời phòng với thiện cảm, và anh Đức thôi nói chuyện với anh/chị.'
        effects: [rel duc trust -10, rel khang trust -4, rep.boss -4, stress +4]
      - p: 0.6
        ok: false
        en: 'Khang has the emails that came with each change, and your replies. He reads two of them aloud, without raising his voice.'
        vi: 'Anh Khang có các email đi kèm mỗi thay đổi và trả lời của anh/chị. Anh đọc to hai cái, không to tiếng.'
        effects: [rel duc trust -8, rel khang trust -12, rep.boss -10, stress +8]
  - en: 'Say that Huy built the sales inputs and that the errors are in his data.'
    vi: 'Nói Huy dựng đầu vào bán hàng và các sai sót nằm trong dữ liệu của cậu.'
    outcomes:
      - p: 0.3
        en: 'The board nods and Huy is given a warning that he does not contest. He resigns in two months. The inputs are still in your formulas.'
        vi: 'Hội đồng gật đầu và Huy nhận một cảnh cáo mà cậu không phản đối. Cậu nghỉ sau hai tháng. Các đầu vào vẫn nằm trong công thức của anh/chị.'
        effects:
          [
            rel huy trust -25,
            rel khang trust -6,
            rep.boss -4,
            stress +6,
            fact blamed_sales_planner private,
          ]
      - p: 0.7
        ok: false
        en: "Huy has the email chain showing the optimistic assumptions came from FP&A's own adjustments. He puts it on the table."
        vi: 'Huy có chuỗi email cho thấy các giả định lạc quan đến từ điều chỉnh của chính FP&A. Cậu đặt nó lên bàn.'
        effects:
          [
            rel huy trust -25,
            rel khang trust -10,
            rep.boss -14,
            stress +9,
            fact blamed_sales_planner public,
          ]
