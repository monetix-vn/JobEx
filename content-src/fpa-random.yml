scene: fpa.audit_asks
place: finance_office
tags: [audit, dark, consequence]
weight: 6
cooldown: 52
when: [month in 10 11, turn >= 40]
when_any:
  [
    fact.reclassified_costs_to_meet_covenant >= 1,
    fact.moved_invoices_across_quarter_end >= 1,
    fact.plugged_the_board_pack >= 1,
    fact.deleted_model_versions >= 1,
    fact.split_purchase_under_limit >= 1,
  ]
lines:
  - who: char:quoc
    en: 'I have a list of items from the planning cycle I would like to understand: a reclassification of maintenance costs, some invoices that moved across the quarter end, a line in the board pack with nothing under it, and a missing set of model versions. I would like to hear from the person who prepared the numbers.'
    vi: 'Tôi có một danh sách các mục trong chu kỳ kế hoạch muốn hiểu: việc phân loại lại chi phí bảo trì, một số hóa đơn dịch qua cuối quý, một dòng trong bộ báo cáo hội đồng không có gì bên dưới và một bộ phiên bản mô hình bị mất. Tôi muốn nghe từ người đã chuẩn bị các con số.'
choices:
  - en: 'Tell him what happened: who asked, what you agreed, what should have been done, and what is being corrected. Give him the files.'
    vi: 'Kể cho ông ấy những gì đã xảy ra: ai nhờ, anh/chị đã đồng ý gì, lẽ ra nên làm gì và đang sửa gì. Đưa ông hồ sơ.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Quoc writes it all down. The finding is serious, but it is recorded as 'self-reported and corrected'. The classification is reversed, the bank is told, and you receive a formal warning."
        vi: "Anh Quốc ghi lại tất cả. Phát hiện nghiêm trọng, nhưng được ghi nhận là 'tự báo cáo và đã sửa'. Việc phân loại được đảo lại, ngân hàng được báo và anh/chị nhận cảnh cáo chính thức."
        effects:
          [
            rel quoc trust +2,
            rel khang trust -2,
            rel duc trust -3,
            rep.boss -5,
            stress +6,
            fact came_clean_to_auditor witnessed,
          ]
  - en: "Give him the files, and say the decisions were Duc's and Mr Cuong's, and that FP&A prepared what it was asked."
    vi: 'Đưa ông các tệp và nói các quyết định là của anh Đức và anh Cường, FP&A chỉ chuẩn bị điều được yêu cầu.'
    outcomes:
      - p: 0.4
        en: 'Quoc notes that the analyst built and signed the numbers. He writes it down, carefully.'
        vi: 'Anh Quốc ghi rằng người phân tích đã dựng và ký các con số. Anh ghi lại, cẩn thận.'
        effects: [rel quoc trust -5, rel khang trust -4, rel duc trust -6, rep.boss -4, stress +4]
      - p: 0.6
        ok: false
        en: 'Hanh and Thu are called in. Each has her own copy of the instructions, and the emails are in the same order. Quoc places them next to your notes.'
        vi: 'Chị Hạnh và Thư được gọi vào. Mỗi người có bản sao chỉ dẫn của mình, và các email theo cùng thứ tự. Anh Quốc đặt chúng cạnh ghi chú của anh/chị.'
        effects:
          [
            rel quoc trust -10,
            rel hanh trust -8,
            rel thu trust -8,
            rel khang trust -8,
            rep.boss -10,
            stress +8,
          ]
  - en: 'Say you do not recall the details, and offer to look.'
    vi: 'Nói anh/chị không nhớ chi tiết và đề nghị đi tìm.'
    outcomes:
      - p: 0.4
        en: 'Quoc gives you a week. You find the files and hand them over. It is not the whole truth, but it is something.'
        vi: 'Anh Quốc cho anh/chị một tuần. Anh/chị tìm thấy hồ sơ và nộp. Không phải toàn bộ sự thật, nhưng là một phần.'
        effects: [rel quoc trust -4, stress +4, fact stalled_the_auditor private]
      - p: 0.6
        ok: false
        en: "The server backups, the supplier statements and the bank's copy of the covenant calculation arrive on the same afternoon. Quoc has them on the table next to your notes."
        vi: 'Bản sao lưu máy chủ, sao kê nhà cung cấp và bản tính điều khoản cam kết của ngân hàng đến cùng một buổi chiều. Anh Quốc để chúng trên bàn cạnh ghi chú của anh/chị.'
        effects:
          [
            rel quoc trust -10,
            rel khang trust -6,
            rep.boss -8,
            rep.finance -6,
            stress +7,
            fact stalled_the_auditor witnessed,
          ]
