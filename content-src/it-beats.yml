scene: it.first_week
place: it_room
tags: [onboarding, people, beat]
beat: 1-3
lines:
  - who: char:kien
    en: 'Welcome to IT. We are two people and an intern for four hundred staff, one ERP and a server room that is also a cupboard. Tickets first, projects when there are no tickets, which is never. One rule: nobody gets access to anything without a ticket, an approver and a date. It sounds slow. It is what saves us in an audit.'
    vi: 'Chào mừng em đến IT. Mình có hai người và một thực tập sinh cho bốn trăm nhân viên, một ERP và một phòng máy chủ đồng thời là cái tủ. Phiếu hỗ trợ trước, dự án khi hết phiếu, mà không bao giờ hết. Một quy tắc: không ai được cấp quyền truy cập gì nếu không có phiếu, người duyệt và ngày tháng. Nghe chậm. Nhưng đó là điều cứu mình khi bị kiểm toán.'
  - who: char:bin
    en: 'I have the admin password for the server saved in my browser, if you need it. Everyone in IT has it. It has been the same since the system was installed.'
    vi: 'Em có mật khẩu quản trị máy chủ lưu trong trình duyệt, nếu anh/chị cần. Ai trong IT cũng có. Nó không đổi từ khi cài hệ thống.'
choices:
  - en: 'Spend the first days making an inventory: who has admin, who has ERP access, which accounts belong to people who left, and what backups really exist. Write it down.'
    vi: 'Dành những ngày đầu lập bản kê: ai có quyền quản trị, ai có quyền ERP, tài khoản nào thuộc về người đã nghỉ và thực sự có những bản sao lưu nào. Ghi lại.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Eleven people have admin rights, four accounts belong to people who left last year, and the last backup that anyone has tested restored in March. Kien reads your list and says: 'Good. Now we know what we do not know.' The password is changed by Friday."
        vi: "Mười một người có quyền quản trị, bốn tài khoản thuộc về người đã nghỉ năm ngoái và bản sao lưu cuối cùng có người thử khôi phục là hồi tháng Ba. Anh Kiên đọc danh sách và nói: 'Tốt. Giờ mình biết điều mình chưa biết.' Mật khẩu được đổi trước thứ Sáu."
        effects: [rel kien trust +5, rel bin trust +2, rep.boss +2, stress +1]
  - en: 'Start on the open tickets, and look at accounts and backups when there is a quiet week.'
    vi: 'Bắt đầu với các phiếu đang mở và xem tài khoản và sao lưu khi có một tuần yên.'
    outcomes:
      - p: 1
        en: 'You close thirty tickets in the first fortnight. Nobody tells you that the one about the printer is on the machine that has the shared admin password.'
        vi: 'Anh/chị đóng ba mươi phiếu trong hai tuần đầu. Không ai nói với anh/chị rằng phiếu về máy in nằm trên chiếc máy có mật khẩu quản trị dùng chung.'
        effects: [rel kien trust +1, stress +1]
  - en: 'Use the shared admin password as everyone does, since it is faster and you have tickets to close.'
    vi: 'Dùng mật khẩu quản trị dùng chung như mọi người vì nhanh hơn và anh/chị có phiếu cần đóng.'
    outcomes:
      - p: 0.7
        en: "The tickets close fast. The server log shows every action as 'admin', with no name beside it."
        vi: "Các phiếu đóng nhanh. Nhật ký máy chủ ghi mọi hành động là 'admin', không có tên bên cạnh."
        effects: [rel kien trust -1, rel bin trust +1, stress +1]
      - p: 0.3
        ok: false
        en: "A file goes missing from the finance share. The log says 'admin', and four people could have done it. Kien asks, mildly, who was in the server that morning."
        vi: "Một tệp biến mất khỏi thư mục dùng chung của tài chính. Nhật ký ghi 'admin' và bốn người có thể đã làm. Anh Kiên hỏi, nhẹ nhàng, sáng đó ai vào máy chủ."
        effects: [rel kien trust -4, rep.finance -2, stress +3]
---
scene: it.midyear_review
place: meeting_room
tags: [people, review, beat]
beat: 24-28
lines:
  - who: char:kien
    en: 'Half a year. Your ticket resolution time is slower than the target, but there have been no repeat incidents and the access list is the cleanest it has ever been. The directors only look at resolution time. How do you want to handle that?'
    vi: 'Nửa năm rồi. Thời gian xử lý phiếu của em chậm hơn chỉ tiêu, nhưng không có sự cố lặp lại và danh sách quyền truy cập sạch nhất từ trước đến nay. Ban giám đốc chỉ nhìn thời gian xử lý. Em muốn xử lý chuyện đó thế nào?'
choices:
  - en: 'Show the full picture: tickets, repeat incidents, accounts reviewed and risks closed, and propose that repeat incidents, not raw speed, are the measure.'
    vi: 'Cho xem bức tranh đầy đủ: phiếu, sự cố lặp lại, tài khoản đã rà soát và rủi ro đã đóng, và đề xuất lấy sự cố lặp lại, không phải tốc độ thô, làm thước đo.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.7
        en: "Kien takes the page to Mr Cuong. 'Repeat incidents' is added to the review next to resolution time. A small change, and it changes what IT is rewarded for."
        vi: "Anh Kiên mang trang giấy lên anh Cường. 'Sự cố lặp lại' được thêm vào đánh giá cạnh thời gian xử lý. Một thay đổi nhỏ, và nó đổi điều IT được thưởng."
        effects: [rel kien trust +4, rep.boss +3, stress +1]
      - p: 0.3
        ok: false
        en: "Mr Cuong says that nobody notices IT unless something is broken. Kien shrugs: 'I tried.' Your resolution time stays modest."
        vi: "Anh Cường nói không ai để ý IT trừ khi có gì hỏng. Anh Kiên nhún vai: 'Anh đã thử.' Thời gian xử lý của em vẫn khiêm tốn."
        effects: [rel kien trust +2, stress +2]
  - en: 'Say you will clear the older tickets with a focused fortnight, and ask Kien to hold new project requests for two weeks.'
    vi: 'Nói anh/chị sẽ dọn các phiếu cũ trong hai tuần tập trung và xin anh Kiên giữ các yêu cầu dự án mới hai tuần.'
    outcomes:
      - p: 1
        en: 'Kien agrees, and writes the rule next to the request. You clear the backlog and the resolution time improves, and a project slips a fortnight.'
        vi: 'Anh Kiên đồng ý và ghi quy tắc bên cạnh yêu cầu. Anh/chị dọn hết các phiếu tồn và thời gian xử lý cải thiện, và một dự án trễ hai tuần.'
        effects: [rel kien trust +2, stress +2]
  - en: 'Say you will hit the resolution target whatever it takes.'
    vi: 'Nói anh/chị sẽ đạt chỉ tiêu xử lý bằng mọi giá.'
    outcomes:
      - p: 0.6
        en: "Kien smiles. 'Good attitude.' A week later you notice that the quickest way to close a ticket is to close it, and to reopen it as a new one if the user complains."
        vi: "Anh Kiên cười. 'Thái độ tốt.' Một tuần sau anh/chị nhận ra cách nhanh nhất để đóng phiếu là đóng nó và mở lại thành phiếu mới nếu người dùng phàn nàn."
        effects: [rel kien trust +3, stress +3]
      - p: 0.4
        ok: false
        en: 'Bin notices that your closed tickets are being reopened, and says so in the team meeting, innocently. Kien looks at the chart for a long moment.'
        vi: 'Bin nhận ra các phiếu anh/chị đóng đang bị mở lại và nói vô tư trong cuộc họp nhóm. Anh Kiên nhìn biểu đồ một lúc lâu.'
        effects: [rel kien trust -3, rel bin trust +1, rep.boss -2, stress +3]
---
scene: it.phishing_click
arc: the_ransom
place: it_room
tags: [security, incident, beat]
beat: 29-32
lines:
  - who: char:thu
    en: 'I clicked on an email that said it was from the bank, and a document opened and asked me to enable macros. I enabled them. Then the screen flickered. It is the day before the month-end close, and I need the finance share. I am so sorry.'
    vi: 'Em bấm vào một email nói là của ngân hàng, một tài liệu mở ra và yêu cầu bật macro. Em đã bật. Rồi màn hình nháy. Mai là ngày trước chốt tháng và em cần thư mục tài chính. Em xin lỗi lắm.'
  - who: char:bin
    en: 'I can see three machines talking to an address I do not know. Should I just turn them off?'
    vi: 'Em thấy ba máy đang nói chuyện với một địa chỉ em không biết. Em tắt chúng luôn nhé?'
choices:
  - en: 'Isolate the three machines from the network, preserve the logs, call Kien, and tell Duc that the finance share may be affected before the close.'
    vi: 'Cách ly ba máy khỏi mạng, giữ nhật ký, gọi anh Kiên và báo anh Đức thư mục tài chính có thể bị ảnh hưởng trước kỳ chốt.'
    cost: { hours: 4 }
    outcomes:
      - p: 0.7
        en: "Two machines are infected, and the share is intact. You find the malware before it spreads, and the logs show where it started. Kien says: 'This is what an incident should look like.' Thu cries a little and is thanked."
        vi: "Hai máy bị nhiễm và thư mục dùng chung còn nguyên. Anh/chị tìm ra mã độc trước khi nó lan và nhật ký cho thấy nó bắt đầu từ đâu. Anh Kiên nói: 'Một sự cố phải trông như thế này.' Thư khóc một chút và được cảm ơn."
        effects:
          [
            rel kien trust +4,
            rel thu trust +3,
            rel duc trust +1,
            rep.finance +2,
            stress +5,
            fact reported_incident_promptly witnessed,
            arc the_ransom lock,
          ]
      - p: 0.3
        ok: false
        en: 'The malware has already encrypted part of the finance share. You have isolated the rest, and the logs are intact. It is a bad night, and it is a night with a record.'
        vi: 'Mã độc đã mã hóa một phần thư mục tài chính. Anh/chị đã cách ly phần còn lại và nhật ký còn nguyên. Một đêm tồi tệ, và là đêm có hồ sơ.'
        effects:
          [
            rel kien trust +3,
            rel thu trust +3,
            rel duc trust -2,
            rep.finance -1,
            stress +7,
            fact reported_incident_promptly witnessed,
            arc the_ransom lock,
          ]
  - en: 'Tell Bin to turn the machines off, scan the rest of the network, and keep it between IT until you know what happened.'
    vi: 'Bảo Bin tắt các máy, quét phần còn lại của mạng và giữ giữa IT cho đến khi biết chuyện gì xảy ra.'
    outcomes:
      - p: 1
        en: 'The machines go dark, and so do the volatile logs. You scan through the night. By morning you have a clean network and an incomplete story.'
        vi: 'Các máy tắt, và nhật ký tạm thời cũng mất. Anh/chị quét suốt đêm. Đến sáng có một mạng sạch và một câu chuyện không đầy đủ.'
        effects: [rel kien trust +1, rel thu trust +1, stress +5, arc the_ransom lock]
  - en: 'Reassure Thu it is probably nothing, tell Bin to scan quietly, and avoid worrying Duc before the close.'
    vi: 'Trấn an Thư là chắc không sao, bảo Bin quét lặng lẽ và tránh làm anh Đức lo trước kỳ chốt.'
    outcomes:
      - p: 0.7
        en: 'The scan finds nothing obvious. Overnight, the malware sits and waits. At six in the morning, the finance share starts to encrypt itself.'
        vi: 'Quét không thấy gì rõ ràng. Qua đêm, mã độc nằm chờ. Sáu giờ sáng, thư mục tài chính bắt đầu tự mã hóa.'
        effects:
          [
            rel kien trust -3,
            rel thu trust -1,
            rel duc trust -1,
            stress +2,
            fact delayed_incident_report private,
            arc the_ransom lock,
          ]
      - p: 0.3
        ok: false
        en: 'By midnight, the encryption spreads to the file server, the backup share and the ERP export folder. Duc phones at one in the morning, and asks why nobody told him at four.'
        vi: 'Đến nửa đêm, mã hóa lan sang máy chủ tệp, thư mục sao lưu và thư mục xuất của ERP. Anh Đức gọi lúc một giờ sáng và hỏi vì sao bốn giờ chiều không ai báo.'
        effects:
          [
            rel kien trust -6,
            rel thu trust -2,
            rel duc trust -8,
            rep.boss -5,
            rep.finance -6,
            stress +8,
            fact delayed_incident_report witnessed,
            arc the_ransom lock,
          ]
