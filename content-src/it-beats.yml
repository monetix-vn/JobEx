scene: it.security_review
place: it_room
tags: [audit, security, beat]
beat: 41-44
lines:
  - who: char:quoc
    en: 'I am the internal auditor for IT general controls. I would like to see the list of people with administrator rights, the ERP user list with their roles, the leaver process, the backup test records and the incident log for the year. I start with the access list, not with the firewall.'
    vi: 'Tôi là kiểm toán nội bộ cho kiểm soát chung về IT. Tôi muốn xem danh sách người có quyền quản trị, danh sách người dùng ERP kèm vai trò, quy trình người nghỉ việc, hồ sơ kiểm thử sao lưu và nhật ký sự cố cả năm. Tôi bắt đầu từ danh sách quyền truy cập, không phải tường lửa.'
  - who: char:kien
    en: 'Give him what he asks for. Do not explain more than you are asked, and do not guess.'
    vi: 'Đưa ông ấy những gì ông ấy yêu cầu. Đừng giải thích nhiều hơn điều được hỏi và đừng đoán.'
choices:
  - en: 'Give him the real lists: who has what, the leavers whose accounts were late to close, the backup tests and the incident log, with what you fixed and what remains open.'
    vi: 'Đưa ông các danh sách thật: ai có gì, những người nghỉ việc có tài khoản đóng muộn, các lần kiểm thử sao lưu và nhật ký sự cố, kèm điều đã sửa và điều còn mở.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Quoc reads for three hours and writes five observations. None is serious. 'An access list that matches the people. I wish that were less unusual.' Kien nods at you across the room."
        vi: "Anh Quốc đọc ba giờ và ghi năm nhận xét. Không cái nào nghiêm trọng. 'Một danh sách quyền khớp với con người. Tôi ước điều đó bớt hiếm.' Anh Kiên gật đầu với anh/chị từ phía bên kia phòng."
        effects: [rel quoc trust +5, rel kien trust +4, rep.finance +2, rep.boss +3, stress +2]
  - en: 'Answer his questions and give him the lists he asks for, without volunteering anything.'
    vi: 'Trả lời câu hỏi và đưa các danh sách ông yêu cầu, không chủ động nói thêm gì.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "A routine review. Quoc notes two items, both already on Kien's list. You come out with nothing to hide and no credit either."
        vi: 'Một buổi rà soát thường lệ. Anh Quốc ghi hai mục, cả hai đã có trong danh sách của anh Kiên. Anh/chị ra về không có gì phải giấu và cũng không được tiếng khen.'
        effects: [rel quoc trust +1, rel kien trust +1]
  - en: 'Tidy the access list before the review: remove the leaver accounts and the shared logins, and back-date the removal tickets so that the history looks clean.'
    vi: 'Dọn danh sách quyền trước buổi rà soát: xóa tài khoản người nghỉ việc và đăng nhập dùng chung và ghi lùi ngày các phiếu xóa để lịch sử trông sạch.'
    outcomes:
      - p: 0.45
        en: 'Quoc sees a clean list. He asks why the removal tickets for eleven accounts were all created on the same day, and accepts the explanation.'
        vi: 'Anh Quốc thấy một danh sách sạch. Anh hỏi vì sao phiếu xóa của mười một tài khoản đều được tạo cùng một ngày và chấp nhận lời giải thích.'
        effects:
          [rel quoc trust -2, rel kien trust -5, stress -1, fact backdated_access_tickets private]
      - p: 0.55
        ok: false
        en: 'The directory log records the real deletion times, and the ticket system records the real creation times. Quoc places the two exports side by side and says nothing for a long time.'
        vi: 'Nhật ký thư mục ghi giờ xóa thật, và hệ thống phiếu ghi giờ tạo thật. Anh Quốc đặt hai bản xuất cạnh nhau và im lặng rất lâu.'
        effects:
          [
            rel quoc trust -10,
            rel kien trust -8,
            rep.boss -6,
            rep.finance -4,
            stress +6,
            fact backdated_access_tickets public,
          ]
---
scene: it.year_end_review
place: meeting_room
tags: [people, review, beat]
beat: 49-50
lines:
  - who: char:kien
    en: 'Annual review. Before I give you my view, tell me how you would rate your own year, and what you would handle differently on access and incidents.'
    vi: 'Đánh giá cuối năm. Trước khi anh cho ý kiến, em hãy tự chấm năm của mình và nói em sẽ xử lý khác đi điều gì về quyền truy cập và sự cố.'
choices:
  - en: 'Give an honest account, including the shortcuts you took on access, the incident you reported late, and what it would have cost to say no earlier.'
    vi: 'Kể thật lòng, kể cả các lối tắt em đã đi về quyền truy cập, sự cố em báo muộn và cái giá của việc nói không sớm hơn.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "Kien is quiet for a long moment. He writes: 'Tells us what the logs will tell us, first.' It is the best thing you have read about yourself."
        vi: "Anh Kiên im lặng một lúc lâu. Anh viết: 'Nói cho mình điều nhật ký sẽ nói, trước tiên.' Đó là lời hay nhất anh/chị từng đọc về mình."
        effects: [rel kien trust +5, rep.boss +4, stress -2]
  - en: 'Stay modest: list the wins and one thing to improve.'
    vi: 'Khiêm tốn: nêu các thắng lợi và một điều cần cải thiện.'
    outcomes:
      - p: 1
        en: 'A safe review. Kien nods and moves to the next topic.'
        vi: 'Một buổi đánh giá an toàn. Anh Kiên gật đầu và chuyển chủ đề.'
        effects: [rel kien trust +1, rep.boss +1]
  - en: 'Present the year as a success and leave out the access you granted without a ticket and the incident that nearly got away.'
    vi: 'Trình bày cả năm như một thành công và bỏ qua quyền truy cập cấp không có phiếu và sự cố suýt vuột.'
    outcomes:
      - p: 0.65
        en: 'It lands well. You leave with a good rating and a small weight in your chest.'
        vi: 'Được đón nhận tốt. Anh/chị ra về với điểm cao và một chút nặng nề trong lòng.'
        effects: [rel kien trust +2, rep.boss +4, stress +1, fact polished_it_review private]
      - p: 0.35
        ok: false
        en: 'Kien has the directory audit log open on his desk, with the dates. He turns the screen towards you without a word.'
        vi: 'Anh Kiên có nhật ký kiểm toán thư mục mở sẵn trên bàn, kèm ngày tháng. Anh xoay màn hình về phía anh/chị mà không nói một lời.'
        effects: [rel kien trust -8, rep.boss -5, stress +4, fact polished_it_review witnessed]
---
scene: it.manager_offer
place: meeting_room
tags: [people, promotion, beat]
beat: 51-52
when: [rel.kien.trust >= 12, rep.boss >= 58]
lines:
  - who: char:kien
    en: 'I am moving to group IT at the end of the year. Mr Cuong asked me who should run IT here. I named you. One condition: every month, a director will ask you to give someone access, or look at something, that the policy does not allow. I need to know what you will say.'
    vi: 'Cuối năm anh chuyển sang IT tập đoàn. Anh Cường hỏi anh ai nên điều hành IT ở đây. Anh nêu tên em. Một điều kiện: mỗi tháng sẽ có giám đốc nhờ em cấp quyền cho ai đó, hoặc xem một thứ mà chính sách không cho phép. Anh cần biết em sẽ nói gì.'
choices:
  - en: 'Accept, and say plainly which requests you will not grant, and that the directors will hear it from you first, in writing.'
    vi: 'Nhận lời và nói rõ những yêu cầu anh/chị sẽ không đáp ứng và ban giám đốc sẽ nghe điều đó từ anh/chị trước, bằng văn bản.'
    outcomes:
      - p: 1
        en: "Kien smiles. 'Then it is yours. Put the list on the first page of the access policy.' You take over IT with the limits in writing."
        vi: "Anh Kiên cười. 'Vậy là của em. Đưa danh sách đó lên trang đầu chính sách truy cập.' Anh/chị tiếp quản IT với các giới hạn đã viết ra giấy."
        effects: [rel kien trust +5, rep.boss +5, end promoted]
  - en: 'Thank him, but decline: you prefer running systems to defending them to the directors.'
    vi: 'Cảm ơn anh nhưng từ chối: anh/chị muốn vận hành hệ thống hơn là bảo vệ chúng trước ban giám đốc.'
    outcomes:
      - p: 1
        en: "Kien looks disappointed, then understanding. 'The next manager may not be as careful as you.'"
        vi: "Anh Kiên có vẻ thất vọng rồi thông cảm. 'Người quản lý tiếp theo có thể không cẩn thận như em.'"
        effects: [rel kien trust +2, stress -3]
  - en: 'Accept without asking what the condition means in practice.'
    vi: 'Nhận lời mà không hỏi điều kiện đó thực tế nghĩa là gì.'
    outcomes:
      - p: 1
        en: 'Kien nods slowly and Mr Cuong congratulates you a little too warmly. You realise you agreed to something you did not ask about.'
        vi: 'Anh Kiên gật đầu chậm và anh Cường chúc mừng anh/chị hơi quá nồng nhiệt. Anh/chị nhận ra mình đã đồng ý với điều mình không hỏi.'
        effects: [rep.boss +4, fact accepted_it_condition private, end promoted]
---
scene: it.resignation_thought
place: it_room
tags: [people, pressure]
weight: 2
cooldown: 26
when: [stress >= 75, turn >= 12]
lines:
  - who: char:bin
    en: 'You look like you have not slept. With respect: I have seen sysadmins carry the pager for two years, and leave by the summer. Are you all right?'
    vi: 'Anh/chị trông như chưa ngủ. Xin phép nói thẳng: em từng thấy quản trị viên mang máy nhắn hai năm và nghỉ vào mùa hè. Anh/chị ổn không?'
choices:
  - en: 'Talk to Kien about the on-call load, and ask him to share the pager with you for a month.'
    vi: 'Nói với anh Kiên về gánh nặng trực và xin anh chia máy nhắn với anh/chị một tháng.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.8
        en: 'Kien listens, takes alternate weekends, and says he should have noticed sooner.'
        vi: 'Anh Kiên lắng nghe, nhận luân phiên các cuối tuần và nói lẽ ra anh phải để ý sớm hơn.'
        effects: [rel kien trust +4, rel bin trust +2, stress -6, rep.boss +1]
      - p: 0.2
        ok: false
        en: 'Kien nods and says everyone is stretched at year end. You leave with sympathy and the same pager.'
        vi: 'Anh Kiên gật đầu và nói cuối năm ai cũng căng. Anh/chị ra về với sự cảm thông và chiếc máy nhắn cũ.'
        effects: [rel kien trust +1, stress -1]
  - en: 'Hand in your resignation, politely, with the notice the contract requires.'
    vi: 'Nộp đơn xin nghỉ, lịch sự, báo trước đúng như hợp đồng quy định.'
    outcomes:
      - p: 1
        en: 'Kien reads it twice and does not argue. You hand over a password vault and an up-to-date access list, and walk out lighter than you walked in.'
        vi: 'Anh Kiên đọc hai lần và không phản đối. Anh/chị bàn giao một kho mật khẩu và danh sách quyền cập nhật và bước ra nhẹ nhõm hơn lúc bước vào.'
        effects: [rel kien trust +2, end walked_away]
  - en: 'Tell Bin you are fine and keep going.'
    vi: 'Nói với Bin là anh/chị ổn và tiếp tục.'
    outcomes:
      - p: 1
        en: 'Bin nods and does not push. You feel slightly worse afterwards for having said it.'
        vi: 'Bin gật đầu và không gặng hỏi. Sau đó anh/chị thấy hơi tệ hơn vì đã nói vậy.'
        effects: [rel bin trust -1, stress +2]
