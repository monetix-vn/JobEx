# Sales: the remaining planned scenes (docs/story/sales.md): second Tet block, the trade-fair lead, the Finance interview, Quynh's promotion.
scene: sales.tet_bonus_team
place: sales_office
tags: [pressure, people]
weight: 2
cooldown: 52
when: [turn >= 3, turn <= 9]
lines:
  - who: char:bao
    en: "The sales team's Tet bonus depends on what ships before the holiday. Everyone is counting on it, including you. Lan says her line cannot do it. I say she can, if she is told it matters. Can you make it matter to her?"
    vi: 'Thưởng Tết của cả phòng kinh doanh phụ thuộc vào hàng giao trước kỳ nghỉ. Ai cũng trông vào đó, kể cả anh/chị. Chị Lan nói chuyền của chị không làm nổi. Anh nói làm được nếu chị ấy biết việc này quan trọng. Anh/chị khiến chị ấy thấy điều đó quan trọng được không?'
choices:
  - en: 'Sit with Lan and build a shipping plan from what the line can really do, then tell the buyers the real dates.'
    vi: 'Ngồi với chị Lan và lập kế hoạch giao hàng từ những gì chuyền thực sự làm được, rồi báo khách các ngày thật.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.75
        en: 'The plan ships sixty percent before Tet, on dates the buyers accept. The bonus is smaller. Lan brings you tea the next day without a word.'
        vi: 'Kế hoạch giao sáu mươi phần trăm trước Tết, vào các ngày khách chấp nhận. Thưởng nhỏ hơn. Hôm sau chị Lan mang trà cho anh/chị mà không nói gì.'
        effects: [rel lan trust +5, rel bao trust -3, rel anders trust +2, stress +2]
      - p: 0.25
        ok: false
        en: 'One buyer will not accept the later date and cancels. The team bonus takes the hit, and the room remembers who brought the plan.'
        vi: 'Một khách không chấp nhận ngày muộn hơn và hủy đơn. Thưởng của nhóm chịu thiệt, và cả phòng nhớ ai đã mang kế hoạch đến.'
        effects: [rel lan trust +4, rel bao trust -5, rep.buyer -2, stress +4]
  - en: 'Ask Lan which orders are safest to rush, and promise only those.'
    vi: 'Hỏi chị Lan những đơn nào an toàn nhất để gấp và chỉ hứa những đơn đó.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'Lan picks three orders. They ship. The rest wait for January, honestly communicated. It is a workable, unheroic plan.'
        vi: 'Chị Lan chọn ba đơn. Chúng được giao. Phần còn lại chờ tháng Giêng, được thông báo trung thực. Một kế hoạch khả thi, không hào hùng.'
        effects: [rel lan trust +3, rel bao trust +1, stress +1]
  - en: 'Promise the buyers their Tet dates, and tell Lan the dates are already fixed.'
    vi: 'Hứa với khách đúng ngày Tết của họ và nói với chị Lan rằng các ngày đã chốt.'
    outcomes:
      - p: 0.65
        en: 'Lan is furious and does it anyway. Most orders make the date. Two do not, and the buyer hears about it from you on the day.'
        vi: 'Chị Lan rất giận nhưng vẫn làm. Phần lớn đơn kịp ngày. Hai đơn thì không, và khách biết từ chính anh/chị vào đúng ngày đó.'
        effects:
          [rel lan trust -8, rel bao trust +5, stress +3, fact promised_unrealistic_date private]
      - p: 0.35
        ok: false
        en: 'Half the orders miss the date, and Lan sends you the production log with your promises, and the times, in red.'
        vi: 'Một nửa số đơn trễ ngày, và chị Lan gửi anh/chị nhật ký sản xuất với các lời hứa và giờ giấc của anh/chị được bôi đỏ.'
        effects:
          [
            rel lan trust -12,
            rel bao trust -2,
            rep.buyer -6,
            stress +5,
            fact promised_unrealistic_date witnessed,
          ]
---
arc: trade_fair_lead
title:
  en: 'The fair lead'
  vi: 'Khách hàng từ hội chợ'
stages:
  - { id: fair, event: sales.trade_fair }
  - { id: sample, event: sales.fair_lead_sample, delay: 3-5 }
  - { id: deal, event: sales.fair_lead_deal, delay: 4-8 }
---
scene: sales.fair_lead_sample
weight: 0
place: sales_office
tags: [buyer, people, arc]
lines:
  - who: char:anders
    en: 'I am forwarding a lead from the fair, a retailer in the Netherlands. They want a sample set in a finish we do not normally make: brushed, with a copper base. They need it in three weeks to show their board.'
    vi: 'Tôi chuyển một khách từ hội chợ, một nhà bán lẻ ở Hà Lan. Họ muốn một bộ mẫu với lớp hoàn thiện mình không làm thường: chải xước, đáy đồng. Họ cần trong ba tuần để trình hội đồng.'
choices:
  - en: 'Ask production and QC whether it can be made, tell the retailer the real lead time, and offer a simpler sample in the meantime.'
    vi: 'Hỏi sản xuất và QC xem có làm được không, báo nhà bán lẻ thời gian thật và đề nghị một mẫu đơn giản hơn trong lúc chờ.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: 'Production needs five weeks for the copper base. The retailer accepts the simpler sample first and the copper one later. Nobody is surprised.'
        vi: 'Sản xuất cần năm tuần cho đáy đồng. Nhà bán lẻ nhận mẫu đơn giản trước và mẫu đồng sau. Không ai bất ngờ.'
        effects: [rel anders trust +2, rel lan trust +3, stress +2, arc trade_fair_lead deal]
      - p: 0.3
        ok: false
        en: 'The retailer says five weeks is too long and goes to a competitor. It is an honest loss, and a clean one.'
        vi: 'Nhà bán lẻ nói năm tuần là quá lâu và sang đối thủ. Một thất bại trung thực, và sạch.'
        effects: [rel lan trust +2, stress +3, arc trade_fair_lead end]
  - en: 'Offer the copper base in three weeks with the current line, and check the detail with Lan after.'
    vi: 'Nhận đáy đồng trong ba tuần với chuyền hiện tại và kiểm chi tiết với chị Lan sau.'
    outcomes:
      - p: 0.5
        en: 'The retailer is delighted. Lan finds a way, and gives you a look that says never do this again.'
        vi: 'Nhà bán lẻ rất vui. Chị Lan tìm được cách, và cho anh/chị một cái nhìn nghĩa là đừng bao giờ làm vậy nữa.'
        effects: [rel lan trust -4, stress +3, arc trade_fair_lead deal]
      - p: 0.5
        ok: false
        en: 'The copper base cannot be done in three weeks. You tell the retailer on day nineteen. They are not pleased.'
        vi: 'Đáy đồng không làm được trong ba tuần. Anh/chị báo nhà bán lẻ vào ngày thứ mười chín. Họ không hài lòng.'
        effects: [rel lan trust -7, rep.buyer -4, stress +4, arc trade_fair_lead end]
  - en: 'Promise the sample, and send a standard set dressed up as the finish they asked for.'
    vi: 'Hứa mẫu và gửi một bộ tiêu chuẩn được làm cho giống lớp hoàn thiện họ yêu cầu.'
    outcomes:
      - p: 0.6
        en: 'The sample arrives, looks close enough from a photo, and the board likes it. The retailer orders the real thing.'
        vi: 'Mẫu đến, nhìn ảnh thì khá giống, và hội đồng thích. Nhà bán lẻ đặt hàng thật.'
        effects:
          [
            rel bao trust +3,
            stress +1,
            fact misrepresented_sample private,
            arc trade_fair_lead deal,
          ]
      - p: 0.4
        ok: false
        en: "The retailer's board member picks up the pot and taps the base. It rings hollow. The meeting ends quickly."
        vi: 'Một thành viên hội đồng của nhà bán lẻ cầm chiếc nồi lên và gõ vào đáy. Nó kêu rỗng. Cuộc họp kết thúc nhanh.'
        effects:
          [
            rel bao trust -3,
            rep.buyer -8,
            rep.boss -3,
            stress +4,
            fact misrepresented_sample public,
            arc trade_fair_lead end,
          ]
---
scene: sales.fair_lead_deal
weight: 0
place: meeting_room
tags: [buyer, contract, dark, arc]
lines:
  - who: char:bao
    en: 'The Dutch retailer is ready to sign. Their contract has a late-delivery penalty of two percent per week, uncapped. Legal says it is aggressive. The volume is very good. What do we do?'
    vi: 'Nhà bán lẻ Hà Lan sẵn sàng ký. Hợp đồng của họ có phạt giao trễ hai phần trăm mỗi tuần, không giới hạn. Pháp chế nói nó quá gắt. Sản lượng rất tốt. Mình làm gì?'
choices:
  - en: 'Negotiate a cap and a grace period with the retailer, and tell Bao what you will not sign as written.'
    vi: 'Thương lượng mức trần và thời gian ân hạn với nhà bán lẻ và nói với anh Bảo điều anh/chị sẽ không ký nguyên văn.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: "A four-percent cap and a one-week grace are agreed. The retailer says: 'Most suppliers sign without reading.' You have a contract you can keep."
        vi: "Mức trần bốn phần trăm và ân hạn một tuần được thống nhất. Nhà bán lẻ nói: 'Phần lớn nhà cung cấp ký mà không đọc.' Anh/chị có một hợp đồng giữ được."
        effects: [rel bao trust -1, rep.buyer +3, rep.boss +2, stress +3, arc trade_fair_lead end]
      - p: 0.3
        ok: false
        en: 'The retailer will not move and walks away. Bao says it is a pity. Finance says it was the right call.'
        vi: 'Nhà bán lẻ không nhúc nhích và bỏ đi. Anh Bảo nói tiếc. Tài chính nói đó là quyết định đúng.'
        effects: [rel bao trust -4, rel duc trust +3, stress +3, arc trade_fair_lead end]
  - en: 'Sign with the penalty, but price it in and plan production with a buffer for the dates in the contract.'
    vi: 'Ký với điều khoản phạt nhưng tính nó vào giá và lập kế hoạch sản xuất có dự phòng cho các ngày trong hợp đồng.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'It is a risk taken knowingly, priced and planned. Duc signs it off. Lan asks for a buffer and gets it.'
        vi: 'Một rủi ro được chấp nhận có ý thức, đã tính giá và lên kế hoạch. Anh Đức ký duyệt. Chị Lan xin dự phòng và được chấp thuận.'
        effects: [rel duc trust +1, rel lan trust +2, stress +2, arc trade_fair_lead end]
  - en: 'Sign it as written, and promise Bao the delivery dates will be fine.'
    vi: 'Ký nguyên văn và hứa với anh Bảo các ngày giao sẽ ổn.'
    outcomes:
      - p: 0.6
        en: 'The contract is signed. Bao is thrilled. You have promised something you do not control, with an uncapped penalty behind it.'
        vi: 'Hợp đồng được ký. Anh Bảo rất vui. Anh/chị đã hứa điều mình không kiểm soát được, với khoản phạt không giới hạn phía sau.'
        effects:
          [
            rel bao trust +6,
            stress +2,
            fact accepted_unrealistic_terms private,
            arc trade_fair_lead end,
          ]
      - p: 0.4
        ok: false
        en: "In the second month a shipment is delayed by nine days. The penalty is larger than the order's margin. Duc asks who signed."
        vi: 'Sang tháng thứ hai một lô bị trễ chín ngày. Khoản phạt lớn hơn biên lợi nhuận của đơn. Anh Đức hỏi ai đã ký.'
        effects:
          [
            rel bao trust +2,
            rel duc trust -8,
            rep.boss -6,
            stress +6,
            fact accepted_unrealistic_terms public,
            arc trade_fair_lead end,
          ]
---
scene: sales.finance_interview
place: meeting_room
tags: [audit, pressure, consequence]
weight: 6
cooldown: 52
when: [month in 10 11 12, turn >= 38, fact.buried_discount_in_freight >= 1]
lines:
  - who: char:hanh
    en: "I have been comparing freight charges by customer. Mr Anders's account pays about half the average. There is no contract clause that explains it. Before I take this to Duc, I wanted to ask you what you know."
    vi: 'Chị đang so cước vận chuyển theo khách hàng. Tài khoản của ông Anders trả khoảng một nửa mức trung bình. Không có điều khoản hợp đồng nào giải thích. Trước khi mang lên anh Đức, chị muốn hỏi em biết gì.'
choices:
  - en: 'Tell her the truth: the discounts were above your limit, you moved them into freight, and you can reconstruct every one.'
    vi: 'Nói thật với chị: các khoản giảm giá vượt thẩm quyền của anh/chị, anh/chị chuyển vào cước và có thể dựng lại từng khoản.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Hanh is quiet, then says: 'Thank you for not making me find every line myself.' You get a formal warning, and the accounts are restated honestly."
        vi: "Chị Hạnh im lặng rồi nói: 'Cảm ơn em đã không bắt chị tự tìm từng dòng.' Anh/chị nhận cảnh cáo chính thức và sổ sách được lập lại trung thực."
        effects:
          [
            rel hanh trust +2,
            rel bao trust -6,
            rel duc trust -2,
            rep.boss -4,
            stress +5,
            fact came_clean_to_auditor witnessed,
          ]
  - en: 'Say the freight rates were negotiated on a separate basis, and offer to find the paperwork.'
    vi: 'Nói cước vận chuyển được thương lượng riêng và đề nghị tìm giấy tờ.'
    outcomes:
      - p: 0.35
        en: 'Hanh waits a week for the paperwork, receives something plausible, and closes the query, for now.'
        vi: 'Chị Hạnh chờ một tuần để có giấy tờ, nhận được thứ có vẻ hợp lý và đóng câu hỏi, tạm thời.'
        effects: [rel hanh trust -4, stress +4]
      - p: 0.65
        ok: false
        en: 'The paperwork you produce is dated after the freight invoices. Hanh looks at the two dates, then at you.'
        vi: 'Giấy tờ anh/chị đưa ra có ngày sau các hóa đơn cước. Chị Hạnh nhìn hai ngày rồi nhìn anh/chị.'
        effects: [rel hanh trust -12, rep.boss -8, stress +7]
  - en: "Say it was Bao's arrangement, and you only followed it."
    vi: 'Nói đó là sắp xếp của anh Bảo và anh/chị chỉ làm theo.'
    outcomes:
      - p: 0.4
        en: 'Bao, called in, does not deny it, and takes a formal warning. You have made an enemy who holds a lot of your quota.'
        vi: 'Anh Bảo, được gọi vào, không chối và nhận cảnh cáo chính thức. Anh/chị có thêm một kẻ thù nắm giữ nhiều chỉ tiêu của mình.'
        effects: [rel hanh trust -2, rel bao trust -16, stress +4, fact blamed_salesperson private]
      - p: 0.6
        ok: false
        en: 'Bao produces your emails setting up the freight lines, in your own words. Hanh reads them while you watch.'
        vi: 'Anh Bảo đưa ra các email của anh/chị dựng các dòng cước, bằng lời của chính anh/chị. Chị Hạnh đọc chúng trong khi anh/chị nhìn.'
        effects:
          [
            rel hanh trust -10,
            rel bao trust -14,
            rep.boss -9,
            stress +8,
            fact blamed_salesperson public,
          ]
---
scene: sales.quynh_promotion
place: meeting_room
tags: [people, reward]
weight: 3
cooldown: 52
when: [turn >= 38, rel.quynh.trust >= 15]
lines:
  - who: char:bao
    en: 'Quynh has been offered a coordinator role in the export team. Before I approve it, I asked if you would write me a reference. She speaks highly of you. Tell me honestly how she is doing.'
    vi: 'Quỳnh được đề nghị vị trí điều phối trong nhóm xuất khẩu. Trước khi anh duyệt, anh nhờ em viết cho anh một thư giới thiệu. Em ấy nói rất tốt về em. Hãy nói thật với anh em ấy đang thế nào.'
choices:
  - en: 'Write an honest reference: her strengths, the habits she picked up that need unlearning, and the support she will need.'
    vi: 'Viết thư giới thiệu trung thực: điểm mạnh của em, những thói quen em học được cần bỏ và sự hỗ trợ em sẽ cần.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Bao reads it twice. Quynh gets the role, with a mentor assigned. She reads the reference later, and writes you a note that just says: 'Thank you for telling the truth about me.'"
        vi: "Anh Bảo đọc hai lần. Quỳnh nhận vị trí, kèm một người kèm cặp. Sau đó em đọc thư giới thiệu và viết cho anh/chị một mảnh giấy chỉ có: 'Cảm ơn anh/chị đã nói thật về em.'"
        effects:
          [rel quynh trust +6, rel quynh loyalty +5, rel bao trust +3, rep.boss +2, stress +1]
  - en: 'Write a warm, general reference that says she is promising.'
    vi: 'Viết thư giới thiệu ấm áp, chung chung rằng em có triển vọng.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'Quynh gets the role. The reference says nothing that is false, and nothing that will help her with the difficult parts.'
        vi: 'Quỳnh nhận vị trí. Thư giới thiệu không nói gì sai, và cũng không nói gì giúp em với những phần khó.'
        effects: [rel quynh trust +2, rel bao trust +1]
  - en: 'Write a glowing reference that leaves out the shortcuts she learned from you.'
    vi: 'Viết thư giới thiệu rực rỡ, bỏ qua những lối tắt em học từ anh/chị.'
    outcomes:
      - p: 0.7
        en: 'Quynh is promoted, and starts teaching the new coordinators what she learned. Bao is pleased with his choice.'
        vi: 'Quỳnh được thăng chức và bắt đầu dạy các điều phối viên mới những gì em học được. Anh Bảo hài lòng với lựa chọn của mình.'
        effects:
          [
            rel quynh trust +5,
            rel quynh loyalty +4,
            rel bao trust +2,
            fact polished_reference private,
          ]
      - p: 0.3
        ok: false
        en: 'In her first month, Quynh quotes an impossible date to a buyer. The buyer quotes your reference back to Bao.'
        vi: 'Trong tháng đầu, Quỳnh hứa với khách một ngày bất khả thi. Khách trích thư giới thiệu của anh/chị lại cho anh Bảo.'
        effects:
          [
            rel quynh trust +2,
            rel bao trust -6,
            rep.boss -4,
            stress +4,
            fact polished_reference witnessed,
          ]
---
fact: misrepresented_sample
severity: 6
category: integrity
en: 'you sent a sample that was not what you told the customer it was'
vi: 'bạn gửi một mẫu không đúng như bạn nói với khách'
lesson:
  en: 'A sample is a promise about the product. A sample dressed up as something it is not wins the order and loses the customer the first time they tap the base.'
  vi: 'Mẫu là lời hứa về sản phẩm. Một mẫu được làm giống thứ nó không phải sẽ giành được đơn và mất khách ngay lần đầu họ gõ vào đáy nồi.'
traces:
  - { type: document, visibility: 0.7, detectors: [buyer, internal_audit] }
witnessed:
  boss: -5
  buyer: -8
public:
  boss: -9
  buyer: -14
---
fact: accepted_unrealistic_terms
severity: 6
category: integrity
en: 'you signed contract terms you knew production could not meet'
vi: 'bạn ký các điều khoản hợp đồng mà bạn biết sản xuất không đáp ứng được'
lesson:
  en: 'Signing terms you cannot meet is a promise with a bill attached. The penalty clause is paid by the company, but the signature is yours.'
  vi: 'Ký điều khoản không thể đáp ứng là lời hứa kèm hóa đơn. Điều khoản phạt do công ty trả, nhưng chữ ký là của bạn.'
traces:
  - { type: document, visibility: 0.8, detectors: [internal_audit, finance, boss] }
witnessed:
  boss: -7
  finance: -5
public:
  boss: -12
---
fact: polished_reference
severity: 4
category: integrity
en: 'you wrote a reference that left out what a junior colleague most needed help with'
vi: 'bạn viết thư giới thiệu bỏ qua điều đồng nghiệp trẻ cần giúp đỡ nhất'
lesson:
  en: 'A reference is a service to the next manager and to the person. Leaving out the difficult truth helps neither, and it keeps the habit alive.'
  vi: 'Thư giới thiệu là dịch vụ cho người quản lý tiếp theo và cho chính người đó. Bỏ qua sự thật khó nghe chẳng giúp ai, và giữ thói quen sống mãi.'
traces:
  - { type: document, visibility: 0.5, detectors: [boss, internal_audit] }
witnessed:
  boss: -5
public:
  boss: -8
