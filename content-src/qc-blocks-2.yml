scene: qc.minh_at_audit
weight: 0
place: meeting_room
tags: [audit, people, dark, arc]
lines:
  - who: char:vy
    en: 'I see a correction to a hardness record in the summer. I would like to hear from the person who made the original entry how it happened, and who reviewed the correction.'
    vi: 'Tôi thấy một sửa đổi ở hồ sơ độ cứng hồi mùa hè. Tôi muốn nghe từ người đã ghi bản gốc về việc nó xảy ra thế nào và ai đã soát lại việc sửa.'
  - who: char:minh
    en: 'That was me. I... I am not sure what to say.'
    vi: 'Là em. Em... em không biết nói gì.'
choices:
  - en: 'Tell Minh to say exactly what happened, and sit beside him while he does.'
    vi: 'Bảo Minh nói đúng sự việc và ngồi cạnh em khi em nói.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "Minh tells it plainly and Vy listens. The finding is recorded as a process improvement. Afterwards he says quietly: 'Thank you for not leaving me alone.'"
        vi: "Minh kể rõ ràng và chị Vy lắng nghe. Phát hiện được ghi nhận là cải tiến quy trình. Sau đó em khẽ nói: 'Cảm ơn anh/chị đã không để em một mình.'"
        effects: [rel minh trust +6, rel vy trust +3, rel khoa trust +2, stress +1]
  - en: 'Let Minh answer alone. He made the entry.'
    vi: 'Để Minh tự trả lời. Em là người ghi.'
    outcomes:
      - p: 1
        en: 'Minh struggles through it. Vy is patient, but it is clear nobody prepared him. He avoids you for a month.'
        vi: 'Minh vật lộn trả lời. Chị Vy kiên nhẫn, nhưng rõ ràng không ai chuẩn bị cho em. Em tránh mặt anh/chị cả tháng.'
        effects: [rel minh trust -7, rel minh loyalty -5, stress +2]
  - en: 'Tell Minh what to say, and what not to mention.'
    vi: 'Bảo Minh nên nói gì và không nên nhắc gì.'
    outcomes:
      - p: 0.5
        en: 'Minh recites the script. Vy notes that the answers sound rehearsed, and moves on.'
        vi: 'Minh đọc kịch bản. Chị Vy ghi chú rằng câu trả lời nghe như được tập trước, rồi chuyển tiếp.'
        effects: [rel minh trust -3, rel vy trust -4, stress +3, fact scripted_witness private]
      - p: 0.5
        ok: false
        en: "Minh's voice cracks mid-script. He looks at you, then at Vy, then tells her what actually happened. The room is very quiet."
        vi: 'Giọng Minh nghẹn giữa chừng kịch bản. Em nhìn anh/chị, nhìn chị Vy, rồi kể điều thực sự đã xảy ra. Căn phòng rất yên lặng.'
        effects:
          [
            rel minh trust -6,
            rel vy trust -10,
            rel khoa trust -6,
            rep.boss -5,
            stress +6,
            fact scripted_witness witnessed,
          ]
