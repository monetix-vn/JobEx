fact: passed_borderline_steel
severity: 5
category: integrity
en: 'you passed a borderline steel lot to keep a supplier trial moving'
vi: 'bạn cho qua một lô thép sát ngưỡng để thử nghiệm nhà cung cấp tiếp tục'
lesson:
  en: 'A borderline result is a question, not an answer. Reading it generously to help a cost saving turns the benefit of the doubt against the customer.'
  vi: 'Kết quả sát ngưỡng là một câu hỏi, không phải câu trả lời. Đọc rộng rãi để giúp tiết kiệm chi phí là xoay lợi ích của sự nghi ngờ chống lại khách hàng.'
