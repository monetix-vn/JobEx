# QC blocks 2 (docs/story/qc.md): Cheaper Steel, Field Complaint, Minh, autumn audit and crisis.
arc: cheaper_steel
title:
  en: 'Cheaper steel'
  vi: 'Thép giá rẻ'
stages:
  - { id: trial, event: qc.new_supplier_trial }
  - { id: results, event: qc.steel_trial_results, delay: 3-5 }
  - { id: failure, event: qc.steel_field_failure, delay: 6-10 }
---
scene: qc.steel_trial_results
weight: 0
place: qc_lab
tags: [supplier, materials, arc]
lines:
  - who: char:tam
    en: 'The trial lot results are in. Hardness is on the edge of spec, two readings out of twenty are just below. The supplier says it is normal for a first lot. The price saving is real. What is the verdict?'
    vi: 'Kết quả lô chạy thử đã có. Độ cứng sát ngưỡng tiêu chuẩn, hai trên hai mươi chỉ số thấp hơn một chút. Nhà cung cấp nói lô đầu thường vậy. Khoản tiết kiệm giá là thật. Kết luận thế nào?'
choices:
  - en: 'Reject the supplier for now and explain what they must fix before the next trial.'
    vi: 'Loại nhà cung cấp lúc này và giải thích họ phải sửa gì trước lần thử tiếp theo.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.8
        en: 'Tam is annoyed but accepts the data. The supplier sends an apologetic email and a corrective plan. The savings will have to wait.'
        vi: 'Anh Tâm bực nhưng chấp nhận số liệu. Nhà cung cấp gửi email xin lỗi và kế hoạch khắc phục. Khoản tiết kiệm phải chờ.'
        effects: [rel tam trust -4, rel khoa trust +3, rep.qc +2, stress +2, arc cheaper_steel end]
      - p: 0.2
        ok: false
        en: 'Tam escalates to the directors, who ask whether QC is being unreasonable. You show the data and they let it drop, with some irritation.'
        vi: 'Anh Tâm báo lên ban giám đốc, họ hỏi QC có quá khắt khe không. Anh/chị đưa số liệu và họ bỏ qua, có phần khó chịu.'
        effects:
          [rel tam trust -7, rel khoa trust +3, rep.boss -2, stress +4, arc cheaper_steel end]
  - en: 'Extend the trial with a second lot and tighter incoming checks, and keep the decision open.'
    vi: 'Kéo dài thử nghiệm với lô thứ hai và kiểm đầu vào chặt hơn, giữ quyết định mở.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'It is a fair middle path. Tam grumbles at the delay but agrees. The second lot will decide.'
        vi: 'Một lối đi giữa hợp lý. Anh Tâm càu nhàu vì chậm nhưng đồng ý. Lô thứ hai sẽ quyết định.'
        effects: [rel tam trust -1, rel khoa trust +1, stress +2, arc cheaper_steel end]
  - en: 'Pass the lot: the two low readings are within normal scatter.'
    vi: 'Cho lô qua: hai chỉ số thấp nằm trong dao động bình thường.'
    outcomes:
      - p: 1
        en: 'Tam is delighted and thanks you with a lunch invitation. The steel goes onto the line. You chose to read two readings generously.'
        vi: 'Anh Tâm rất vui và cảm ơn bằng một lời mời ăn trưa. Thép lên chuyền. Anh/chị đã chọn đọc hai chỉ số theo hướng rộng lượng.'
        effects:
          [
            rel tam trust +6,
            stress -1,
            fact passed_borderline_steel private,
            arc cheaper_steel failure,
          ]
---
scene: qc.steel_field_failure
weight: 0
place: meeting_room
tags: [supplier, materials, consequence, arc]
lines:
  - who: char:lan
    en: 'We have had three pots crack at the rivet in the field, all from the new steel. The buyer is asking for the incoming inspection records for that material. What do we show them?'
    vi: 'Có ba chiếc nồi bị nứt ở chỗ đinh tán ngoài thị trường, đều từ thép mới. Khách yêu cầu hồ sơ kiểm đầu vào của vật liệu đó. Mình cho họ xem gì?'
  - who: char:tam
    en: "It is the supplier's problem. Their certificate said it met spec."
    vi: 'Đó là vấn đề của nhà cung cấp. Giấy chứng nhận của họ nói đạt tiêu chuẩn.'
choices:
  - en: 'Own what you signed: show the records, including the borderline readings, and lead the investigation.'
    vi: 'Nhận điều mình đã ký: đưa hồ sơ, kể cả các chỉ số sát ngưỡng, và dẫn dắt việc điều tra.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "It is a rough week. The records show a borderline pass, and you say so first. The buyer's engineer writes: 'Transparent.' Khoa backs you, carefully."
        vi: "Một tuần khó khăn. Hồ sơ cho thấy một lần đạt sát ngưỡng và anh/chị nói trước. Kỹ sư của khách viết: 'Minh bạch.' Anh Khoa ủng hộ, một cách thận trọng."
        effects:
          [
            rel khoa trust +3,
            rel tam trust -5,
            rep.qc -1,
            rep.buyer +2,
            stress +5,
            fact owned_steel_decision witnessed,
          ]
  - en: "Share the blame: the supplier's certificate, the borderline data and the approval were a joint decision."
    vi: 'Chia sẻ trách nhiệm: giấy chứng nhận của nhà cung cấp, số liệu sát ngưỡng và việc phê duyệt là quyết định chung.'
    outcomes:
      - p: 1
        en: "It is roughly true, and it spreads the damage. Tam resents being included, and Khoa says: 'Next time, decide alone if you are going to sign alone.'"
        vi: "Gần đúng sự thật, và nó chia nhỏ thiệt hại. Anh Tâm bực vì bị kéo vào, và anh Khoa nói: 'Lần sau, nếu ký một mình thì hãy quyết một mình.'"
        effects: [rel khoa trust -2, rel tam trust -6, rep.qc -3, stress +4]
  - en: "Say the supplier's certificate was the only evidence you had, and show the incoming records without the borderline notes."
    vi: 'Nói giấy chứng nhận của nhà cung cấp là bằng chứng duy nhất và đưa hồ sơ kiểm đầu vào nhưng không kèm ghi chú sát ngưỡng.'
    outcomes:
      - p: 0.45
        en: 'The buyer accepts the records and focuses on the supplier. You feel the relief, and the unease.'
        vi: 'Khách chấp nhận hồ sơ và tập trung vào nhà cung cấp. Anh/chị thấy nhẹ nhõm, và bất an.'
        effects: [rel tam trust +3, rep.qc -1, stress +2, fact hid_borderline_data private]
      - p: 0.55
        ok: false
        en: "The buyer's lab asks for the raw data. Minh, asked directly, has to hand over the file with the notes in it."
        vi: 'Phòng lab của khách đòi dữ liệu gốc. Minh, được hỏi thẳng, phải đưa tệp có các ghi chú.'
        effects:
          [
            rel minh trust -6,
            rel khoa trust -8,
            rep.buyer -8,
            rep.qc -6,
            stress +6,
            fact hid_borderline_data public,
          ]
---
arc: field_complaint
title:
  en: 'The field complaint'
  vi: 'Khiếu nại ngoài thị trường'
stages:
  - { id: complaint, event: qc.field_complaint_arrives }
  - { id: dispute, event: qc.root_cause_dispute, delay: 2-3 }
  - { id: press, event: qc.recall_press, delay: 4-8 }
---
scene: qc.field_complaint_arrives
arc: field_complaint
place: meeting_room
tags: [quality, complaint, beat]
beat: 29-32
lines:
  - who: char:khoa
    en: 'A buyer in Germany has reported rust spots on the inside of a batch of pots, after six weeks in a warehouse. It could be storage. It could be us. They want a response within five days.'
    vi: 'Một khách ở Đức báo có đốm gỉ bên trong một lô nồi sau sáu tuần trong kho. Có thể do bảo quản. Có thể do mình. Họ muốn phản hồi trong năm ngày.'
choices:
  - en: 'Open a formal investigation: retain samples, check the passivation records, and tell the buyer what you are doing.'
    vi: 'Mở điều tra chính thức: giữ mẫu, kiểm hồ sơ thụ động hóa và nói cho khách biết anh/chị đang làm gì.'
    cost: { hours: 4 }
    outcomes:
      - p: 0.85
        en: 'You find the passivation step was shortened on two shifts. It is an honest finding. The buyer appreciates the speed, and production is not pleased.'
        vi: 'Anh/chị phát hiện bước thụ động hóa bị rút ngắn ở hai ca. Một phát hiện trung thực. Khách đánh giá cao tốc độ, còn bên sản xuất không vui.'
        effects:
          [
            rel khoa trust +3,
            rel lan trust -4,
            rep.buyer +3,
            stress +4,
            arc field_complaint dispute,
          ]
      - p: 0.15
        ok: false
        en: 'The retained samples have been discarded by mistake. You investigate from records alone, and the buyer hears about it.'
        vi: 'Các mẫu lưu đã bị bỏ nhầm. Anh/chị điều tra chỉ từ hồ sơ, và khách nghe chuyện đó.'
        effects: [rel khoa trust +1, rep.buyer -3, stress +5, arc field_complaint dispute]
  - en: 'Check a limited sample, answer the buyer with what you find, and leave the wider question open.'
    vi: 'Kiểm một mẫu giới hạn, trả lời khách bằng những gì tìm được và để mở câu hỏi rộng hơn.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "A quick, partial answer. The buyer accepts it for now. Khoa says: 'We will come back to this, will we not?'"
        vi: "Một câu trả lời nhanh, một phần. Khách tạm chấp nhận. Anh Khoa nói: 'Mình sẽ quay lại chuyện này, đúng không?'"
        effects: [rel khoa trust +1, stress +2, arc field_complaint dispute]
  - en: 'Reply that it is a one-off caused by storage, and close the case.'
    vi: 'Trả lời rằng đó là sự cố đơn lẻ do bảo quản và đóng hồ sơ.'
    outcomes:
      - p: 0.7
        en: 'The buyer accepts. Lan is relieved. The passivation records stay unopened.'
        vi: 'Khách chấp nhận. Chị Lan nhẹ nhõm. Hồ sơ thụ động hóa vẫn chưa ai mở.'
        effects:
          [
            rel lan trust +4,
            stress -1,
            fact dismissed_field_complaint private,
            arc field_complaint press,
          ]
      - p: 0.3
        ok: false
        en: 'The buyer sends a second report, this time with photographs and batch numbers, and copies its director.'
        vi: 'Khách gửi báo cáo thứ hai, lần này kèm ảnh và số lô, đồng gửi giám đốc của họ.'
        effects:
          [
            rel lan trust +2,
            rel khoa trust -5,
            rep.buyer -6,
            stress +5,
            fact dismissed_field_complaint witnessed,
            arc field_complaint press,
          ]
---
scene: qc.root_cause_dispute
weight: 0
place: meeting_room
tags: [quality, people, arc]
lines:
  - who: char:lan
    en: "You say passivation was shortened. My shift leads say the steel was already contaminated when it arrived. Tam says the lab's own cleaning agent could be the cause. Everyone has a story. What do we do?"
    vi: 'Anh/chị nói bước thụ động hóa bị rút ngắn. Các ca trưởng của em nói thép đã nhiễm từ khi về. Anh Tâm nói chất tẩy rửa của chính phòng lab có thể là nguyên nhân. Ai cũng có một câu chuyện. Mình làm gì đây?'
choices:
  - en: 'Follow the data: test samples from each stage and let the results decide, even if they point at QC.'
    vi: 'Theo dữ liệu: kiểm mẫu từ từng công đoạn và để kết quả quyết định, kể cả khi nó chỉ về QC.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.85
        en: 'Results take five days. Contamination is in the steel and the shortened step made it worse. Everyone gets a share, and nobody is scapegoated.'
        vi: 'Kết quả mất năm ngày. Nhiễm bẩn có trong thép và việc rút ngắn bước làm nó nặng hơn. Mỗi bên có một phần, và không ai bị đổ lỗi một mình.'
        effects:
          [rel khoa trust +3, rel tam trust -2, rep.qc +2, stress +3, arc field_complaint end]
      - p: 0.15
        ok: false
        en: 'The results are inconclusive. You document the uncertainty honestly and recommend three controls. The meeting ends without a winner.'
        vi: 'Kết quả không kết luận được. Anh/chị ghi nhận sự không chắc chắn một cách trung thực và khuyến nghị ba biện pháp kiểm soát. Cuộc họp kết thúc không có người thắng.'
        effects: [rel khoa trust +2, stress +3, arc field_complaint end]
  - en: "Propose an independent review by the buyer's lab and abide by it."
    vi: 'Đề xuất để phòng lab của khách xem xét độc lập và tuân theo kết quả.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'It is bold and it works: the buyer trusts an answer they helped reach. Lan is nervous but agrees.'
        vi: 'Táo bạo và hiệu quả: khách tin một câu trả lời họ cùng tìm ra. Chị Lan lo lắng nhưng đồng ý.'
        effects:
          [rel khoa trust +2, rel lan trust -1, rep.buyer +4, stress +2, arc field_complaint end]
  - en: 'Pick the explanation that protects the lab, and argue it.'
    vi: 'Chọn cách giải thích bảo vệ phòng lab và bảo vệ nó.'
    outcomes:
      - p: 0.6
        en: "Your version carries the room. Lan's shift leads are blamed, and the procedure is left alone."
        vi: 'Phiên bản của anh/chị thuyết phục cả phòng. Các ca trưởng của chị Lan bị quy lỗi và quy trình được để nguyên.'
        effects:
          [
            rel lan trust -8,
            rel khoa trust +1,
            stress +1,
            fact picked_side_on_root_cause private,
            arc field_complaint press,
          ]
      - p: 0.4
        ok: false
        en: 'A shift lead brings the maintenance log showing the passivation bath was out of range for a week. Your version comes apart in front of everyone.'
        vi: 'Một ca trưởng mang nhật ký bảo trì cho thấy bể thụ động hóa ngoài ngưỡng cả tuần. Phiên bản của anh/chị sụp đổ trước mặt mọi người.'
        effects:
          [
            rel lan trust -10,
            rel khoa trust -6,
            rep.qc -5,
            rep.production -4,
            stress +5,
            fact picked_side_on_root_cause witnessed,
            arc field_complaint press,
          ]
---
scene: qc.recall_press
weight: 0
place: meeting_room
tags: [quality, complaint, dark, arc]
lines:
  - who: char:khoa
    en: 'The buyer wants a written statement about the rust spots, for their own customers. They want to know how many lots are affected and whether we knew. The directors are nervous. How do we word it?'
    vi: 'Khách muốn một văn bản về các đốm gỉ, để gửi cho khách hàng của họ. Họ muốn biết bao nhiêu lô bị ảnh hưởng và mình có biết không. Ban giám đốc lo lắng. Mình viết thế nào?'
choices:
  - en: 'State the affected lots, what you found, and what you are doing, including what you did not know at the time.'
    vi: 'Nêu các lô bị ảnh hưởng, những gì đã tìm ra và đang làm, kể cả những gì lúc đó mình chưa biết.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "The statement is factual and uncomfortable. The buyer replies: 'This is the statement we needed. Thank you.' The directors complain about the word 'did not know'."
        vi: "Văn bản đúng sự thật và khó chịu. Khách trả lời: 'Đây là văn bản chúng tôi cần. Cảm ơn.' Ban giám đốc phàn nàn về cụm 'chưa biết'."
        effects: [rel khoa trust +4, rep.buyer +4, rep.boss -2, stress +4, arc field_complaint end]
  - en: 'Write a careful statement that is accurate, but does not volunteer the number of lots.'
    vi: 'Viết một văn bản thận trọng, chính xác nhưng không chủ động nêu số lô.'
    outcomes:
      - p: 0.7
        en: 'The buyer accepts it and asks a follow-up. You answer it honestly. The statement is correct, if a little reluctant.'
        vi: 'Khách chấp nhận và hỏi tiếp. Anh/chị trả lời trung thực. Văn bản đúng, dù hơi miễn cưỡng.'
        effects: [rel khoa trust +1, stress +3, arc field_complaint end]
      - p: 0.3
        ok: false
        en: "The buyer counts the lots from the shipping data and finds more than you mentioned. The word 'reluctant' appears in their reply."
        vi: "Khách đếm các lô từ dữ liệu giao hàng và thấy nhiều hơn anh/chị nói. Từ 'miễn cưỡng' xuất hiện trong thư trả lời của họ."
        effects: [rel khoa trust -3, rep.buyer -5, stress +4, arc field_complaint end]
  - en: 'Describe it as a minor cosmetic issue affecting a small number of units.'
    vi: 'Mô tả đó là vấn đề thẩm mỹ nhỏ ảnh hưởng số ít sản phẩm.'
    outcomes:
      - p: 0.5
        en: 'The directors love it. The buyer accepts it without comment. The real number is in a drawer.'
        vi: 'Ban giám đốc rất thích. Khách chấp nhận không bình luận. Con số thật nằm trong ngăn kéo.'
        effects:
          [
            rel khoa trust -2,
            rep.boss +3,
            stress +2,
            fact minimised_defect_to_buyer private,
            arc field_complaint end,
          ]
      - p: 0.5
        ok: false
        en: "A buyer's customer posts photographs of corroded pots online, with the word 'cosmetic' quoted from your statement."
        vi: "Khách hàng của khách đăng ảnh những chiếc nồi bị ăn mòn lên mạng, trích dẫn từ 'thẩm mỹ' trong văn bản của anh/chị."
        effects:
          [
            rel khoa trust -8,
            rep.buyer -10,
            rep.boss -6,
            stress +7,
            fact minimised_defect_to_buyer public,
            arc field_complaint end,
          ]
---
arc: minh
title:
  en: 'Minh'
  vi: 'Minh'
stages:
  - { id: mistake, event: qc.minh_mistake }
  - { id: audit, event: qc.minh_at_audit, delay: 10-16 }
---
scene: qc.minh_mistake
arc: minh
place: qc_lab
tags: [people, dark]
weight: 1.5
cooldown: 52
when: [turn >= 24, turn <= 40, rel.minh.trust >= 10]
lines:
  - who: char:minh
    en: 'I misread a hardness value on a lot that has already shipped. It was 61 and I wrote 67. It would have failed. Please... I cannot lose this job. Can we just fix the record?'
    vi: 'Em đọc sai một giá trị độ cứng của lô đã xuất. Là 61 mà em ghi 67. Đáng lẽ nó đã bị loại. Anh/chị ơi... em không thể mất việc này. Mình sửa hồ sơ được không?'
choices:
  - en: 'Report it to Khoa now with context, recall the lot for retest, and stand beside Minh while it is handled.'
    vi: 'Báo anh Khoa ngay kèm bối cảnh, thu hồi lô để kiểm lại và đứng cạnh Minh trong lúc xử lý.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.85
        en: "Khoa is grave but fair: 'Good that it came to me.' The lot is retested and the record corrected in the open. Minh gets a written warning, not a dismissal."
        vi: "Anh Khoa nghiêm nhưng công bằng: 'May là báo lên anh.' Lô được kiểm lại và hồ sơ được sửa công khai. Minh nhận cảnh cáo bằng văn bản, không bị đuổi."
        effects:
          [
            rel minh trust +7,
            rel minh loyalty +6,
            rel khoa trust +3,
            rep.qc +1,
            stress +4,
            arc minh audit,
          ]
      - p: 0.15
        ok: false
        en: 'The lot has already been installed at the buyer. The recall is expensive and embarrassing. You did the right thing and it still hurts.'
        vi: 'Lô đã được lắp ở nơi khách. Việc thu hồi tốn kém và xấu hổ. Anh/chị làm đúng mà vẫn đau.'
        effects: [rel minh trust +5, rel khoa trust +2, rep.buyer -3, stress +6, arc minh audit]
  - en: 'Correct the record properly with a dated note, retest what you can, and coach Minh without escalating.'
    vi: 'Sửa hồ sơ đúng quy trình kèm ghi chú có ngày, kiểm lại phần có thể và hướng dẫn Minh mà không báo lên.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'The lot is retested and passes. The correction is documented, and the record shows a colleague noticing an error. Minh does not forget.'
        vi: 'Lô được kiểm lại và đạt. Việc sửa có ghi chép, và hồ sơ cho thấy một đồng nghiệp nhận ra lỗi. Minh không quên.'
        effects: [rel minh trust +5, rel minh loyalty +3, stress +2, arc minh audit]
  - en: 'Change the record to 67 and say nothing.'
    vi: 'Sửa hồ sơ thành 67 và không nói gì.'
    outcomes:
      - p: 0.7
        en: 'Minh nearly faints with relief. The lot is out there with a value that was never true. You have a colleague who will walk through fire for you.'
