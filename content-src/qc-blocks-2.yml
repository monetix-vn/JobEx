scene: qc.ms_vy_returns
place: meeting_room
tags: [audit, people, beat]
beat: 41-44
lines:
  - who: char:vy
    en: 'I was here in spring. This time I am comparing spring to now: records, calibrations, the lots I traced, and any corrections made since. Patterns interest me more than single errors.'
    vi: 'Tôi đã đến đây hồi mùa xuân. Lần này tôi so mùa xuân với bây giờ: hồ sơ, hiệu chuẩn, các lô tôi đã truy và mọi sửa đổi từ đó. Quy luật khiến tôi quan tâm hơn các lỗi đơn lẻ.'
choices:
  - en: 'Open everything, and point out the corrections, the borderline calls and what you learned from them.'
    vi: 'Mở mọi thứ và chỉ ra các sửa đổi, các quyết định sát ngưỡng và những gì anh/chị học được từ chúng.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Vy takes notes for two days. Her draft says: 'The laboratory demonstrates a culture of disclosure.' Khoa reads it twice and sits down."
        vi: "Chị Vy ghi chép hai ngày. Bản nháp của chị viết: 'Phòng thí nghiệm thể hiện văn hóa minh bạch.' Anh Khoa đọc hai lần rồi ngồi xuống."
        effects: [rel vy trust +6, rel khoa trust +4, rep.boss +3, stress +2]
  - en: 'Answer fully and give her the files she asks for.'
    vi: 'Trả lời đầy đủ và đưa các hồ sơ chị ấy yêu cầu.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'Uneventful. Her questions are sharper than in spring, and your answers hold.'
        vi: 'Không có gì đặc biệt. Câu hỏi của chị sắc hơn hồi mùa xuân, và câu trả lời của anh/chị đứng vững.'
        effects: [rel vy trust +2]
  - en: 'Give her the files but keep answers short, and do not mention the judgement calls.'
    vi: 'Đưa hồ sơ nhưng trả lời ngắn và không nhắc các quyết định mang tính đánh giá.'
    outcomes:
      - p: 0.6
        en: 'Vy makes no comment. The visit ends on time, and you are tired from not volunteering anything.'
        vi: 'Chị Vy không bình luận. Buổi làm việc kết thúc đúng hạn, và anh/chị mệt vì cố không nói thêm điều gì.'
        effects: [rel vy trust -2, stress +2]
      - p: 0.4
        ok: false
        en: 'Vy finds a pattern across three lots. She asks you to explain each one in writing, copied to Khoa.'
        vi: 'Chị Vy thấy một quy luật xuyên ba lô. Chị yêu cầu anh/chị giải thích từng lô bằng văn bản, đồng gửi anh Khoa.'
        effects: [rel vy trust -8, rel khoa trust -6, rep.boss -4, stress +5]
---
scene: qc.scapegoat_meeting
place: meeting_room
tags: [audit, pressure, consequence]
weight: 6
cooldown: 52
when: [month in 11 12, turn >= 42, fact.took_supplier_money >= 1]
lines:
  - who: char:khoa
    en: "The auditor's draft mentions payments from a supplier to someone in this lab. The directors want a name by tomorrow. I am not going to name someone on a rumour, but I need you to tell me if there is anything I should know."
    vi: 'Bản nháp của kiểm toán nhắc đến các khoản tiền từ một nhà cung cấp cho ai đó trong phòng lab này. Ban giám đốc muốn một cái tên trước ngày mai. Anh sẽ không nêu tên ai chỉ vì tin đồn, nhưng anh cần em nói nếu có điều gì anh nên biết.'
choices:
  - en: 'Tell him everything, now, before anyone else does.'
    vi: 'Nói hết với anh ngay bây giờ, trước khi ai khác nói.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Khoa is silent for a long time. 'I wish you had come earlier. But you came.' You are suspended pending review, and you keep the chance to explain."
        vi: "Anh Khoa im lặng rất lâu. 'Giá như em đến sớm hơn. Nhưng em đã đến.' Anh/chị bị đình chỉ chờ xem xét và giữ được cơ hội giải thích."
        effects: [rel khoa trust +1, rep.boss -5, stress +6, fact came_clean_to_auditor witnessed]
  - en: 'Say you know nothing about any payments.'
    vi: 'Nói rằng anh/chị không biết gì về bất kỳ khoản tiền nào.'
    outcomes:
      - p: 0.35
        en: "Khoa nods and lets it go. The name the directors get is someone else's. You sleep badly for a month."
        vi: 'Anh Khoa gật đầu và bỏ qua. Cái tên ban giám đốc nhận là của người khác. Anh/chị ngủ không ngon cả tháng.'
        effects: [rel khoa trust -4, rel minh trust -3, stress +4]
      - p: 0.65
        ok: false
        en: "The auditor's analyst has already matched the supplier's payment dates to your bank deposits. Khoa is given the file the next morning."
        vi: 'Chuyên viên của kiểm toán đã đối chiếu ngày thanh toán của nhà cung cấp với các khoản tiền gửi ngân hàng của anh/chị. Sáng hôm sau anh Khoa nhận hồ sơ.'
        effects: [rel khoa trust -14, rel vy trust -10, rep.boss -12, stress +9]
  - en: 'Suggest that the new lab technician may have been in contact with the supplier.'
    vi: 'Gợi ý rằng kỹ thuật viên mới có thể đã liên lạc với nhà cung cấp.'
    outcomes:
      - p: 0.4
        en: 'Khoa writes it down. Minh is questioned for a day. He says nothing wrong, and everyone knows it.'
        vi: 'Anh Khoa ghi lại. Minh bị hỏi cả ngày. Em không nói gì sai, và ai cũng biết điều đó.'
        effects:
          [
            rel minh trust -20,
            rel minh loyalty -15,
            rel khoa trust -6,
            stress +5,
            fact blamed_minh private,
          ]
      - p: 0.6
        ok: false
        en: 'Minh produces his own record of every supplier interaction, including the day you were with Mr Hung. It is dated.'
        vi: 'Minh đưa hồ sơ riêng về mọi lần làm việc với nhà cung cấp, kể cả ngày anh/chị đi cùng anh Hùng. Có ghi ngày.'
        effects:
          [rel minh trust -20, rel khoa trust -16, rep.boss -14, stress +9, fact blamed_minh public]
