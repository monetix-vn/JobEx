---
term: accrual
en:
  term: Accrual
  definition: 'An entry that records a cost or income in the month it belongs to, even though the invoice or payment comes later.'
vi:
  term: Trích trước
  definition: 'Bút toán ghi chi phí hoặc thu nhập vào đúng tháng phát sinh, dù hóa đơn hoặc khoản thanh toán đến sau.'
---
term: cutoff
en:
  term: Cut-off
  definition: 'The rule that a sale or cost belongs to the period when the goods or service actually changed hands, not when the paperwork happened to be ready.'
vi:
  term: Cắt kỳ
  definition: 'Nguyên tắc doanh thu hay chi phí thuộc kỳ mà hàng hóa hoặc dịch vụ thực sự được chuyển giao, chứ không phải kỳ giấy tờ tình cờ xong.'
---
fact: wrote_off_unexplained_item
severity: 2
category: integrity
en: 'you wrote off a reconciling item you could not explain'
vi: 'bạn xóa sổ một khoản chênh lệch mà bạn không giải thích được'
lesson:
  en: 'An item you cannot explain is exactly the one an auditor will ask about. Writing it off hides the question instead of answering it.'
  vi: 'Khoản bạn không giải thích được chính là khoản kiểm toán sẽ hỏi. Xóa sổ chỉ giấu câu hỏi chứ không trả lời nó.'
