fact: incomplete_compliance_disclosure
severity: 6
category: integrity
en: 'you gave Compliance a favourable, incomplete account of your personal dealings'
vi: 'bạn đưa cho bộ phận Tuân thủ một lời khai có lợi, không đầy đủ về các giao dịch cá nhân'
lesson:
  en: 'A compliance review is the one place to say what you are unsure about. An incomplete answer turns uncertainty into concealment.'
  vi: 'Rà soát tuân thủ là nơi duy nhất để nói điều bạn không chắc. Một câu trả lời không đầy đủ biến sự không chắc thành che giấu.'
traces:
  - { type: record, visibility: 0.75, detectors: [internal_audit, boss] }
witnessed:
