fact: softened_risk_disclosure
severity: 8
category: integrity
en: 'you softened the risk language in a public offering document'
vi: 'bạn làm nhẹ ngôn từ rủi ro trong tài liệu chào bán công khai'
lesson:
  en: "Risk disclosure is what a retail investor relies on. Softening it to help a deal prices a risk into the investor's loss, and into your own liability."
  vi: 'Công bố rủi ro là điều nhà đầu tư nhỏ dựa vào. Làm nhẹ nó để giúp thương vụ biến một rủi ro thành khoản lỗ của nhà đầu tư và trách nhiệm của chính bạn.'
traces:
  - { type: document, visibility: 0.85, detectors: [internal_audit, boss, buyer] }
witnessed:
  boss: -12
  buyer: -12
public:
  boss: -18
  buyer: -18
