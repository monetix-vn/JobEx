fact: sent_client_file_home
severity: 4
category: integrity
en: "you sent a client's confidential file to a personal email address"
vi: 'bạn gửi hồ sơ mật của khách hàng sang địa chỉ email cá nhân'
lesson:
  en: "Client files belong inside the firm's systems. A personal copy is a leak waiting for a lost phone, a shared laptop or a curious flatmate."
  vi: 'Hồ sơ khách hàng thuộc về hệ thống của công ty. Bản sao cá nhân là một vụ rò rỉ đang chờ một chiếc điện thoại mất, một máy tính dùng chung hoặc một người ở cùng tò mò.'
traces:
  - { type: message, visibility: 0.8, detectors: [internal_audit, boss] }
witnessed:
  boss: -4
public:
  boss: -8
