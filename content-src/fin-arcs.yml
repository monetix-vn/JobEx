scene: fin.receipt_support
weight: 0
place: finance_office
tags: [expenses, dark, arc]
lines:
  - who: char:long
    en: 'The auditor will want paperwork for the party. Can you get a letter from a supplier, saying it was a marketing event? Someone who owes us. Just a letter.'
    vi: 'Kiểm toán sẽ đòi giấy tờ cho bữa tiệc. Anh/chị xin một lá thư từ một nhà cung cấp, nói đó là sự kiện marketing được không? Người nào đó nợ mình. Chỉ một lá thư.'
choices:
  - en: 'Refuse, and tell him the only safe route now is to reclassify the expense as personal.'
    vi: 'Từ chối và nói với anh ấy rằng con đường an toàn duy nhất bây giờ là chuyển khoản này thành cá nhân.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Long is silent, then says, 'You are making this difficult.' You are not, but you feel the cost of saying so."
        vi: "Anh Long im lặng rồi nói: 'Anh/chị đang làm khó tôi.' Anh/chị không làm khó, nhưng anh/chị cảm thấy cái giá của việc nói điều đó."
        effects:
          [
            rel long trust -6,
            rel hanh trust +3,
            rep.boss +1,
            stress +3,
            arc the_receipt_problem end,
          ]
  - en: 'Ask him for the real documents: a vendor quote, a booking, anything honest.'
    vi: 'Xin anh ấy các giấy tờ thật: báo giá, đặt chỗ, bất cứ thứ gì trung thực.'
    outcomes:
      - p: 0.5
        en: 'He finds an actual booking confirmation. It does not make the party a business event, but it is true and you file it.'
        vi: 'Anh ấy tìm được một xác nhận đặt chỗ thật. Nó không biến bữa tiệc thành sự kiện kinh doanh, nhưng là sự thật và anh/chị lưu lại.'
        effects: [rel long trust +1, stress +1, arc the_receipt_problem end]
      - p: 0.5
        ok: false
        en: 'He comes back empty-handed and annoyed. The question of what to book remains open.'
        vi: 'Anh ấy quay lại tay trắng và bực bội. Câu hỏi nên ghi gì vẫn còn đó.'
        effects: [rel long trust -4, stress +2, arc the_receipt_problem end]
  - en: 'Draft the letter yourself for a supplier to sign.'
    vi: 'Tự soạn lá thư để một nhà cung cấp ký.'
    outcomes:
      - p: 0.55
        en: 'The supplier signs without reading. Long pats your arm. You file a document that says something that did not happen.'
        vi: 'Nhà cung cấp ký mà không đọc. Anh Long vỗ vai anh/chị. Anh/chị lưu một tài liệu nói về điều chưa từng xảy ra.'
        effects:
          [
            rel long trust +8,
            rel long owed +3,
            stress +4,
            fact created_support_document private,
            arc the_receipt_problem end,
          ]
      - p: 0.45
        ok: false
        en: "The supplier's accountant reads it and calls Hanh to check. You can hear her voice through the glass."
        vi: 'Kế toán của nhà cung cấp đọc nó và gọi chị Hạnh để kiểm tra. Anh/chị nghe thấy giọng chị qua lớp kính.'
        effects:
          [
            rel long trust +2,
            rel hanh trust -12,
            rep.boss -8,
            stress +6,
            fact created_support_document public,
            arc the_receipt_problem end,
          ]
