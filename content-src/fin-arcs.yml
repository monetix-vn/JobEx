fact: deflected_to_sales
severity: 4
category: integrity
en: 'you put the blame for an early booking on the salesperson'
vi: 'bạn đổ lỗi cho nhân viên kinh doanh về việc ghi nhận sớm'
lesson:
  en: 'The one who books the entry owns the entry. Blaming the person who asked turns one mistake into two: the booking and the dishonesty about it.'
  vi: 'Người ghi bút toán sở hữu bút toán. Đổ lỗi cho người nhờ biến một sai sót thành hai: việc ghi nhận và sự không trung thực về nó.'
