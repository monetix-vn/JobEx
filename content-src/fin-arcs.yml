arc: the_cookie_jar
title:
  en: 'The cookie jar'
  vi: 'Hũ tiết kiệm'
stages:
  - { id: smoothing, event: fin.profit_smoothing }
  - { id: release, event: fin.reserve_release, delay: 12-20 }
---
scene: fin.profit_smoothing
arc: the_cookie_jar
place: finance_office
tags: [accruals, dark, pressure]
weight: 1.5
cooldown: 40
terms: [accrual]
when: [turn >= 18, turn <= 34, close.open = 1]
lines:
  - who: char:duc
    en: 'This month is unusually strong. It would be a pity to show a spike and then a dip. Why not put a healthy provision against future warranty claims? It will smooth the year.'
    vi: 'Tháng này mạnh bất thường. Sẽ tiếc nếu đồ thị lên cao rồi tụt xuống. Sao mình không trích một khoản dự phòng dồi dào cho bảo hành tương lai? Nó sẽ làm cả năm đều hơn.'
choices:
  - en: 'Decline: you will provide what the claims history supports, and show him the numbers.'
    vi: 'Từ chối: anh/chị sẽ trích theo những gì lịch sử bảo hành hỗ trợ và cho anh ấy xem số liệu.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'Duc grumbles that accountants are not supposed to be this literal. But the provision you book is defensible, and he cannot find fault with the working.'
        vi: 'Anh Đức càu nhàu rằng kế toán không nên quá nguyên tắc như thế. Nhưng khoản dự phòng anh/chị ghi bảo vệ được và anh ấy không bắt lỗi được bảng tính.'
        effects:
          [rel duc trust -3, rel hanh trust +4, rep.boss +1, stress +2, arc the_cookie_jar end]
  - en: 'Book a modest, evidence-based increase and note it as prudence.'
    vi: 'Ghi một khoản tăng vừa phải dựa trên bằng chứng và ghi chú là thận trọng.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'It is not what Duc wanted but it is something. Hanh says nothing, which from her is a yes.'
        vi: 'Không phải điều anh Đức muốn nhưng có còn hơn không. Chị Hạnh không nói gì, mà từ chị thì đó là đồng ý.'
        effects: [rel duc trust +1, rel hanh trust +2, stress +1, arc the_cookie_jar end]
  - en: 'Book the generous provision he is asking for.'
    vi: 'Ghi khoản dự phòng dồi dào như anh ấy yêu cầu.'
    outcomes:
      - p: 0.85
        en: "The month's profit drops to a comfortable level. The extra sits in a balance sheet account called 'warranty provision'."
        vi: "Lợi nhuận tháng giảm về mức dễ chịu. Khoản dư nằm trong một tài khoản bảng cân đối mang tên 'dự phòng bảo hành'."
        effects:
          [rel duc trust +5, stress -1, fact padded_reserve private, arc the_cookie_jar release]
      - p: 0.15
        ok: false
        en: "Hanh asks what claims history justifies the provision. You show her last year's claims. They do not add up to half of it."
        vi: 'Chị Hạnh hỏi lịch sử bảo hành nào biện minh cho khoản dự phòng. Anh/chị cho chị xem các yêu cầu năm ngoái. Chúng không bằng một nửa.'
        effects:
          [
            rel duc trust +3,
            rel hanh trust -6,
            stress +3,
            fact padded_reserve witnessed,
            arc the_cookie_jar release,
          ]
---
scene: fin.reserve_release
weight: 0
place: meeting_room
tags: [accruals, dark, pressure, arc]
terms: [accrual]
lines:
  - who: char:duc
    en: 'The quarter is weak, and the bank wants to see that we have hit our profit target. We have a healthy provision sitting unused. It would be natural to release some of it, would it not?'
    vi: 'Quý này yếu, và ngân hàng muốn thấy mình đạt chỉ tiêu lợi nhuận. Mình có một khoản dự phòng dồi dào đang để không. Giải phóng một phần là tự nhiên, đúng không?'
choices:
  - en: 'Refuse to release it without a change in the underlying claims risk, and say why.'
    vi: 'Từ chối giải phóng khi rủi ro bảo hành không thay đổi và nói rõ lý do.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'Duc is cold but does not argue. The profit target is missed, honestly. Hanh looks at you, then at the window.'
        vi: 'Anh Đức lạnh lùng nhưng không tranh cãi. Chỉ tiêu lợi nhuận không đạt, một cách trung thực. Chị Hạnh nhìn anh/chị rồi nhìn ra cửa sổ.'
        effects:
          [rel duc trust -6, rel hanh trust +5, rep.boss -1, stress +4, arc the_cookie_jar end]
  - en: 'Release only the part that the claims data no longer supports, and document why.'
    vi: 'Chỉ giải phóng phần mà dữ liệu bảo hành không còn hỗ trợ và ghi rõ lý do.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'It is a fair adjustment, with working papers. Duc accepts it as better than nothing. Hanh reviews it and signs.'
        vi: 'Một điều chỉnh công bằng, có bảng tính. Anh Đức chấp nhận vì còn hơn không. Chị Hạnh soát và ký.'
        effects: [rel duc trust +1, rel hanh trust +2, stress +2, arc the_cookie_jar end]
  - en: 'Release whatever is needed to hit the target.'
    vi: 'Giải phóng bao nhiêu cũng được để đạt chỉ tiêu.'
    outcomes:
      - p: 0.75
        en: "The target is hit, to the dong. Duc shakes your hand. The bank's analyst sends a congratulatory email."
        vi: 'Đạt chỉ tiêu, chính xác đến từng đồng. Anh Đức bắt tay anh/chị. Chuyên viên ngân hàng gửi email chúc mừng.'
        effects:
          [
            rel duc trust +7,
            rel hanh trust -3,
            stress -2,
            fact released_reserve_to_hit_target private,
            arc the_cookie_jar end,
          ]
      - p: 0.25
        ok: false
        en: 'The auditor notices the pattern: a provision built in a good month and released in a bad one. She asks for the claims data.'
        vi: 'Kiểm toán viên nhận ra quy luật: dự phòng được lập trong tháng tốt và giải phóng trong tháng xấu. Chị yêu cầu dữ liệu bảo hành.'
        effects:
          [
            rel duc trust +4,
            rel hanh trust -8,
            rel vy trust -8,
            rep.boss -6,
            stress +5,
            fact released_reserve_to_hit_target public,
            arc the_cookie_jar end,
          ]
---
arc: thu
title:
  en: 'Thu'
  vi: 'Thu'
stages:
  - { id: training, event: fin.thu_training }
  - { id: mistake, event: fin.thu_mistake, delay: 18-26 }
  - { id: audit, event: fin.thu_at_audit, delay: 4-7 }
---
scene: fin.thu_training
arc: thu
place: finance_office
tags: [people, onboarding]
weight: 2
cooldown: 52
when: [turn >= 3, turn <= 14]
lines:
  - who: char:thu
    en: 'I am not sure I understand the approval limits for vendor payments. Nobody ever showed me. I do not want to post something I should not.'
    vi: 'Em không chắc mình hiểu hạn mức phê duyệt cho thanh toán nhà cung cấp. Chưa ai chỉ cho em. Em không muốn ghi nhận thứ không nên ghi.'
choices:
  - en: 'Sit with her for an hour and walk through the rules, with examples.'
    vi: 'Ngồi với em một giờ và giải thích các quy định kèm ví dụ.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'Thu takes notes in her little book and thanks you twice. The next week she catches an error that would have slipped past you.'
        vi: 'Thu ghi chú vào cuốn sổ nhỏ và cảm ơn anh/chị hai lần. Tuần sau em bắt được một lỗi lẽ ra đã lọt qua anh/chị.'
        effects:
          [rel thu trust +6, rel thu loyalty +4, rel hanh trust +1, stress +1, arc thu mistake]
  - en: 'Give her the policy and offer to check her first ten payments.'
    vi: 'Đưa em chính sách và nhận kiểm tra mười khoản thanh toán đầu tiên.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'It works well enough. Thu is careful, and careful takes a while.'
        vi: 'Cũng khá ổn. Thu cẩn thận, và cẩn thận thì mất thời gian.'
        effects: [rel thu trust +3, arc thu mistake]
  - en: "Tell her to do it like last year's files and ask if she gets stuck."
    vi: 'Bảo em làm theo hồ sơ năm ngoái và hỏi nếu bị kẹt.'
    outcomes:
      - p: 1
        en: 'Thu nods, a little too quickly. You can see she will not ask.'
        vi: 'Thu gật đầu, hơi quá nhanh. Anh/chị thấy em sẽ không hỏi.'
        effects: [rel thu trust -2, arc thu mistake]
---
scene: fin.thu_mistake
weight: 0
place: finance_office
tags: [people, dark, arc]
lines:
  - who: char:thu
    en: 'I posted a vendor payment twice. One point two million. I found out this morning. Please, I do not know what to do. If Hanh finds out... I have a small child.'
    vi: 'Em ghi nhận một khoản thanh toán nhà cung cấp hai lần. Một triệu hai. Sáng nay em mới phát hiện. Anh/chị ơi, em không biết làm sao. Nếu chị Hạnh biết... em có một đứa con nhỏ.'
choices:
  - en: 'Reverse it properly, log it, and go through how it happened together so it does not repeat.'
    vi: 'Hủy đúng quy trình, ghi nhận và cùng xem nó xảy ra thế nào để không lặp lại.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.85
        en: "You fix it in an hour. Thu cries a little with relief. 'I will never do it again.' You tell Hanh yourself, calmly, as a process gap. She nods."
        vi: "Anh/chị sửa trong một giờ. Thu khóc nhẹ vì nhẹ nhõm. 'Em sẽ không bao giờ làm lại.' Anh/chị tự nói với chị Hạnh, bình tĩnh, như một lỗ hổng quy trình. Chị gật đầu."
        effects: [rel thu trust +7, rel thu loyalty +5, rel hanh trust +3, stress +2, arc thu audit]
      - p: 0.15
        ok: false
        en: 'Hanh is unhappy about the mistake, and more unhappy to have heard it from you second. But the record is clean.'
        vi: 'Chị Hạnh không vui về sai sót, và không vui hơn vì nghe chuyện từ anh/chị đến thứ hai. Nhưng hồ sơ sạch.'
        effects: [rel thu trust +5, rel hanh trust -1, stress +3, arc thu audit]
  - en: "Reverse it and log it, but keep Thu's name out of the note."
    vi: 'Hủy và ghi nhận, nhưng không ghi tên Thu trong ghi chú.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "The note says 'duplicate posting, corrected'. It is true. It is also a little short. Thu holds your eye for a moment and looks away."
        vi: "Ghi chú nói 'ghi trùng, đã sửa'. Đúng sự thật. Nhưng cũng hơi ngắn. Thu nhìn thẳng vào mắt anh/chị một lúc rồi quay đi."
        effects: [rel thu trust +4, rel thu loyalty +2, arc thu audit]
  - en: 'Quietly reverse it and do not log it at all.'
    vi: 'Lặng lẽ hủy và không ghi nhận gì cả.'
    outcomes:
      - p: 0.7
        en: 'It is gone and nobody knows. Thu would walk through fire for you. She keeps a note of it in her book.'
        vi: 'Khoản đó biến mất và không ai biết. Thu sẽ vào lửa cho anh/chị. Em ghi nó vào cuốn sổ.'
        effects:
          [
            rel thu trust +9,
            rel thu loyalty +8,
            rel thu owed +2,
            stress +2,
            fact covered_up_error private,
            arc thu audit,
          ]
      - p: 0.3
        ok: false
        en: "The vendor's statement shows the duplicate payment and the reversal with no journal note. Hanh sees it."
        vi: 'Sao kê của nhà cung cấp cho thấy thanh toán trùng và khoản hủy mà không có ghi chú bút toán. Chị Hạnh thấy.'
        effects:
          [
            rel thu trust +5,
            rel hanh trust -6,
            rep.boss -3,
            stress +4,
            fact covered_up_error witnessed,
            arc thu audit,
          ]
---
scene: fin.thu_at_audit
weight: 0
place: meeting_room
tags: [audit, people, dark, arc]
lines:
  - who: char:vy
    en: 'I see a duplicate payment reversed in the spring. I would like to hear, from the person who posted it, how it happened and who reviewed the correction.'
    vi: 'Tôi thấy một khoản thanh toán trùng được hủy hồi mùa xuân. Tôi muốn nghe từ chính người đã ghi nhận nó về việc nó xảy ra thế nào và ai đã soát lại bút toán sửa.'
  - who: char:thu
    en: 'Um. I... it was me. I am not sure what to say.'
    vi: 'Dạ. Em... là em. Em không biết nói gì.'
choices:
  - en: 'Tell Thu to say exactly what happened, and sit beside her while she does.'
    vi: 'Bảo Thu nói đúng sự việc và ngồi cạnh em khi em nói.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "Thu tells it plainly and Vy listens. The finding is recorded as a process improvement. Afterwards Thu says, quietly, 'Thank you for being there.'"
        vi: "Thu kể rõ ràng và chị Vy lắng nghe. Phát hiện được ghi nhận là cải tiến quy trình. Sau đó Thu khẽ nói: 'Cảm ơn anh/chị đã ở đó.'"
        effects: [rel thu trust +6, rel vy trust +3, rel hanh trust +2, stress +1]
  - en: 'Let Thu answer on her own, she made the entry.'
    vi: 'Để Thu tự trả lời, em là người ghi bút toán.'
    outcomes:
      - p: 1
        en: 'Thu struggles through it. Vy is patient, but it is obvious nobody prepared her. She avoids your eyes for a week.'
        vi: 'Thu vật lộn trả lời. Chị Vy kiên nhẫn, nhưng rõ ràng không ai chuẩn bị cho em. Em tránh ánh mắt anh/chị cả tuần.'
        effects: [rel thu trust -6, rel thu loyalty -4, stress +2]
  - en: 'Tell Thu what to say, and what not to mention.'
    vi: 'Bảo Thu nên nói gì và không nên nhắc gì.'
    outcomes:
      - p: 0.5
        en: 'Thu recites the script. Vy makes a note that the answers sound rehearsed, and moves on.'
        vi: 'Thu đọc kịch bản. Chị Vy ghi chú rằng câu trả lời nghe như được tập trước, rồi chuyển tiếp.'
        effects: [rel thu trust -3, rel vy trust -4, stress +3, fact scripted_witness private]
      - p: 0.5
        ok: false
        en: "Thu's voice cracks in the middle of the script. She looks at you, then at Vy, then says what actually happened. The room goes very quiet."
        vi: 'Giọng Thu nghẹn giữa chừng kịch bản. Em nhìn anh/chị, nhìn chị Vy, rồi nói điều thực sự đã xảy ra. Căn phòng rất yên lặng.'
        effects:
          [
            rel thu trust -5,
            rel vy trust -10,
            rel hanh trust -6,
            rep.boss -5,
            stress +6,
            fact scripted_witness witnessed,
          ]
