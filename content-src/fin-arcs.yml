# Finance storylines (docs/story/finance.md): The Cut-off, The Receipt Problem, The Cookie Jar, Thu.
arc: the_cutoff
title:
  en: 'The cut-off'
  vi: 'Cắt kỳ'
stages:
  - { id: request, event: fin.quarter_close_push }
  - { id: followup, event: fin.cutoff_followup, delay: 2-3 }
  - { id: test, event: fin.cutoff_test_prep, delay: 5-9 }
---
scene: fin.quarter_close_push
arc: the_cutoff
place: finance_office
tags: [close, pressure, dark]
weight: 4
cooldown: 10
terms: [cutoff]
when: [close.open = 1, month in 3 6 9 12, turn >= 8]
lines:
  - who: char:bao
    en: 'Quarter end is Friday and I am short by one container. It ships Monday, but the goods are packed and the paperwork is signed. Book it this quarter. Nobody gets hurt.'
    vi: 'Cuối quý là thứ Sáu và em thiếu một container. Thứ Hai mới xuất, nhưng hàng đã đóng gói và giấy tờ đã ký. Anh/chị ghi vào quý này. Không ai bị thiệt.'
  - who: char:duc
    en: 'Bao has a point. The quarter matters to the bank. See what you can do.'
    vi: 'Bảo nói có lý. Quý này quan trọng với ngân hàng. Anh/chị xem làm được gì.'
choices:
  - en: 'Refuse: revenue goes in the period the goods ship, and you tell them why in plain words.'
    vi: 'Từ chối: doanh thu vào kỳ hàng được giao đi, và anh/chị giải thích lý do bằng lời đơn giản.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.8
        en: "It is an uncomfortable meeting. Duc, after a pause, says: 'Fine. Then we explain the quarter to the bank.' Hanh quietly approves."
        vi: "Một cuộc họp khó chịu. Sau một lúc im lặng, anh Đức nói: 'Được rồi. Vậy mình giải thích quý này với ngân hàng.' Chị Hạnh lặng lẽ tán thành."
        effects:
          [
            rel bao trust -6,
            rel duc trust -2,
            rel hanh trust +5,
            rep.boss +2,
            stress +3,
            arc the_cutoff end,
          ]
      - p: 0.2
        ok: false
        en: 'Duc takes it to the CEO and you are asked to explain to a room full of people. You hold the line; it costs you sleep.'
        vi: 'Anh Đức đưa lên giám đốc và anh/chị phải giải thích trước cả phòng. Anh/chị giữ nguyên lập trường; nó làm anh/chị mất ngủ.'
        effects:
          [rel bao trust -8, rel duc trust -5, rel hanh trust +4, stress +5, arc the_cutoff end]
  - en: 'Book it on the shipping date, and sit with Bao to see what could ship legitimately before Friday.'
    vi: 'Ghi theo ngày giao hàng, và ngồi với anh Bảo xem có gì xuất hợp lệ được trước thứ Sáu.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'Bao finds half a container that can ship on Thursday. It is not everything, but it is honest, and he owes you one.'
        vi: 'Anh Bảo tìm được nửa container có thể xuất vào thứ Năm. Không phải tất cả, nhưng trung thực, và anh ấy nợ anh/chị một lần.'
        effects:
          [rel bao trust +1, rel bao owed +1, rel hanh trust +2, stress +1, arc the_cutoff end]
  - en: 'Book it this quarter, on the signed paperwork.'
    vi: 'Ghi vào quý này, dựa trên giấy tờ đã ký.'
    outcomes:
      - p: 0.85
        en: 'The quarter closes on target. Duc is relieved and Bao could hug you. You tell yourself it is only three days.'
        vi: 'Quý khép lại đúng chỉ tiêu. Anh Đức nhẹ nhõm và anh Bảo suýt ôm anh/chị. Anh/chị tự nhủ chỉ là ba ngày.'
        effects:
          [
            rel bao trust +7,
            rel bao owed +2,
            rel duc trust +5,
            stress -2,
            fact booked_revenue_early private,
            arc the_cutoff followup,
          ]
      - p: 0.15
        ok: false
        en: 'Hanh reviews the quarter-end entries the same afternoon and stops at the container. She asks, very quietly, what is going on.'
        vi: 'Chị Hạnh soát các bút toán cuối quý ngay chiều hôm đó và dừng lại ở container. Chị hỏi, rất khẽ, chuyện gì đang xảy ra.'
        effects:
          [
            rel bao trust +5,
            rel hanh trust -6,
            stress +3,
            fact booked_revenue_early witnessed,
            arc the_cutoff followup,
          ]
---
scene: fin.cutoff_followup
weight: 0
place: finance_office
tags: [close, pressure, dark, arc]
terms: [cutoff]
lines:
  - who: char:hanh
    en: 'I was going through last quarter. One container is booked three days before the dispatch log says it left. Tell me about it.'
    vi: 'Chị đang xem lại quý trước. Có một container được ghi ba ngày trước khi nhật ký xuất hàng cho thấy nó rời kho. Em nói cho chị nghe.'
choices:
  - en: 'Tell her straight: Bao asked, Duc leaned on you, you booked it early, and you should not have. Offer to reverse it.'
    vi: 'Nói thẳng với chị: anh Bảo nhờ, anh Đức gây áp lực, anh/chị ghi sớm, và lẽ ra không nên. Đề nghị hủy bút toán.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Hanh closes her notebook. 'Thank you. We will correct it and I will deal with Bao. Next time, call me before.' You have a reprimand and a reputation for telling the truth."
        vi: "Chị Hạnh đóng sổ lại. 'Cảm ơn em. Mình sẽ sửa và chị sẽ làm việc với Bảo. Lần sau gọi chị trước.' Anh/chị nhận một lời nhắc nhở và danh tiếng biết nói thật."
        effects:
          [
            rel hanh trust +3,
            rel bao trust -6,
            rel duc trust -2,
            rep.boss -1,
            stress +3,
            arc the_cutoff end,
          ]
  - en: 'Explain the timing and note that the paperwork was signed on the date you booked it.'
    vi: 'Giải thích thời điểm và lưu ý rằng giấy tờ đã được ký vào ngày anh/chị ghi.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.65
        en: "Hanh looks at you for a while. 'The paperwork date is not the cut-off date.' She lets it go, this time, and writes something down."
        vi: "Chị Hạnh nhìn anh/chị một lúc. 'Ngày giấy tờ không phải ngày cắt kỳ.' Chị bỏ qua, lần này, và ghi lại điều gì đó."
        effects: [rel hanh trust -2, stress +2, arc the_cutoff test]
      - p: 0.35
        ok: false
        en: 'Hanh already has the dispatch log printed. She puts it next to your entry and leaves it there.'
        vi: 'Chị Hạnh đã in sẵn nhật ký xuất hàng. Chị đặt nó cạnh bút toán của anh/chị rồi để đó.'
        effects: [rel hanh trust -6, rep.boss -2, stress +4, arc the_cutoff test]
  - en: 'Say Bao told you it had shipped and you trusted him.'
    vi: 'Nói anh Bảo bảo hàng đã đi và anh/chị tin anh ấy.'
    outcomes:
      - p: 0.5
        en: 'Hanh accepts it, slowly. Bao will get a talking-to, and he will know you gave his name.'
        vi: 'Chị Hạnh chấp nhận, chậm rãi. Anh Bảo sẽ bị nhắc nhở, và anh ấy sẽ biết anh/chị đã nhắc tên anh.'
        effects:
          [
            rel hanh trust -1,
            rel bao trust -9,
            fact deflected_to_sales private,
            arc the_cutoff test,
          ]
      - p: 0.5
        ok: false
        en: 'Bao, called in, says he told you the opposite. Hanh looks at the two of you and draws her own conclusion.'
        vi: 'Anh Bảo được gọi vào, nói rằng anh đã nói điều ngược lại. Chị Hạnh nhìn hai người và tự rút ra kết luận.'
        effects:
          [
            rel hanh trust -7,
            rel bao trust -10,
            rep.boss -4,
            stress +4,
            fact deflected_to_sales witnessed,
            arc the_cutoff test,
          ]
---
scene: fin.cutoff_test_prep
weight: 0
place: meeting_room
tags: [audit, pressure, dark, arc]
terms: [cutoff]
lines:
  - who: char:vy
    en: 'For the cut-off test I will take the last ten shipments of each quarter and compare invoice dates with dispatch logs. I will send the list next week.'
    vi: 'Với kiểm tra cắt kỳ, tôi sẽ lấy mười lô hàng cuối mỗi quý và so ngày hóa đơn với nhật ký xuất hàng. Tuần sau tôi gửi danh sách.'
  - who: char:hanh
    en: 'If there is anything in those quarters that needs to be corrected, now is when it is cheap.'
    vi: 'Nếu có gì trong các quý đó cần sửa, bây giờ là lúc chi phí còn rẻ.'
choices:
  - en: 'Correct the entries now, in the open, and tell Vy before she asks.'
    vi: 'Sửa các bút toán ngay, công khai, và nói với chị Vy trước khi chị hỏi.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Vy writes a finding, but rates it 'corrected voluntarily'. Hanh nods: it is the best outcome available."
        vi: "Chị Vy ghi một phát hiện nhưng xếp loại 'tự nguyện sửa'. Chị Hạnh gật đầu: đó là kết quả tốt nhất có thể."
        effects: [rel vy trust +5, rel hanh trust +4, rep.boss +1, stress +3]
  - en: 'Prepare a written explanation of the early booking and the reasoning, and hand it over if asked.'
    vi: 'Chuẩn bị bản giải trình bằng văn bản về việc ghi sớm và lý do, đưa ra nếu được hỏi.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.6
        en: 'Vy finds the item, reads your explanation, and records it as a cut-off exception with a recommendation.'
        vi: 'Chị Vy tìm thấy khoản đó, đọc giải trình của anh/chị và ghi nhận nó là ngoại lệ cắt kỳ kèm khuyến nghị.'
        effects: [rel vy trust +1, rep.boss -1, stress +2]
      - p: 0.4
        ok: false
        en: 'Vy records it as a cut-off error, with your explanation attached. It reads as someone who knew.'
        vi: 'Chị Vy ghi nhận đó là lỗi cắt kỳ, kèm giải trình của anh/chị. Đọc lên thấy giống một người đã biết.'
        effects:
          [
            rel vy trust -3,
            rel hanh trust -3,
            rep.boss -3,
            stress +3,
            fact booked_revenue_early witnessed,
          ]
  - en: 'Change the invoice dates in the system to match the dispatch log.'
    vi: 'Sửa ngày hóa đơn trong hệ thống cho khớp nhật ký xuất hàng.'
    outcomes:
      - p: 0.4
        en: 'The dates now agree. You close the window and do not look at the audit trail.'
        vi: 'Các ngày giờ khớp nhau. Anh/chị đóng cửa sổ lại và không nhìn vào lịch sử thay đổi.'
        effects: [stress -1, fact backdated_invoice_entry private]
      - p: 0.6
        ok: false
        en: "The system logged every change with a time and a user name. Vy's analyst finds them within an hour."
        vi: 'Hệ thống ghi lại mọi thay đổi kèm thời gian và tên người dùng. Chuyên viên của chị Vy tìm thấy trong vòng một giờ.'
        effects:
          [
            rel vy trust -12,
            rel hanh trust -10,
            rep.boss -8,
            stress +6,
            fact backdated_invoice_entry public,
          ]
---
arc: the_receipt_problem
title:
  en: 'The receipt problem'
  vi: 'Chuyện hóa đơn chứng từ'
stages:
  - { id: receipts, event: fin.long_receipts }
  - { id: personal, event: fin.long_personal, delay: 3-5 }
  - { id: event, event: fin.long_event, delay: 4-8 }
  - { id: support, event: fin.receipt_support, delay: 2-4 }
---
scene: fin.long_receipts
arc: the_receipt_problem
place: finance_office
tags: [expenses, pressure, dark]
weight: 1.5
cooldown: 40
when: [turn >= 14, turn <= 38]
lines:
  - who: char:long
    en: "Here is last month's pile of expenses. No receipts, I am afraid, I lose them. But you know it is all for the business. Please just process it."
    vi: 'Đây là chồng chi phí tháng trước. Không có hóa đơn, em xin lỗi, em hay làm mất. Nhưng anh/chị biết tất cả đều cho công ty. Anh/chị cứ xử lý giúp.'
choices:
  - en: 'Explain that nothing is processed without a receipt, and offer to help him get duplicates from the vendors.'
    vi: 'Giải thích rằng không có hóa đơn thì không xử lý, và đề nghị giúp anh ấy xin bản sao từ nhà cung cấp.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.75
        en: 'Long is irritated, but two days later he returns with half the receipts. Hanh nods when she hears about it.'
        vi: 'Anh Long bực mình, nhưng hai ngày sau anh quay lại với một nửa số hóa đơn. Chị Hạnh gật đầu khi nghe chuyện.'
        effects: [rel long trust -3, rel hanh trust +4, stress +1, arc the_receipt_problem end]
      - p: 0.25
        ok: false
        en: 'Long complains to his uncle that Finance is being difficult. The uncle says nothing to you, but your name gets mentioned.'
        vi: 'Anh Long phàn nàn với chú rằng bên Tài chính làm khó. Ông chú không nói gì với anh/chị, nhưng tên anh/chị được nhắc tới.'
        effects:
          [
            rel long trust -8,
            rel duc trust -3,
            rel hanh trust +4,
            stress +3,
            arc the_receipt_problem end,
          ]
  - en: 'Book the smallest items as a staff advance to be settled against receipts within thirty days.'
    vi: 'Ghi các khoản nhỏ thành tạm ứng nhân viên, thanh toán theo hóa đơn trong ba mươi ngày.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'It is a workable compromise and Long accepts it, for now. The advance sits on your list, and so does he.'
        vi: 'Một thỏa hiệp khả thi và anh Long chấp nhận, tạm thời. Khoản tạm ứng nằm trong danh sách của anh/chị, anh ấy cũng vậy.'
        effects: [rel long trust +1, rel hanh trust +1, arc the_receipt_problem personal]
  - en: 'Process it as business expenses, since he says it is for the business.'
    vi: 'Xử lý như chi phí kinh doanh vì anh ấy nói là cho công ty.'
    outcomes:
      - p: 0.85
        en: "It goes through and Long is pleasantly surprised. 'You are a practical person.' He remembers."
        vi: "Mọi thứ thông qua và anh Long vui bất ngờ. 'Anh/chị là người thực tế.' Anh ấy nhớ điều đó."
        effects:
          [
            rel long trust +6,
            rel long owed +1,
            stress -1,
            fact accepted_missing_receipt private,
            arc the_receipt_problem personal,
          ]
      - p: 0.15
        ok: false
        en: 'Thu, doing the payment run, asks why thirty-four entries have no attachments. You find an answer that is shorter than the truth.'
        vi: 'Thu, khi làm đợt chi, hỏi vì sao ba mươi bốn bút toán không có chứng từ đính kèm. Anh/chị đưa ra một câu trả lời ngắn hơn sự thật.'
        effects:
          [
            rel long trust +4,
            rel thu trust -5,
            fact accepted_missing_receipt witnessed,
            arc the_receipt_problem personal,
          ]
---
scene: fin.long_personal
weight: 0
place: finance_office
tags: [expenses, dark, arc]
lines:
  - who: char:long
    en: 'I have one more. It is a dinner for ten at a nice place. Put it under client entertainment. It was a family dinner, but really, our clients are family, in a way.'
    vi: 'Còn một khoản nữa. Bữa tối mười người ở một nơi sang trọng. Anh/chị ghi vào tiếp khách. Thực ra là bữa ăn gia đình, nhưng thật ra khách hàng của mình cũng như người nhà.'
choices:
  - en: 'Refuse to book it as business, and suggest he reimburses it personally.'
    vi: 'Từ chối ghi là chi phí kinh doanh và gợi ý anh ấy tự thanh toán.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "He stares at you for a moment, then laughs, not kindly. 'You have spine. I will remember that.' The receipt goes into the personal pile."
        vi: "Anh ấy nhìn anh/chị một lúc rồi cười, không thiện cảm. 'Anh/chị có bản lĩnh. Tôi sẽ nhớ.' Hóa đơn chuyển sang chồng cá nhân."
        effects: [rel long trust -8, rel hanh trust +3, stress +2, arc the_receipt_problem end]
  - en: 'Take it to Hanh and let her decide.'
    vi: 'Mang lên chị Hạnh để chị quyết định.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'Hanh says no, and handles Long herself, with a very short call. You are out of the middle, and Long knows who sent it up.'
        vi: 'Chị Hạnh nói không và tự xử lý anh Long bằng một cuộc gọi rất ngắn. Anh/chị thoát khỏi vị trí kẹt giữa, và anh Long biết ai đã báo lên.'
        effects: [rel hanh trust +4, rel long trust -6, stress +1, arc the_receipt_problem end]
  - en: 'Book it as client entertainment.'
    vi: 'Ghi là chi phí tiếp khách.'
    outcomes:
      - p: 0.8
        en: "Done. Long thanks you warmly. The entry is labelled 'client event'. It is not quite a lie, and it is not quite true."
        vi: "Xong. Anh Long cảm ơn nồng nhiệt. Bút toán được gắn nhãn 'sự kiện khách hàng'. Không hẳn là nói dối, và cũng không hẳn là đúng."
        effects:
          [
            rel long trust +8,
            rel long owed +2,
            stress +1,
            fact booked_personal_expense private,
            arc the_receipt_problem event,
          ]
      - p: 0.2
        ok: false
        en: "Thu sees a restaurant name she recognises, from a family photo in Long's office. She says nothing, but she looks."
        vi: 'Thu thấy tên một nhà hàng mà em nhận ra, từ tấm ảnh gia đình trong phòng anh Long. Em không nói gì, nhưng em nhìn.'
        effects:
          [
            rel long trust +6,
            rel thu trust -6,
            fact booked_personal_expense witnessed,
            arc the_receipt_problem event,
          ]
---
scene: fin.long_event
weight: 0
place: finance_office
tags: [expenses, dark, arc]
lines:
  - who: char:long
    en: "My cousin's engagement party. Thirty-eight million dong. Book it to marketing. Duc has already said it is fine, more or less."
    vi: 'Tiệc đính hôn của em họ tôi. Ba mươi tám triệu đồng. Anh/chị ghi vào marketing. Anh Đức đã nói được rồi, đại khái vậy.'
choices:
  - en: 'Take the invoice to Hanh and Duc together and ask for a written decision.'
    vi: 'Mang hóa đơn đến chị Hạnh và anh Đức cùng lúc và xin quyết định bằng văn bản.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.85
        en: "Duc's 'more or less' turns out to have been 'not at all'. Nobody wants to put it in writing. It is reclassified as personal."
        vi: "'Đại khái' của anh Đức hóa ra là 'hoàn toàn không'. Không ai muốn ghi ra giấy. Khoản này được chuyển thành cá nhân."
        effects:
          [
            rel long trust -10,
            rel hanh trust +5,
            rel duc trust -2,
            rep.boss +3,
            stress +4,
            arc the_receipt_problem end,
          ]
      - p: 0.15
        ok: false
        en: "Duc says, in front of Hanh, that it is the owner's family and to keep it simple. Hanh's face does not change. Your hands shake a little."
        vi: 'Anh Đức nói, trước mặt chị Hạnh, rằng đó là gia đình chủ và nên làm cho đơn giản. Gương mặt chị Hạnh không đổi. Tay anh/chị run nhẹ.'
        effects:
          [
            rel long trust -4,
            rel hanh trust +3,
            rel duc trust +2,
            stress +5,
            arc the_receipt_problem end,
          ]
  - en: 'Refuse and say you will not book it without a business purpose, and leave it there.'
    vi: 'Từ chối và nói anh/chị không ghi nếu không có mục đích kinh doanh, rồi để đó.'
    outcomes:
      - p: 1
        en: 'Long goes red, then white. He does not raise his voice. He says he will speak to someone else. Nothing is booked.'
        vi: 'Anh Long đỏ mặt rồi tái đi. Anh không to tiếng. Anh nói sẽ nói chuyện với người khác. Không có gì được ghi.'
        effects: [rel long trust -12, rel hanh trust +2, stress +3, arc the_receipt_problem end]
  - en: 'Book it to marketing.'
    vi: 'Ghi vào marketing.'
    outcomes:
      - p: 0.85
        en: "Thirty-eight million leaves the marketing budget without a word of resistance. Long says, 'I will not forget this.' He does not say what he means by it."
        vi: "Ba mươi tám triệu rời ngân sách marketing mà không một lời phản đối. Anh Long nói: 'Tôi sẽ không quên.' Anh không nói rõ ý."
        effects:
          [
            rel long trust +10,
            rel long owed +3,
            rel hanh trust -2,
            stress +2,
            fact booked_personal_expense private,
            arc the_receipt_problem support,
          ]
      - p: 0.15
        ok: false
        en: 'The marketing manager sees the charge and asks what campaign it was. Nobody has an answer, and word gets around fast.'
        vi: 'Quản lý marketing thấy khoản chi và hỏi đó là chiến dịch nào. Không ai có câu trả lời, và tin đồn lan nhanh.'
        effects:
          [
            rel long trust +8,
            rel hanh trust -5,
            rep.boss -4,
            fact booked_personal_expense rumor,
            arc the_receipt_problem support,
          ]
