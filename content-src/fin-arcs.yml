fact: padded_reserve
severity: 6
category: integrity
en: 'you built a reserve larger than the evidence supported'
vi: 'bạn lập một khoản dự phòng lớn hơn so với bằng chứng'
lesson:
  en: 'A reserve bigger than the evidence is hidden profit, stored for later. It exists to be released when the numbers are needed, which is exactly why it is wrong.'
  vi: 'Khoản dự phòng lớn hơn bằng chứng là lợi nhuận bị giấu để dành cho sau. Nó tồn tại để được giải phóng khi cần số đẹp, và đó chính là lý do nó sai.'
