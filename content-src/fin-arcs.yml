scene: fin.vy_asks_receipts
place: meeting_room
tags: [audit, dark, consequence]
weight: 6
cooldown: 30
when: [fact.booked_personal_expense >= 1, month in 9 10 11, turn >= 36]
lines:
  - who: char:vy
    en: 'I have a list of expenses where the business purpose is thin. Two of them have no receipt, and one is for a restaurant that I think I have seen in a wedding photograph. Can we go through them?'
    vi: 'Tôi có danh sách các khoản chi có mục đích kinh doanh mỏng. Hai khoản không có hóa đơn và một khoản ở nhà hàng mà tôi nghĩ tôi từng thấy trong ảnh cưới. Mình xem qua chúng nhé?'
choices:
  - en: 'Show her exactly what you have, say which entries you think were wrong, and name who asked for them.'
    vi: 'Cho chị ấy xem chính xác những gì anh/chị có, nói các bút toán nào anh/chị cho là sai và nêu ai đã yêu cầu.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "It is the hardest conversation of your year. Vy writes it down and asks that the expenses be reclassified. Hanh, told afterwards, says: 'You should have come to me first. But thank you.'"
        vi: "Đây là cuộc trò chuyện khó nhất trong năm của anh/chị. Chị Vy ghi lại và đề nghị phân loại lại các khoản chi. Chị Hạnh, được báo sau đó, nói: 'Lẽ ra em phải đến gặp chị trước. Nhưng cảm ơn em.'"
        effects:
          [
            rel vy trust +3,
            rel hanh trust +1,
            rel long trust -10,
            rep.boss -2,
            stress +5,
            fact came_clean_to_auditor witnessed,
          ]
  - en: 'Explain the circumstances and say you followed instructions, without naming anyone.'
    vi: 'Giải thích hoàn cảnh và nói anh/chị làm theo chỉ dẫn, không nêu tên ai.'
    outcomes:
      - p: 0.6
        en: "Vy nods slowly: 'Instructions from whom?' She writes down your non-answer."
        vi: "Chị Vy gật đầu chậm: 'Chỉ dẫn từ ai?' Chị ghi lại việc anh/chị không trả lời."
        effects: [rel vy trust -4, rel hanh trust -2, stress +3]
      - p: 0.4
        ok: false
        en: "Vy's analyst has the approval log. The name comes up anyway, and it is next to your user id."
        vi: 'Chuyên viên của chị Vy có nhật ký phê duyệt. Cái tên vẫn hiện ra, ngay cạnh mã người dùng của anh/chị.'
        effects: [rel vy trust -7, rel hanh trust -6, rep.boss -5, stress +5]
  - en: 'Produce the supplier letter and the booking confirmation as support.'
    vi: 'Đưa thư của nhà cung cấp và xác nhận đặt chỗ làm chứng từ.'
    outcomes:
      - p: 0.35
        en: 'Vy reads the letter. She does not challenge it. She files it, and you leave the room sweating.'
        vi: 'Chị Vy đọc lá thư. Chị không chất vấn. Chị lưu lại, và anh/chị rời phòng trong mồ hôi.'
        effects: [stress +4, rel vy trust -3]
      - p: 0.65
        ok: false
        en: "Vy holds the letter up to the light, then puts it next to the supplier's own stationery from last year. The fonts do not match."
        vi: 'Chị Vy giơ lá thư lên ánh sáng, rồi đặt cạnh giấy tiêu đề của chính nhà cung cấp hồi năm ngoái. Phông chữ không khớp.'
        effects:
          [
            rel vy trust -15,
            rel hanh trust -10,
            rep.boss -10,
            stress +8,
            fact created_support_document public,
          ]
