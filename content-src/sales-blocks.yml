scene: sales.anders_renewal
place: meeting_room
tags: [buyer, people, reward]
weight: 4
cooldown: 52
when: [turn >= 34, rel.anders.trust >= 25]
lines:
  - who: char:anders
    en: 'You have been the most honest supplier I have worked with. I would like to make you my main supplier for next year, with a three-year framework. The price is for you to propose. I will trust it.'
    vi: 'Anh/chị là nhà cung cấp trung thực nhất tôi từng làm việc. Tôi muốn đưa anh/chị thành nhà cung cấp chính của tôi cho năm sau, với hợp đồng khung ba năm. Giá để anh/chị đề xuất. Tôi sẽ tin nó.'
choices:
  - en: 'Propose a fair price with a clear review clause, and tell him what you will and will not promise.'
    vi: 'Đề xuất một mức giá hợp lý kèm điều khoản xem xét rõ ràng và nói với ông điều anh/chị sẽ và sẽ không hứa.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: 'Anders signs the framework the next week. Bao is overjoyed. The contract has your honesty written into its review clause, and it is the best deal of the year.'
        vi: 'Ông Anders ký hợp đồng khung tuần sau. Anh Bảo vui mừng. Hợp đồng có sự trung thực của anh/chị viết vào điều khoản xem xét, và là thương vụ tốt nhất năm.'
        effects: [rel anders trust +5, rel bao trust +5, rep.buyer +6, rep.boss +5, stress +1]
  - en: 'Propose a fair price and quietly include a margin that would not survive his comparison.'
    vi: 'Đề xuất giá hợp lý và lặng lẽ thêm một mức biên không chịu nổi sự so sánh của ông.'
    outcomes:
      - p: 0.7
        en: 'Anders signs without checking. The margin is good, and Bao is delighted. You have used the trust he gave you.'
        vi: 'Ông Anders ký mà không kiểm tra. Biên tốt, và anh Bảo rất vui. Anh/chị đã dùng lòng tin ông trao.'
        effects:
          [
            rel anders trust +2,
            rel bao trust +6,
            rep.boss +4,
            stress +1,
            fact exploited_buyer_trust private,
          ]
      - p: 0.3
        ok: false
        en: "Anders's analyst benchmarks the price against the market and reports the gap. Anders calls you himself, and he is quiet."
        vi: 'Chuyên viên của ông Anders so giá với thị trường và báo khoảng chênh. Ông Anders tự gọi cho anh/chị, và ông rất trầm.'
        effects:
          [
            rel anders trust -14,
            rel bao trust -4,
            rep.buyer -10,
            stress +6,
            fact exploited_buyer_trust public,
          ]
  - en: 'Thank him but say you cannot commit for three years, and propose one year with an option.'
    vi: 'Cảm ơn ông nhưng nói anh/chị không thể cam kết ba năm và đề xuất một năm kèm quyền gia hạn.'
    outcomes:
      - p: 1
        en: "Anders laughs, surprised. 'I have never had a supplier refuse a longer contract.' He signs the one-year deal, and respects you more."
        vi: "Ông Anders cười, ngạc nhiên. 'Tôi chưa từng có nhà cung cấp nào từ chối hợp đồng dài hơn.' Ông ký hợp đồng một năm và tôn trọng anh/chị hơn."
        effects: [rel anders trust +4, rel bao trust -2, rep.buyer +3]
---
scene: sales.year_end_review
place: meeting_room
tags: [people, review, beat]
beat: 49-50
lines:
  - who: char:bao
    en: 'Annual review. Before I give you my view, tell me how you would rate your own year, and what you would do differently.'
    vi: 'Đánh giá cuối năm. Trước khi anh nói quan điểm, em hãy tự chấm năm của mình và nói em sẽ làm khác đi điều gì.'
choices:
  - en: 'Give an honest account, including the promises you stretched and what they cost.'
    vi: 'Kể thật lòng, kể cả những lời hứa anh/chị đã nới và cái giá của chúng.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "Bao is quiet, then says: 'That is more honest than I am with myself.' He writes: 'Reliable in the telling.'"
        vi: "Anh Bảo im lặng rồi nói: 'Em trung thực hơn cả anh với chính mình.' Anh viết: 'Đáng tin khi kể lại.'"
        effects: [rel bao trust +5, rep.boss +4, stress -2]
  - en: 'Stay modest: list the wins and one thing to improve.'
    vi: 'Khiêm tốn: nêu các thắng lợi và một điều cần cải thiện.'
    outcomes:
      - p: 1
        en: 'A safe review. Bao nods and moves on to the next topic.'
        vi: 'Một buổi đánh giá an toàn. Anh Bảo gật đầu và chuyển chủ đề.'
        effects: [rel bao trust +1, rep.boss +1]
  - en: 'Present the year as a clean success and leave out the promises you bent.'
    vi: 'Trình bày cả năm như một thành công sạch và bỏ qua các lời hứa anh/chị đã bẻ.'
    outcomes:
      - p: 0.65
        en: 'It lands well, and you leave with a bonus recommendation and a small weight in your chest.'
        vi: 'Được đón nhận tốt, và anh/chị ra về với đề xuất thưởng và một chút nặng nề trong lòng.'
        effects: [rel bao trust +2, rep.boss +4, stress +1, fact polished_year_review private]
      - p: 0.35
        ok: false
        en: "Bao has Lan's notes on the dates you promised. He puts them on the table without comment."
        vi: 'Anh Bảo có ghi chú của chị Lan về các ngày anh/chị đã hứa. Anh đặt chúng lên bàn mà không bình luận.'
        effects: [rel bao trust -8, rep.boss -5, stress +4, fact polished_year_review witnessed]
---
scene: sales.manager_offer
place: meeting_room
tags: [people, promotion, beat]
beat: 51-52
when: [rep.boss >= 55]
when_any: [rel.bao.trust >= 10, rel.anders.trust >= 15]
lines:
  - who: char:bao
    en: 'I am being moved up to regional director at the end of the year. The directors asked who should run export sales. I named you. One condition: you will be asked, every quarter, to reach numbers that are not quite reachable. I need to know what you will do.'
    vi: 'Cuối năm anh được lên giám đốc khu vực. Ban giám đốc hỏi ai nên phụ trách bán hàng xuất khẩu. Anh nêu tên em. Một điều kiện: mỗi quý em sẽ được yêu cầu đạt những con số gần như không đạt nổi. Anh cần biết em sẽ làm gì.'
choices:
  - en: 'Accept, and say you will bring honest numbers and real options every time, and expect the directors to hear that too.'
    vi: 'Nhận lời và nói rằng anh/chị sẽ mang số liệu trung thực và phương án thật mỗi lần, và mong ban giám đốc cũng nghe điều đó.'
    outcomes:
      - p: 1
        en: "Bao smiles. 'Then you are the right person.' You take over export sales with your terms understood, and with Anders's contract in your drawer."
        vi: "Anh Bảo cười. 'Vậy em là người phù hợp.' Anh/chị tiếp quản bán hàng xuất khẩu với điều kiện đã được hiểu và hợp đồng của ông Anders trong ngăn kéo."
        effects: [rel bao trust +5, rep.boss +5, end promoted]
  - en: 'Thank him, but decline: you would rather sell than manage the pressure.'
    vi: 'Cảm ơn anh nhưng từ chối: anh/chị muốn bán hàng hơn là quản lý áp lực.'
    outcomes:
      - p: 1
        en: "Bao looks disappointed, then understanding. 'The next manager may not be as careful as you.'"
        vi: "Anh Bảo có vẻ thất vọng rồi thông cảm. 'Người quản lý tiếp theo có thể không cẩn thận như em.'"
        effects: [rel bao trust +2, stress -3]
  - en: 'Accept without asking what the condition means in practice.'
    vi: 'Nhận lời mà không hỏi điều kiện đó thực tế nghĩa là gì.'
    outcomes:
      - p: 1
        en: 'Bao shakes your hand a little too warmly. You realise you agreed to something you did not ask about.'
        vi: 'Anh Bảo bắt tay anh/chị hơi quá nồng nhiệt. Anh/chị nhận ra mình đã đồng ý với điều mình không hỏi.'
        effects:
          [rel bao trust +5, rep.boss +4, fact accepted_smoothing_condition private, end promoted]
---
fact: buried_discount_in_freight
severity: 6
category: integrity
en: 'you hid unapproved discounts inside the freight charges'
vi: 'bạn giấu các khoản giảm giá không được duyệt trong cước vận chuyển'
lesson:
  en: 'A discount that does not appear on the price line is still a discount. Moving it elsewhere only stops the people who approve prices from seeing it.'
  vi: 'Khoản giảm giá không xuất hiện ở dòng giá vẫn là giảm giá. Chuyển nó sang chỗ khác chỉ khiến người duyệt giá không thấy nó.'
