scene: prod.first_week
place: factory_floor
tags: [onboarding, people, beat]
beat: 1-3
lines:
  - who: char:lan
    en: 'Welcome to planning. The schedule for this week is on the board. Kiet runs line 2 and he will tell you what the board does not. Learn the lines before you learn the spreadsheet.'
    vi: 'Chào mừng em đến bộ phận kế hoạch. Lịch tuần này ở trên bảng. Anh Kiệt phụ trách chuyền 2 và anh sẽ nói cho em điều bảng không nói. Hãy học các chuyền trước khi học bảng tính.'
  - who: char:kiet
    en: 'With respect, most planners never walk the floor. Do not be one of them. Ask me how long a changeover really takes, not how long it says on the sheet.'
    vi: 'Xin phép nói thẳng, phần lớn người lập kế hoạch chẳng bao giờ đi xuống xưởng. Em đừng là một trong số đó. Hỏi anh một lần đổi khuôn thực sự mất bao lâu, đừng hỏi trên giấy ghi bao lâu.'
choices:
  - en: 'Spend the morning on line 2 with Kiet, timing the real changeover and noting where the sheet is wrong.'
    vi: 'Dành cả buổi sáng ở chuyền 2 với anh Kiệt, bấm giờ lần đổi khuôn thật và ghi chỗ bảng sai.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "The sheet says 40 minutes. The real time is 75. Kiet sees you write it down, and says: 'Now you can plan.' The crew nods at you in the canteen afterwards."
        vi: "Bảng ghi 40 phút. Thời gian thật là 75. Anh Kiệt thấy anh/chị ghi lại và nói: 'Giờ thì em lập kế hoạch được rồi.' Sau đó ở căng tin cả tổ gật đầu chào anh/chị."
        effects: [rel kiet trust +5, rel lan trust +3, stress +1]
  - en: 'Take the standard times from the sheet and check them against two or three lines as you go.'
    vi: 'Lấy thời gian chuẩn từ bảng và đối chiếu với hai, ba chuyền khi có dịp.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'It is a workable start. You find two wrong times by accident, in the second week, when a shift runs late.'
        vi: 'Một khởi đầu khả thi. Anh/chị tìm ra hai thời gian sai một cách tình cờ, vào tuần thứ hai, khi một ca chạy trễ.'
        effects: [rel kiet trust +1, stress +1]
  - en: 'Trust the sheet. It was built by people who know the lines.'
    vi: 'Tin vào bảng. Nó do những người biết các chuyền lập ra.'
    outcomes:
      - p: 0.7
        en: 'Your first plan looks perfect on paper. Kiet reads it, says nothing, and pins a corrected version beside it.'
        vi: 'Kế hoạch đầu tiên của anh/chị trông hoàn hảo trên giấy. Anh Kiệt đọc, không nói gì và ghim một bản đã sửa bên cạnh.'
        effects: [rel kiet trust -3, stress +1]
      - p: 0.3
        ok: false
        en: 'The plan puts 40 minutes on a changeover that takes 75. Line 2 runs an hour late every day for a week, and Lan asks whose numbers those were.'
        vi: 'Kế hoạch ghi 40 phút cho lần đổi khuôn mất 75. Chuyền 2 trễ một giờ mỗi ngày cả tuần, và chị Lan hỏi con số đó của ai.'
        effects: [rel kiet trust -6, rel lan trust -4, rep.boss -2, stress +3]
---
scene: prod.midyear_review
place: meeting_room
tags: [people, review, beat]
beat: 24-28
lines:
  - who: char:lan
    en: "Half a year. Your plans are more accurate than last year's planner's, and the crews trust them more. But I hear sales thinks you slow them down. How do you see that?"
    vi: 'Nửa năm rồi. Kế hoạch của em chính xác hơn người lập kế hoạch năm ngoái và các tổ tin chúng hơn. Nhưng chị nghe bên kinh doanh nghĩ em làm họ chậm. Em thấy thế nào?'
choices:
  - en: 'Show her the on-time numbers, and the cases where an honest date saved a worse delay.'
    vi: 'Cho chị xem số liệu giao đúng hạn và các trường hợp một ngày trung thực đã tránh được việc trễ tệ hơn.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.75
        en: "Lan goes through the cases. 'I will tell Bao to come to you before he promises a date. That is what you should be telling me.' You leave with a real rule."
        vi: "Chị Lan xem từng trường hợp. 'Chị sẽ bảo Bảo đến gặp em trước khi hứa ngày. Đó là điều em nên nói với chị.' Anh/chị ra về với một quy tắc thật."
        effects: [rel lan trust +4, rep.boss +2, stress -1]
      - p: 0.25
        ok: false
        en: 'Lan agrees with the numbers but says the company cannot win every argument with data. She asks you to be more commercial, and you are not sure what she means.'
        vi: 'Chị Lan đồng ý với số liệu nhưng nói công ty không thể thắng mọi tranh luận bằng dữ liệu. Chị nhờ em thương mại hơn và anh/chị không chắc chị muốn nói gì.'
        effects: [rel lan trust +1, stress +2]
  - en: 'Say you will try to give sales options, not just refusals, and ask her which orders matter most.'
    vi: 'Nói rằng anh/chị sẽ cố đưa cho bên kinh doanh phương án chứ không chỉ từ chối và hỏi chị đơn nào quan trọng nhất.'
    outcomes:
      - p: 1
        en: "Lan brightens: 'Yes. A planner who brings options is worth two who bring walls.' She gives you her own priority list."
        vi: "Chị Lan tươi lên: 'Đúng. Một người lập kế hoạch mang phương án đáng giá hơn hai người mang bức tường.' Chị đưa cho anh/chị danh sách ưu tiên của chính chị."
        effects: [rel lan trust +3, rep.boss +1]
  - en: 'Say sales asks for things that cannot be done, and the problem is theirs.'
    vi: 'Nói bên kinh doanh đòi những điều không làm được và vấn đề là của họ.'
    outcomes:
      - p: 0.5
        en: "Lan sighs, partly agreeing. 'It is true, but it is not a plan.' She marks you down for defensiveness."
        vi: "Chị Lan thở dài, đồng ý một phần. 'Đúng, nhưng đó không phải kế hoạch.' Chị ghi chú em còn phòng thủ."
        effects: [rel lan trust -2, rel bao trust -3, stress +1]
      - p: 0.5
        ok: false
        en: 'Bao has already spoken to Lan. She has his version, which has three examples of you saying no to a date you could have met.'
        vi: 'Anh Bảo đã nói chuyện với chị Lan. Chị có phiên bản của anh, với ba ví dụ anh/chị từ chối một ngày mà lẽ ra đáp ứng được.'
        effects: [rel lan trust -5, rel bao trust -5, rep.boss -3, stress +3]
---
scene: prod.big_breakdown_twist
place: factory_floor
tags: [pressure, breakdown, beat]
beat: 29-32
lines:
  - who: char:mai
    en: "Line 1's forming press has stopped. A hydraulic seal has gone, and the spare is in another city. It is at least four days, more if the courier is slow. You have a rush order of eight thousand units due next Friday."
    vi: 'Máy ép tạo hình chuyền 1 đã dừng. Một gioăng thủy lực hỏng, còn phụ tùng ở thành phố khác. Ít nhất bốn ngày, lâu hơn nếu chuyển phát chậm. Anh/chị có một đơn gấp tám nghìn chiếc giao thứ Sáu tuần sau.'
  - who: char:bao
    en: 'Whatever it takes. Move it to another line, run the weekend, I do not care. The buyer has been promised.'
    vi: 'Bằng mọi giá. Chuyển sang chuyền khác, chạy cuối tuần, anh không quan tâm. Khách đã được hứa.'
choices:
  - en: 'Re-plan honestly: which part can move to line 3, which part cannot, and tell Bao and the buyer the real date today.'
    vi: 'Lập lại kế hoạch trung thực: phần nào chuyển sang chuyền 3 được, phần nào không, và báo anh Bảo cùng khách ngày thật ngay hôm nay.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: 'Half moves to line 3 on two shifts. The other half slips three days. Bao hates it, the buyer accepts it, and the crews can do what you planned.'
        vi: 'Một nửa chuyển sang chuyền 3, chạy hai ca. Nửa còn lại trễ ba ngày. Anh Bảo ghét điều đó, khách chấp nhận, và các tổ làm được điều anh/chị lên kế hoạch.'
        effects: [rel bao trust -4, rel kiet trust +4, rel lan trust +3, rep.buyer +1, stress +4]
      - p: 0.3
        ok: false
        en: 'The buyer refuses the delay and cancels the second half. Bao says so in front of Lan. You have an honest plan and a smaller order.'
        vi: 'Khách từ chối trễ và hủy nửa sau. Anh Bảo nói điều đó trước mặt chị Lan. Anh/chị có một kế hoạch trung thực và một đơn nhỏ hơn.'
        effects: [rel bao trust -6, rel kiet trust +3, rel lan trust +2, rep.buyer -3, stress +5]
  - en: 'Move what can move to line 3 on a legal double shift, and ask Bao to split the delivery with the buyer.'
    vi: 'Chuyển phần có thể sang chuyền 3 với hai ca trong giới hạn hợp pháp và nhờ anh Bảo chia đợt giao với khách.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'It is a workable middle. The buyer takes two deliveries. The crews are tired but within limits, and Bao is merely unhappy.'
        vi: 'Một giải pháp trung gian khả thi. Khách nhận hai đợt. Các tổ mệt nhưng trong giới hạn, và anh Bảo chỉ không vui.'
        effects: [rel bao trust -1, rel kiet trust +1, stress +3]
  - en: 'Tell Bao it will be fine, and work out the shifts afterwards, even if it means running the crews past what is allowed.'
    vi: 'Nói với anh Bảo là sẽ ổn, và tính ca sau, dù có nghĩa là bắt các tổ chạy quá mức cho phép.'
    outcomes:
      - p: 0.65
        en: 'Bao is delighted. The crews run nights and a Sunday and most of the order makes the date. Nobody records the overtime.'
        vi: 'Anh Bảo rất vui. Các tổ chạy ca đêm và một ngày Chủ nhật và phần lớn đơn kịp ngày. Không ai ghi lại giờ làm thêm.'
        effects:
          [rel bao trust +6, rel kiet trust -6, stress +2, fact exceeded_overtime_limit private]
      - p: 0.35
        ok: false
        en: 'On Saturday night a tired operator drops a die and nearly loses a hand. The line stops, and Kiet looks at the plan you posted.'
        vi: 'Tối thứ Bảy một công nhân mệt làm rơi khuôn và suýt mất bàn tay. Chuyền dừng, và anh Kiệt nhìn vào kế hoạch anh/chị đã dán.'
        effects:
          [
            rel bao trust +3,
            rel kiet trust -10,
            rel lan trust -6,
            rep.boss -4,
            stress +6,
            fact exceeded_overtime_limit witnessed,
          ]
---
scene: prod.sang_inspection
place: factory_floor
tags: [audit, safety, beat]
beat: 41-44
lines:
  - who: char:sang
    en: 'I am here for the annual inspection. I would like to see the presses, the guards, the overtime records and the maintenance log for the last six months. I start on the floor, not in the office.'
    vi: 'Tôi đến kiểm tra định kỳ hằng năm. Tôi muốn xem các máy ép, tấm chắn an toàn, hồ sơ giờ làm thêm và nhật ký bảo trì sáu tháng qua. Tôi bắt đầu từ xưởng, không phải văn phòng.'
  - who: char:lan
    en: 'Show him what he asks for. Do not guess. If you do not know, say you will find out.'
    vi: 'Cho ông ấy xem những gì ông ấy yêu cầu. Đừng đoán. Nếu không biết, hãy nói sẽ tìm hiểu.'
choices:
  - en: 'Walk him through the real floor and the real records, including the things you know are not ideal, and what you are doing about each.'
    vi: 'Dẫn ông ấy đi qua xưởng thật và hồ sơ thật, kể cả những điều anh/chị biết chưa lý tưởng, và những gì đang làm với từng điều.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Sang spends two hours on line 2 and writes four observations. None is serious. 'Records that match the floor. I wish that were less unusual.' Kiet shakes your hand afterwards."
        vi: "Ông Sáng dành hai giờ ở chuyền 2 và ghi bốn nhận xét. Không cái nào nghiêm trọng. 'Hồ sơ khớp với xưởng. Tôi ước điều đó bớt hiếm.' Sau đó anh Kiệt bắt tay anh/chị."
        effects: [rel sang trust +5, rel kiet trust +4, rel lan trust +3, rep.boss +3, stress +2]
  - en: 'Tidy the obvious problems honestly, answer his questions, and produce the records he asks for.'
    vi: 'Dọn các vấn đề rõ ràng một cách trung thực, trả lời câu hỏi và đưa các hồ sơ ông yêu cầu.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "A routine inspection. Sang notes two items, both already on Mai's list. You come out with nothing to hide and no credit either."
        vi: 'Một buổi kiểm tra thường lệ. Ông Sáng ghi hai mục, cả hai đã có trong danh sách của chị Mai. Anh/chị ra về không có gì phải giấu và cũng không được tiếng khen.'
        effects: [rel sang trust +1, rel lan trust +1]
  - en: 'Prepare a show: replace the guards that came off, clean the floor, and have the records look complete.'
    vi: 'Chuẩn bị một màn trình diễn: lắp lại các tấm chắn đã tháo, dọn xưởng và làm hồ sơ trông đầy đủ.'
    outcomes:
      - p: 0.45
        en: 'Sang sees a perfect floor. He looks at the new paint on the guard brackets. He asks how long ago they were installed, and accepts the answer.'
        vi: 'Ông Sáng thấy một xưởng hoàn hảo. Ông nhìn lớp sơn mới trên các giá đỡ tấm chắn. Ông hỏi chúng được lắp từ bao giờ, và chấp nhận câu trả lời.'
        effects:
          [rel sang trust -2, rel kiet trust -4, stress -1, fact staged_safety_inspection private]
      - p: 0.55
        ok: false
        en: 'A worker tells Sang, politely, that the guard on press 3 was put back this morning. Sang checks the maintenance log and the overtime sheet next.'
        vi: 'Một công nhân nói với ông Sáng, lịch sự, rằng tấm chắn máy ép 3 mới được lắp lại sáng nay. Tiếp theo ông Sáng kiểm tra nhật ký bảo trì và bảng giờ làm thêm.'
        effects:
          [
            rel sang trust -10,
            rel kiet trust -6,
            rel lan trust -6,
            rep.boss -6,
            stress +6,
            fact staged_safety_inspection public,
          ]
---
scene: prod.year_end_review
place: meeting_room
tags: [people, review, beat]
beat: 49-50
lines:
  - who: char:lan
    en: 'Annual review. Before I give you my view, tell me how you would rate your own year, and what you would plan differently.'
    vi: 'Đánh giá cuối năm. Trước khi chị cho ý kiến, em hãy tự chấm năm của mình và nói em sẽ lập kế hoạch khác đi điều gì.'
choices:
  - en: 'Give an honest account, including the plans that were too optimistic and the corners you saw being cut.'
    vi: 'Kể thật lòng, kể cả các kế hoạch quá lạc quan và những chỗ bị cắt xén mà anh/chị đã thấy.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "Lan is quiet for a long moment. She writes: 'Plans what can be done, not what is wanted.' It is the best thing you have read about yourself."
        vi: "Chị Lan im lặng một lúc lâu. Chị viết: 'Lập kế hoạch cho điều làm được, không phải điều được muốn.' Đó là lời hay nhất anh/chị từng đọc về mình."
        effects: [rel lan trust +5, rep.boss +4, stress -2]
  - en: 'Stay modest: list the wins and one thing to improve.'
    vi: 'Khiêm tốn: nêu các thắng lợi và một điều cần cải thiện.'
    outcomes:
      - p: 1
        en: 'A safe review. Lan nods and moves to the next topic.'
        vi: 'Một buổi đánh giá an toàn. Chị Lan gật đầu và chuyển chủ đề.'
        effects: [rel lan trust +1, rep.boss +1]
  - en: 'Present the year as a success and leave out the nights and Sundays nobody recorded.'
    vi: 'Trình bày cả năm như một thành công và bỏ qua những ca đêm và Chủ nhật không ai ghi lại.'
    outcomes:
      - p: 0.65
        en: 'It lands well. You leave with a good rating and a small weight in your chest.'
        vi: 'Được đón nhận tốt. Anh/chị ra về với điểm cao và một chút nặng nề trong lòng.'
        effects: [rel lan trust +2, rep.boss +4, stress +1, fact polished_year_review private]
      - p: 0.35
        ok: false
        en: "Lan has Kiet's shift records open on her desk. She turns them towards you without a word."
        vi: 'Chị Lan có sẵn hồ sơ ca của anh Kiệt trên bàn. Chị xoay chúng về phía anh/chị mà không nói một lời.'
        effects:
          [
            rel lan trust -8,
            rel kiet trust -3,
            rep.boss -5,
            stress +4,
            fact polished_year_review witnessed,
          ]
---
scene: prod.manager_offer
place: meeting_room
tags: [people, promotion, beat]
beat: 51-52
when: [rel.lan.trust >= 25, rep.boss >= 58]
lines:
  - who: char:lan
    en: 'I am moving to plant director at the end of the year. The directors asked me who should run production. I named you. One condition: every week, someone will ask you to bend a limit, just this once. I need to know what you will say.'
    vi: 'Cuối năm chị lên giám đốc nhà máy. Ban giám đốc hỏi chị ai nên phụ trách sản xuất. Chị nêu tên em. Một điều kiện: mỗi tuần sẽ có người nhờ em nới một giới hạn, chỉ lần này thôi. Chị cần biết em sẽ nói gì.'
choices:
  - en: 'Accept, and say plainly which limits you will not bend, and that the directors must hear it from you first.'
    vi: 'Nhận lời và nói rõ những giới hạn anh/chị sẽ không nới và ban giám đốc phải nghe điều đó từ anh/chị trước.'
    outcomes:
      - p: 1
        en: "Lan smiles. 'Then it is yours. Write them on the wall of the planning office.' You take over the floor with the limits in writing."
        vi: "Chị Lan cười. 'Vậy là của em. Viết chúng lên tường phòng kế hoạch.' Anh/chị tiếp quản xưởng với các giới hạn đã viết ra giấy."
        effects: [rel lan trust +5, rep.boss +5, end promoted]
  - en: 'Thank her, but decline: you would rather plan than manage the pressure.'
    vi: 'Cảm ơn chị nhưng từ chối: anh/chị muốn lập kế hoạch hơn là quản lý áp lực.'
    outcomes:
      - p: 1
        en: "Lan looks disappointed, then understanding. 'The next manager may not be as careful as you.'"
        vi: "Chị Lan có vẻ thất vọng rồi thông cảm. 'Người quản lý tiếp theo có thể không cẩn thận như em.'"
        effects: [rel lan trust +2, stress -3]
  - en: 'Accept without asking what the condition means in practice.'
    vi: 'Nhận lời mà không hỏi điều kiện đó thực tế nghĩa là gì.'
    outcomes:
      - p: 1
        en: 'Lan nods slowly and the directors congratulate you a little too warmly. You realise you agreed to something you did not ask about.'
        vi: 'Chị Lan gật đầu chậm và ban giám đốc chúc mừng anh/chị hơi quá nồng nhiệt. Anh/chị nhận ra mình đã đồng ý với điều mình không hỏi.'
