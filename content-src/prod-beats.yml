fact: exceeded_overtime_limit
severity: 6
category: integrity
en: 'you ran crews beyond the overtime limit and did not record it'
vi: 'bạn bắt các tổ làm thêm vượt giới hạn và không ghi lại'
lesson:
  en: 'An overtime limit exists because tired people make mistakes with machines. Running past it, and leaving it off the record, hides the risk from everyone who could have stopped it.'
  vi: 'Giới hạn làm thêm giờ tồn tại vì người mệt sẽ sai sót với máy móc. Chạy quá giới hạn và không ghi lại là giấu rủi ro khỏi tất cả những người có thể ngăn nó.'
