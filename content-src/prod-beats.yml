fact: staged_safety_inspection
severity: 6
category: integrity
en: 'you staged the floor for a safety inspection'
vi: 'bạn dàn dựng xưởng cho đợt thanh tra an toàn'
lesson:
  en: 'An inspection tests how the floor really is. A staged floor tells the inspector nothing and tells the workers that safety is for show.'
  vi: 'Thanh tra kiểm tra xưởng thực sự như thế nào. Một xưởng được dàn dựng không nói gì với thanh tra và nói với công nhân rằng an toàn chỉ để trình diễn.'
