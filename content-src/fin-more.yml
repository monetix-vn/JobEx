scene: fin.dso_pressure
place: meeting_room
tags: [receivables, pressure, dark]
weight: 1.5
cooldown: 26
when: [turn >= 26, turn <= 46]
lines:
  - who: char:duc
    en: 'The bank wants DSO below 55 days. We are at 63. Bao says the customers will pay, but not this quarter. I need you to think about what can reasonably be done with the receivables.'
    vi: 'Ngân hàng muốn DSO dưới 55 ngày. Mình đang ở 63. Anh Bảo nói khách sẽ trả, nhưng không phải quý này. Anh cần em nghĩ xem có thể làm gì hợp lý với các khoản phải thu.'
choices:
  - en: 'Propose real actions: earlier invoicing, a collections push on the five largest balances, and an honest forecast.'
    vi: 'Đề xuất hành động thật: xuất hóa đơn sớm hơn, chiến dịch thu nợ năm khoản lớn nhất và một dự báo trung thực.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: 'DSO falls to 58 over the quarter: not enough for the bank, but real. Duc presents it with a plan. The bank extends the deadline.'
        vi: 'DSO giảm xuống 58 trong quý: chưa đủ cho ngân hàng, nhưng là thật. Anh Đức trình bày kèm kế hoạch. Ngân hàng gia hạn thời hạn.'
        effects: [rel duc trust +3, rel hanh trust +3, rep.boss +3, stress +3]
      - p: 0.3
        ok: false
        en: 'The collections push brings in less than hoped, and DSO stays at 61. You give Duc the facts. He says it is not what he wanted to hear.'
        vi: 'Chiến dịch thu nợ thu về ít hơn mong đợi, và DSO ở mức 61. Anh/chị đưa sự thật cho anh Đức. Anh nói không phải điều anh muốn nghe.'
        effects: [rel duc trust -2, rel hanh trust +3, stress +4]
  - en: 'Offer a small early-payment discount to a few customers, approved by Duc, to pull cash in.'
    vi: 'Đề nghị chiết khấu thanh toán sớm nhỏ cho vài khách, do anh Đức duyệt, để kéo tiền về.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'Three customers take it. Cash improves, margin falls slightly, and the approval is on file. A legitimate trade-off, openly made.'
        vi: 'Ba khách nhận lời. Tiền mặt tốt lên, biên giảm nhẹ, và phê duyệt đã lưu. Một đánh đổi hợp lệ, được thực hiện công khai.'
        effects: [rel duc trust +2, rel hanh trust +1, stress +2]
  - en: "Reclassify the slowest balances as 'other receivables' so they fall out of the DSO calculation."
    vi: "Phân loại lại các khoản chậm nhất thành 'phải thu khác' để chúng rơi khỏi phép tính DSO."
    outcomes:
      - p: 0.7
        en: 'DSO drops to 52. Duc says it is excellent work. The balances are still owed, and still late, and now harder to see.'
        vi: 'DSO giảm xuống 52. Anh Đức nói công việc xuất sắc. Các khoản vẫn còn nợ, vẫn trễ, và giờ khó thấy hơn.'
        effects: [rel duc trust +6, stress -1, fact hid_overdue_balance private]
      - p: 0.3
        ok: false
        en: 'The auditor compares the DSO to the ageing report and the receivables note. The numbers do not reconcile.'
        vi: 'Kiểm toán viên so DSO với báo cáo tuổi nợ và thuyết minh phải thu. Các con số không khớp.'
        effects:
          [
            rel duc trust +3,
            rel vy trust -8,
            rel hanh trust -6,
            rep.boss -5,
            stress +5,
            fact hid_overdue_balance public,
          ]
---
scene: fin.year_end_close
place: finance_office
tags: [close, pressure, dark]
weight: 4
cooldown: 40
terms: [cutoff]
when: [close.open = 1, month in 12, turn >= 44]
lines:
  - who: char:bao
    en: 'It is the last week of the year. I am 400 million short of the annual target, and I have two shipments that leave on the second of January. Book them this year. It is the same goods, just a few days.'
    vi: 'Đây là tuần cuối năm. Anh thiếu 400 triệu so với chỉ tiêu cả năm, và có hai lô hàng rời kho ngày mùng hai tháng Giêng. Anh/chị ghi vào năm nay. Cùng một lô hàng, chỉ chênh vài ngày.'
  - who: char:hanh
    en: 'This will be audited. It is your call, and I will support what you decide. But decide knowing that.'
    vi: 'Cái này sẽ bị kiểm toán. Em quyết, và chị sẽ ủng hộ quyết định của em. Nhưng hãy quyết với hiểu biết đó.'
choices:
  - en: 'Refuse: they belong to next year, and say so clearly to Bao and to Duc in writing.'
    vi: 'Từ chối: chúng thuộc năm sau, và nói rõ với anh Bảo và anh Đức bằng văn bản.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.85
        en: "Bao is angry and the year ends below target. Hanh nods once. In January, the auditor's note says: 'Cut-off at year end was properly applied.'"
        vi: "Anh Bảo giận và năm kết thúc dưới chỉ tiêu. Chị Hạnh gật đầu một lần. Tháng Giêng, ghi chú của kiểm toán viết: 'Cắt kỳ cuối năm được áp dụng đúng.'"
        effects: [rel bao trust -8, rel hanh trust +5, rel vy trust +3, rep.boss +3, stress +4]
      - p: 0.15
        ok: false
        en: 'Duc overrules you and asks someone else to book it. You have a written record, and not much else.'
        vi: 'Anh Đức gạt quyết định của anh/chị và nhờ người khác ghi. Anh/chị có bản ghi bằng văn bản, và không nhiều hơn thế.'
        effects: [rel bao trust -6, rel duc trust -6, rel hanh trust +4, stress +6]
  - en: 'Offer to book what has actually shipped by the 31st, and help Bao find more that can legitimately go out.'
    vi: 'Đề nghị ghi phần thực sự đã xuất đến ngày 31 và giúp anh Bảo tìm thêm phần có thể xuất hợp lệ.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'Bao finds one shipment that can leave on the 30th. It is not everything. It is honest, and he owes you one.'
        vi: 'Anh Bảo tìm được một lô có thể xuất ngày 30. Không phải tất cả. Trung thực, và anh ấy nợ anh/chị một lần.'
        effects: [rel bao trust +1, rel bao owed +1, rel hanh trust +2, stress +2]
  - en: 'Book both shipments in December.'
    vi: 'Ghi cả hai lô vào tháng Mười Hai.'
    outcomes:
      - p: 0.6
        en: 'The year closes at target. Bao embraces you. The entries carry December dates and January dispatch logs.'
        vi: 'Năm khép lại đúng chỉ tiêu. Anh Bảo ôm anh/chị. Các bút toán mang ngày tháng Mười Hai và nhật ký xuất hàng tháng Giêng.'
        effects:
          [
            rel bao trust +8,
            rel bao owed +3,
            rel duc trust +3,
            rep.boss +3,
            stress -1,
            fact booked_revenue_early private,
          ]
      - p: 0.4
        ok: false
        en: "The auditor's year-end cut-off test picks both shipments. The dispatch logs are dated the second of January. The error is material."
        vi: 'Kiểm tra cắt kỳ cuối năm của kiểm toán chọn đúng cả hai lô. Nhật ký xuất hàng ghi ngày mùng hai tháng Giêng. Sai lệch là trọng yếu.'
        effects:
          [
            rel bao trust +4,
            rel hanh trust -10,
            rel vy trust -10,
            rep.boss -8,
            stress +7,
            fact booked_revenue_early public,
          ]
---
fact: skipped_cutoff_check
severity: 3
category: integrity
en: 'you skipped checking the cut-off before the auditor did'
vi: 'bạn bỏ qua việc kiểm tra cắt kỳ trước khi kiểm toán viên làm'
lesson:
  en: 'Letting the auditor find your errors is a choice to be caught rather than to fix. A self-check costs an afternoon and changes how everything else is read.'
  vi: 'Để kiểm toán viên tìm ra lỗi của bạn là chọn bị bắt thay vì sửa. Tự kiểm tra tốn một buổi chiều và thay đổi cách mọi thứ khác được đọc.'
traces:
  - { type: record, visibility: 0.5, detectors: [internal_audit, finance] }
witnessed:
  boss: -3
  finance: -3
public:
  boss: -6
