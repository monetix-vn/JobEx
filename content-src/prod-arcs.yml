scene: prod.phuc_incident
weight: 0
place: meeting_room
tags: [people, safety, dark, consequence, arc]
lines:
  - who: char:lan
    en: 'Phuc has hurt his hand on the press. It is not serious, but it is reportable. The report goes to the safety office and the insurer. You wrote the night plan. I need you to write the account, and I will sign it.'
    vi: 'Phúc bị thương tay ở máy ép. Không nghiêm trọng, nhưng phải báo cáo. Báo cáo gửi phòng an toàn và công ty bảo hiểm. Em lập kế hoạch ca đêm. Chị cần em viết tường trình và chị sẽ ký.'
choices:
  - en: 'Write the account as it was: the plan, the short staffing, who was supervising and what you asked for.'
    vi: 'Viết tường trình đúng như đã xảy ra: kế hoạch, việc thiếu người, ai giám sát và điều anh/chị đã yêu cầu.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Lan reads it twice and signs it without changing a word. Phuc is paid in full during recovery, and the night plan rule is rewritten. You get a formal warning, and keep Kiet's trust."
        vi: 'Chị Lan đọc hai lần và ký không đổi một chữ. Phúc được trả đủ lương trong lúc hồi phục và quy tắc kế hoạch ca đêm được viết lại. Anh/chị nhận cảnh cáo chính thức và giữ được lòng tin của anh Kiệt.'
        effects:
          [
            rel lan trust +1,
            rel kiet trust +6,
            rel phuc trust +8,
            rel phuc loyalty +6,
            rep.boss -3,
            stress +5,
            fact accurate_incident_report witnessed,
            arc phuc end,
          ]
  - en: 'Write a short, factual account that leaves out who decided the night staffing.'
    vi: 'Viết tường trình ngắn, đúng sự kiện nhưng bỏ qua ai quyết định nhân sự ca đêm.'
    outcomes:
      - p: 1
        en: 'Lan signs it. The account is accurate and incomplete. The insurer asks no questions. Phuc reads it and says only that it is fine.'
        vi: 'Chị Lan ký. Tường trình chính xác nhưng không đầy đủ. Công ty bảo hiểm không hỏi gì. Phúc đọc và chỉ nói là ổn.'
        effects: [rel lan trust +0, rel phuc trust -3, rel kiet trust -3, stress +3, arc phuc end]
  - en: 'Write that Phuc operated the press without authorisation, against instructions.'
    vi: 'Viết rằng Phúc vận hành máy ép khi chưa được phép, trái chỉ dẫn.'
    outcomes:
      - p: 0.5
        en: 'Lan signs it without looking closely. Phuc is placed on a formal warning, loses the night premium and does not look at you again.'
        vi: 'Chị Lan ký mà không đọc kỹ. Phúc bị cảnh cáo chính thức, mất phụ cấp ca đêm và không nhìn anh/chị nữa.'
        effects:
          [
            rel phuc trust -20,
            rel phuc loyalty -15,
            rel kiet trust -10,
            stress +4,
            fact blamed_operator private,
            fact edited_incident_report private,
            arc phuc end,
          ]
      - p: 0.5
        ok: false
        en: 'Kiet hands Lan the night plan with your initials on it, and the shift roster showing Phuc was assigned. The report and the documents disagree.'
        vi: 'Anh Kiệt đưa chị Lan kế hoạch ca đêm có chữ viết tắt của anh/chị và bảng phân ca cho thấy Phúc được phân công. Báo cáo và tài liệu không khớp nhau.'
        effects:
          [
            rel phuc trust -20,
            rel kiet trust -14,
            rel lan trust -12,
            rep.boss -12,
            stress +9,
            fact blamed_operator public,
            fact edited_incident_report public,
            arc phuc end,
          ]
