scene: prod.breakdown
weight: 0
place: factory_floor
tags: [maintenance, pressure, consequence, arc]
lines:
  - who: char:mai
    en: 'The annealing oven on line 1 has failed in the middle of the peak. Three days to repair, at best. The logbook shows it was due for service eleven weeks ago, and what was said about it.'
    vi: 'Lò ủ chuyền 1 hỏng giữa đợt cao điểm. Ba ngày sửa, tốt nhất. Sổ ghi cho thấy nó đến hạn bảo dưỡng từ mười một tuần trước và điều đã được nói về nó.'
  - who: char:lan
    en: 'I need to know, for the directors, how this happened. Tell me what I should say.'
    vi: 'Chị cần biết, để trình ban giám đốc, việc này xảy ra thế nào. Em nói chị nghe chị nên nói gì.'
choices:
  - en: "Give Lan the whole sequence: Mai's requests, the deferrals, and your part in them, and propose a recovery plan."
    vi: 'Nói với chị Lan toàn bộ chuỗi sự việc: các đề nghị của chị Mai, các lần hoãn và phần của anh/chị trong đó, và đề xuất kế hoạch phục hồi.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Lan listens and writes it down. To the directors she says: 'We deferred it, we knew the risk, and here is the fix.' It is an uncomfortable meeting, and you keep your credibility."
        vi: "Chị Lan lắng nghe và ghi lại. Với ban giám đốc chị nói: 'Mình đã hoãn, mình biết rủi ro và đây là cách sửa.' Một cuộc họp khó chịu, và anh/chị giữ được uy tín."
        effects:
          [
            rel lan trust +2,
            rel mai trust +5,
            rel kiet trust +2,
            rep.boss -2,
            stress +5,
            fact owned_deferral witnessed,
            arc deferred_maintenance end,
          ]
  - en: 'Say the decision was made jointly, by planning, production and maintenance, in the peak.'
    vi: 'Nói quyết định là chung, của kế hoạch, sản xuất và bảo trì, trong đợt cao điểm.'
    outcomes:
      - p: 1
        en: 'It is roughly true and shares the damage around. Mai reads the minutes and is silent. The directors accept it and ask for a process change.'
        vi: 'Gần đúng sự thật và chia nhỏ thiệt hại. Chị Mai đọc biên bản và im lặng. Ban giám đốc chấp nhận và yêu cầu đổi quy trình.'
        effects:
          [rel lan trust +1, rel mai trust -4, rep.boss -2, stress +4, arc deferred_maintenance end]
  - en: 'Say maintenance never flagged it as urgent, and suggest that the maintenance log is unreliable.'
    vi: 'Nói bảo trì không bao giờ báo khẩn cấp và gợi ý rằng nhật ký bảo trì không đáng tin.'
    outcomes:
      - p: 0.4
        en: 'The directors turn on maintenance. Mai is placed under review. She looks at you across the canteen and says nothing.'
        vi: 'Ban giám đốc quay sang bảo trì. Chị Mai bị đưa vào diện xem xét. Chị nhìn anh/chị qua căng tin và không nói gì.'
        effects:
          [
            rel mai trust -20,
            rel mai loyalty -15,
            rel kiet trust -6,
            stress +3,
            fact blamed_maintenance private,
            arc deferred_maintenance end,
          ]
      - p: 0.6
        ok: false
        en: 'Mai produces her logbook: each request, each date, each reply, including yours. The logbook is stamped by the safety officer every month.'
        vi: 'Chị Mai đưa sổ của chị ra: từng đề nghị, từng ngày, từng câu trả lời, kể cả của anh/chị. Sổ được cán bộ an toàn đóng dấu mỗi tháng.'
        effects:
          [
            rel mai trust -20,
            rel lan trust -10,
            rel kiet trust -6,
            rep.boss -9,
            stress +8,
            fact blamed_maintenance public,
            arc deferred_maintenance end,
          ]
