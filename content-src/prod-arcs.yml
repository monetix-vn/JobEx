arc: materials
title:
  en: 'The late steel'
  vi: 'Thép về trễ'
stages:
  - { id: late, event: prod.material_late }
  - { id: cover, event: prod.stockout_cover, delay: 1-2 }
---
scene: prod.material_late
arc: materials
place: sales_office
tags: [materials, pressure]
weight: 2
cooldown: 26
when: [turn >= 12, turn <= 44]
lines:
  - who: char:tam
    en: 'I have bad news about the steel for next week. The supplier is three days late. It is not my fault, it is the port. You will have to shuffle the schedule, and I would rather you did not mention it to Bao.'
    vi: 'Anh có tin xấu về thép tuần sau. Nhà cung cấp trễ ba ngày. Không phải lỗi của anh, là do cảng. Em sẽ phải xếp lại lịch và anh mong em đừng nhắc với anh Bảo.'
choices:
  - en: 'Re-plan openly: move orders around the gap, tell Lan and Bao the new dates, and log the reason.'
    vi: 'Lập lại công khai: xếp lại các đơn quanh khoảng trống, báo chị Lan và anh Bảo ngày mới và ghi lý do.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: 'Two orders move, and one is delayed by two days. Bao is irritated. Tam is embarrassed. The plan works, and everyone can see why it changed.'
        vi: 'Hai đơn được dời và một đơn trễ hai ngày. Anh Bảo bực. Anh Tâm xấu hổ. Kế hoạch chạy được, và mọi người thấy vì sao nó thay đổi.'
        effects:
          [rel lan trust +3, rel bao trust -2, rel tam trust -3, stress +2, arc materials end]
      - p: 0.2
        ok: false
        en: "The steel is five days late, not three. You re-plan twice. Bao says 'I thought planning could handle this.'"
        vi: "Thép trễ năm ngày chứ không phải ba. Anh/chị lập lại hai lần. Anh Bảo nói 'Anh tưởng kế hoạch xử lý được chuyện này.'"
        effects:
          [rel lan trust +2, rel bao trust -5, rel tam trust -2, stress +4, arc materials end]
  - en: 'Run the orders that can run with what is on hand, and tell sales only that one order will be late.'
    vi: 'Chạy các đơn chạy được với hàng hiện có và chỉ nói với kinh doanh rằng có một đơn sẽ trễ.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'It is accurate: one order is late. The fuller story, about the steel, is still in your notes. Tam thanks you quietly.'
        vi: 'Chính xác: có một đơn trễ. Câu chuyện đầy đủ hơn, về thép, vẫn nằm trong ghi chú của anh/chị. Anh Tâm cảm ơn khẽ.'
        effects: [rel tam trust +2, rel bao trust -1, stress +2, arc materials cover]
  - en: 'Tell nobody. Re-plan quietly and hope the steel arrives in time.'
    vi: 'Không nói ai. Lặng lẽ lập lại kế hoạch và hy vọng thép về kịp.'
    outcomes:
      - p: 0.6
        en: 'The steel arrives on the fourth day. You lose a day of output and nobody notices. Tam owes you one.'
        vi: 'Thép về vào ngày thứ tư. Anh/chị mất một ngày sản lượng và không ai để ý. Anh Tâm nợ anh/chị một lần.'
        effects: [rel tam trust +5, rel tam owed +1, stress +1, arc materials cover]
      - p: 0.4
        ok: false
        en: 'The steel is late by a week. By the time you say so, sales has promised the delivery to the buyer twice.'
        vi: 'Thép trễ một tuần. Khi anh/chị nói ra thì bên kinh doanh đã hứa giao với khách hai lần.'
        effects:
          [
            rel tam trust +2,
            rel bao trust -8,
            rel lan trust -4,
            rep.boss -4,
            stress +5,
            arc materials cover,
          ]
---
scene: prod.stockout_cover
weight: 0
place: sales_office
tags: [materials, pressure, dark, arc]
lines:
  - who: char:bao
    en: 'Mr Anders wants to know whether his order will ship on the date I gave him. The lines say it cannot because of the steel, and I am hearing it for the first time in a corridor. Tell me it is fine.'
    vi: 'Ông Anders muốn biết đơn của ông có giao đúng ngày anh đã nói không. Các chuyền nói không được vì thép, và anh nghe điều đó lần đầu ở hành lang. Em nói là ổn đi.'
choices:
  - en: 'Tell him the truth, with a plan: the real new date, and what you can do to shorten it.'
    vi: 'Nói thật với anh ấy kèm kế hoạch: ngày mới thật và điều anh/chị có thể làm để rút ngắn.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Bao swears, then calls Anders. Anders says: 'Better to hear it now.' The new date holds. Bao thanks you, in his own way, three weeks later."
        vi: "Anh Bảo chửi rồi gọi ông Anders. Ông Anders nói: 'Nghe bây giờ còn hơn.' Ngày mới được giữ. Anh Bảo cảm ơn anh/chị theo cách của mình, ba tuần sau."
        effects: [rel bao trust -1, rel tam trust -2, rep.buyer +2, stress +3, arc materials end]
  - en: 'Say there is a risk, and that you will confirm by Friday after you check with Tam.'
    vi: 'Nói có rủi ro và anh/chị sẽ xác nhận trước thứ Sáu sau khi hỏi anh Tâm.'
    outcomes:
      - p: 1
        en: 'Bao accepts, anxiously. The truth arrives on Friday and is no better. But no one can say you hid it.'
        vi: 'Anh Bảo chấp nhận, lo lắng. Sự thật đến vào thứ Sáu và không khá hơn. Nhưng không ai nói được anh/chị đã giấu.'
        effects: [rel bao trust +0, stress +2, arc materials end]
  - en: 'Say it is fine. Sort out the steel afterwards.'
    vi: 'Nói là ổn. Xử lý thép sau.'
    outcomes:
      - p: 0.6
        en: 'Bao relays it to Anders. The steel arrives a day before the date, and you manage to squeeze the order in. You were lucky.'
        vi: 'Anh Bảo chuyển lời cho ông Anders. Thép về trước ngày một hôm và anh/chị xoay xở nhét được đơn vào. Anh/chị may mắn.'
        effects: [rel bao trust +5, stress +2, fact hid_stockout private, arc materials end]
      - p: 0.4
        ok: false
        en: 'The steel does not arrive. The order ships a week late. Anders asks Bao who told him it was fine. Bao tells him.'
        vi: 'Thép không về. Đơn giao trễ một tuần. Ông Anders hỏi anh Bảo ai bảo ông là ổn. Anh Bảo nói.'
        effects:
          [
