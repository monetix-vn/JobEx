category: integrity
en: 'you planned shifts that the lines and the crews could not deliver'
vi: 'bạn lập ca mà các chuyền và các tổ không thể đáp ứng'
lesson:
  en: 'A plan that needs more capacity than exists is a promise in a spreadsheet. It becomes overtime, skipped steps or shortcuts, and the planner wrote it.'
  vi: 'Kế hoạch cần nhiều công suất hơn hiện có là lời hứa trong bảng tính. Nó thành giờ làm thêm, bước bị bỏ hay lối tắt, và người lập kế hoạch đã viết ra nó.'
