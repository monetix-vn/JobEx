arc: phuc
title:
  en: 'Phuc'
  vi: 'Phúc'
stages:
  - { id: training, event: prod.phuc_training }
  - { id: alone, event: prod.phuc_unsupervised, delay: 8-14 }
  - { id: incident, event: prod.phuc_incident, delay: 1-3 }
---
scene: prod.phuc_training
arc: phuc
place: factory_floor
tags: [people, safety, onboarding]
weight: 2
cooldown: 52
when: [turn >= 3, turn <= 18]
lines:
  - who: char:phuc
    en: 'I am supposed to run the press by myself from next week. I have only watched it for three days. I do not like to ask, but can I have a proper training session? I want to do it right.'
    vi: 'Em phải tự vận hành máy ép từ tuần sau. Em mới xem ba ngày. Em không thích hỏi, nhưng em có thể được huấn luyện đàng hoàng không? Em muốn làm cho đúng.'
choices:
  - en: 'Schedule a full training with Kiet and the safety sheet, and do not put Phuc on the press alone until he is signed off.'
    vi: 'Xếp một buổi huấn luyện đầy đủ với anh Kiệt và phiếu an toàn và không cho Phúc đứng máy một mình đến khi được ký duyệt.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Two days of training, and a sign-off sheet. Phuc is proud of his card. Kiet adds a line to his own notebook: 'Planner keeps to sign-off.'"
        vi: "Hai ngày huấn luyện và một phiếu ký duyệt. Phúc tự hào về tấm thẻ của mình. Anh Kiệt ghi thêm một dòng vào sổ của anh: 'Người lập kế hoạch giữ đúng ký duyệt.'"
        effects:
          [rel phuc trust +7, rel phuc loyalty +5, rel kiet trust +4, stress +2, arc phuc alone]
  - en: 'Pair him with an experienced operator for two weeks and check in on him.'
    vi: 'Ghép em với một công nhân có kinh nghiệm hai tuần và hỏi thăm em.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'It helps. Phuc learns the rhythm of the press. There is no sign-off sheet, but there is a person who will speak up if something is wrong.'
        vi: 'Có ích. Phúc học nhịp của máy ép. Không có phiếu ký duyệt, nhưng có một người sẽ lên tiếng nếu có gì sai.'
        effects: [rel phuc trust +3, rel kiet trust +1, arc phuc alone]
  - en: 'Tell him he will pick it up as he goes, the press is simple.'
    vi: 'Bảo em cứ vừa làm vừa học, máy ép đơn giản thôi.'
    outcomes:
      - p: 1
        en: 'Phuc nods. He does not ask again. He will learn it, one way or another, on the job.'
        vi: 'Phúc gật đầu. Em không hỏi lại. Em sẽ học, bằng cách này hay cách khác, khi làm việc.'
        effects: [rel phuc trust -4, arc phuc alone]
---
scene: prod.phuc_unsupervised
weight: 0
place: factory_floor
tags: [people, safety, dark, arc]
lines:
  - who: char:kiet
    en: 'We are two short on line 2 this week, with one sick and one at a funeral. The only way the plan works is if Phuc runs the press alone on the night shift. He has done it twice with someone nearby. With respect: should he?'
    vi: 'Tuần này chuyền 2 thiếu hai người, một người ốm và một người đi đám tang. Cách duy nhất để kế hoạch chạy là Phúc vận hành máy ép một mình ca đêm. Em ấy đã làm hai lần với người đứng gần. Xin phép hỏi: có nên không?'
choices:
  - en: 'No: keep Phuc on supervised work, re-plan the night shift around what the crew can safely do, and tell Bao the date slips.'
    vi: 'Không: giữ Phúc làm việc có người giám sát, lập lại ca đêm theo điều tổ làm được an toàn và báo anh Bảo ngày bị trễ.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.85
        en: 'The night shift runs at seventy percent. Bao shouts. Kiet says nothing, but the next morning he brings you a coffee.'
        vi: 'Ca đêm chạy ở bảy mươi phần trăm. Anh Bảo quát. Anh Kiệt không nói gì, nhưng sáng hôm sau anh mang cho anh/chị một ly cà phê.'
        effects: [rel kiet trust +6, rel phuc trust +4, rel bao trust -4, stress +3, arc phuc end]
      - p: 0.15
        ok: false
        en: 'No replacement can be found and the night shift is cancelled. You lose a day, and Bao makes sure Lan knows it was your choice.'
        vi: 'Không tìm được người thay và ca đêm bị hủy. Anh/chị mất một ngày, và anh Bảo bảo đảm chị Lan biết đó là lựa chọn của anh/chị.'
        effects:
          [
            rel kiet trust +4,
            rel phuc trust +3,
            rel bao trust -6,
            rel lan trust -2,
            stress +4,
            arc phuc end,
          ]
  - en: 'Put Phuc on the press with Kiet checking on him every half hour, and log it as supervised work.'
    vi: 'Cho Phúc đứng máy ép và anh Kiệt kiểm tra mỗi nửa giờ, và ghi đó là công việc có giám sát.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'It is thin, but Kiet can do it. The night shift runs. Phuc is nervous, and careful. Nothing goes wrong, and you do not relax.'
        vi: 'Mỏng, nhưng anh Kiệt làm được. Ca đêm chạy. Phúc lo lắng và cẩn thận. Không có gì sai, và anh/chị không yên tâm.'
        effects: [rel kiet trust +1, rel phuc trust +1, stress +3, arc phuc incident]
  - en: 'Yes: put Phuc on the press alone, it is only one night.'
    vi: 'Có: cho Phúc đứng máy ép một mình, chỉ một đêm thôi.'
    outcomes:
      - p: 0.65
        en: 'The night shift runs at full speed. Phuc is exhausted and proud. You do not ask how it went.'
        vi: 'Ca đêm chạy hết tốc độ. Phúc kiệt sức và tự hào. Anh/chị không hỏi nó diễn ra thế nào.'
        effects:
          [
            rel kiet trust -6,
            rel phuc trust +2,
            rel bao trust +3,
            stress -1,
            fact assigned_untrained_operator private,
            arc phuc incident,
          ]
      - p: 0.35
        ok: false
        en: "At 2 a.m. the press cycles with Phuc's hand too close. He pulls back, but the tip of a finger is caught. The night supervisor calls you at home."
        vi: 'Lúc 2 giờ sáng máy ép chạy khi tay Phúc quá gần. Em rút lại nhưng đầu ngón tay bị kẹt. Giám sát ca đêm gọi anh/chị ở nhà.'
        effects:
          [
            rel kiet trust -10,
            rel phuc trust -6,
            rel lan trust -6,
            rep.boss -6,
            stress +8,
            fact assigned_untrained_operator witnessed,
            arc phuc incident,
          ]
