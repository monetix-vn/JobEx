# Production Planner storylines (docs/story/production.md): The Promise, The Deferred Maintenance, Phuc, Materials.
arc: the_promise
title:
  en: 'The promise'
  vi: 'Lời hứa'
stages:
  - { id: request, event: prod.impossible_date }
  - { id: shifts, event: prod.extra_shifts, delay: 1-2 }
  - { id: guard, event: prod.guard_off_today, delay: 1-2 }
  - { id: nearmiss, event: prod.near_miss, delay: 1-2 }
---
scene: prod.impossible_date
arc: the_promise
place: meeting_room
tags: [pressure, sales, dark]
weight: 3
cooldown: 30
when: [turn >= 10, turn <= 40]
lines:
  - who: char:bao
    en: 'I have promised Mr Anders fifteen thousand units in three weeks. I know, I know. The buyer needs them for a promotion and I could not say no. Tell me it is possible.'
    vi: 'Anh đã hứa với ông Anders mười lăm nghìn chiếc trong ba tuần. Anh biết, anh biết. Khách cần cho đợt khuyến mãi và anh không nói không được. Em nói là làm được đi.'
  - who: char:lan
    en: 'It is your plan. I will back what is honest. Tell us what the lines can really do.'
    vi: 'Đó là kế hoạch của em. Chị sẽ ủng hộ điều trung thực. Nói cho mọi người biết các chuyền thực sự làm được gì.'
choices:
  - en: 'Show the real capacity: eleven thousand in three weeks without breaking any limit, fifteen in five. Offer a split delivery.'
    vi: 'Cho xem công suất thật: mười một nghìn trong ba tuần mà không phá giới hạn nào, mười lăm nghìn trong năm tuần. Đề xuất giao chia đợt.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: 'Bao groans and calls Anders. Anders accepts two deliveries. You have a plan that is possible, and a salesman who owes you an apology.'
        vi: 'Anh Bảo rên rỉ và gọi ông Anders. Ông Anders chấp nhận hai đợt giao. Anh/chị có một kế hoạch khả thi và một nhân viên kinh doanh nợ anh/chị một lời xin lỗi.'
        effects:
          [rel bao trust -3, rel lan trust +4, rel kiet trust +3, stress +3, arc the_promise end]
      - p: 0.3
        ok: false
        en: 'Anders will not split the order and gives the second half to a rival. You are right, and poorer for it.'
        vi: 'Ông Anders không chia đơn và giao nửa sau cho đối thủ. Anh/chị đúng, và nghèo đi vì điều đó.'
        effects:
          [
            rel bao trust -6,
            rel lan trust +3,
            rel kiet trust +3,
            rep.buyer -2,
            stress +4,
            arc the_promise end,
          ]
  - en: 'Offer thirteen thousand by adding a legal third shift on line 3, and ask Bao to negotiate the last two thousand.'
    vi: 'Đề xuất mười ba nghìn bằng cách thêm ca ba hợp pháp trên chuyền 3 và nhờ anh Bảo thương lượng hai nghìn cuối.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'It is a stretch within limits. Kiet agrees to try it for two weeks. Bao negotiates a one-week extension on the rest.'
        vi: 'Một nỗ lực trong giới hạn. Anh Kiệt đồng ý thử hai tuần. Anh Bảo thương lượng gia hạn một tuần cho phần còn lại.'
        effects:
          [rel bao trust +1, rel kiet trust +1, rel lan trust +1, stress +4, arc the_promise shifts]
  - en: 'Say it is possible, and work out how afterwards.'
    vi: 'Nói là làm được và tính cách làm sau.'
    outcomes:
      - p: 0.85
        en: 'Bao kisses the air. The plan on your desk needs eighteen percent more capacity than exists. You add optimistic times and close the spreadsheet.'
        vi: 'Anh Bảo hôn gió. Kế hoạch trên bàn anh/chị cần nhiều hơn công suất hiện có mười tám phần trăm. Anh/chị thêm các thời gian lạc quan và đóng bảng tính.'
        effects:
          [
            rel bao trust +6,
            rel lan trust -3,
            rel kiet trust -4,
            stress +2,
            fact planned_unrealistic_shifts private,
            arc the_promise shifts,
          ]
      - p: 0.15
        ok: false
        en: 'Kiet reads the plan on the board and laughs, not happily. He takes it to Lan before lunch.'
        vi: 'Anh Kiệt đọc kế hoạch trên bảng và cười, không vui vẻ gì. Anh mang nó sang chị Lan trước bữa trưa.'
        effects:
          [
            rel bao trust +3,
            rel lan trust -6,
            rel kiet trust -8,
            rep.boss -3,
            stress +4,
            fact planned_unrealistic_shifts witnessed,
            arc the_promise shifts,
          ]
---
scene: prod.extra_shifts
weight: 0
place: factory_floor
tags: [pressure, people, dark, arc]
lines:
  - who: char:kiet
    en: 'We are four days behind and my crew has worked twelve days straight. With respect, I need to know: are we going to be asked to work Sunday again, and will it be written down?'
    vi: 'Mình trễ bốn ngày và tổ của anh đã làm mười hai ngày liền. Xin phép nói thẳng, anh cần biết: mình có bị yêu cầu làm Chủ nhật nữa không, và có được ghi lại không?'
choices:
  - en: 'Stay within the limit: rotate crews, bring in two temps for the weekend, and record every hour.'
    vi: 'Giữ trong giới hạn: luân phiên các tổ, thuê hai người tạm cho cuối tuần và ghi lại từng giờ.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.75
        en: "The temps slow the line at first, but it holds. Kiet's crew gets its Sunday back. You ship a day late and everyone knows why."
        vi: 'Người tạm lúc đầu làm chậm chuyền, nhưng vẫn giữ được. Tổ anh Kiệt được lấy lại Chủ nhật. Anh/chị giao trễ một ngày và ai cũng biết vì sao.'
        effects: [rel kiet trust +5, rel lan trust +1, stress +3, arc the_promise end]
      - p: 0.25
        ok: false
        en: 'The temps are not trained for the press, so you keep them off it. The weekend is thin. Bao shouts, and Kiet stays quiet.'
        vi: 'Người tạm chưa được huấn luyện cho máy ép nên anh/chị không cho họ đứng máy. Cuối tuần thiếu người. Anh Bảo quát, và anh Kiệt im lặng.'
        effects: [rel kiet trust +3, rel bao trust -4, stress +4, arc the_promise end]
  - en: 'Ask the crew to volunteer for Sunday, pay the premium, and record it, knowing it is close to the limit.'
    vi: 'Xin tổ tình nguyện làm Chủ nhật, trả mức thưởng thêm và ghi lại, biết rằng sát giới hạn.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'Nine of twelve volunteer. You record all the hours, and Lan signs the approval. It is a judgement call, made in the open.'
        vi: 'Chín trong mười hai người tình nguyện. Anh/chị ghi tất cả giờ, và chị Lan ký duyệt. Một quyết định mang tính đánh giá, được đưa ra công khai.'
        effects: [rel kiet trust +1, rel lan trust +1, stress +2, arc the_promise guard]
  - en: 'Run them Sunday and Monday night too, and leave the extra hours off the sheet.'
    vi: 'Cho chạy Chủ nhật và cả đêm thứ Hai và để giờ thêm ngoài bảng.'
    outcomes:
      - p: 0.7
        en: 'The order catches up. The sheet shows a normal week. Kiet does not thank you, and does not say no.'
        vi: 'Đơn hàng bắt kịp. Bảng ghi một tuần bình thường. Anh Kiệt không cảm ơn, và cũng không nói không.'
        effects:
          [
            rel kiet trust -6,
            rel bao trust +3,
            stress +1,
            fact exceeded_overtime_limit private,
            arc the_promise guard,
          ]
      - p: 0.3
        ok: false
        en: 'A worker faints at the press on Monday night. The first-aider asks how many hours he has worked. The sheet says forty-four.'
        vi: 'Một công nhân ngất ở máy ép đêm thứ Hai. Người sơ cứu hỏi anh ấy đã làm bao nhiêu giờ. Bảng ghi bốn mươi bốn.'
        effects:
          [
            rel kiet trust -10,
            rel lan trust -6,
            rep.boss -5,
            stress +6,
            fact exceeded_overtime_limit witnessed,
            arc the_promise guard,
          ]
---
scene: prod.guard_off_today
weight: 0
place: factory_floor
tags: [safety, pressure, dark, arc]
lines:
  - who: char:kiet
    en: 'The guard on press 3 slows the operators by about twelve percent, because they have to reach around it. I would never say this, but I have been asked to. Can the guard come off for today only? It will get us back on schedule.'
    vi: 'Tấm chắn máy ép 3 làm công nhân chậm khoảng mười hai phần trăm vì họ phải với vòng qua. Anh không bao giờ muốn nói, nhưng anh bị nhờ. Tháo tấm chắn hôm nay thôi được không? Nó giúp mình kịp tiến độ.'
choices:
  - en: 'Refuse: the guard stays on. Find the twelve percent elsewhere: a changeover saved, a batch moved, or a later date.'
    vi: 'Từ chối: tấm chắn giữ nguyên. Tìm mười hai phần trăm ở chỗ khác: tiết kiệm một lần đổi khuôn, chuyển một lô hoặc lùi ngày.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.85
        en: "You find nine of the twelve. The rest becomes a one-day delay that Bao will complain about. Kiet says, quietly: 'Thank you.'"
        vi: "Anh/chị tìm được chín trong mười hai. Phần còn lại thành một ngày trễ mà anh Bảo sẽ phàn nàn. Anh Kiệt khẽ nói: 'Cảm ơn em.'"
        effects:
          [
            rel kiet trust +8,
            rel bao trust -3,
            rel lan trust +2,
            stress +3,
            fact stopped_the_line witnessed,
            arc the_promise end,
          ]
      - p: 0.15
        ok: false
        en: 'There is nothing left to find. The order slips two days, and you hold the line in a room that does not like it.'
        vi: 'Không còn gì để tìm. Đơn trễ hai ngày, và anh/chị giữ lập trường trong một căn phòng không thích điều đó.'
        effects:
          [rel kiet trust +6, rel bao trust -6, rel lan trust +1, stress +5, arc the_promise end]
  - en: 'Slow the line to a safer rhythm with a second operator on the feed, and re-plan the loss.'
    vi: 'Làm chậm chuyền xuống nhịp an toàn hơn với một công nhân thứ hai ở cửa cấp phôi và lập lại phần mất.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'The press runs slower but safe. You recover part of the loss on line 4. Kiet nods, with some doubt about how long it will last.'
        vi: 'Máy ép chạy chậm hơn nhưng an toàn. Anh/chị bù một phần ở chuyền 4. Anh Kiệt gật đầu, còn chút nghi ngờ về việc nó kéo dài bao lâu.'
        effects: [rel kiet trust +3, stress +3, arc the_promise nearmiss]
  - en: 'Tell him to take it off for today, and put it back tomorrow.'
    vi: 'Bảo anh ấy tháo hôm nay và lắp lại ngày mai.'
    outcomes:
      - p: 0.7
        en: 'The guard comes off. The press runs faster. The catch-up works. Nobody puts the guard back on Tuesday, and you do not ask.'
        vi: 'Tấm chắn được tháo. Máy ép chạy nhanh hơn. Việc bắt kịp có hiệu quả. Không ai lắp lại tấm chắn vào thứ Ba, và anh/chị không hỏi.'
        effects:
          [
            rel kiet trust -5,
            rel bao trust +3,
            stress -1,
            fact bypassed_guard private,
            arc the_promise nearmiss,
          ]
      - p: 0.3
        ok: false
        en: "Phuc's sleeve is caught by the press on the first morning. He pulls free, unhurt, white as paper. The guard sits on the floor by the wall."
        vi: 'Tay áo của Phúc bị máy ép kẹt vào sáng đầu tiên. Em rút ra, không bị thương, mặt trắng bệch. Tấm chắn nằm trên sàn cạnh tường.'
        effects:
          [
            rel kiet trust -8,
            rel phuc trust -6,
            rep.boss -4,
            stress +6,
            fact bypassed_guard witnessed,
            arc the_promise nearmiss,
          ]
---
scene: prod.near_miss
weight: 0
place: factory_floor
tags: [safety, dark, consequence, arc]
lines:
  - who: char:kiet
    en: 'There was a near miss at press 3 this morning. Nobody is hurt. Phuc is in the canteen, shaking. The rule is that near misses are reported to Lan and logged. You decide what goes in the log.'
    vi: 'Sáng nay có một suýt tai nạn ở máy ép 3. Không ai bị thương. Phúc đang ngồi ở căng tin, run. Quy định là suýt tai nạn phải báo chị Lan và ghi nhật ký. Em quyết định điều gì được ghi.'
choices:
  - en: 'Stop the press, report it in full to Lan and log it with the cause, including what you asked for that week.'
    vi: 'Dừng máy ép, báo cáo đầy đủ cho chị Lan và ghi nhật ký kèm nguyên nhân, kể cả điều anh/chị đã yêu cầu tuần đó.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Lan is silent for a long time. 'Thank you for telling me all of it.' The schedule is re-planned, the guard goes back, and you are given a formal warning for the decision that led here."
        vi: "Chị Lan im lặng rất lâu. 'Cảm ơn em đã nói hết.' Kế hoạch được lập lại, tấm chắn được lắp lại, và anh/chị bị cảnh cáo chính thức vì quyết định dẫn đến chuyện này."
        effects:
          [
            rel lan trust +2,
            rel kiet trust +6,
            rel phuc trust +4,
            rep.boss -3,
            stress +5,
            fact reported_near_miss witnessed,
            arc the_promise end,
          ]
  - en: 'Log the near miss and put the guard back, but describe the cause as operator error.'
    vi: 'Ghi nhật ký suýt tai nạn và lắp lại tấm chắn, nhưng mô tả nguyên nhân là lỗi người vận hành.'
    outcomes:
      - p: 0.55
        en: 'The log says what it says. The guard is back. Phuc reads the log and looks at you once, then nods as if he expected it.'
        vi: 'Nhật ký ghi như vậy. Tấm chắn đã được lắp lại. Phúc đọc nhật ký và nhìn anh/chị một lần, rồi gật đầu như đã đoán trước.'
        effects:
          [
            rel phuc trust -8,
            rel kiet trust -6,
            stress +3,
            fact blamed_operator private,
            arc the_promise end,
          ]
      - p: 0.45
        ok: false
        en: 'Kiet, asked by Lan, says plainly that the guard was off on your instruction. The log and his account are side by side.'
        vi: 'Anh Kiệt, được chị Lan hỏi, nói thẳng rằng tấm chắn bị tháo theo chỉ dẫn của anh/chị. Nhật ký và lời kể của anh nằm cạnh nhau.'
        effects:
          [
            rel phuc trust -8,
            rel kiet trust -10,
            rel lan trust -8,
            rep.boss -7,
            stress +7,
            fact blamed_operator witnessed,
            arc the_promise end,
          ]
  - en: 'Do not log it, put the guard back quietly, and ask everyone to forget it.'
    vi: 'Không ghi nhật ký, lặng lẽ lắp lại tấm chắn và nhờ mọi người quên chuyện này.'
    outcomes:
      - p: 0.6
        en: "Nobody says anything. The near miss exists only in people's heads. Phuc has started wearing a glove on the other hand."
        vi: 'Không ai nói gì. Vụ suýt tai nạn chỉ còn trong đầu mọi người. Phúc bắt đầu đeo găng ở bàn tay kia.'
        effects:
          [
            rel phuc trust -4,
            rel kiet trust -6,
            stress +2,
            fact hid_near_miss private,
            arc the_promise end,
          ]
      - p: 0.4
        ok: false
        en: "A week later the inspector's questionnaire asks the crew whether any near misses were left off the log. Four people tick yes."
        vi: 'Một tuần sau bảng hỏi của thanh tra hỏi tổ có suýt tai nạn nào bị bỏ khỏi nhật ký không. Bốn người đánh dấu có.'
        effects:
          [
            rel phuc trust -5,
            rel kiet trust -8,
            rel lan trust -6,
            rep.boss -6,
            stress +6,
            fact hid_near_miss public,
            arc the_promise end,
          ]
---
arc: deferred_maintenance
title:
  en: 'The deferred maintenance'
  vi: 'Bảo trì bị hoãn'
stages:
  - { id: request, event: prod.maintenance_request }
  - { id: defer, event: prod.maintenance_defer, delay: 2-3 }
  - { id: breakdown, event: prod.breakdown, delay: 6-10 }
---
scene: prod.maintenance_request
arc: deferred_maintenance
place: factory_floor
tags: [maintenance, pressure]
weight: 2
cooldown: 40
when: [turn >= 14, turn <= 30]
lines:
  - who: char:mai
    en: 'The annealing oven on line 1 is overdue for its service by three weeks. I have put in the request twice. The thermocouple is drifting, and I am worried. I need two days of downtime. Write it into the plan, please.'
    vi: 'Lò ủ chuyền 1 quá hạn bảo dưỡng ba tuần. Chị đã gửi đề nghị hai lần. Cặp nhiệt điện đang lệch và chị lo. Chị cần hai ngày dừng máy. Em ghi vào kế hoạch giúp chị.'
choices:
  - en: 'Schedule the two days now, in the quietest week you can find, and tell Lan and Bao what it costs.'
    vi: 'Xếp hai ngày ngay bây giờ, vào tuần vắng nhất em tìm được và nói chị Lan và anh Bảo biết nó tốn gì.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: 'It costs a day of output. Bao complains. Mai services the oven properly and finds the thermocouple was off by eleven degrees. She writes it in the log, and gives you a copy.'
        vi: 'Mất một ngày sản lượng. Anh Bảo phàn nàn. Chị Mai bảo dưỡng lò đàng hoàng và thấy cặp nhiệt điện lệch mười một độ. Chị ghi vào nhật ký và đưa anh/chị một bản.'
        effects:
          [
            rel mai trust +6,
            rel lan trust +2,
            rel bao trust -2,
            stress +2,
            arc deferred_maintenance end,
          ]
      - p: 0.2
        ok: false
        en: 'The chosen week turns out to be the week a rush order arrives. You hold the shutdown, and Bao never forgives the timing.'
        vi: 'Tuần được chọn hóa ra là tuần có đơn gấp. Anh/chị giữ lịch dừng máy, và anh Bảo không bao giờ tha thứ cho thời điểm đó.'
        effects:
          [
            rel mai trust +5,
            rel lan trust +1,
            rel bao trust -6,
            stress +4,
            arc deferred_maintenance end,
          ]
  - en: 'Split it: one day now and one day in the holiday week, and agree the split with Mai in writing.'
    vi: 'Chia đôi: một ngày bây giờ và một ngày vào tuần nghỉ lễ và thống nhất cách chia với chị Mai bằng văn bản.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "Mai accepts, not happily. 'Half is better than nothing, as long as the second day happens.' It goes into the plan with a date."
        vi: "Chị Mai chấp nhận, không vui lắm. 'Một nửa còn hơn không, miễn là ngày thứ hai xảy ra.' Nó vào kế hoạch kèm ngày cụ thể."
        effects: [rel mai trust +1, stress +1, arc deferred_maintenance defer]
  - en: 'Tell her it will go in after the peak, and make a note to do it later.'
    vi: 'Nói với chị sẽ làm sau đợt cao điểm và ghi chú làm sau.'
    outcomes:
      - p: 1
        en: "Mai does not argue. She writes the date in her logbook, your name next to it, and the word 'deferred'."
        vi: "Chị Mai không tranh cãi. Chị ghi ngày vào sổ của mình, tên anh/chị bên cạnh và chữ 'hoãn'."
        effects:
          [
            rel mai trust -5,
            stress -1,
            fact deferred_maintenance private,
            arc deferred_maintenance defer,
          ]
---
scene: prod.maintenance_defer
weight: 0
place: meeting_room
tags: [maintenance, pressure, dark, arc]
lines:
  - who: char:lan
    en: 'The peak is starting. I know Mai has a service booked on line 1. I need that oven running every day for the next six weeks. Can it wait until the peak is over? I will take responsibility.'
    vi: 'Đợt cao điểm sắp bắt đầu. Chị biết chị Mai có lịch bảo dưỡng chuyền 1. Chị cần lò đó chạy mỗi ngày sáu tuần tới. Có thể chờ đến hết đợt cao điểm không? Chị chịu trách nhiệm.'
choices:
  - en: "Hold to the date: bring Mai's findings and what the drifting thermocouple can do to the product and the crew."
    vi: 'Giữ đúng ngày: mang các phát hiện của chị Mai và điều cặp nhiệt điện lệch có thể gây ra cho sản phẩm và tổ.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.7
        en: "Lan reads Mai's note twice. 'Then do it on Saturday and Sunday. We will take the loss.' She signs it herself."
        vi: "Chị Lan đọc ghi chú của chị Mai hai lần. 'Vậy làm vào thứ Bảy và Chủ nhật. Mình chịu thiệt.' Chị tự ký."
        effects: [rel lan trust +3, rel mai trust +5, stress +3, arc deferred_maintenance end]
      - p: 0.3
        ok: false
        en: 'Lan says the peak cannot be touched, and asks you to write the deferral down with her name on it. Mai is listening at the door.'
        vi: 'Chị Lan nói đợt cao điểm không thể đụng vào và nhờ anh/chị ghi việc hoãn kèm tên chị. Chị Mai đang nghe ở cửa.'
        effects: [rel lan trust -1, rel mai trust +2, stress +4, arc deferred_maintenance breakdown]
  - en: 'Agree a hard date after the peak, written down and signed, with a spare thermocouple on standby in the meantime.'
    vi: 'Thống nhất một ngày cứng sau đợt cao điểm, có ghi và ký, kèm một cặp nhiệt điện dự phòng sẵn sàng trong thời gian đó.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: 'It is a real compromise with a real date and a real spare. Mai agrees, because the risk is now named and owned.'
        vi: 'Một thỏa hiệp thật với ngày thật và phụ tùng dự phòng thật. Chị Mai đồng ý vì rủi ro giờ đã có tên và có người nhận.'
        effects: [rel lan trust +1, rel mai trust +2, stress +2, arc deferred_maintenance breakdown]
  - en: 'Defer it past the peak without a date, and tell Mai it will be soon.'
    vi: 'Hoãn qua đợt cao điểm không có ngày và nói với chị Mai là sẽ sớm thôi.'
    outcomes:
      - p: 0.8
        en: "The oven runs through the peak. The shutdown disappears from the plan. Mai's logbook gets a new line, and she stops asking."
        vi: 'Lò chạy suốt đợt cao điểm. Lịch dừng máy biến mất khỏi kế hoạch. Sổ của chị Mai có thêm một dòng mới, và chị thôi không hỏi nữa.'
        effects:
          [
            rel lan trust +4,
            rel mai trust -8,
            stress -1,
            fact deferred_maintenance private,
            arc deferred_maintenance breakdown,
          ]
      - p: 0.2
        ok: false
        en: 'The thermocouple drifts further. A batch comes out under-annealed and is scrapped. Mai shows you her logbook, without comment.'
        vi: 'Cặp nhiệt điện lệch thêm. Một mẻ ủ không đạt và bị loại. Chị Mai cho anh/chị xem sổ của chị, không bình luận.'
        effects:
          [
            rel lan trust +2,
            rel mai trust -10,
            rep.qc -3,
            stress +4,
            fact deferred_maintenance witnessed,
            arc deferred_maintenance breakdown,
          ]
