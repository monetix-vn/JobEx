scene: sup.favourite_overtime
weight: 0
place: factory_floor
tags: [people, overtime, dark, arc]
lines:
  - who: char:hoa
    en: 'The rush week has extra overtime hours, and everybody wants them. I have a list of the people who always stay late and never complain. They are my friends, and they are good. Put them first. Nobody else needs to know why.'
    vi: 'Tuần gấp có thêm giờ làm thêm và ai cũng muốn. Chị có danh sách những người luôn ở lại muộn và không bao giờ than. Họ là bạn chị, và họ giỏi. Cho họ trước. Không ai khác cần biết vì sao.'
choices:
  - en: "Offer the hours to everyone on a rotation posted on the board, with skill needs marked, and give Hoa's friends their share of it."
    vi: 'Chia giờ cho tất cả theo lịch luân phiên dán trên bảng, có đánh dấu nhu cầu kỹ năng, và cho bạn của chị Hoa phần của họ.'
    cost: { hours: 2 }
    outcomes:
