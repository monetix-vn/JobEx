        vi: 'Anh Bình ghi lại tất cả và tìm ra nguyên nhân gốc: một cảm biến bị bỏ qua hai tháng trước và một chỉ tiêu thưởng cho việc bỏ qua đó. Biện pháp là thay cảm biến mới, kèm kiến nghị rà soát chỉ tiêu.'
