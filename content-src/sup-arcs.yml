    en: 'I have to complete the incident investigation. I would like to talk to Nam, to Hoa and to you, separately, and look at the press records. I want to know why the hand got there, not who to blame.'
    vi: 'Anh phải hoàn tất điều tra sự cố. Anh muốn nói chuyện với Nam, chị Hoa và em, riêng từng người, và xem hồ sơ máy ép. Anh muốn biết vì sao bàn tay vào đó, không phải ai để đổ lỗi.'
