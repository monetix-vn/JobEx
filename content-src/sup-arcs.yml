fact: promised_impossible_target
severity: 4
category: integrity
en: 'you agreed to a target the presses could not reach within their rating'
vi: 'bạn nhận một chỉ tiêu mà các máy ép không thể đạt trong định mức'
lesson:
  en: 'Saying yes to a target that needs the machines to run past their rating moves the pressure from the meeting to the floor. The crew will pay for it before the directors do.'
  vi: 'Nói đồng ý với một chỉ tiêu cần máy chạy vượt định mức chuyển áp lực từ cuộc họp xuống xưởng. Tổ sẽ trả giá trước ban giám đốc.'
traces:
  - { type: witness, visibility: 0.5, detectors: [boss, staff] }
