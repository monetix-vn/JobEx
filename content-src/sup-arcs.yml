scene: sup.break_dispute
weight: 0
place: factory_floor
tags: [people, breaks, pressure, arc]
lines:
  - who: char:hoa
    en: 'The crew has stopped asking and decided. During the rush weeks the lunch break was cut from forty-five minutes to twenty. They say that they will take the full break tomorrow, with or without your agreement. I am telling you as a friend, not as a threat.'
    vi: 'Cả tổ thôi hỏi và đã quyết định. Trong các tuần gấp giờ nghỉ trưa bị cắt từ bốn mươi lăm phút xuống hai mươi. Họ nói ngày mai họ sẽ nghỉ đủ, dù em đồng ý hay không. Chị nói với tư cách bạn, không phải đe dọa.'
choices:
  - en: 'Agree that the full break is restored, and propose a staggered break so that the line never stops, and tell Lan before the crew does.'
    vi: 'Đồng ý khôi phục giờ nghỉ đầy đủ, đề xuất nghỉ so le để chuyền không bao giờ dừng, và báo chị Lan trước khi tổ báo.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.75
        en: "The staggered break costs four percent of output and gives the crew their forty-five minutes. Lan agrees after a short, loud call. Hoa says: 'We were not going to forget this.'"
        vi: "Nghỉ so le tốn bốn phần trăm sản lượng và trả lại cho tổ bốn mươi lăm phút. Chị Lan đồng ý sau một cuộc gọi ngắn và lớn tiếng. Chị Hoa nói: 'Bọn chị sẽ không quên chuyện này.'"
        effects:
          [
            rel hoa trust +5,
            rel lan trust -2,
            rep.staff +5,
            rep.production +2,
            stress +4,
            fact negotiated_break_fairly witnessed,
            arc the_roster end,
          ]
      - p: 0.25
        ok: false
        en: 'Lan says no change during the rush, and tells you it is your job to hold the line. You tell the crew, and they take the full break anyway, calmly, the next day.'
        vi: 'Chị Lan nói không đổi trong đợt gấp và bảo anh/chị giữ chuyền là việc của anh/chị. Anh/chị báo cho tổ và họ vẫn nghỉ đủ, bình tĩnh, ngày hôm sau.'
        effects: [rel hoa trust +3, rel lan trust -5, rep.staff +2, stress +6, arc the_roster end]
  - en: 'Ask the crew to wait one more week and promise a proper break after the rush, in writing.'
    vi: 'Xin tổ chờ thêm một tuần và hứa bằng văn bản sẽ có giờ nghỉ đàng hoàng sau đợt gấp.'
    outcomes:
      - p: 0.5
        en: 'The crew waits. After the rush, you keep your word and the break returns. It costs you some trust that you earn back.'
        vi: 'Cả tổ chờ. Sau đợt gấp, anh/chị giữ lời và giờ nghỉ trở lại. Anh/chị mất chút lòng tin rồi lấy lại được.'
        effects: [rel hoa trust +1, rep.staff +1, stress +3, arc the_roster end]
      - p: 0.5
        ok: false
        en: 'The rush runs two weeks longer than planned. You are asked to extend, and the break does not return. The crew remembers the paper you signed.'
        vi: 'Đợt gấp kéo dài hơn dự kiến hai tuần. Anh/chị bị yêu cầu gia hạn và giờ nghỉ không trở lại. Cả tổ nhớ tờ giấy anh/chị đã ký.'
        effects:
          [
            rel hoa trust -6,
            rep.staff -5,
            stress +4,
            fact broke_a_promise_to_crew private,
            arc the_roster end,
          ]
  - en: 'Refuse and threaten warnings for anyone who stops the line.'
    vi: 'Từ chối và dọa cảnh cáo bất cứ ai dừng chuyền.'
    outcomes:
      - p: 0.5
        en: 'The crew complies in silence for three days. Then three of them call in sick on the same day.'
        vi: 'Cả tổ im lặng tuân thủ ba ngày. Rồi ba người cùng xin nghỉ ốm một ngày.'
        effects:
          [
            rel hoa trust -8,
            rel lan trust +1,
            rep.staff -6,
            stress +5,
            fact broke_a_promise_to_crew private,
            arc the_roster end,
          ]
      - p: 0.5
        ok: false
        en: 'Twenty people stop the line at noon and sit on the floor, politely. Lan arrives, then Mr Cuong. A photo of the sitting crew goes into the factory chat.'
        vi: 'Hai mươi người dừng chuyền lúc trưa và ngồi xuống sàn, lịch sự. Chị Lan đến, rồi anh Cường. Một bức ảnh tổ ngồi đã vào nhóm chat của nhà máy.'
        effects:
          [
            rel hoa trust -10,
