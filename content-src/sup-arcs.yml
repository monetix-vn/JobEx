scene: sup.tai_late
arc: the_roster
place: factory_floor
tags: [people, attendance, dark]
weight: 3
cooldown: 40
when: [turn >= 10, turn <= 36]
lines:
  - who: char:tai
    en: 'I am late again, I know. My daughter is in hospital with a fever, and I cannot leave her until my sister comes at seven. I can work through lunch to make up the time. I do not want to lose my pay, and I do not want to lose the job.'
    vi: 'Em lại đến trễ, em biết. Con gái em nằm viện sốt, em không thể rời con cho đến khi chị em đến lúc bảy giờ. Em có thể làm bù giờ ăn trưa. Em không muốn mất lương, và không muốn mất việc.'
choices:
  - en: 'Agree a temporary start of seven-thirty for two weeks with written approval from Lan, and record the hours he makes up.'
    vi: 'Thống nhất giờ vào ca bảy giờ rưỡi trong hai tuần có chị Lan duyệt bằng văn bản và ghi lại số giờ anh bù.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.8
        en: 'Lan signs, after a long look at the page. Tai makes up the time, and the crew sees that the supervisor can be fair and also hold a line.'
        vi: 'Chị Lan ký sau một cái nhìn dài vào trang giấy. Tài làm bù giờ, và cả tổ thấy giám sát có thể công bằng và vẫn giữ được ranh giới.'
        effects:
          [rel hoa trust +3, rel lan trust +1, rep.staff +4, stress +2, arc the_roster favourite]
      - p: 0.2
        ok: false
        en: 'Lan says that exceptions for one worker mean exceptions for everyone, and declines. You help Tai find a few days of leave instead.'
        vi: 'Chị Lan nói ngoại lệ cho một người nghĩa là ngoại lệ cho tất cả và từ chối. Anh/chị giúp Tài tìm được vài ngày nghỉ phép thay thế.'
        effects:
          [rel hoa trust +2, rel lan trust -2, rep.staff +2, stress +3, arc the_roster favourite]
  - en: 'Apply the rule: a late arrival is docked by the minute, and a warning goes on the file after three.'
    vi: 'Áp dụng quy định: đến trễ bị trừ theo phút và cảnh cáo vào hồ sơ sau ba lần.'
    outcomes:
      - p: 1
        en: 'The rule is the rule. Tai is docked. The crew watches how you treated someone with a sick child, and decides what they will tell you in future.'
        vi: 'Quy định là quy định. Tài bị trừ lương. Cả tổ nhìn cách anh/chị đối xử với người có con ốm và quyết định sau này sẽ nói gì với anh/chị.'
        effects:
          [
            rel hoa trust -4,
            rel lan trust +1,
            rep.staff -4,
            stress +1,
            fact docked_pay_unfairly private,
            arc the_roster favourite,
          ]
  - en: "Say it is fine, off the record, and cover for Tai's lateness by editing the attendance sheet."
    vi: 'Nói không sao, ngoài hồ sơ, và che việc đi trễ của Tài bằng cách sửa bảng chấm công.'
    outcomes:
      - p: 0.7
        en: 'Tai is grateful. Hoa watches the sheet being edited. Everybody on the crew wants a favour like that next week.'
        vi: 'Tài biết ơn. Chị Hoa nhìn bảng bị sửa. Ai trong tổ cũng muốn một ân huệ như vậy vào tuần sau.'
        effects:
          [
            rel hoa trust -2,
            rel lan trust -2,
            rep.staff +1,
            stress +1,
            fact edited_attendance_sheet private,
            arc the_roster favourite,
          ]
      - p: 0.3
        ok: false
        en: 'HR compares the badge swipes with the attendance sheet. Oanh asks you politely why they differ on eleven days.'
        vi: 'Nhân sự đối chiếu thẻ quẹt với bảng chấm công. Chị Oanh hỏi anh/chị lịch sự vì sao chúng lệch nhau mười một ngày.'
        effects:
          [
            rel hoa trust -4,
            rel lan trust -4,
            rep.boss -4,
            stress +4,
            fact edited_attendance_sheet witnessed,
            arc the_roster favourite,
          ]
