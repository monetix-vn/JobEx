fact: refused_unsafe_speed
severity: 2
category: integrity
en: 'you kept the pause check and refused to run a press above its rating'
vi: 'bạn giữ bước kiểm tra tạm dừng và từ chối cho máy ép chạy vượt định mức'
lesson:
  en: "Refusing the speed-up costs units this week and buys the crew's trust for the year. It is also what a fair inspection looks for."
  vi: 'Từ chối tăng tốc tốn sản phẩm tuần này và đổi lại lòng tin của tổ cả năm. Đó cũng là điều một cuộc thanh tra công bằng tìm kiếm.'
