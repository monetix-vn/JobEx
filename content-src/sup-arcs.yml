# Production Line Supervisor storylines (docs/story/supervisor.md): The Target, The Hand, The Roster.
arc: the_target
title:
  en: 'The target'
  vi: 'Chỉ tiêu'
stages:
  - { id: raised, event: sup.target_raised }
  - { id: faster, event: sup.run_it_faster, delay: 1-2 }
  - { id: count, event: sup.end_of_shift_count, delay: 2-3 }
  - { id: recount, event: sup.qc_recount, delay: 3-5 }
---
scene: sup.target_raised
arc: the_target
place: meeting_room
tags: [pressure, target, dark]
weight: 3
cooldown: 40
when: [turn >= 8, turn <= 38]
lines:
  - who: char:lan
    en: 'The directors raised the daily target for Line 3 by fifteen percent from Monday. The presses did not change. The bonus for the plant depends on it. I know. Tell me what you need to make it, and tell me what you cannot.'
    vi: 'Ban giám đốc nâng chỉ tiêu ngày của chuyền 3 lên mười lăm phần trăm từ thứ Hai. Các máy ép không đổi. Thưởng của cả nhà máy phụ thuộc vào đó. Chị biết. Nói chị nghe em cần gì để đạt, và nói điều em không thể.'
choices:
  - en: "Show Lan the line's rated capacity and the real changeover losses, and propose a target that rises by eight percent with a plan to recover the rest."
    vi: 'Cho chị Lan xem công suất định mức của chuyền và tổn thất thật khi đổi khuôn, và đề xuất chỉ tiêu tăng tám phần trăm kèm kế hoạch lấy lại phần còn lại.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.6
        en: 'Lan takes the numbers to the directors. They give eight percent now and the rest in a quarter. It is a smaller win than anyone wanted, and it holds.'
        vi: 'Chị Lan mang số liệu lên ban giám đốc. Họ cho tám phần trăm bây giờ và phần còn lại sau một quý. Một thắng lợi nhỏ hơn mọi người muốn, và nó giữ được.'
        effects: [rel lan trust +3, rep.boss +2, rep.production +2, stress +3, arc the_target end]
      - p: 0.4
        ok: false
        en: 'The directors say fifteen percent is fifteen percent. Lan tells you she argued, and lost, and that the number stays.'
        vi: 'Ban giám đốc nói mười lăm là mười lăm. Chị Lan nói chị đã tranh luận, và thua, và con số vẫn vậy.'
        effects: [rel lan trust +2, stress +4, arc the_target faster]
  - en: 'Say you will try, and reorganise the crew to cut idle time between jobs, within the rated speeds.'
    vi: 'Nói anh/chị sẽ cố, và tổ chức lại tổ để cắt thời gian chờ giữa các việc, trong tốc độ định mức.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'You find six percent in the changeovers and the break rota. The line is faster and more tired. The rest you cannot find honestly.'
        vi: 'Anh/chị tìm được sáu phần trăm trong việc đổi khuôn và lịch nghỉ. Chuyền nhanh hơn và mệt hơn. Phần còn lại anh/chị không tìm được một cách trung thực.'
        effects: [rel lan trust +1, rel hoa trust -1, stress +4, arc the_target faster]
  - en: 'Say yes to fifteen percent, and work out how afterwards.'
    vi: 'Nói đồng ý mười lăm phần trăm và tính cách làm sau.'
    outcomes:
      - p: 0.8
        en: 'Lan looks relieved. You have promised a number that needs the presses to run past their rating.'
        vi: 'Chị Lan có vẻ nhẹ nhõm. Anh/chị đã hứa một con số cần các máy ép chạy vượt định mức.'
        effects:
          [
            rel lan trust +4,
            rel hoa trust -2,
            stress +2,
            fact promised_impossible_target private,
            arc the_target faster,
          ]
      - p: 0.2
        ok: false
        en: 'Hoa asks, in front of the crew, which press is going to do the extra fifteen percent. You do not have an answer.'
        vi: 'Chị Hoa hỏi, trước mặt cả tổ, máy ép nào sẽ làm thêm mười lăm phần trăm đó. Anh/chị không có câu trả lời.'
        effects:
          [
            rel lan trust +2,
            rel hoa trust -5,
            stress +3,
            fact promised_impossible_target witnessed,
            arc the_target faster,
          ]
---
scene: sup.run_it_faster
weight: 0
place: factory_floor
tags: [pressure, safety, dark, arc]
lines:
  - who: char:hoa
    en: 'We are three thousand short for the week. Press 2 can run twenty percent faster than its rating if the crew skips the pause check between strokes. We have done it before, when the old supervisor allowed it. I am telling you, so that you can say yes or no.'
    vi: 'Cả tuần mình thiếu ba nghìn. Máy ép 2 chạy nhanh hơn định mức hai mươi phần trăm nếu tổ bỏ bước kiểm tra tạm dừng giữa các nhịp. Mình từng làm khi giám sát cũ cho phép. Chị nói để em quyết có hay không.'
choices:
  - en: 'Say no to the speed-up, keep the pause check, and move two people from the finishing bench to press 2 to recover the units honestly.'
    vi: 'Nói không với việc tăng tốc, giữ bước kiểm tra tạm dừng, và chuyển hai người từ bàn hoàn thiện sang máy ép 2 để lấy lại sản phẩm một cách trung thực.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: "You recover two thousand of the three. Hoa says: 'Good. Now I know what you will say.' The directors see a shortfall of a thousand and a clean injury log."
        vi: "Anh/chị lấy lại hai nghìn trong ba nghìn. Chị Hoa nói: 'Tốt. Giờ chị biết em sẽ nói gì.' Ban giám đốc thấy thiếu một nghìn và sổ chấn thương sạch."
        effects:
          [
            rel hoa trust +5,
            rel lan trust +1,
            rep.production +2,
            stress +3,
            fact refused_unsafe_speed witnessed,
            arc the_target count,
          ]
      - p: 0.3
        ok: false
        en: 'The two people from the bench are slow on the press. The shortfall is two thousand, and Lan asks why the line is not hitting its number.'
        vi: 'Hai người từ bàn hoàn thiện làm chậm trên máy ép. Thiếu hai nghìn, và chị Lan hỏi vì sao chuyền không đạt số.'
        effects:
          [
            rel hoa trust +3,
            rel lan trust -3,
            rep.boss -2,
            stress +5,
            fact refused_unsafe_speed witnessed,
            arc the_target count,
          ]
  - en: 'Allow it for one shift only, with Binh informed, and check the press after every hundred strokes.'
    vi: 'Cho phép trong đúng một ca, có báo anh Bình và kiểm tra máy sau mỗi một trăm nhịp.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'Binh grumbles, and watches. The shift makes up half the shortfall. Nobody is hurt, and everybody knows this is the last time.'
        vi: 'Anh Bình càu nhàu và theo dõi. Ca đó bù được nửa phần thiếu. Không ai bị thương, và ai cũng biết đây là lần cuối.'
        effects: [rel hoa trust +1, rel binh trust +1, stress +4, arc the_target count]
  - en: 'Say yes, run the line at the higher speed for the rest of the week, and keep the pause check off the shift report.'
    vi: 'Nói đồng ý, cho chuyền chạy tốc độ cao suốt tuần và để bước kiểm tra tạm dừng ngoài báo cáo ca.'
    outcomes:
      - p: 0.7
        en: 'The week makes its number. The press runs hot and loud. Hoa does as you said, and her silence is the worst thing about it.'
        vi: 'Cả tuần đạt số. Máy ép nóng và ồn. Chị Hoa làm như em nói, và sự im lặng của chị là điều tệ nhất.'
        effects:
          [
            rel hoa trust -3,
            rel lan trust +4,
            stress +2,
            fact ran_above_rated_speed private,
            arc the_target count,
          ]
      - p: 0.3
        ok: false
        en: 'Thursday, the clutch on press 2 slips, and the ram comes down on an empty die. Nobody is hurt. Binh walks in an hour later, and the pause log is not there.'
        vi: 'Thứ Năm, ly hợp máy ép 2 trượt, và đầu ép hạ xuống khuôn trống. Không ai bị thương. Một giờ sau anh Bình bước vào, và sổ tạm dừng không có.'
        effects:
          [
            rel hoa trust -6,
            rel lan trust -3,
            rel binh trust -8,
            rep.boss -4,
            stress +6,
            fact ran_above_rated_speed witnessed,
            arc the_target count,
          ]
---
scene: sup.end_of_shift_count
weight: 0
place: factory_floor
tags: [pressure, count, dark, arc]
lines:
  - who: char:lan
    en: 'Friday night. The line is eight hundred short of the week. The directors read the number at seven tomorrow. I would like to see a good number on the report. I am not asking you to do anything. I am saying what I would like to see.'
    vi: 'Tối thứ Sáu. Chuyền thiếu tám trăm so với cả tuần. Ban giám đốc đọc con số lúc bảy giờ sáng mai. Chị muốn thấy một con số đẹp trên báo cáo. Chị không bảo em làm gì. Chị nói điều chị muốn thấy.'
choices:
  - en: 'Report the true count, with the shortfall explained: the breakdown, the changeovers, and the pause checks that were kept.'
    vi: 'Báo cáo số đếm thật kèm giải thích phần thiếu: hỏng máy, đổi khuôn và các bước kiểm tra tạm dừng đã giữ.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.8
        en: "Lan reads the explanation and says, after a moment, 'Thank you.' The directors see eight hundred missing. Nobody is happy, and the number is true."
        vi: "Chị Lan đọc phần giải thích và nói, sau một lúc, 'Cảm ơn em.' Ban giám đốc thấy thiếu tám trăm. Không ai vui, và con số là thật."
        effects:
          [
            rel lan trust +3,
            rep.boss +1,
            stress +3,
            fact reported_true_count witnessed,
            arc the_target recount,
          ]
      - p: 0.2
        ok: false
        en: 'The directors ask why Line 3 is the only line that is short. Lan answers with your explanation, and does not say it was yours.'
        vi: 'Ban giám đốc hỏi vì sao chuyền 3 là chuyền duy nhất thiếu. Chị Lan trả lời bằng lời giải thích của em, và không nói đó là của em.'
        effects:
          [
            rel lan trust +1,
            rep.boss -2,
            stress +4,
            fact reported_true_count witnessed,
            arc the_target recount,
          ]
  - en: 'Count the units on the finishing bench that are waiting for the final check, and report them as complete, because they will pass.'
    vi: 'Đếm cả sản phẩm trên bàn hoàn thiện đang chờ kiểm tra cuối và báo là hoàn tất vì chúng sẽ đạt.'
    outcomes:
      - p: 1
        en: 'The count is eight hundred higher. Most of them will pass. A few will not. Hoa watches you sign the sheet and says nothing.'
        vi: 'Số đếm cao hơn tám trăm. Phần lớn sẽ đạt. Một số thì không. Chị Hoa nhìn em ký bảng và không nói gì.'
        effects: [rel lan trust +2, rel hoa trust -2, stress +2, arc the_target recount]
  - en: 'Add eight hundred to the count, to round the week up.'
    vi: 'Cộng thêm tám trăm vào số đếm để làm tròn cả tuần.'
    outcomes:
      - p: 0.65
        en: "The number reads clean at seven o'clock. Lan thanks you, in the voice of someone who has not asked. You have invented eight hundred pans."
        vi: 'Con số trông sạch lúc bảy giờ. Chị Lan cảm ơn, bằng giọng của người chưa hỏi gì. Anh/chị đã bịa ra tám trăm chiếc chảo.'
        effects:
          [
            rel lan trust +5,
            rel hoa trust -4,
            rep.boss +3,
            stress +1,
            fact inflated_output_count private,
            arc the_target recount,
          ]
      - p: 0.35
        ok: false
        en: "The packing list for the shipment says eight hundred fewer pans than the report. Mr Khoa's team notices, and asks the line for an explanation."
        vi: 'Phiếu đóng gói của lô hàng ghi ít hơn báo cáo tám trăm chiếc chảo. Nhóm anh Khoa nhận ra và xin chuyền giải thích.'
        effects:
          [
            rel lan trust +2,
            rel khoa trust -6,
            rep.boss -4,
            rep.qc -4,
            stress +5,
            fact inflated_output_count witnessed,
            arc the_target recount,
          ]
---
scene: sup.qc_recount
weight: 0
place: meeting_room
tags: [pressure, count, consequence, arc]
lines:
  - who: char:khoa
    en: "We counted the finished stock for the shipment. It does not match the line's weekly report for Line 3. I am not accusing anyone. I would like to understand where the difference is, before the buyer's audit finds it."
    vi: 'Bọn anh đã đếm thành phẩm của lô hàng. Nó không khớp báo cáo tuần của chuyền 3. Anh không buộc tội ai. Anh muốn hiểu chênh lệch nằm ở đâu, trước khi đợt đánh giá của khách tìm ra nó.'
choices:
  - en: 'Show Khoa the shift sheets and the true counts, say exactly where the differences came from, and offer to change how the end-of-shift count is made.'
    vi: 'Cho anh Khoa xem các phiếu ca và số đếm thật, nói chính xác chênh lệch đến từ đâu và đề xuất đổi cách đếm cuối ca.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Khoa reads the sheets. 'A bench count is not a finished count. Let us write that down.' The reporting rule is changed, and you get a quiet word from Lan."
        vi: "Anh Khoa đọc các phiếu. 'Đếm ở bàn không phải đếm thành phẩm. Mình ghi lại điều đó.' Quy tắc báo cáo được đổi, và anh/chị nhận một lời nhắc nhỏ từ chị Lan."
        effects: [rel khoa trust +4, rel lan trust -1, rep.qc +3, stress +3, arc the_target end]
  - en: 'Say the difference is probably the finishing bench and a timing issue, and ask for a week to reconcile.'
    vi: 'Nói chênh lệch chắc là do bàn hoàn thiện và vấn đề thời điểm và xin một tuần để đối chiếu.'
    outcomes:
      - p: 1
        en: 'Khoa gives you a week. You reconcile what you can, and the rest becomes a footnote.'
        vi: 'Anh Khoa cho anh/chị một tuần. Anh/chị đối chiếu được phần nào, và phần còn lại thành chú thích.'
        effects: [rel khoa trust -1, stress +3, arc the_target end]
  - en: 'Say the QC count is the one that is wrong, and ask Khoa to recount.'
    vi: 'Nói số đếm của QC mới là số sai và đề nghị anh Khoa đếm lại.'
    outcomes:
      - p: 0.4
        en: 'Khoa recounts, and the number is nearly the same. He writes down that the line disputed it. The pans are not there.'
        vi: 'Anh Khoa đếm lại và con số gần như vậy. Anh ghi lại rằng chuyền phản đối. Số chảo không có đó.'
        effects: [rel khoa trust -6, rep.qc -3, stress +4, arc the_target end]
      - p: 0.6
        ok: false
        en: 'Hoa has the real count in her pocket notebook, and Khoa asks to see it. Hoa hands it over, and looks at you only after she has.'
        vi: 'Chị Hoa có số đếm thật trong sổ tay bỏ túi, và anh Khoa xin xem. Chị Hoa đưa, và chỉ nhìn anh/chị sau khi đã đưa.'
        effects:
          [
            rel khoa trust -8,
            rel hoa trust -6,
            rel lan trust -6,
            rep.boss -6,
            rep.qc -5,
            stress +6,
            arc the_target end,
          ]
---
arc: the_hand
title:
  en: 'The hand'
  vi: 'Bàn tay'
stages:
  - { id: caught, event: sup.hand_caught }
  - { id: record, event: sup.how_to_record, delay: 1 }
  - { id: investigation, event: sup.binh_investigates, delay: 1-2 }
  - { id: return, event: sup.nam_returns, delay: 3-5 }
---
scene: sup.hand_caught
arc: the_hand
place: factory_floor
tags: [injury, safety, dark]
weight: 3
cooldown: 40
when: [turn >= 12, turn <= 40]
lines:
  - who: char:hoa
    en: "Nam's hand was caught in the press. He pulled it back in time, but it is cut and swollen, and he cannot close his fingers. He wants to go back to work. He says it is nothing. Look at his hand."
    vi: 'Tay Nam bị kẹt vào máy ép. Cậu rút ra kịp, nhưng bị rách và sưng, và không nắm lại được ngón tay. Cậu muốn quay lại làm việc. Cậu nói không sao. Em nhìn tay cậu đi.'
choices:
  - en: 'Stop the press, take Nam to the clinic now, and call Binh and Lan before anything else.'
    vi: 'Dừng máy ép, đưa Nam đến phòng khám ngay và gọi anh Bình và chị Lan trước mọi việc khác.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "The doctor says two fingers are fractured, and he will be off work for three weeks. Nam is frightened about the pay. Binh arrives, takes photographs of the press, and says: 'Good. Now we have a record that starts right.'"
        vi: "Bác sĩ nói hai ngón tay bị gãy và cậu nghỉ ba tuần. Nam lo về lương. Anh Bình đến, chụp ảnh máy ép và nói: 'Tốt. Giờ mình có hồ sơ bắt đầu đúng.'"
        effects:
          [rel hoa trust +4, rel binh trust +4, rel lan trust +1, stress +5, arc the_hand record]
  - en: 'Send Nam to the clinic with Hoa, restart the press with a temporary guard, and report the incident at the end of the shift.'
    vi: 'Cho Nam đến phòng khám cùng chị Hoa, chạy lại máy ép với tấm chắn tạm và báo sự cố cuối ca.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "Nam is treated, and the line loses only an hour. Binh asks why the press ran again before he inspected it. You say you wanted the crew to keep their pay. He says that the crew's safety is not a pay question."
        vi: 'Nam được điều trị, và chuyền chỉ mất một giờ. Anh Bình hỏi vì sao máy ép chạy lại trước khi anh kiểm tra. Anh/chị nói muốn tổ giữ lương. Anh nói an toàn của tổ không phải câu hỏi về lương.'
        effects: [rel hoa trust +1, rel binh trust -3, stress +4, arc the_hand record]
  - en: 'Bandage the hand, send Nam back to light work, and keep the press running.'
    vi: 'Băng tay, cho Nam quay lại việc nhẹ và giữ máy ép chạy.'
    outcomes:
      - p: 0.7
        en: 'Nam does the light work. By afternoon his hand is the size of a glove, and Hoa takes him to the clinic herself, with a look at you.'
        vi: 'Nam làm việc nhẹ. Đến chiều bàn tay cậu to bằng một chiếc găng, và chị Hoa tự đưa cậu đến phòng khám, kèm một cái nhìn dành cho anh/chị.'
        effects:
          [
            rel hoa trust -6,
            rel binh trust -3,
            stress +4,
            fact delayed_medical_care private,
            arc the_hand record,
          ]
      - p: 0.3
        ok: false
        en: 'The doctor asks why the hand was not seen for six hours. Binh is called, and the first line of his report is a question about you.'
        vi: 'Bác sĩ hỏi vì sao sáu tiếng sau mới cho khám. Anh Bình được gọi, và dòng đầu tiên trong báo cáo của anh là một câu hỏi về anh/chị.'
        effects:
          [
            rel hoa trust -8,
            rel binh trust -8,
            rel lan trust -5,
            rep.boss -5,
            stress +6,
            fact delayed_medical_care witnessed,
            arc the_hand record,
          ]
---
scene: sup.how_to_record
weight: 0
place: meeting_room
tags: [injury, report, dark, arc]
lines:
  - who: char:lan
    en: 'The plant has gone two hundred days without a lost-time injury, and the safety bonus depends on it. Nam is off for three weeks. That makes it a lost-time injury. It could also be recorded as first aid, with a medical leave for something else. I am not telling you what to write. I am telling you what it costs.'
    vi: 'Nhà máy đã hai trăm ngày không có chấn thương mất ngày công, và thưởng an toàn phụ thuộc vào đó. Nam nghỉ ba tuần. Như vậy là chấn thương mất ngày công. Cũng có thể ghi là sơ cứu, và nghỉ ốm vì lý do khác. Chị không bảo em viết gì. Chị nói điều đó tốn bao nhiêu.'
choices:
  - en: 'Record it as a lost-time injury, with what happened, including that the guard was not fully set, and the fix for it.'
    vi: 'Ghi là chấn thương mất ngày công, kèm chuyện đã xảy ra, kể cả việc tấm chắn chưa được đặt đủ, và cách sửa.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.75
        en: 'The counter goes back to zero. Lan says nothing about the bonus. She signs the report, and asks Binh to review the guard on every press.'
        vi: 'Bộ đếm về không. Chị Lan không nói gì về thưởng. Chị ký báo cáo và nhờ anh Bình rà soát tấm chắn mọi máy ép.'
        effects:
          [
            rel lan trust +1,
            rel binh trust +5,
            rel hoa trust +4,
            rep.boss -1,
            rep.staff +3,
            stress +3,
            fact reported_injury_honestly witnessed,
            arc the_hand investigation,
          ]
      - p: 0.25
        ok: false
        en: "Mr Cuong asks why Line 3 broke the plant's record. Lan answers with your report, and tells him it was a good one."
