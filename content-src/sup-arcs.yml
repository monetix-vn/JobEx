scene: sup.nam_returns
weight: 0
place: factory_floor
tags: [injury, people, consequence, arc]
lines:
  - who: char:nam
    en: 'The doctor says I can do light duty from next week. Lan wants me back on the press on Monday, because we are short. I can open and close the hand, a little. I do not want to say no to you.'
    vi: 'Bác sĩ nói tuần sau em làm việc nhẹ được. Chị Lan muốn em quay lại máy ép thứ Hai vì mình thiếu người. Em nắm mở bàn tay được một chút. Em không muốn nói không với anh/chị.'
choices:
  - en: 'Keep Nam on light duty as the doctor says, cover the press with a trained temp, and tell Lan the reason in writing.'
    vi: 'Giữ Nam làm việc nhẹ như bác sĩ nói, dùng một người thời vụ đã được huấn luyện thay ở máy ép và nói rõ lý do với chị Lan bằng văn bản.'
