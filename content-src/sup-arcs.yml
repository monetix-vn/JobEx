fact: ran_above_rated_speed
severity: 6
category: integrity
en: 'you ran a press above its rated speed and left the checks off the record'
vi: 'bạn cho máy ép chạy vượt tốc độ định mức và để các bước kiểm tra ngoài hồ sơ'
