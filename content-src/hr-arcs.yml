fact: promised_hire_to_owner_nephew
severity: 4
category: integrity
en: "you promised a hire to the owner's nephew before the process had started"
vi: 'bạn hứa một suất tuyển cho cháu chủ trước khi quy trình bắt đầu'
lesson:
  en: 'A promise made before the interviews turns the interviews into theatre. Everyone who applies is then competing against a decision that was already made.'
  vi: 'Lời hứa trước khi phỏng vấn biến các buổi phỏng vấn thành sân khấu. Mọi người nộp hồ sơ khi đó đang cạnh tranh với một quyết định đã có sẵn.'
