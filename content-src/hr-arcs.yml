scene: hr.survivors
weight: 0
place: factory_floor
tags: [layoff, people, consequence, arc]
lines:
  - who: char:kiet
    en: 'We lost six people on Line 2 and the target did not change. The ones left are working through lunch. They keep asking me whether they are next. What do I tell them?'
    vi: 'Chuyền 2 mất sáu người và chỉ tiêu không đổi. Những người còn lại làm cả giờ ăn trưa. Họ cứ hỏi anh có phải là người tiếp theo không. Anh nói với họ thế nào?'
choices:
  - en: 'Hold a short briefing with Kiet: what is decided, what is not, no more cuts planned this year as far as you know, and review the workload against the new headcount.'
    vi: 'Họp ngắn cùng anh Kiệt: điều gì đã quyết, điều gì chưa, theo hiểu biết của anh/chị thì năm nay không cắt thêm, và rà lại khối lượng công việc theo số người mới.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.8
        en: 'The briefing is short and honest. The line is still stretched, and the questions stop. The workload review moves two orders to the next quarter.'
        vi: 'Buổi thông tin ngắn và thẳng thắn. Chuyền vẫn căng, và những câu hỏi dừng lại. Việc rà khối lượng chuyển hai đơn hàng sang quý sau.'
        effects: [rel kiet trust +4, rep.production +3, rep.staff +3, stress +2, arc the_list end]
      - p: 0.2
        ok: false
        en: "Mr Cuong hears about the briefing and says that promising 'no more cuts' was not HR's place. You wrote 'as far as I know', and he lets it go."
        vi: "Anh Cường nghe về buổi thông tin và nói hứa 'không cắt thêm' không phải chỗ của nhân sự. Anh/chị đã nói 'theo hiểu biết của tôi', và anh bỏ qua."
        effects: [rel kiet trust +3, rel cuong trust -3, rep.staff +2, stress +4, arc the_list end]
  - en: 'Tell Kiet to keep the line calm, and say the workload is a production issue.'
    vi: 'Bảo anh Kiệt giữ chuyền yên ổn và nói khối lượng công việc là chuyện của sản xuất.'
    outcomes:
      - p: 1
        en: "Kiet says 'Understood' in the tone of a man who has understood something about you."
        vi: "Anh Kiệt nói 'Đã hiểu' bằng giọng của người vừa hiểu ra điều gì đó về anh/chị."
        effects: [rel kiet trust -4, rep.production -2, stress +1, arc the_list end]
  - en: 'Say that the survivors should be grateful, and that overtime is expected until orders recover.'
    vi: 'Nói những người còn lại nên biết ơn và làm thêm giờ là điều được kỳ vọng cho đến khi đơn hàng hồi phục.'
    outcomes:
      - p: 0.6
        en: "The overtime comes, and so do three resignations in a month. Kiet puts the figures on Oanh's desk without comment."
        vi: 'Giờ làm thêm đến, và ba đơn xin nghỉ trong một tháng cũng đến. Anh Kiệt đặt các con số lên bàn chị Oanh mà không bình luận.'
        effects:
          [
            rel kiet trust -8,
            rel oanh trust -3,
            rep.production -5,
            rep.staff -6,
            stress +3,
            arc the_list end,
