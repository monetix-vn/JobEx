fact: documented_conflict_of_interest
severity: 1
category: integrity
en: 'you wrote down a friendship between a decision-maker and a candidate'
vi: 'bạn ghi lại mối quan hệ bạn bè giữa người ra quyết định và một ứng viên'
lesson:
  en: 'A declared interest is not an accusation. It is the cheapest protection a fair process has, for the candidate, the decision-maker and the person who ran it.'
  vi: 'Lợi ích được khai báo không phải lời buộc tội. Đó là sự bảo vệ rẻ nhất của một quy trình công bằng, cho ứng viên, cho người quyết định và cho người tổ chức quy trình.'
witnessed:
  boss: 2
public:
  boss: 3
