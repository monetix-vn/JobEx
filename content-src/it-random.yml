scene: it.patch_downtime
place: factory_floor
tags: [security, patching, dark]
weight: 3
cooldown: 30
when: [turn >= 10]
lines:
  - who: char:kien
    en: 'A critical vulnerability has been announced for the server software we run. Attackers are already using it. The patch needs a two-hour restart. Lan says no downtime in peak season, and she has the shipping schedule to prove it. I need you to decide how we handle it, and I will back you.'
    vi: 'Một lỗ hổng nghiêm trọng vừa được công bố cho phần mềm máy chủ mình dùng. Kẻ tấn công đã khai thác. Bản vá cần khởi động lại hai giờ. Chị Lan nói không có thời gian ngừng trong mùa cao điểm, và chị có lịch giao hàng để chứng minh. Anh cần em quyết định cách xử lý, và anh sẽ ủng hộ.'
choices:
  - en: "Patch in a two-hour window on Saturday night with Lan's agreement, isolate the exposed service until then, and tell the directors the risk and the plan."
    vi: 'Vá trong cửa sổ hai giờ tối thứ Bảy với sự đồng ý của chị Lan, cách ly dịch vụ bị lộ cho đến lúc đó và báo ban giám đốc rủi ro và kế hoạch.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: 'Lan agrees to Saturday night after reading the log of attempted attacks. The patch goes in cleanly, and Monday is quiet. Nobody sees what was prevented.'
        vi: 'Chị Lan đồng ý tối thứ Bảy sau khi đọc nhật ký các nỗ lực tấn công. Bản vá được cài sạch, và thứ Hai yên ả. Không ai thấy điều đã được ngăn.'
        effects: [rel kien trust +4, rel lan trust +1, rep.production +1, rep.boss +2, stress +4]
      - p: 0.2
        ok: false
        en: 'The restart takes four hours instead of two, and a shipment is late by half a day. Lan is angry, and Kien backs you, in writing, as he promised.'
        vi: 'Khởi động lại mất bốn giờ thay vì hai, và một lô hàng trễ nửa ngày. Chị Lan giận, và anh Kiên ủng hộ anh/chị, bằng văn bản, như đã hứa.'
        effects: [rel kien trust +4, rel lan trust -4, rep.production -2, stress +6]
  - en: 'Apply a temporary mitigation (block the vulnerable service from outside) and schedule the patch for the first quiet week.'
    vi: 'Áp dụng biện pháp giảm thiểu tạm thời (chặn dịch vụ dễ tổn thương từ bên ngoài) và lên lịch vá vào tuần yên đầu tiên.'
    outcomes:
      - p: 1
        en: 'The mitigation holds for six weeks. It is a judgement call, written down, with a date. The vulnerability is patched when the season ends.'
        vi: 'Biện pháp giảm thiểu giữ được sáu tuần. Đó là một phán đoán, được viết ra, kèm ngày. Lỗ hổng được vá khi mùa cao điểm kết thúc.'
        effects: [rel kien trust +1, rel lan trust +1, stress +3]
  - en: 'Skip the patch until after the peak season, as Lan asks, and do not mention it in the risk register.'
    vi: 'Bỏ qua bản vá cho đến sau mùa cao điểm như chị Lan yêu cầu và không ghi vào sổ rủi ro.'
    outcomes:
      - p: 0.7
        en: 'The season passes without downtime. Lan sends a thank-you note. The unpatched server is probed two hundred times, and holds.'
        vi: 'Mùa cao điểm qua không ngừng. Chị Lan gửi lời cảm ơn. Máy chủ chưa vá bị dò hai trăm lần, và vẫn chịu được.'
        effects:
          [
            rel kien trust -3,
            rel lan trust +4,
            rep.production +2,
            stress +1,
            fact skipped_critical_patch private,
          ]
      - p: 0.3
        ok: false
        en: 'On a Sunday, the vulnerable server is compromised. The incident report shows that the patch had been available for five weeks, and that it was not in the risk register. Kien reads the line twice.'
        vi: 'Vào một Chủ nhật, máy chủ dễ tổn thương bị xâm nhập. Báo cáo sự cố cho thấy bản vá đã có năm tuần và không có trong sổ rủi ro. Anh Kiên đọc dòng đó hai lần.'
        effects:
          [
            rel kien trust -8,
            rel lan trust +1,
            rep.boss -6,
            rep.production -3,
            stress +8,
            fact skipped_critical_patch witnessed,
          ]
---
scene: it.keylogger_ask
place: meeting_room
tags: [privacy, surveillance, dark]
weight: 2
cooldown: 40
when: [turn >= 14]
lines:
  - who: char:cuong
    en: 'I have a suspicion about the head of purchasing and a supplier. I want you to install monitoring software on his laptop that records every keystroke and takes a screenshot every minute. Do not tell him, do not tell HR, and do not write it down. We have a right to know what is happening on our own laptops.'
    vi: 'Anh nghi ngờ trưởng phòng mua hàng và một nhà cung cấp. Anh muốn em cài phần mềm giám sát lên laptop của anh ấy ghi mọi phím gõ và chụp màn hình mỗi phút. Đừng nói với anh ấy, đừng nói với nhân sự và đừng ghi lại. Mình có quyền biết điều gì đang xảy ra trên laptop của chính mình.'
choices:
  - en: 'Decline covert monitoring, explain the legal and trust risks, and offer a lawful alternative: a documented audit of purchase approvals and supplier payments with HR and Legal informed.'
    vi: 'Từ chối giám sát bí mật, giải thích rủi ro pháp lý và lòng tin và đề xuất cách thay thế hợp pháp: kiểm toán có hồ sơ các phê duyệt mua hàng và thanh toán nhà cung cấp với nhân sự và pháp chế được báo.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: "Mr Cuong exhales. 'I did not think about the law.' The audit finds a discount that Tam had not disclosed, and nothing worse. It was found without recording a single keystroke."
        vi: "Anh Cường thở ra. 'Anh chưa nghĩ đến luật.' Cuộc kiểm toán tìm thấy một khoản chiết khấu anh Tâm chưa khai báo và không có gì tệ hơn. Nó được tìm ra mà không ghi một phím gõ nào."
        effects:
          [
            rel cuong trust -2,
            rel kien trust +4,
            rel tam trust -2,
            rep.boss +2,
            stress +4,
            fact refused_covert_surveillance witnessed,
          ]
      - p: 0.3
        ok: false
        en: "Mr Cuong says that he will buy the software himself. Kien tells you that the company's lawyers will be informed, and that you did the right thing."
        vi: 'Anh Cường nói anh sẽ tự mua phần mềm. Anh Kiên nói với anh/chị rằng luật sư của công ty sẽ được báo và anh/chị đã làm đúng.'
        effects:
          [
            rel cuong trust -5,
            rel kien trust +4,
            rep.boss -2,
            stress +6,
            fact refused_covert_surveillance witnessed,
          ]
  - en: 'Agree to log only the websites and the files he opens on the company laptop, for two weeks, with a written approval from Kien and a notice in the acceptable-use policy.'
    vi: 'Đồng ý chỉ ghi các trang web và tệp anh ấy mở trên laptop công ty, trong hai tuần, với phê duyệt bằng văn bản của anh Kiên và thông báo trong chính sách sử dụng hợp lý.'
    outcomes:
      - p: 1
        en: "The log is narrow, documented and covered by the policy. It shows that Tam visited a supplier's site fourteen times, which was part of his job."
        vi: 'Nhật ký hẹp, có hồ sơ và nằm trong chính sách. Nó cho thấy anh Tâm vào trang của nhà cung cấp mười bốn lần, vốn là một phần công việc của anh.'
        effects: [rel cuong trust +1, rel kien trust +1, stress +3]
  - en: 'Install the keylogger and screenshot tool covertly, and send Mr Cuong the recordings.'
    vi: 'Cài phần mềm ghi phím và chụp màn hình bí mật và gửi cho anh Cường các bản ghi.'
    outcomes:
      - p: 0.7
        en: 'The recordings contain a supplier, a personal bank login and a long conversation with a doctor. Mr Cuong reads all three, and tells you that you are very useful.'
        vi: 'Các bản ghi có một nhà cung cấp, một lần đăng nhập ngân hàng cá nhân và một cuộc trò chuyện dài với bác sĩ. Anh Cường đọc cả ba và bảo anh/chị rất hữu ích.'
        effects:
          [
            rel cuong trust +6,
            rel kien trust -6,
            rel tam trust -6,
            rep.staff -6,
            stress +2,
            fact installed_keylogger private,
          ]
      - p: 0.3
        ok: false
        en: 'Tam finds the tool during a routine update. He takes the screen to Oanh and to a lawyer on the same afternoon, and the first line he says is the name of the person who installed it.'
        vi: 'Anh Tâm thấy công cụ trong một lần cập nhật định kỳ. Anh mang màn hình đến chị Oanh và một luật sư ngay chiều đó, và câu đầu tiên anh nói là tên người đã cài.'
        effects:
          [
            rel cuong trust +2,
            rel kien trust -10,
            rel tam trust -12,
            rel oanh trust -6,
            rep.boss -10,
            rep.staff -10,
            stress +9,
            fact installed_keylogger public,
          ]
