scene: it.shadow_cloud
place: meeting_room
tags: [data, shadow_it, dark]
weight: 3
cooldown: 40
when: [turn >= 12]
lines:
  - who: char:bao
    en: "My team is sharing price lists and buyers' files through a personal cloud account. It is faster than your server, which is slow and keeps asking for a VPN. Please do not block it. If you do, they will simply send everything by messaging apps."
    vi: 'Nhóm anh chia sẻ bảng giá và hồ sơ khách qua một tài khoản đám mây cá nhân. Nhanh hơn máy chủ của em vốn chậm và cứ đòi VPN. Làm ơn đừng chặn. Nếu chặn, họ sẽ gửi hết qua ứng dụng nhắn tin.'
choices:
  - en: "Offer a sanctioned cloud folder with single sign-on, move the files in a day with Bao's team, and then block the personal account."
    vi: 'Đề xuất thư mục đám mây được phê duyệt với đăng nhập một lần, chuyển tệp trong một ngày cùng nhóm anh Bảo và sau đó chặn tài khoản cá nhân.'
    cost: { hours: 4 }
    outcomes:
      - p: 0.7
        en: "The new folder is as fast as the personal one, and has an audit log. Bao says, grudgingly, 'It works.' Two people keep using the old account, and you chase them politely."
        vi: "Thư mục mới nhanh bằng cái cá nhân và có nhật ký kiểm toán. Anh Bảo nói, miễn cưỡng, 'Chạy được.' Hai người vẫn dùng tài khoản cũ, và anh/chị nhắc họ lịch sự."
        effects: [rel bao trust -1, rel kien trust +3, rep.boss +2, stress +4]
      - p: 0.3
        ok: false
        en: 'The migration breaks a link that the sales team relied on, and a buyer cannot open a file for a day. Bao tells everyone that the new system is a failure. You fix it, and say nothing.'
        vi: 'Việc chuyển đổi làm hỏng một liên kết nhóm bán hàng dựa vào, và một khách không mở được tệp một ngày. Anh Bảo nói với mọi người hệ thống mới thất bại. Anh/chị sửa và không nói gì.'
        effects: [rel bao trust -4, rel kien trust +2, stress +5]
  - en: "Allow the personal account for non-confidential files only, and put the buyers' files on the company server with a faster VPN."
    vi: 'Cho phép tài khoản cá nhân chỉ với tệp không mật và đặt hồ sơ khách trên máy chủ công ty với VPN nhanh hơn.'
    outcomes:
      - p: 1
        en: 'A compromise that half-works. The VPN is faster, and the personal account keeps what it should not. Kien asks for a review in three months.'
        vi: 'Một thỏa hiệp chạy được một nửa. VPN nhanh hơn, và tài khoản cá nhân vẫn giữ những gì không nên giữ. Anh Kiên xin rà soát sau ba tháng.'
        effects: [rel bao trust +1, stress +3]
  - en: "Leave it alone. It is Bao's team's choice, and IT has enough to do."
    vi: 'Để yên. Đó là lựa chọn của nhóm anh Bảo, và IT đã đủ việc.'
    outcomes:
      - p: 0.7
        en: "Everyone is happy for four months. The personal account is shared with a former employee's address, and nobody notices."
        vi: 'Ai cũng vui bốn tháng. Tài khoản cá nhân được chia sẻ với địa chỉ của một nhân viên đã nghỉ, và không ai để ý.'
        effects: [rel bao trust +4, rel kien trust -2, stress +1, fact allowed_shadow_cloud private]
      - p: 0.3
        ok: false
        en: "A salesman leaves for a rival, and the personal account goes with him, along with the buyers' price list. Kien asks why the company had no copy of the audit trail."
        vi: 'Một nhân viên kinh doanh sang đối thủ, và tài khoản cá nhân đi cùng, kèm bảng giá khách hàng. Anh Kiên hỏi vì sao công ty không có bản sao dấu vết kiểm toán.'
        effects:
          [
            rel bao trust +2,
            rel kien trust -6,
            rep.boss -6,
            rep.buyer -4,
            stress +6,
            fact allowed_shadow_cloud witnessed,
          ]
