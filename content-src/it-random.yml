scene: it.usb_found
place: it_room
tags: [security, physical, dark]
weight: 2
cooldown: 40
when: [turn >= 10]
lines:
  - who: char:bin
    en: "I found a USB stick in the car park with a label that says 'Payroll 2025'. I put it in my laptop to see whose it was, and a window flickered, and then closed. Now the laptop is acting oddly. I am sorry. Should I just wipe it?"
    vi: "Em nhặt được một chiếc USB ở bãi đỗ xe có nhãn 'Bảng lương 2025'. Em cắm vào laptop xem của ai và một cửa sổ nháy rồi đóng. Giờ laptop chạy lạ. Em xin lỗi. Em xóa sạch luôn nhé?"
choices:
  - en: 'Take the laptop off the network, keep it as it is for analysis, reassure Bin that reporting it quickly was the right call, and check whether anything else was exposed.'
    vi: 'Rút laptop khỏi mạng, giữ nguyên để phân tích, trấn an Bin rằng báo nhanh là đúng và kiểm tra xem còn gì khác bị lộ không.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: "The laptop has a basic credential stealer. It is cleaned, and the passwords that were typed in the last hour are changed. Bin says 'Thank you for not shouting.' You write the incident down, and nobody else needs to be told."
        vi: "Laptop có một công cụ đánh cắp thông tin đăng nhập cơ bản. Nó được dọn sạch, và các mật khẩu gõ trong giờ qua được đổi. Bin nói 'Cảm ơn anh/chị đã không mắng.' Anh/chị ghi sự cố lại, và không ai khác cần được báo."
        effects:
          [
            rel bin trust +4,
            rel kien trust +3,
            stress +3,
            fact reported_incident_promptly witnessed,
          ]
      - p: 0.2
        ok: false
        en: 'The stealer had already sent three passwords. You rotate them within the hour, and one is already used from another country. Kien asks for a report, and you have one.'
        vi: 'Công cụ đánh cắp đã gửi ba mật khẩu. Anh/chị đổi chúng trong một giờ, và một cái đã được dùng từ nước khác. Anh Kiên xin báo cáo, và anh/chị có sẵn.'
        effects:
          [
            rel bin trust +3,
            rel kien trust +3,
            stress +6,
            fact reported_incident_promptly witnessed,
          ]
  - en: 'Tell Bin to wipe the laptop and reinstall it, and keep the story to yourselves so that it does not become a lecture for everybody.'
    vi: 'Bảo Bin xóa và cài lại laptop và giữ chuyện này giữa hai người để nó không thành bài giảng cho mọi người.'
    outcomes:
      - p: 0.6
        en: "The laptop is clean in an hour. Nobody learns that a stranger's USB works in this building, including the other twelve people who will pick up the next one."
        vi: 'Laptop sạch sau một giờ. Không ai biết USB của người lạ chạy được trong tòa nhà này, kể cả mười hai người khác sẽ nhặt chiếc tiếp theo.'
        effects: [rel bin trust +1, rel kien trust -2, stress +2, fact plugged_unknown_usb private]
      - p: 0.4
        ok: false
        en: "Two days later another USB, with the same label, is plugged into a finance machine. The first incident was in nobody's record, and the second is in Duc's."
        vi: 'Hai ngày sau một chiếc USB khác, cùng nhãn, được cắm vào máy tài chính. Sự cố đầu không có trong hồ sơ của ai, và sự cố sau nằm trong hồ sơ anh Đức.'
        effects:
          [
            rel bin trust +1,
            rel kien trust -6,
            rel duc trust -4,
            rep.boss -4,
            rep.finance -4,
            stress +6,
            fact plugged_unknown_usb witnessed,
          ]
  - en: 'Tell Bin to give you the stick, and plug it into the finance server to see what is on it.'
    vi: 'Bảo Bin đưa chiếc USB cho anh/chị và cắm vào máy chủ tài chính để xem có gì.'
    outcomes:
      - p: 0.6
        en: 'The stick is a clean, empty one. You were lucky, and the file server is the one place you should never have tried.'
        vi: 'Chiếc USB trống và sạch. Anh/chị may mắn, và máy chủ tệp là nơi duy nhất anh/chị không bao giờ nên thử.'
        effects: [rel bin trust -1, rel kien trust -3, stress +2, fact plugged_unknown_usb private]
      - p: 0.4
        ok: false
        en: 'The stick runs a script on the finance server. It copies a folder, and the antivirus flags it at once. Kien is called, and the log has your login on it.'
        vi: 'Chiếc USB chạy một đoạn mã trên máy chủ tài chính. Nó sao chép một thư mục, và phần mềm diệt virus đánh dấu ngay. Anh Kiên được gọi, và nhật ký có tài khoản của anh/chị.'
        effects:
          [
            rel bin trust -2,
            rel kien trust -9,
            rel duc trust -5,
            rep.boss -8,
            rep.finance -6,
            stress +8,
            fact plugged_unknown_usb witnessed,
          ]
