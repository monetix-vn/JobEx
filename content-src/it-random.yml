scene: it.vendor_gift
place: meeting_room
tags: [vendor, gifts, dark]
weight: 2
cooldown: 40
when: [turn >= 12]
lines:
  - who: char:son
    en: 'Our cloud backup service is exactly what you need, and we can start next month. We also have a small thank-you for the people who help us: a nice laptop for you, personally, and a commission of five percent if you make the recommendation to Mr Kien. It is how we always work with our partners.'
    vi: 'Dịch vụ sao lưu đám mây của bọn em đúng là thứ anh/chị cần, và có thể bắt đầu tháng sau. Bọn em cũng có một lời cảm ơn nhỏ cho những người giúp mình: một chiếc laptop đẹp cho anh/chị, riêng cá nhân, và hoa hồng năm phần trăm nếu anh/chị giới thiệu với anh Kiên. Đó là cách bọn em luôn làm với đối tác.'
choices:
  - en: 'Decline the laptop and the commission, tell Mr Son that you will include his service in a proper comparison with two others, and declare the approach to Kien.'
    vi: 'Từ chối chiếc laptop và hoa hồng, nói với anh Sơn rằng anh/chị sẽ đưa dịch vụ của anh vào một so sánh đàng hoàng với hai dịch vụ khác và báo anh Kiên về lời mời.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: "Mr Son laughs and says 'Fair', and his service comes second. The comparison goes to Kien with the criteria, and Kien signs the winner's contract. Nobody sends you a laptop."
        vi: "Anh Sơn cười và nói 'Công bằng', và dịch vụ của anh xếp thứ hai. Bản so sánh đến anh Kiên kèm tiêu chí, và anh Kiên ký hợp đồng cho bên thắng. Không ai gửi anh/chị laptop."
        effects:
          [
            rel son trust +1,
            rel kien trust +4,
            rep.finance +2,
            rep.boss +2,
            stress +3,
            fact declared_vendor_approach witnessed,
          ]
      - p: 0.2
        ok: false
        en: "Mr Son's company wins the comparison on merit. You have to explain to Kien that you declined the gift and still recommend him, and Kien asks for an independent review of the scoring."
        vi: 'Công ty anh Sơn thắng bản so sánh nhờ chất lượng. Anh/chị phải giải thích với anh Kiên rằng anh/chị đã từ chối quà và vẫn khuyến nghị anh, và anh Kiên yêu cầu một đánh giá độc lập về cách chấm.'
        effects:
          [rel son trust +2, rel kien trust +3, stress +4, fact declared_vendor_approach witnessed]
  - en: 'Decline the commission, but accept a modest conference ticket that the vendor offers to all customers, and enter it in the gift register.'
    vi: 'Từ chối hoa hồng nhưng nhận một vé hội nghị khiêm tốn nhà cung cấp tặng mọi khách hàng và ghi vào sổ quà tặng.'
    outcomes:
      - p: 1
        en: 'The ticket is logged. The comparison goes ahead with three vendors, and the register has a line that Kien reads with interest.'
        vi: 'Vé được ghi lại. Bản so sánh tiến hành với ba nhà cung cấp, và sổ có một dòng mà anh Kiên đọc với sự quan tâm.'
        effects: [rel son trust +2, rel kien trust +1, stress +2]
  - en: "Accept the laptop and the commission, and recommend Mr Son's service to Kien."
    vi: 'Nhận laptop và hoa hồng và giới thiệu dịch vụ của anh Sơn cho anh Kiên.'
    outcomes:
      - p: 0.7
        en: "The laptop is excellent. Mr Son's service is adequate and expensive. You enter nothing in the register, and Kien signs the contract on your recommendation."
        vi: 'Chiếc laptop rất tốt. Dịch vụ của anh Sơn tạm được và đắt. Anh/chị không ghi gì vào sổ, và anh Kiên ký hợp đồng theo khuyến nghị của anh/chị.'
        effects: [rel son trust +6, rel kien trust -3, stress -1, fact accepted_vendor_gift private]
      - p: 0.3
        ok: false
        en: 'A competing vendor protests the award and mentions the laptop, which Mr Son had also offered to them as a counter-bid. Duc asks where the laptop came from.'
        vi: 'Một nhà cung cấp đối thủ phản đối kết quả và nhắc đến chiếc laptop mà anh Sơn cũng đã đề nghị với họ như một đòn đáp trả. Anh Đức hỏi laptop từ đâu ra.'
        effects:
          [
            rel son trust +2,
            rel kien trust -7,
            rel duc trust -5,
            rep.boss -6,
            rep.finance -5,
            stress +6,
            fact accepted_vendor_gift witnessed,
          ]
