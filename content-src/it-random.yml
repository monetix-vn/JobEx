# IT Support and Systems Administrator: everyday incidents and consequences (docs/story/it.md).
scene: it.boss_password
place: meeting_room
tags: [passwords, executives, dark]
weight: 3
cooldown: 30
when: [turn >= 8]
lines:
  - who: char:cuong
    en: 'I keep forgetting my password. Set it to something simple I can remember, like the company name and the year, and give a copy to my assistant so that she can read my mail when I travel. And turn off that second step thing. It is a waste of my time.'
    vi: 'Anh cứ quên mật khẩu. Đặt cho anh cái gì đơn giản dễ nhớ, như tên công ty và năm, và đưa một bản cho trợ lý để cô ấy đọc thư giúp khi anh đi công tác. Và tắt cái bước thứ hai đó đi. Phí thời gian của anh.'
choices:
  - en: 'Set up a password manager for Mr Cuong, enable delegated mailbox access for his assistant in her own name, and keep two-step sign-in with a quick app prompt.'
    vi: 'Cài trình quản lý mật khẩu cho anh Cường, bật quyền ủy quyền hộp thư cho trợ lý mang tên cô và giữ đăng nhập hai bước với thông báo nhanh trên ứng dụng.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.7
        en: "Mr Cuong grumbles for two days, then says 'Fine, it is easy.' His assistant has her own access, and the log shows who reads what. Kien nods across the room."
        vi: "Anh Cường càu nhàu hai ngày rồi nói 'Được, dễ thôi.' Trợ lý có quyền riêng, và nhật ký cho thấy ai đọc gì. Anh Kiên gật đầu từ phía bên kia phòng."
        effects: [rel cuong trust -1, rel kien trust +3, rep.boss +2, stress +2]
      - p: 0.3
        ok: false
        en: 'Mr Cuong says the new set-up is too complicated and goes back to a paper note under his keyboard. You find it on the third day, and photograph it for the register.'
        vi: 'Anh Cường nói cách mới quá phức tạp và quay lại mảnh giấy dưới bàn phím. Ngày thứ ba anh/chị thấy nó và chụp ảnh cho sổ đăng ký.'
        effects: [rel cuong trust -3, rel kien trust +2, stress +3]
  - en: 'Set a longer password that he can remember as a phrase, and leave two-step sign-in on.'
    vi: 'Đặt mật khẩu dài hơn mà anh nhớ được như một câu và giữ đăng nhập hai bước.'
    outcomes:
      - p: 1
        en: 'It is a good compromise. Mr Cuong stops complaining after a week, and complains about something else.'
        vi: 'Đó là thỏa hiệp tốt. Anh Cường thôi phàn nàn sau một tuần, và phàn nàn chuyện khác.'
        effects: [rel cuong trust +1, stress +1]
  - en: 'Set a simple password, share it with the assistant, and turn off two-step sign-in, as asked.'
    vi: 'Đặt mật khẩu đơn giản, chia sẻ với trợ lý và tắt đăng nhập hai bước như được yêu cầu.'
    outcomes:
      - p: 0.7
        en: "Mr Cuong is delighted. Three weeks later, his account sends two hundred phishing emails to the buyers' list."
        vi: 'Anh Cường rất vui. Ba tuần sau, tài khoản của anh gửi hai trăm email lừa đảo đến danh sách khách.'
        effects:
          [rel cuong trust +4, rel kien trust -3, stress +2, fact shared_boss_password private]
      - p: 0.3
        ok: false
        en: "The account is hijacked in the first week, and a fake invoice with Mr Cuong's name goes to Anders. Duc catches it a day later. Kien asks who set the password."
        vi: 'Tài khoản bị chiếm trong tuần đầu, và một hóa đơn giả mang tên anh Cường gửi đến ông Anders. Một ngày sau anh Đức phát hiện. Anh Kiên hỏi ai đặt mật khẩu.'
        effects:
          [
            rel cuong trust +2,
            rel kien trust -8,
            rel duc trust -3,
            rep.boss -6,
            rep.buyer -4,
            stress +7,
            fact shared_boss_password witnessed,
          ]
---
scene: it.pirated_software
place: it_room
tags: [licences, audit, dark]
weight: 3
cooldown: 40
when: [turn >= 10]
lines:
  - who: char:yen
    en: 'I am carrying out a software licence check on behalf of two vendors. I would like to see the install list for the design and engineering machines, and your purchase records. I notice that some of the machines run a drawing package that appears to be cracked.'
    vi: 'Tôi tiến hành kiểm tra bản quyền phần mềm thay mặt hai nhà cung cấp. Tôi muốn xem danh sách cài đặt các máy thiết kế và kỹ thuật và hồ sơ mua sắm. Tôi thấy một số máy chạy một phần mềm vẽ có vẻ đã bị bẻ khóa.'
choices:
  - en: 'Show Yen the real install list and purchase records, explain the gap, and ask for time to buy licences or switch tools, with a written plan.'
    vi: 'Cho chị Yến xem danh sách cài đặt thật và hồ sơ mua, giải thích khoảng thiếu và xin thời gian mua bản quyền hoặc đổi công cụ, kèm kế hoạch bằng văn bản.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: 'Yen agrees to a ninety-day plan and a settlement at a discount. The company buys twelve licences and moves four machines to an open-source tool. It costs, and it ends.'
        vi: 'Chị Yến đồng ý kế hoạch chín mươi ngày và một thỏa thuận giảm giá. Công ty mua mười hai bản quyền và chuyển bốn máy sang công cụ mã nguồn mở. Tốn kém, và kết thúc.'
        effects: [rel yen trust +4, rel kien trust +3, rep.boss +1, stress +4]
      - p: 0.3
        ok: false
        en: 'The settlement is larger than the budget. Mr Cuong says IT should have found this earlier. You show him the request you wrote in March for exactly this.'
        vi: 'Khoản thỏa thuận lớn hơn ngân sách. Anh Cường nói IT lẽ ra phải phát hiện sớm hơn. Anh/chị cho anh xem yêu cầu đã viết hồi tháng Ba đúng về việc này.'
        effects: [rel yen trust +3, rel kien trust +3, rel cuong trust -2, stress +5]
  - en: 'Uninstall the cracked package from every machine overnight, and tell the designers to use the old version for now.'
    vi: 'Gỡ bản phần mềm bị bẻ khóa khỏi mọi máy qua đêm và bảo các nhà thiết kế dùng phiên bản cũ tạm thời.'
    outcomes:
      - p: 1
        en: "Yen sees clean machines, and a log of the removal. She says 'That is a start', and asks for the history. The designers lose a day."
        vi: "Chị Yến thấy các máy sạch và nhật ký việc gỡ. Chị nói 'Đó là một khởi đầu' và xin lịch sử. Các nhà thiết kế mất một ngày."
        effects: [rel yen trust +1, stress +3]
  - en: 'Tell Yen that the machines belong to the designers and IT does not manage their software.'
    vi: 'Nói với chị Yến các máy thuộc các nhà thiết kế và IT không quản lý phần mềm của họ.'
    outcomes:
      - p: 0.5
        en: "Yen writes that down, politely. Her report names the company, the machines and the department, and says that IT 'declined to verify'."
        vi: "Chị Yến ghi lại, lịch sự. Báo cáo của chị nêu tên công ty, các máy và bộ phận, và ghi rằng IT 'từ chối xác minh'."
        effects:
          [
            rel yen trust -4,
            rel kien trust -3,
            rep.boss -2,
            stress +3,
            fact used_pirated_software private,
          ]
      - p: 0.5
        ok: false
        en: "The vendor's lawyer sends a letter with the number of installations, the dates and a claim fifteen times the licence price. Kien reads it twice and forwards it to Mr Cuong."
        vi: 'Luật sư của nhà cung cấp gửi thư kèm số lượng cài đặt, ngày tháng và yêu cầu bồi thường gấp mười lăm lần giá bản quyền. Anh Kiên đọc hai lần và chuyển cho anh Cường.'
        effects:
          [
            rel yen trust -6,
            rel kien trust -6,
            rel cuong trust -3,
            rep.boss -6,
            stress +7,
            fact used_pirated_software public,
          ]
