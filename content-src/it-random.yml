scene: it.blame_meeting
place: meeting_room
tags: [pressure, consequence]
weight: 6
cooldown: 52
when: [month in 11 12, turn >= 44]
when_any:
  [
    fact.hid_security_incident >= 1,
    fact.paid_ransom_secretly >= 1,
    fact.read_mailbox_without_authorisation >= 1,
    fact.shared_personal_findings >= 1,
    fact.installed_keylogger >= 1,
    fact.deleted_security_logs >= 1,
  ]
lines:
  - who: char:cuong
    en: "A lawyer's letter arrived this morning about the mailboxes, and a second one from the data authority about the breach. The directors meet tomorrow. I want to know who in IT is responsible, and I want it from you first."
    vi: 'Sáng nay có thư của luật sư về các hộp thư, và thư thứ hai từ cơ quan bảo vệ dữ liệu về vụ rò rỉ. Ngày mai các giám đốc họp. Anh muốn biết ai ở IT chịu trách nhiệm, và muốn nghe từ em trước.'
choices:
  - en: 'Tell him the real account: what each person asked, what you agreed, and your own part. Show him the tickets and the emails.'
    vi: 'Nói với anh bản tường trình thật: ai nhờ gì, anh/chị đồng ý gì và phần của chính mình. Cho anh xem các phiếu và email.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: "Mr Cuong listens, and calls the lawyer. The company's answer is an offer to put everything right. You are moved off access administration and keep your job and, eventually, your name."
        vi: 'Anh Cường lắng nghe và gọi luật sư. Câu trả lời của công ty là đề nghị khắc phục tất cả. Anh/chị bị chuyển khỏi quản trị quyền truy cập và giữ được việc và về sau là cả danh tiếng.'
        effects:
          [
            rel cuong trust -1,
            rel kien trust +2,
            rel bin trust +3,
            rep.boss -8,
            stress +7,
            fact came_clean_to_auditor witnessed,
          ]
  - en: 'Say that each of those decisions was taken on the instruction of a director, and that IT followed instructions.'
    vi: 'Nói mỗi quyết định đó được đưa ra theo chỉ đạo của một giám đốc và IT làm theo chỉ đạo.'
    outcomes:
      - p: 0.4
        en: 'Mr Cuong treats it as shared fault. Nobody leaves the room liked.'
        vi: 'Anh Cường coi đó là lỗi chung. Không ai rời phòng với thiện cảm.'
