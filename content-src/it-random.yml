scene: it.quoc_asks_access
place: it_room
tags: [audit, access, dark, consequence]
weight: 6
cooldown: 52
when: [month in 10 11, turn >= 40]
when_any:
  [
    fact.shared_admin_login >= 1,
    fact.granted_conflicting_erp_rights >= 1,
    fact.left_leaver_account_active >= 1,
    fact.edited_posted_records_directly >= 1,
    fact.shared_boss_password >= 1,
  ]
lines:
  - who: char:quoc
    en: 'My review of the logs has raised some questions. A payment module login used from two places at once, a user who can approve and pay, an account of a departed employee that is still being used, and a change in the finance database that has no ticket. I would like to hear from the person who administers these systems.'
    vi: 'Rà soát nhật ký của tôi nêu ra vài câu hỏi. Một tài khoản mô-đun thanh toán được dùng từ hai nơi cùng lúc, một người dùng vừa duyệt vừa thanh toán được, một tài khoản của nhân viên đã nghỉ vẫn đang được dùng và một thay đổi trong cơ sở dữ liệu tài chính không có phiếu. Tôi muốn nghe từ người quản trị các hệ thống này.'
choices:
  - en: 'Tell him what happened: who asked, what you agreed, what the policy required, and what is being fixed. Give him the logs and the tickets you do have.'
    vi: 'Kể cho ông ấy những gì đã xảy ra: ai nhờ, anh/chị đã đồng ý gì, chính sách yêu cầu gì và đang sửa gì. Đưa ông các nhật ký và các phiếu anh/chị có.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Quoc writes it all down. The finding is serious, but it is recorded as 'self-reported and corrected'. The rights are fixed, the entry is documented, and you receive a formal warning."
        vi: "Anh Quốc ghi lại tất cả. Phát hiện nghiêm trọng, nhưng được ghi nhận là 'tự báo cáo và đã sửa'. Các quyền được sửa, bút toán được lập hồ sơ, và anh/chị nhận cảnh cáo chính thức."
        effects:
          [
            rel quoc trust +2,
            rel kien trust -2,
            rel duc trust -3,
            rep.boss -5,
            stress +6,
            fact came_clean_to_auditor witnessed,
          ]
  - en: 'Give him the logs and say that every one of those requests came from a director, and that IT did as it was told.'
    vi: 'Đưa ông các nhật ký và nói mọi yêu cầu đó đến từ một giám đốc và IT làm theo lời bảo.'
    outcomes:
      - p: 0.4
        en: "Quoc notes that the administrator's own account performed each action. He writes it down, carefully."
        vi: 'Anh Quốc ghi rằng tài khoản của chính quản trị viên thực hiện từng hành động. Anh ghi lại, cẩn thận.'
        effects: [rel quoc trust -5, rel kien trust -4, rel duc trust -6, rep.boss -4, stress +4]
      - p: 0.6
        ok: false
        en: 'Hanh and Thu are called in. Each has her own copy of the request, and the tickets that do not exist are the first thing Quoc points at.'
        vi: 'Chị Hạnh và Thư được gọi vào. Mỗi người có bản sao yêu cầu của mình, và các phiếu không tồn tại là điều đầu tiên anh Quốc chỉ ra.'
        effects:
          [
            rel quoc trust -10,
            rel hanh trust -6,
            rel thu trust -6,
            rel kien trust -8,
            rep.boss -10,
            stress +8,
          ]
  - en: 'Say you do not recall the details, and offer to look.'
    vi: 'Nói anh/chị không nhớ chi tiết và đề nghị đi tìm.'
    outcomes:
      - p: 0.4
        en: 'Quoc gives you a week. You find the logs and hand them over. It is not the whole truth, but it is something.'
        vi: 'Anh Quốc cho anh/chị một tuần. Anh/chị tìm thấy nhật ký và nộp. Không phải toàn bộ sự thật, nhưng là một phần.'
        effects: [rel quoc trust -4, stress +4, fact stalled_the_auditor private]
      - p: 0.6
        ok: false
        en: "The directory audit log, the ERP's change history and the mail gateway log arrive on the same afternoon. Quoc has them on the table next to your notes."
        vi: 'Nhật ký kiểm toán thư mục, lịch sử thay đổi của ERP và nhật ký cổng thư đến cùng một buổi chiều. Anh Quốc để chúng trên bàn cạnh ghi chú của anh/chị.'
        effects:
          [
            rel quoc trust -10,
            rel kien trust -6,
            rep.boss -8,
            rep.finance -6,
            stress +7,
            fact stalled_the_auditor witnessed,
          ]
