lesson:
  en: 'The account with the most authority is the one an attacker wants most. Convenience for the director is a weakness for everyone whose email he can send.'
  vi: 'Tài khoản có quyền hạn lớn nhất là thứ kẻ tấn công muốn nhất. Sự tiện lợi cho giám đốc là điểm yếu cho mọi người mà anh có thể gửi email tới.'
