scene: it.direct_edit
place: finance_office
tags: [erp, records, dark]
weight: 3
cooldown: 30
when: [turn >= 12, month in 3 6 9 12]
lines:
  - who: char:duc
    en: 'An invoice for ninety million was posted in the wrong period. The quarter is closed, and reopening it needs three signatures and a day. You have database access. Could you just change the posting date directly in the table? Nobody would see it, and the numbers would be right.'
    vi: 'Một hóa đơn chín mươi triệu bị hạch toán sai kỳ. Quý đã đóng, và mở lại cần ba chữ ký và một ngày. Em có quyền truy cập cơ sở dữ liệu. Em sửa thẳng ngày hạch toán trong bảng được không? Không ai thấy, và các con số sẽ đúng.'
choices:
  - en: 'Raise a change request, get the three signatures, reopen the period under control, correct the entry through the ERP, and close it again.'
    vi: 'Lập yêu cầu thay đổi, lấy ba chữ ký, mở lại kỳ có kiểm soát, sửa bút toán qua ERP và đóng lại.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.85
        en: "It takes a day and a half. The entry is corrected with a trail that anybody can follow. Duc says: 'You are slow, and the only person I will not need to explain.'"
        vi: "Mất một ngày rưỡi. Bút toán được sửa với dấu vết ai cũng theo dõi được. Anh Đức nói: 'Em chậm, và là người duy nhất anh không cần giải thích.'"
        effects: [rel duc trust +1, rel kien trust +3, rel hanh trust +2, rep.finance +3, stress +3]
      - p: 0.15
        ok: false
        en: 'One of the three signatories is travelling, and the reopening slips to Monday. The bank pack is a day late. Duc is not amused, and the entry is clean.'
        vi: 'Một trong ba người ký đang đi công tác, và việc mở lại trễ đến thứ Hai. Bộ báo cáo cho ngân hàng trễ một ngày. Anh Đức không vui, và bút toán sạch.'
        effects: [rel duc trust -2, rel kien trust +3, rep.finance +1, stress +4]
  - en: 'Offer a correcting journal entry in the open period, with a note explaining the original period, and no change to closed data.'
    vi: 'Đề xuất bút toán điều chỉnh trong kỳ đang mở kèm ghi chú giải thích kỳ gốc và không đổi dữ liệu đã đóng.'
    outcomes:
      - p: 1
        en: "Hanh agrees, and posts the correction with her own note. The quarter's numbers stay as they were. The next quarter carries the fix, in full view."
        vi: 'Chị Hạnh đồng ý và hạch toán điều chỉnh kèm ghi chú của chính chị. Số của quý vẫn như cũ. Quý sau mang bản sửa, rõ ràng.'
        effects: [rel duc trust +1, rel hanh trust +2, stress +2]
  - en: 'Change the posting date directly in the database, and tell no one.'
    vi: 'Sửa thẳng ngày hạch toán trong cơ sở dữ liệu và không nói với ai.'
    outcomes:
      - p: 0.7
        en: 'It takes thirty seconds. The numbers are right, and the audit trail is not. Duc thanks you warmly. You are now the person who can change the numbers without anyone knowing.'
        vi: 'Mất ba mươi giây. Số liệu đúng, và dấu vết kiểm toán thì không. Anh Đức cảm ơn nồng nhiệt. Giờ anh/chị là người có thể đổi số liệu mà không ai biết.'
        effects:
          [
            rel duc trust +5,
            rel kien trust -5,
            stress +1,
            fact edited_posted_records_directly private,
          ]
      - p: 0.3
        ok: false
        en: "The ERP's integrity check compares the period totals with the ledger. It reports a mismatch at the next close, and Quoc traces it to a direct database change on the day you made it."
        vi: 'Phép kiểm tra tính toàn vẹn của ERP so tổng kỳ với sổ cái. Nó báo lệch ở kỳ chốt sau, và anh Quốc truy ra một thay đổi trực tiếp trong cơ sở dữ liệu vào đúng ngày anh/chị làm.'
        effects:
          [
            rel duc trust +2,
            rel kien trust -8,
            rel quoc trust -8,
            rep.boss -6,
            rep.finance -8,
            stress +7,
            fact edited_posted_records_directly witnessed,
          ]
