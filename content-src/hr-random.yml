fact: ended_probation_for_pregnancy
severity: 8
category: integrity
en: 'you ended a probation because the employee was pregnant, and wrote another reason'
vi: 'bạn chấm dứt thử việc vì nhân viên mang thai và ghi một lý do khác'
lesson:
  en: 'Pregnancy is protected by law. A false reason on the letter turns a hard business decision into discrimination with a written alibi, and the alibi is the evidence.'
  vi: 'Mang thai được pháp luật bảo vệ. Một lý do giả trong thư biến một quyết định kinh doanh khó thành phân biệt đối xử có sẵn lời biện hộ viết ra, và lời biện hộ chính là bằng chứng.'
