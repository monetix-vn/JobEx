fact: chained_contracts
severity: 5
category: integrity
en: 'you renewed fixed-term contracts with gaps to avoid giving workers an indefinite contract'
vi: 'bạn gia hạn hợp đồng xác định thời hạn có khoảng nghỉ để tránh phải ký không xác định thời hạn với công nhân'
lesson:
  en: 'A rule about contracts exists because chaining them takes security from workers who are doing permanent work. A gap week is a trick the law has already seen.'
  vi: 'Quy định về hợp đồng tồn tại vì việc nối chuỗi chúng lấy đi sự ổn định của công nhân làm việc lâu dài. Một tuần nghỉ là mánh mà luật đã thấy rồi.'
