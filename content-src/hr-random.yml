fact: underreported_insurance_base
severity: 6
category: integrity
en: 'you declared social insurance on a base pay lower than what workers were paid'
vi: 'bạn kê khai bảo hiểm xã hội trên mức lương thấp hơn mức công nhân thực nhận'
