fact: edited_overtime_records
severity: 6
category: integrity
en: 'you changed overtime records so that nobody exceeded the legal cap on paper'
vi: 'bạn sửa hồ sơ giờ làm thêm để trên giấy không ai vượt mức trần luật định'
lesson:
  en: "An overtime cap protects tired people around machines. Editing the sheet hides the breach from everyone who could prevent the next one, and leaves the workers' pay and the paper in disagreement."
  vi: 'Mức trần giờ làm thêm bảo vệ những người mệt mỏi quanh máy móc. Sửa bảng ghi giấu vi phạm khỏi mọi người có thể ngăn lần sau, và để lương công nhân và giấy tờ mâu thuẫn nhau.'
