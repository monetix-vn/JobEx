fact: backdated_hr_records
severity: 7
category: integrity
en: 'you signed missing documents with their original dates, and aligned records before an inspection'
vi: 'bạn ký bổ sung tài liệu còn thiếu với ngày gốc và chỉnh hồ sơ trước một cuộc thanh tra'
lesson:
  en: 'Records are only worth anything if they were made when they say. Backdating a signature makes a gap into a forgery, and a missing signature is something you can explain, forgery you cannot.'
  vi: 'Hồ sơ chỉ có giá trị nếu được lập đúng lúc nó ghi. Ký lùi ngày biến chỗ thiếu thành giả mạo, và chữ ký thiếu thì giải thích được, giả mạo thì không.'
traces:
  - { type: document, visibility: 0.7, detectors: [internal_audit, boss, staff] }
witnessed:
  boss: -10
  staff: -8
public:
  boss: -16
  staff: -12
