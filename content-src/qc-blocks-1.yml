scene: qc.vy_spring_visit
place: meeting_room
tags: [audit, people, beat]
beat: 14-17
lines:
  - who: char:vy
    en: "I am the buyer's external auditor. I would like to see your calibration records, the last six months of incoming inspections, and two lots from start to finish: raw material to shipment. Take your time, but I do read the dates."
    vi: 'Tôi là kiểm toán viên bên ngoài của khách hàng. Tôi muốn xem hồ sơ hiệu chuẩn, sáu tháng kiểm nguyên liệu đầu vào gần nhất và hai lô từ đầu đến cuối: từ nguyên liệu đến xuất hàng. Cứ thong thả, nhưng tôi có đọc ngày tháng.'
  - who: char:khoa
    en: 'Show her what she asks for. If she asks something you do not know, say so.'
    vi: 'Đưa cho cô ấy những gì cô ấy yêu cầu. Nếu cô ấy hỏi điều em không biết thì cứ nói là không biết.'
choices:
  - en: 'Show her everything organised, including the records that needed corrections and the reasons.'
    vi: 'Cho chị ấy xem mọi thứ gọn gàng, kể cả hồ sơ đã phải sửa và lý do.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Vy traces two lots end to end without stopping. At the end she says: 'Traceable. That is rarer than people think.' Khoa exhales."
        vi: "Chị Vy truy hai lô từ đầu đến cuối không dừng. Cuối cùng chị nói: 'Truy vết được. Hiếm hơn người ta nghĩ.' Anh Khoa thở ra."
        effects: [rel vy trust +5, rel khoa trust +3, rep.boss +2, stress +1]
  - en: 'Answer what she asks and produce the files she requests.'
    vi: 'Trả lời những gì chị ấy hỏi và đưa các hồ sơ chị ấy yêu cầu.'
    cost: { hours: 1 }
    outcomes:
      - p: 1
        en: "A routine visit. Vy writes three observations. None is serious and two were already on Khoa's list."
        vi: 'Một buổi làm việc thường lệ. Chị Vy ghi ba quan sát. Không cái nào nghiêm trọng và hai cái đã có trong danh sách của anh Khoa.'
        effects: [rel vy trust +1, rel khoa trust +1]
  - en: 'Offer her the two best lots to trace, and steer her away from the calibration log.'
    vi: 'Đề nghị chị ấy truy hai lô tốt nhất và dẫn chị tránh nhật ký hiệu chuẩn.'
    outcomes:
      - p: 0.55
        en: 'Vy traces your two lots and finds nothing. She does not ask for the calibration log. You feel the small, dangerous relief of a shortcut that worked.'
        vi: 'Chị Vy truy hai lô của anh/chị và không thấy gì. Chị không hỏi nhật ký hiệu chuẩn. Anh/chị thấy sự nhẹ nhõm nhỏ, nguy hiểm của một lối tắt đã thành công.'
        effects: [rel vy trust -2, stress -1, fact steered_auditor_sample private]
      - p: 0.45
        ok: false
        en: 'Vy picks a third lot of her own and asks for the calibration log without looking up. The date on the last entry is ten weeks old.'
        vi: 'Chị Vy tự chọn một lô thứ ba và đòi nhật ký hiệu chuẩn mà không ngẩng lên. Ngày ở mục cuối đã cách mười tuần.'
        effects:
          [rel vy trust -9, rel khoa trust -5, stress +4, fact steered_auditor_sample witnessed]
