fact: signed_before_result
severity: 4
category: integrity
en: 'you signed a certificate before the last result was in'
vi: 'bạn ký chứng nhận trước khi có kết quả cuối cùng'
lesson:
  en: 'A signature on a certificate says every result is in and within spec. Signing first and hoping is how a small courtesy becomes a false statement.'
  vi: 'Chữ ký trên chứng nhận nói rằng mọi kết quả đã có và đạt chuẩn. Ký trước và hy vọng là cách một sự nể nang nhỏ thành lời khai sai.'
