fact: gamed_yield_kpi
severity: 5
category: integrity
en: 'you relabelled retests as first-pass results to improve a KPI'
vi: 'bạn gắn nhãn lại các lần kiểm lại thành kết quả lần đầu để cải thiện KPI'
lesson:
  en: 'Gaming a KPI makes the number look better while the problem stays. The next person to rely on that number will make a worse decision because of you.'
  vi: 'Làm đẹp KPI khiến con số trông tốt hơn trong khi vấn đề vẫn còn. Người tiếp theo dựa vào con số đó sẽ quyết định tệ hơn vì bạn.'
