fact: skimmed_lots_before_tet
severity: 5
category: integrity
en: 'you signed lots you had only skimmed, to catch the holiday shipment'
vi: 'bạn ký các lô chỉ xem lướt để kịp chuyến giao trước Tết'
lesson:
  en: 'A deadline is when inspection matters most. Signing lots you did not really check turns your signature into a formality, and formalities are not defences.'
  vi: 'Hạn chót là lúc kiểm tra quan trọng nhất. Ký các lô bạn không thực sự kiểm biến chữ ký thành thủ tục, và thủ tục không phải là lá chắn.'
