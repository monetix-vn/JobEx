fact: released_borderline_for_bonus
severity: 5
category: integrity
en: 'you released borderline lots so the plant would reach its bonus target'
vi: 'bạn cho xuất các lô sát ngưỡng để nhà máy đạt chỉ tiêu thưởng'
lesson:
  en: 'When a bonus depends on your signature, the rules have to hold hardest. Benefit of the doubt belongs to the customer, not to the target.'
  vi: 'Khi thưởng phụ thuộc vào chữ ký của bạn, quy tắc phải được giữ chặt nhất. Lợi ích của sự nghi ngờ thuộc về khách hàng, không phải chỉ tiêu.'
