fact: used_expired_standard
severity: 4
category: integrity
en: 'you kept using an expired reference standard'
vi: 'bạn tiếp tục dùng chất chuẩn đã hết hạn'
lesson:
  en: 'A reference standard defines what a test result means. Once it has expired, every result measured with it carries a doubt nobody can remove.'
  vi: 'Chất chuẩn xác định ý nghĩa của một kết quả kiểm. Khi đã hết hạn, mọi kết quả đo bằng nó mang một nghi ngờ không ai gỡ được.'
