scene: sup.breakdown_pressure
place: factory_floor
tags: [maintenance, pressure, dark]
weight: 3
cooldown: 26
when: [turn >= 10]
lines:
  - who: char:mai
    en: 'Press 1 has a hydraulic leak. It still works, but the pressure drops under load, and the ram can stick at the bottom. I need four hours to fix it properly. Bao is already asking when the line will be back at full.'
    vi: 'Máy ép 1 rò thủy lực. Vẫn chạy, nhưng áp suất giảm khi có tải và đầu ép có thể kẹt ở đáy. Chị cần bốn giờ để sửa cho đàng hoàng. Anh Bảo đã hỏi bao giờ chuyền chạy lại đủ.'
choices:
  - en: 'Stop press 1 for the four hours, move its job to press 3 at a slower rate, and tell Bao the new date.'
    vi: 'Dừng máy ép 1 bốn giờ, chuyển việc sang máy ép 3 với tốc độ chậm hơn và báo anh Bảo ngày mới.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: 'Mai fixes it in three and a half hours and tells the crew what she changed. Bao complains, and then stops.'
        vi: 'Chị Mai sửa trong ba tiếng rưỡi và nói với tổ chị đã đổi gì. Anh Bảo phàn nàn rồi thôi.'
        effects: [rel mai trust +4, rel bao trust -2, rep.production +2, stress +3]
      - p: 0.2
        ok: false
        en: 'Mai finds a second leak when she opens the line. The repair takes eight hours, and the order slips by a day.'
        vi: 'Chị Mai thấy chỗ rò thứ hai khi mở đường ống. Việc sửa mất tám giờ, và đơn hàng trễ một ngày.'
        effects: [rel mai trust +4, rel bao trust -4, rel lan trust -2, stress +5]
  - en: 'Run press 1 at half load until the weekend, and have Mai fix it then.'
    vi: 'Cho máy ép 1 chạy nửa tải đến cuối tuần rồi nhờ chị Mai sửa lúc đó.'
    outcomes:
      - p: 1
        en: 'It is a compromise with a risk. Mai watches the gauge every hour and does not like it. The weekend comes without a problem.'
        vi: 'Một thỏa hiệp có rủi ro. Chị Mai nhìn đồng hồ mỗi giờ và không thích. Cuối tuần đến mà không có chuyện gì.'
        effects: [rel mai trust +1, stress +3]
  - en: 'Keep press 1 running at full load, and tell Mai it can wait until the order ships.'
    vi: 'Giữ máy ép 1 chạy đủ tải và bảo chị Mai việc sửa chờ đến khi đơn giao xong.'
    outcomes:
      - p: 0.7
        en: 'The order ships. The ram sticks twice and the crew learns to step back. Mai writes the leak into the log, with the date and your name.'
        vi: 'Đơn giao xong. Đầu ép kẹt hai lần và tổ học cách lùi lại. Chị Mai ghi chỗ rò vào sổ, có ngày và tên anh/chị.'
        effects:
          [
            rel mai trust -5,
            rel bao trust +4,
            rep.production -1,
            stress +1,
            fact ran_machine_past_fault private,
          ]
      - p: 0.3
        ok: false
        en: 'On the third day the ram sticks on a part, and the crew has to free it with a bar. Binh sees the maintenance log and the production sheet on the same day.'
        vi: 'Ngày thứ ba đầu ép kẹt trên một chi tiết, và tổ phải gỡ bằng thanh sắt. Anh Bình thấy sổ bảo trì và phiếu sản xuất cùng một ngày.'
        effects:
          [
            rel mai trust -8,
            rel binh trust -8,
            rel lan trust -4,
            rep.boss -6,
            stress +7,
            fact ran_machine_past_fault witnessed,
          ]
