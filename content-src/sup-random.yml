# Production Line Supervisor: everyday incidents and consequences (docs/story/supervisor.md).
scene: sup.heat_day
place: factory_floor
tags: [safety, heat, pressure, dark]
weight: 3
cooldown: 26
when: [month in 4 5 6 7 8 9, turn >= 8]
lines:
  - who: char:hoa
    en: 'It is thirty-eight degrees on the floor. Two people have already gone dizzy, and Nam is not sweating, which is worse. Lan says the order cannot slip. I am saying what the crew is feeling.'
    vi: 'Dưới xưởng ba mươi tám độ. Hai người đã chóng mặt, và Nam không ra mồ hôi, như vậy còn tệ hơn. Chị Lan nói đơn hàng không được trễ. Chị nói điều cả tổ đang cảm thấy.'
choices:
  - en: 'Stop the two presses nearest the furnace for twenty minutes, rotate everyone through the shade, bring water and salt, and log the stop.'
    vi: 'Dừng hai máy ép gần lò hai mươi phút, luân phiên mọi người ra chỗ mát, mang nước và muối, và ghi lại việc dừng.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.8
        en: 'The line loses an hour, and nobody collapses. Hoa brings the cold towels herself. Lan accepts the loss without a word.'
        vi: 'Chuyền mất một giờ, và không ai ngã quỵ. Chị Hoa tự mang khăn lạnh. Chị Lan chấp nhận tổn thất không nói gì.'
        effects: [rel hoa trust +4, rel lan trust -1, rep.staff +3, rep.production +1, stress +3]
      - p: 0.2
        ok: false
        en: "Lan says that the stop was too long. You show her the log with Nam's temperature on it. She does not raise the point again."
        vi: 'Chị Lan nói dừng như vậy là quá lâu. Anh/chị đưa chị xem sổ ghi có nhiệt độ của Nam. Chị không nhắc lại.'
        effects: [rel hoa trust +4, rel lan trust -3, rep.staff +3, stress +4]
  - en: 'Run all presses, with extra water and two five-minute breaks, and watch Nam.'
    vi: 'Cho chạy tất cả máy ép, thêm nước và hai lần nghỉ năm phút, và để mắt đến Nam.'
    outcomes:
      - p: 1
        en: "It is hot and nobody falls. Hoa says only 'It could have gone either way.'"
        vi: "Nóng và không ai ngã. Chị Hoa chỉ nói 'Có thể đã khác.'"
        effects: [rel hoa trust +1, stress +3]
  - en: 'Run everything, tell the crew heat is part of the job, and keep the order on time.'
    vi: 'Chạy hết, nói với tổ nóng là một phần của công việc và giữ đơn đúng hạn.'
    outcomes:
      - p: 0.7
        en: 'The order ships on time. Two people go home sick the next day. Hoa does not say what she thinks.'
        vi: 'Đơn giao đúng hạn. Hai người nghỉ ốm hôm sau. Chị Hoa không nói điều chị nghĩ.'
        effects:
          [
            rel hoa trust -4,
            rel lan trust +3,
            rep.staff -3,
            stress +1,
            fact ignored_heat_risk private,
          ]
      - p: 0.3
        ok: false
        en: 'Nam collapses at the press at two in the afternoon. The ambulance crosses the yard in front of the whole crew.'
        vi: 'Nam ngã gục ở máy ép lúc hai giờ chiều. Xe cấp cứu băng qua sân trước mặt cả tổ.'
        effects:
          [
            rel hoa trust -8,
            rel lan trust -4,
            rel binh trust -6,
            rep.boss -6,
            rep.staff -8,
            stress +8,
            fact ignored_heat_risk witnessed,
          ]
