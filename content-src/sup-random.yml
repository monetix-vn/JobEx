scene: sup.sang_asks_injury
place: meeting_room
tags: [audit, safety, dark, consequence]
weight: 6
cooldown: 52
when: [month in 10 11, turn >= 40]
when_any: [fact.hid_injury >= 1, fact.blamed_injured_worker >= 1, fact.ran_above_rated_speed >= 1]
lines:
  - who: char:sang
    en: 'I have interviewed your crew. Three of them say that a worker was hurt at the press, that he was told to say it was first aid, and that the press was running above its rating that week. I would like to see the injury log and the speed records, and hear from the supervisor what happened.'
    vi: 'Tôi đã phỏng vấn tổ của anh/chị. Ba người nói một công nhân bị thương ở máy ép, rằng cậu được dặn nói đó là sơ cứu, và rằng tuần đó máy ép chạy vượt định mức. Tôi muốn xem sổ chấn thương và hồ sơ tốc độ, và nghe từ giám sát chuyện gì đã xảy ra.'
choices:
  - en: 'Tell him what happened: the target, the speed, the record, and what you should have done. Give him the logs.'
    vi: 'Kể ông nghe chuyện gì đã xảy ra: chỉ tiêu, tốc độ, hồ sơ và điều lẽ ra anh/chị nên làm. Đưa ông các sổ.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Sang writes it all down. The finding is serious, but it is recorded as 'self-reported and corrected'. The record is amended, the speed procedure is rewritten, and you are given a formal warning."
        vi: "Ông Sáng ghi lại tất cả. Phát hiện nghiêm trọng, nhưng được ghi nhận là 'tự báo cáo và đã sửa'. Hồ sơ được điều chỉnh, quy trình tốc độ được viết lại, và anh/chị nhận cảnh cáo chính thức."
        effects:
          [
            rel sang trust +2,
            rel lan trust -2,
            rel hoa trust +3,
            rep.boss -5,
            stress +6,
            fact came_clean_to_auditor witnessed,
          ]
  - en: "Give him the logs and say the speed and the injury report were Lan's decisions, and that you followed them."
    vi: 'Đưa ông các sổ và nói tốc độ và báo cáo chấn thương là quyết định của chị Lan, anh/chị chỉ làm theo.'
    outcomes:
      - p: 0.35
        en: 'Sang looks at the target letter and notes that the target required the speed. He writes it down, carefully.'
        vi: 'Ông Sáng xem thư chỉ tiêu và ghi rằng chỉ tiêu đòi hỏi tốc độ đó. Ông ghi lại, cẩn thận.'
        effects: [rel sang trust -5, rel lan trust -8, rep.boss -4, stress +4]
      - p: 0.65
        ok: false
        en: 'Hoa is called in and says, quietly, that the supervisor told the crew to leave the pause check off, and that she has the shift notes. Nam shows his hand.'
        vi: 'Chị Hoa được gọi vào và khẽ nói giám sát bảo tổ bỏ bước kiểm tra tạm dừng, và chị có ghi chú ca. Nam giơ bàn tay.'
        effects: [rel sang trust -10, rel hoa trust -12, rel lan trust -8, rep.boss -10, stress +8]
  - en: 'Say you do not recall the details, and offer to look.'
    vi: 'Nói anh/chị không nhớ chi tiết và đề nghị đi tìm.'
    outcomes:
      - p: 0.4
        en: 'Sang gives you a week. You find the logs and hand them over. It is not the whole truth, but it is something.'
        vi: 'Ông Sáng cho anh/chị một tuần. Anh/chị tìm thấy các sổ và nộp. Không phải toàn bộ sự thật, nhưng là một phần.'
        effects: [rel sang trust -4, stress +4, fact stalled_the_inspector private]
      - p: 0.6
        ok: false
        en: "The crew gives Sang the clinic bill, the shift notes and the speed readings from the machine's own log. He has them on the table next to your notes."
        vi: 'Tổ đưa ông Sáng hóa đơn phòng khám, ghi chú ca và số liệu tốc độ từ nhật ký của chính máy. Ông để chúng trên bàn cạnh ghi chú của anh/chị.'
        effects:
          [
            rel sang trust -10,
            rel hoa trust -8,
            rel lan trust -6,
            rep.boss -8,
            stress +7,
            fact stalled_the_inspector witnessed,
          ]
---
scene: sup.blame_meeting
place: meeting_room
tags: [pressure, consequence]
weight: 6
cooldown: 52
when: [month in 11 12, turn >= 44]
when_any:
  [
    fact.inflated_output_count >= 1,
    fact.forced_early_return >= 1,
    fact.signed_false_training >= 1,
    fact.ran_machine_past_fault >= 1,
  ]
lines:
  - who: char:lan
    en: 'The inspection report names an incident on Line 3, a training sheet and a count that does not match the shipment. The directors want to know who is responsible. They will decide tomorrow. I want to hear it from you first.'
    vi: 'Báo cáo thanh tra nêu một sự cố ở chuyền 3, một bảng huấn luyện và một số đếm không khớp lô hàng. Ban giám đốc muốn biết ai chịu trách nhiệm. Ngày mai họ quyết. Chị muốn nghe từ em trước.'
choices:
  - en: 'Tell her the real account, including what you were asked, what you agreed, and your own part. Show the documents.'
    vi: 'Nói với chị bản tường trình thật, kể cả điều anh/chị được yêu cầu, điều anh/chị đồng ý và phần của chính mình. Đưa các tài liệu.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'Lan listens, and takes your account to the directors with her own signature beside it. You are moved to the packing line for three months, and you keep your job and, eventually, your name.'
        vi: 'Chị Lan lắng nghe và mang bản tường trình của anh/chị lên ban giám đốc kèm chữ ký của chính chị. Anh/chị bị chuyển sang chuyền đóng gói ba tháng, và giữ được việc và về sau là cả danh tiếng.'
        effects:
          [
            rel lan trust +2,
            rel hoa trust +4,
            rep.boss -8,
            stress +7,
            fact came_clean_to_auditor witnessed,
          ]
  - en: 'Say the crew was responsible for not following the pause checks and the training.'
    vi: 'Nói tổ chịu trách nhiệm vì không tuân thủ các bước kiểm tra tạm dừng và huấn luyện.'
    outcomes:
      - p: 0.4
        en: 'The directors treat it as shared fault. Two operators are moved, and everyone knows why.'
        vi: 'Ban giám đốc coi đó là lỗi chung. Hai công nhân bị chuyển, và ai cũng biết vì sao.'
        effects: [rel hoa trust -10, rep.boss -4, rep.staff -6, stress +4]
      - p: 0.6
        ok: false
        en: "Hoa has her own notes and Nam shows his hand. The 'shared fault' argument does not survive the room."
        vi: "Chị Hoa có ghi chú riêng và Nam giơ bàn tay. Lập luận 'lỗi chung' không sống sót trong căn phòng."
        effects: [rel hoa trust -12, rel lan trust -8, rep.boss -10, rep.staff -10, stress +8]
  - en: 'Say the target and the speed came from Lan, and she approved the report.'
    vi: 'Nói chỉ tiêu và tốc độ đến từ chị Lan và chị đã duyệt báo cáo.'
    outcomes:
      - p: 0.3
        en: "Lan says, quietly, 'That is true.' She takes her own share. She also never trusts you with a line again."
        vi: "Chị Lan khẽ nói: 'Đúng vậy.' Chị nhận phần của mình. Chị cũng không bao giờ tin em với một chuyền nữa."
        effects:
          [rel lan trust -20, rel lan loyalty -15, rep.boss -6, stress +5, fact blamed_boss private]
      - p: 0.7
        ok: false
        en: 'Lan has the draft you sent her, with the line about who decided the speed in it. She reads it aloud.'
        vi: 'Chị Lan có bản nháp anh/chị gửi, trong đó có dòng về ai quyết định tốc độ. Chị đọc to lên.'
        effects:
          [rel lan trust -20, rel hoa trust -6, rep.boss -14, stress +9, fact blamed_boss public]
