scene: sup.qc_hold_rework
place: factory_floor
tags: [quality, pressure, dark]
weight: 3
cooldown: 26
when: [turn >= 8]
lines:
  - who: char:khoa
    en: 'I have put a lot from your line on hold: thickness is out on part of it. It has to be reworked or scrapped. The truck is booked for tomorrow.'
    vi: 'Anh đã giữ một lô từ chuyền em: độ dày lệch ở một phần. Phải làm lại hoặc loại bỏ. Xe tải đã đặt cho ngày mai.'
choices:
  - en: 'Accept the hold, rework the lot overnight with a volunteer crew and paid hours, and tell Bao the truck will leave a day late.'
    vi: 'Chấp nhận giữ lô, làm lại qua đêm với tổ tình nguyện có trả giờ và báo anh Bảo xe sẽ đi muộn một ngày.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.75
        en: 'The lot is reworked and re-measured. Khoa signs the release at five in the morning. Bao says nothing about the day.'
        vi: 'Lô hàng được làm lại và đo lại. Anh Khoa ký xuất lúc năm giờ sáng. Anh Bảo không nhắc gì về ngày trễ.'
        effects: [rel khoa trust +4, rel bao trust -2, rep.qc +3, stress +4]
      - p: 0.25
        ok: false
        en: 'Half of the reworked lot is still out. Khoa scraps it. The crew is tired and the plant is out of money for the night.'
        vi: 'Một nửa lô làm lại vẫn lệch. Anh Khoa loại bỏ. Tổ mệt và nhà máy mất tiền của đêm đó.'
        effects: [rel khoa trust +3, rel bao trust -4, rel lan trust -2, rep.qc +2, stress +5]
  - en: 'Ask Khoa to release the part of the lot that is in tolerance and rework the rest later.'
    vi: 'Nhờ anh Khoa xuất phần lô đạt dung sai và làm lại phần còn lại sau.'
    outcomes:
      - p: 1
        en: 'Khoa agrees to split the lot, with a note on each pallet. The truck leaves half full, and honestly.'
        vi: 'Anh Khoa đồng ý chia lô, có ghi chú trên từng pallet. Xe đi nửa đầy, và trung thực.'
        effects: [rel khoa trust +1, rel bao trust -1, stress +3]
  - en: 'Ask Khoa to release the lot, and say your line will sort it out afterwards, quietly.'
    vi: 'Nhờ anh Khoa xuất cả lô và nói chuyền sẽ tự xử lý sau, lặng lẽ.'
    outcomes:
      - p: 0.6
        en: 'Khoa hesitates, then releases it with a remark in the log. The lot ships. Nobody mentions it again, until the complaint.'
        vi: 'Anh Khoa ngần ngừ rồi cho xuất kèm một ghi chú trong sổ. Lô hàng đi. Không ai nhắc lại, cho đến khi có khiếu nại.'
        effects:
          [
            rel khoa trust -5,
            rel bao trust +3,
            rep.qc -3,
            stress +1,
            fact pressured_qc_release private,
          ]
      - p: 0.4
        ok: false
        en: 'Khoa says no. He writes down that the line asked him to release a lot that he had held, and who asked.'
        vi: 'Anh Khoa nói không. Anh ghi lại rằng chuyền đã nhờ anh xuất một lô anh đã giữ, và ai nhờ.'
        effects:
          [
            rel khoa trust -8,
            rel bao trust +1,
            rep.boss -4,
            rep.qc -5,
            stress +4,
            fact pressured_qc_release witnessed,
          ]
---
scene: sup.training_signoff
place: factory_floor
tags: [training, safety, dark]
weight: 3
cooldown: 30
when: [turn >= 10, month in 8 9 10 11]
lines:
  - who: char:binh
    en: 'Six new temps start on Monday. The safety induction takes four hours, and the plant needs them on the presses by lunchtime. I will sign the induction sheet only for people who attended. I am telling you in advance, so there are no surprises.'
    vi: 'Sáu người thời vụ mới bắt đầu thứ Hai. Buổi huấn luyện an toàn mất bốn giờ, và nhà máy cần họ đứng máy trước giờ trưa. Anh chỉ ký bảng huấn luyện cho người đã tham dự. Anh nói trước để không có bất ngờ.'
choices:
  - en: 'Give the induction in full on Monday morning, and put the temps on the packing bench until they pass it.'
    vi: 'Cho huấn luyện đầy đủ sáng thứ Hai và để người thời vụ ở bàn đóng gói cho đến khi họ qua.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: 'The temps are slow on the bench, and safe. Binh signs six names at lunchtime. Lan asks why the presses are short, and you say why.'
        vi: 'Người thời vụ chậm ở bàn đóng gói, và an toàn. Anh Bình ký sáu tên lúc trưa. Chị Lan hỏi vì sao thiếu người ở máy ép, và anh/chị nói lý do.'
        effects: [rel binh trust +4, rel lan trust -1, rep.staff +2, stress +3]
      - p: 0.2
        ok: false
        en: 'Two of the temps leave at lunchtime and do not come back. You are four people short instead of six.'
        vi: 'Hai người thời vụ bỏ đi lúc trưa và không quay lại. Anh/chị thiếu bốn người thay vì sáu.'
        effects: [rel binh trust +4, rel lan trust -2, stress +4]
  - en: 'Give a short, two-hour induction on the presses they will actually use, and finish the rest in the first week.'
    vi: 'Huấn luyện ngắn hai giờ trên các máy ép họ sẽ thực sự dùng và hoàn tất phần còn lại trong tuần đầu.'
    outcomes:
      - p: 1
        en: 'Binh signs for the two hours, with a note about the second half. It is not perfect, and it is written down.'
        vi: 'Anh Bình ký cho hai giờ kèm ghi chú về nửa sau. Không hoàn hảo, và có ghi lại.'
        effects: [rel binh trust +1, stress +3]
  - en: 'Sign the induction sheet for all six yourself, and put them on the presses on Monday.'
    vi: 'Tự ký bảng huấn luyện cho cả sáu người và cho họ đứng máy thứ Hai.'
    outcomes:
      - p: 0.7
        en: 'The presses run full. Hoa watches the temps for the first hour and puts her own hand on two of their shoulders. Nobody is hurt this week.'
        vi: 'Các máy ép chạy đủ người. Chị Hoa quan sát người thời vụ giờ đầu và tự đặt tay lên vai hai người. Tuần này không ai bị thương.'
        effects:
          [
            rel hoa trust -3,
            rel lan trust +3,
            rep.production +2,
            stress +1,
            fact signed_false_training private,
          ]
      - p: 0.3
        ok: false
        en: "A temp's glove is caught on Tuesday. Binh asks for the induction sheet, and sees that his name on it was signed by you, in a different pen from the others."
        vi: 'Găng tay của một người thời vụ bị kẹt hôm thứ Ba. Anh Bình xin bảng huấn luyện và thấy tên cậu trong đó do anh/chị ký, bằng bút khác với những tên còn lại.'
        effects:
          [
            rel hoa trust -6,
            rel binh trust -10,
            rel lan trust -5,
            rep.boss -8,
            rep.staff -6,
            stress +7,
            fact signed_false_training witnessed,
          ]
---
scene: sup.handover_gap
place: factory_floor
tags: [handover, people, dark]
weight: 3
cooldown: 26
when: [turn >= 8]
lines:
  - who: char:kiet
    en: "I took Line 2's night shift and the notes from your day crew were three lines. Press 3 has a new noise. Did you want to tell me about it?"
    vi: 'Anh nhận ca đêm chuyền 2 và ghi chú từ ca ngày của em chỉ có ba dòng. Máy ép 3 có tiếng ồn mới. Em có định nói với anh không?'
choices:
  - en: 'Apologise, call Mai about the noise now, and agree a half-page handover template for every shift.'
    vi: 'Xin lỗi, gọi chị Mai về tiếng ồn ngay và thống nhất mẫu bàn giao nửa trang cho mọi ca.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.8
        en: 'Mai finds a loose bearing. Kiet nods and says the template is a good idea. Both shifts use it within a week.'
        vi: 'Chị Mai thấy một vòng bi lỏng. Anh Kiệt gật đầu và nói mẫu bàn giao là ý hay. Cả hai ca dùng nó trong một tuần.'
        effects: [rel kiet trust +4, rel mai trust +2, rep.production +2, stress +2]
      - p: 0.2
        ok: false
        en: 'The bearing fails before Mai arrives. It costs an hour, and Kiet says nothing about whose notes they were.'
        vi: 'Vòng bi hỏng trước khi chị Mai đến. Mất một giờ, và anh Kiệt không nói gì về ghi chú của ai.'
        effects: [rel kiet trust +1, stress +4]
  - en: 'Say the noise has been there for a week and is probably nothing, and promise longer notes.'
    vi: 'Nói tiếng ồn có từ một tuần và chắc không sao, và hứa ghi chú dài hơn.'
    outcomes:
      - p: 1
        en: "Kiet says 'Probably' in a voice that means 'Maybe'. Next week's notes are four lines."
        vi: "Anh Kiệt nói 'Chắc vậy' bằng giọng nghĩa là 'Có thể'. Ghi chú tuần sau là bốn dòng."
        effects: [rel kiet trust -2, stress +2]
  - en: 'Tell Kiet that handover notes are not a priority when the target is this high.'
    vi: 'Nói với anh Kiệt rằng ghi chú bàn giao không ưu tiên khi chỉ tiêu cao thế này.'
    outcomes:
      - p: 0.6
        en: 'Kiet shrugs. The night shift makes its own notes, and does not share them. The two shifts start to work around each other.'
        vi: 'Anh Kiệt nhún vai. Ca đêm tự ghi chú và không chia sẻ. Hai ca bắt đầu làm việc vòng qua nhau.'
        effects: [rel kiet trust -5, rep.production -2, stress +1, fact skipped_handover private]
      - p: 0.4
        ok: false
        en: "The noise on press 3 is a cracked frame. Kiet's night crew finds it. Mai's report asks why the day shift did not."
        vi: 'Tiếng ồn ở máy ép 3 là khung bị nứt. Tổ đêm của anh Kiệt phát hiện. Báo cáo của chị Mai hỏi vì sao ca ngày không thấy.'
        effects:
          [
            rel kiet trust -8,
            rel mai trust -5,
            rel lan trust -4,
            rep.boss -4,
            stress +5,
            fact skipped_handover witnessed,
          ]
---
scene: sup.vip_visit
place: factory_floor
tags: [safety, buyer, dark]
weight: 2
cooldown: 40
when: [turn >= 12]
lines:
  - who: char:bao
    en: 'Mr Anders is bringing two colleagues on a line walk in ten minutes, in dress shoes and no helmets. He says the safety gear is a waste of time for a fifteen-minute visit. Please do not make it awkward. We need the order.'
    vi: 'Ông Anders đưa hai đồng nghiệp đi tham quan chuyền sau mười phút, mang giày công sở và không đội mũ. Ông nói đồ bảo hộ là lãng phí thời gian cho chuyến thăm mười lăm phút. Xin đừng làm khó. Mình cần đơn hàng.'
choices:
  - en: "Offer helmets, safety glasses and shoe covers, keep the group on the marked walkway, and say it is the plant's rule for everybody."
    vi: 'Mời mũ, kính và bọc giày, giữ nhóm đi trên lối đi có vạch và nói đó là quy định của nhà máy cho tất cả mọi người.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.8
        en: "Anders raises an eyebrow, puts on the helmet and says 'Good plant.' Bao exhales. The visit goes well."
        vi: "Ông Anders nhướng mày, đội mũ và nói 'Nhà máy tốt.' Anh Bảo thở ra. Chuyến thăm diễn ra tốt đẹp."
        effects: [rel bao trust -1, rel hoa trust +2, rep.buyer +3, stress +1]
      - p: 0.2
        ok: false
        en: "One of the visitors refuses the helmet. You stop the walk at the walkway's edge, and Bao takes him to the meeting room, furious and polite."
        vi: 'Một vị khách từ chối đội mũ. Anh/chị dừng chuyến đi ở mép lối đi, và anh Bảo đưa ông vào phòng họp, vừa giận vừa lịch sự.'
        effects: [rel bao trust -4, rel hoa trust +2, rep.buyer -1, stress +3]
  - en: 'Let them walk the line from the far side of the guard rail, with glasses only.'
    vi: 'Cho họ đi dọc chuyền từ phía bên kia lan can, chỉ đeo kính.'
    outcomes:
      - p: 1
        en: 'A compromise. It works, and the crew does not like seeing visitors held to a different standard.'
        vi: 'Một thỏa hiệp. Có tác dụng, và tổ không thích thấy khách được áp dụng tiêu chuẩn khác.'
        effects: [rel bao trust +1, rel hoa trust -1, stress +1]
  - en: 'Waive the safety gear for the visit, as asked, and walk them through the live presses.'
    vi: 'Bỏ đồ bảo hộ cho chuyến thăm theo yêu cầu và dẫn họ đi qua các máy ép đang chạy.'
    outcomes:
      - p: 0.7
        en: "The visit is charming. Anders says 'No fuss, I like that.' Hoa watches the crew watch the visitors, and says nothing."
        vi: "Chuyến thăm thật dễ chịu. Ông Anders nói 'Không làm rối, anh thích vậy.' Chị Hoa nhìn tổ nhìn khách, và không nói gì."
        effects:
          [
            rel bao trust +5,
            rel hoa trust -4,
            rep.buyer +2,
            rep.staff -2,
            stress +1,
            fact waived_ppe_for_vip private,
          ]
      - p: 0.3
        ok: false
        en: 'A visitor steps off the walkway to look at a die, and a press cycles at the wrong moment. Nobody is hurt, and everybody is pale. Binh has the photo from the security camera by evening.'
        vi: 'Một vị khách bước ra khỏi lối đi để xem khuôn và một máy ép chạy nhịp sai lúc. Không ai bị thương, và ai cũng tái mặt. Tối đó anh Bình đã có ảnh từ camera an ninh.'
        effects:
          [
            rel bao trust +1,
            rel hoa trust -6,
            rel binh trust -8,
            rep.boss -6,
            rep.buyer -4,
            stress +7,
            fact waived_ppe_for_vip witnessed,
          ]
---
scene: sup.exit_blocked
place: factory_floor
tags: [safety, rush, dark]
weight: 2
cooldown: 40
when: [turn >= 12]
lines:
  - who: char:binh
    en: 'Pallets are stacked in front of the fire exit on Line 3, and the extinguisher cabinet is behind the pile. I understand the rush. I need the exit clear by the end of the shift, or I have to write it up.'
    vi: 'Pallet chất trước cửa thoát hiểm chuyền 3, và tủ bình chữa cháy nằm sau đống đó. Anh hiểu đang gấp. Anh cần lối thoát được dọn trước cuối ca, nếu không anh phải lập biên bản.'
choices:
  - en: 'Clear the exit now, stack the pallets on the marked area even if it costs a forklift run, and thank Binh.'
    vi: 'Dọn lối thoát ngay, xếp pallet vào khu vực có vạch dù tốn một chuyến xe nâng và cảm ơn anh Bình.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'It takes twenty minutes and a forklift. Binh nods. The rest of the shift is slightly less cramped than it was.'
        vi: 'Mất hai mươi phút và một xe nâng. Anh Bình gật đầu. Phần còn lại của ca thoáng hơn một chút.'
        effects: [rel binh trust +3, rep.staff +2, stress +2]
  - en: 'Move the pallets just enough to clear the door and cabinet, and ask Binh to give you until the next shift for the rest.'
    vi: 'Dời pallet vừa đủ để thông cửa và tủ và xin anh Bình cho thêm đến ca sau để xử lý phần còn lại.'
    outcomes:
      - p: 1
        en: 'Binh accepts the half-measure, with a time written on it. You do the rest the next morning.'
        vi: 'Anh Bình chấp nhận biện pháp nửa chừng, có ghi giờ. Anh/chị làm phần còn lại sáng hôm sau.'
        effects: [rel binh trust +1, stress +2]
  - en: 'Tell Binh the pallets stay until the order ships, and that you will move them if there is a fire.'
    vi: 'Nói với anh Bình pallet ở nguyên cho đến khi đơn giao xong và anh/chị sẽ dời nếu có cháy.'
    outcomes:
      - p: 0.7
        en: 'Binh writes it up, with a deadline. The pallets are cleared in the end, and the line keeps its place on his list.'
        vi: 'Anh Bình lập biên bản kèm thời hạn. Cuối cùng pallet được dọn, và chuyền giữ vị trí trong danh sách của anh.'
        effects:
          [
            rel binh trust -6,
            rel lan trust +1,
            rep.boss -1,
            stress +1,
            fact blocked_fire_exit private,
          ]
      - p: 0.3
        ok: false
        en: 'The smoke alarm goes off in the night shift, from a burnt cable, and the crew cannot reach the door for four minutes. Nobody is hurt. The report is long.'
        vi: 'Chuông báo khói kêu trong ca đêm do một sợi cáp cháy, và tổ không đến được cửa trong bốn phút. Không ai bị thương. Báo cáo rất dài.'
        effects:
          [
            rel binh trust -10,
            rel kiet trust -4,
            rel lan trust -5,
            rep.boss -8,
            rep.staff -6,
            stress +8,
            fact blocked_fire_exit public,
          ]
