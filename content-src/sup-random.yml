scene: sup.scrap_theft
place: factory_floor
tags: [people, discipline, fairness]
weight: 2
cooldown: 40
when: [turn >= 14]
lines:
  - who: char:hoa
    en: 'The guard at the gate stopped one of ours with a bag of scrap steel. It is Tai. His daughter needs medicine. Some of the crew say he should be fired today, and some say they will walk out if he is. What are you going to do?'
    vi: 'Bảo vệ cổng chặn một người của mình với một túi thép vụn. Là Tài. Con gái anh cần thuốc. Một số người trong tổ nói anh phải bị đuổi hôm nay, số khác nói họ sẽ bỏ đi nếu anh bị đuổi. Em định làm gì?'
choices:
  - en: 'Follow the written procedure: suspend him with pay, hear his side with Oanh present, and decide on the facts and the policy.'
    vi: 'Theo quy trình đã viết: đình chỉ có lương, nghe anh trình bày với sự có mặt của chị Oanh và quyết theo sự việc và quy định.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: 'The hearing is fair and sad. Tai gets a final written warning and a salary advance through the welfare fund. The crew is quiet, and the next week, normal.'
        vi: 'Buổi nghe công bằng và buồn. Tài nhận cảnh cáo cuối cùng bằng văn bản và một khoản ứng lương qua quỹ phúc lợi. Cả tổ im lặng, và tuần sau trở lại bình thường.'
        effects: [rel hoa trust +3, rel oanh trust +3, rep.staff +4, stress +4]
      - p: 0.2
        ok: false
        en: 'Oanh decides that the policy requires dismissal, and the hearing goes that way. You stand with Tai as he leaves, and Hoa says nothing for the rest of the shift.'
        vi: 'Chị Oanh quyết định chính sách đòi sa thải, và buổi nghe đi theo hướng đó. Anh/chị đứng cạnh Tài khi anh ra về, và chị Hoa không nói gì suốt phần còn lại của ca.'
        effects: [rel hoa trust -2, rel oanh trust +1, rep.staff -1, stress +5]
  - en: 'Give Tai a verbal warning, put the scrap back and say nothing to HR.'
    vi: 'Nhắc nhở Tài bằng lời, trả lại số thép vụn và không báo nhân sự.'
    outcomes:
      - p: 1
        en: "Tai thanks you. The guard's report goes to Lan with no outcome on it, and Lan asks why."
        vi: 'Tài cảm ơn. Báo cáo của bảo vệ đến chị Lan mà không có kết quả, và chị Lan hỏi vì sao.'
        effects: [rel hoa trust +1, rel lan trust -3, rep.boss -2, stress +2]
  - en: 'Fire him on the spot, in front of the crew, as an example.'
    vi: 'Sa thải anh ngay tại chỗ, trước mặt cả tổ, để làm gương.'
    outcomes:
      - p: 0.6
        en: 'The crew goes quiet. Tai leaves with his bag and his badge. Nothing is stolen for three months, and nobody speaks to you freely for six.'
        vi: 'Cả tổ im lặng. Tài ra về với túi và thẻ của mình. Ba tháng không có gì bị lấy, và sáu tháng không ai nói chuyện thoải mái với anh/chị.'
        effects:
          [
            rel hoa trust -8,
            rel oanh trust -4,
            rep.staff -8,
            stress +2,
            fact fired_without_process private,
          ]
      - p: 0.4
        ok: false
        en: 'Tai goes to the labour office with the date, the time and the names of those who watched. Oanh asks you where the written procedure was.'
        vi: 'Tài đến phòng lao động với ngày giờ và tên những người chứng kiến. Chị Oanh hỏi anh/chị quy trình bằng văn bản đâu.'
        effects:
          [
            rel hoa trust -10,
            rel oanh trust -8,
            rep.boss -6,
            rep.staff -10,
            stress +7,
            fact fired_without_process witnessed,
          ]
