            rel duc trust +5,
            rel kien trust -6,
            stress +2,
            fact deleted_security_logs private,
            arc the_ransom end,
          ]
      - p: 0.6
        ok: false
        en: 'The mail gateway, the firewall and the cloud provider each keep their own copy of the logs. Quoc has all three on the table by the afternoon.'
        vi: 'Cổng thư, tường lửa và nhà cung cấp đám mây đều giữ bản sao nhật ký của riêng mình. Đến chiều anh Quốc có cả ba trên bàn.'
        effects:
          [
            rel quoc trust -12,
            rel duc trust +1,
            rel kien trust -10,
            rep.boss -12,
            rep.buyer -8,
            rep.finance -6,
            stress +9,
            fact deleted_security_logs public,
            arc the_ransom end,
          ]
