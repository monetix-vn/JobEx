            rel kien trust -3,
            stress +1,
            fact left_leaver_account_active private,
            arc the_keys end,
          ]
      - p: 0.3
        ok: false
        en: 'The old account logs in from a home address, then downloads the full price list. Kien finds the pattern in the weekly log and asks you who knows the password.'
        vi: 'Tài khoản cũ đăng nhập từ địa chỉ nhà, rồi tải toàn bộ bảng giá. Anh Kiên thấy mẫu hình trong nhật ký tuần và hỏi anh/chị ai biết mật khẩu.'
        effects:
          [
            rel long trust +2,
            rel kien trust -8,
