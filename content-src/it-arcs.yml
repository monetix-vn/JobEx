scene: it.leaver_account
weight: 0
place: it_room
tags: [access, leaver, dark, arc]
lines:
  - who: char:long
    en: 'Do you remember the salesman who left last spring? His account is still active, is it not? I have a few files in his folder that I need for the family office. Could you just give me his login for a week? It is a dead account. Nobody will notice.'
    vi: 'Em nhớ nhân viên kinh doanh nghỉ hồi mùa xuân không? Tài khoản của cậu ấy vẫn đang hoạt động, đúng không? Anh có vài tệp trong thư mục của cậu ấy cần cho văn phòng gia đình. Em đưa anh tài khoản đó một tuần được không? Tài khoản chết rồi. Không ai để ý.'
choices:
  - en: 'Disable the leaver account today as the process requires, copy the files Long needs to a new folder in his own name after Duc confirms they are company files, and add the account to the leaver report.'
    vi: 'Vô hiệu hóa tài khoản người đã nghỉ hôm nay như quy trình yêu cầu, sao chép các tệp anh Long cần vào một thư mục mới mang tên anh sau khi anh Đức xác nhận đó là tệp của công ty và thêm tài khoản vào báo cáo người nghỉ việc.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.8
        en: 'Long grumbles, and gets the files in a new folder by lunchtime. The leaver report shows four closed accounts that month. Kien says nothing, and approves.'
        vi: 'Anh Long càu nhàu và có các tệp trong thư mục mới trước trưa. Báo cáo người nghỉ việc cho thấy bốn tài khoản được đóng tháng đó. Anh Kiên không nói gì và duyệt.'
        effects:
          [
            rel long trust -3,
            rel kien trust +3,
            rel duc trust +2,
            rep.finance +2,
            stress +2,
            arc the_keys end,
          ]
      - p: 0.2
        ok: false
        en: "Long says that you are treating the owner's family like a stranger. He does not push the point. A cold week follows, and the folder is clean."
        vi: 'Anh Long nói anh/chị đối xử với gia đình chủ sở hữu như người lạ. Anh không nhấn mạnh. Một tuần lạnh nhạt theo sau, và thư mục sạch.'
        effects: [rel long trust -6, rel kien trust +3, stress +4, arc the_keys end]
  - en: 'Copy the files to Long without using the account, and disable the account when you are next on the leaver list.'
    vi: 'Sao chép các tệp cho anh Long mà không dùng tài khoản đó và vô hiệu hóa tài khoản khi đến lượt trong danh sách người nghỉ việc.'
    outcomes:
      - p: 1
        en: 'Long has the files. The leaver account stays active for another six weeks, and nobody uses it.'
        vi: 'Anh Long có các tệp. Tài khoản người đã nghỉ vẫn hoạt động thêm sáu tuần, và không ai dùng nó.'
        effects: [rel long trust +1, rel kien trust -1, stress +2, arc the_keys end]
  - en: "Give Long the leaver's login, and leave the account active as it is."
    vi: 'Đưa anh Long tài khoản của người đã nghỉ và để nguyên tài khoản đang hoạt động.'
    outcomes:
      - p: 0.7
        en: "Long uses it for a week, and again in the autumn. It has the salesman's permissions, which include the price list. The account is active for another year."
        vi: 'Anh Long dùng một tuần, và lại dùng vào mùa thu. Nó có quyền của nhân viên kinh doanh, gồm cả bảng giá. Tài khoản hoạt động thêm một năm.'
        effects:
