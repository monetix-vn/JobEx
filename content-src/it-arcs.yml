arc: the_ransom
title:
  en: 'The ransom'
  vi: 'Tiền chuộc'
stages:
  - { id: phish, event: it.phishing_click }
  - { id: lock, event: it.files_locked, delay: 1 }
  - { id: decision, event: it.pay_or_restore, delay: 1 }
