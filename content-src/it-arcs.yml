scene: it.files_locked
weight: 0
place: it_room
tags: [security, incident, dark, arc]
lines:
  - who: char:duc
    en: 'It is the morning of the close. The finance share, and part of the ERP exports, show a note on every folder: pay in cryptocurrency within seventy-two hours, or the data is gone and goes public. I have the board on Friday and the bank on Monday. Tell me what you know, and tell me what we can do.'
    vi: 'Sáng nay là ngày chốt. Thư mục tài chính và một phần các bản xuất ERP hiện một ghi chú trên mọi thư mục: trả bằng tiền mã hóa trong bảy mươi hai giờ nếu không dữ liệu mất và bị công khai. Thứ Sáu anh họp hội đồng và thứ Hai làm việc với ngân hàng. Nói anh nghe em biết gì và mình làm được gì.'
choices:
  - en: 'Tell Duc plainly what you know and do not know, that you are isolating the network and preserving evidence, and ask for Kien, Quoc and Legal to be in the room within the hour.'
    vi: 'Nói rõ với anh Đức điều anh/chị biết và không biết, rằng anh/chị đang cách ly mạng và giữ bằng chứng, và đề nghị anh Kiên, anh Quốc và pháp chế có mặt trong vòng một giờ.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Duc is pale, and the room fills in forty minutes. For the first time that year nobody asks you to make the number work. A plan appears on the whiteboard, and your name is under 'evidence'."
        vi: "Anh Đức tái mặt, và phòng đầy người sau bốn mươi phút. Lần đầu năm đó không ai bảo anh/chị làm cho con số chạy. Một kế hoạch hiện trên bảng trắng, và tên anh/chị nằm dưới 'bằng chứng'."
        effects:
          [
            rel duc trust +2,
            rel kien trust +3,
            rel quoc trust +2,
            rep.finance +2,
            stress +5,
            arc the_ransom decision,
          ]
  - en: "Tell Duc you can restore from last night's backup, and ask for a few hours before bringing anyone else in."
    vi: 'Nói với anh Đức anh/chị khôi phục được từ bản sao lưu đêm qua và xin vài giờ trước khi gọi ai khác vào.'
    outcomes:
      - p: 1
        en: 'Duc says yes with relief. You start the restore. It is slower than you hoped, and nobody else knows yet.'
        vi: 'Anh Đức đồng ý với vẻ nhẹ nhõm. Anh/chị bắt đầu khôi phục. Chậm hơn anh/chị hy vọng, và chưa ai khác biết.'
        effects: [rel duc trust +1, rel kien trust -2, stress +5, arc the_ransom decision]
  - en: 'Tell Duc that it is under control, and ask him not to mention it to anyone until it is solved.'
    vi: 'Nói với anh Đức mọi việc trong tầm kiểm soát và xin anh đừng nhắc với ai cho đến khi giải quyết xong.'
    outcomes:
      - p: 0.7
        en: 'Duc agrees, because he wants to. You have a locked share, a note and a plan that is in your head only.'
        vi: 'Anh Đức đồng ý vì anh muốn vậy. Anh/chị có thư mục bị khóa, một ghi chú và một kế hoạch chỉ có trong đầu.'
        effects:
          [
            rel duc trust +4,
            rel kien trust -4,
            stress +3,
            fact hid_security_incident private,
            arc the_ransom decision,
          ]
      - p: 0.3
        ok: false
        en: "Kien sees the ransom note on a user's screen in the corridor, and walks into the room without knocking. He says: 'Why am I learning this from a monitor?'"
        vi: "Anh Kiên thấy ghi chú đòi tiền trên màn hình của một người dùng ở hành lang và bước vào phòng không gõ cửa. Anh nói: 'Sao anh phải biết chuyện này từ một màn hình?'"
        effects:
          [
            rel duc trust +2,
            rel kien trust -9,
            rep.boss -5,
            stress +6,
            fact hid_security_incident witnessed,
            arc the_ransom decision,
          ]
---
scene: it.pay_or_restore
weight: 0
place: it_room
tags: [security, ransom, dark, arc]
lines:
  - who: char:kien
    en: 'The facts. The backup from last Friday is clean and covers ninety percent of what was encrypted. The restore will take three days, and the close will slip. The attackers say that they will give the key for four million dong in cryptocurrency. There is no guarantee they will, and the money funds the next attack. Duc wants to pay. What is your recommendation?'
    vi: 'Sự thật. Bản sao lưu thứ Sáu tuần trước sạch và bao phủ chín mươi phần trăm dữ liệu bị mã hóa. Khôi phục mất ba ngày, và kỳ chốt sẽ trễ. Kẻ tấn công nói họ sẽ đưa khóa nếu nhận bốn triệu đồng bằng tiền mã hóa. Không có gì bảo đảm họ sẽ đưa, và số tiền tài trợ cho đợt tấn công tiếp theo. Anh Đức muốn trả. Khuyến nghị của em là gì?'
choices:
  - en: 'Recommend restoring from backup, rebuilding the infected machines, rotating every password and not paying, and tell the directors the close will be late and why.'
    vi: 'Khuyến nghị khôi phục từ bản sao lưu, dựng lại các máy bị nhiễm, đổi mọi mật khẩu và không trả tiền, và nói với ban giám đốc kỳ chốt sẽ trễ và vì sao.'
    cost: { hours: 4 }
    outcomes:
      - p: 0.7
        en: "The restore takes three and a half days, and the close slips by four. Duc is miserable, and the data returns, clean. Kien writes the report, and your name is under 'recommended'."
        vi: "Khôi phục mất ba ngày rưỡi, và kỳ chốt trễ bốn ngày. Anh Đức rất khổ sở, và dữ liệu trở lại, sạch. Anh Kiên viết báo cáo, và tên anh/chị nằm dưới 'khuyến nghị'."
        effects:
          [
            rel duc trust -1,
            rel kien trust +5,
            rel hanh trust +2,
            rep.boss +3,
            rep.finance +1,
            stress +6,
            fact restored_from_backup witnessed,
            arc the_ransom disclosure,
          ]
      - p: 0.3
        ok: false
        en: "One of the backups is corrupt, and a week of invoices must be re-entered by hand. Hanh and Thu work two weekends, and nobody says 'I told you so'."
        vi: "Một bản sao lưu bị hỏng, và một tuần hóa đơn phải nhập lại bằng tay. Chị Hạnh và Thư làm hai cuối tuần, và không ai nói 'đã bảo mà'."
        effects:
          [
            rel duc trust -2,
            rel kien trust +4,
            rel hanh trust -1,
            rep.boss +1,
            stress +8,
            fact restored_from_backup witnessed,
            arc the_ransom disclosure,
          ]
  - en: 'Recommend restoring, and ask the directors whether they want to consult the police and a specialist before deciding anything about payment.'
    vi: 'Khuyến nghị khôi phục và hỏi ban giám đốc có muốn tham vấn cảnh sát và một chuyên gia trước khi quyết định về việc trả tiền không.'
    outcomes:
      - p: 1
        en: 'A specialist advises against paying, in writing. The restore goes ahead, and the decision is documented. It is slower than anyone wanted, and it is on the record.'
        vi: 'Một chuyên gia khuyên không trả, bằng văn bản. Việc khôi phục tiến hành, và quyết định được ghi lại. Chậm hơn mọi người muốn, và có hồ sơ.'
        effects: [rel duc trust +1, rel kien trust +2, stress +5, arc the_ransom disclosure]
  - en: 'Help Duc pay the ransom quietly through an account that does not go through the ledger.'
    vi: 'Giúp anh Đức trả tiền chuộc lặng lẽ qua một tài khoản không đi qua sổ cái.'
    outcomes:
      - p: 0.6
        en: "The payment is made. A key arrives, and works for most of the files. The attackers know the company pays, and the company's ledger does not."
        vi: 'Khoản thanh toán được thực hiện. Một khóa đến và mở được phần lớn tệp. Kẻ tấn công biết công ty trả tiền, còn sổ cái của công ty thì không.'
        effects:
          [
            rel duc trust +6,
            rel kien trust -6,
            stress +2,
            fact paid_ransom_secretly private,
            arc the_ransom disclosure,
          ]
      - p: 0.4
        ok: false
        en: 'The key works for half the files. The attackers send a second demand with a sample of the data. Duc asks you, very quietly, what to do next.'
        vi: 'Khóa mở được nửa số tệp. Kẻ tấn công gửi yêu cầu thứ hai kèm một mẫu dữ liệu. Anh Đức hỏi anh/chị, rất khẽ, mình làm gì tiếp.'
        effects:
          [
            rel duc trust +4,
            rel kien trust -8,
            rep.boss -5,
            rep.finance -5,
            stress +8,
            fact paid_ransom_secretly witnessed,
            arc the_ransom disclosure,
          ]
