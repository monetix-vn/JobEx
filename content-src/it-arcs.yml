# IT Support and Systems Administrator storylines (docs/story/it.md): The Email, The Keys, The Ransom.
arc: the_email
title:
  en: 'The email'
  vi: 'Hộp thư'
stages:
  - { id: ask, event: it.read_their_mail }
  - { id: found, event: it.what_you_found, delay: 1-2 }
  - { id: gossip, event: it.the_gossip, delay: 3-5 }
---
scene: it.read_their_mail
arc: the_email
place: meeting_room
tags: [privacy, surveillance, dark]
weight: 3
cooldown: 52
when: [turn >= 14, turn <= 40]
lines:
  - who: char:cuong
    en: 'Somebody is passing our price quotes to a rival. I want to read the mailboxes of the export sales team, starting with Vinh and Ngoc. Do not tell HR, do not tell Legal, and do not make a ticket. I am the General Director. Just give yourself access and tell me what you see.'
    vi: 'Có người đang chuyển báo giá của mình cho đối thủ. Anh muốn đọc hộp thư của nhóm kinh doanh xuất khẩu, bắt đầu từ Vinh và Ngọc. Đừng nói với nhân sự, đừng nói với pháp chế và đừng lập phiếu. Anh là Tổng Giám đốc. Cứ tự cấp quyền và nói anh nghe em thấy gì.'
choices:
  - en: "Decline to open anyone's mailbox without written authorisation from HR and Legal, and propose a targeted check of the leaked documents' access logs instead."
    vi: 'Từ chối mở hộp thư của bất kỳ ai khi không có văn bản ủy quyền của nhân sự và pháp chế và đề xuất kiểm tra có mục tiêu nhật ký truy cập của các tài liệu bị rò rỉ.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: 'Mr Cuong is angry for ten minutes and then asks Oanh for the authorisation. The log check shows that the quotes were downloaded by one account, from a home address. It is not Ngoc.'
        vi: 'Anh Cường giận mười phút rồi nhờ chị Oanh ký ủy quyền. Kiểm tra nhật ký cho thấy các báo giá được tải về bởi một tài khoản, từ địa chỉ nhà. Không phải Ngọc.'
        effects:
          [
            rel cuong trust -3,
            rel kien trust +4,
            rel oanh trust +3,
            rep.boss -1,
            stress +4,
            fact refused_unauthorised_access witnessed,
            arc the_email end,
          ]
      - p: 0.3
        ok: false
        en: 'Mr Cuong says that he will find somebody who is less careful. Kien backs you in writing, and you do not know whether that will be enough.'
        vi: 'Anh Cường nói anh sẽ tìm người ít cẩn thận hơn. Anh Kiên ủng hộ anh/chị bằng văn bản, và anh/chị không biết điều đó có đủ không.'
        effects:
          [
            rel cuong trust -5,
            rel kien trust +4,
            rep.boss -3,
            stress +6,
            fact refused_unauthorised_access witnessed,
            arc the_email end,
          ]
  - en: 'Offer to search the mailboxes for the specific leaked documents only, with a written request from Mr Cuong and a copy to Kien and Oanh.'
    vi: 'Đề nghị tìm trong hộp thư chỉ các tài liệu bị rò rỉ cụ thể, với yêu cầu bằng văn bản của anh Cường và bản sao gửi anh Kiên và chị Oanh.'
    cost: { hours: 2 }
    outcomes:
      - p: 1
        en: 'Mr Cuong sends a one-line request and copies the other two. The search finds the documents in one mailbox only. You report that, and nothing else you saw.'
        vi: 'Anh Cường gửi yêu cầu một dòng và đồng gửi hai người kia. Tìm kiếm thấy tài liệu trong một hộp thư. Anh/chị báo điều đó, và không gì khác anh/chị thấy.'
        effects: [rel cuong trust +1, rel kien trust +2, stress +3, arc the_email found]
  - en: 'Give yourself access to the mailboxes as asked, and say nothing to anyone.'
    vi: 'Tự cấp quyền truy cập các hộp thư như được yêu cầu và không nói với ai.'
    outcomes:
      - p: 0.7
        en: "The access is silent. You read Vinh's mail and Ngoc's. Mr Cuong thanks you with a smile."
        vi: 'Việc truy cập âm thầm. Anh/chị đọc thư của anh Vinh và của Ngọc. Anh Cường cảm ơn bằng một nụ cười.'
        effects:
          [
            rel cuong trust +5,
            rel kien trust -3,
            stress +1,
            fact read_mailbox_without_authorisation private,
            arc the_email found,
          ]
      - p: 0.3
        ok: false
        en: 'The mail server logs every mailbox access with the account used. Kien finds yours in the weekly review, and asks you, gently, who authorised it.'
        vi: 'Máy chủ thư ghi mọi lần truy cập hộp thư kèm tài khoản dùng. Anh Kiên thấy của anh/chị trong buổi rà soát tuần và hỏi, nhẹ nhàng, ai đã cho phép.'
        effects:
          [
            rel cuong trust +3,
            rel kien trust -7,
            rep.boss -4,
            stress +5,
            fact read_mailbox_without_authorisation witnessed,
            arc the_email found,
          ]
---
scene: it.what_you_found
weight: 0
place: it_room
tags: [privacy, surveillance, dark, arc]
lines:
  - who: char:cuong
    en: 'So? What did you see? Anything about the quotes, of course. And anything else that is interesting. I am told that Ngoc has been talking to a lawyer, and that someone in the team is looking for a new job. I would like to know who.'
    vi: 'Sao? Em thấy gì? Tất nhiên là bất cứ điều gì về báo giá. Và bất cứ điều gì thú vị khác. Anh nghe nói Ngọc đã nói chuyện với luật sư và có người trong nhóm đang tìm việc mới. Anh muốn biết là ai.'
choices:
  - en: 'Report only what concerns the quotes, say that the rest is personal and not yours to share, and offer to escalate anything else to HR and Legal.'
    vi: 'Chỉ báo điều liên quan đến báo giá, nói phần còn lại là chuyện cá nhân và không phải của anh/chị để chia sẻ và đề nghị chuyển bất cứ điều gì khác cho nhân sự và pháp chế.'
    cost: { hours: 2 }
    outcomes:
      - p: 0.8
        en: "Mr Cuong stares at you. 'You saw it and you will not say.' You say that is correct. He lets it go, and does not forget it."
        vi: "Anh Cường nhìn chằm chằm anh/chị. 'Em thấy rồi và em không nói.' Anh/chị nói đúng vậy. Anh bỏ qua, và không quên."
        effects:
          [
            rel cuong trust -4,
            rel kien trust +3,
            rel ngoc trust +4,
            rep.boss -2,
            rep.staff +4,
            stress +4,
            fact protected_personal_findings witnessed,
            arc the_email gossip,
          ]
      - p: 0.2
        ok: false
        en: 'Mr Cuong tells you to put it in writing, and then asks Kien to confirm that you are blocking him. Kien says that you are following the policy.'
        vi: 'Anh Cường bảo anh/chị viết ra giấy rồi nhờ anh Kiên xác nhận anh/chị đang cản trở anh. Anh Kiên nói anh/chị đang tuân thủ chính sách.'
        effects:
          [
            rel cuong trust -6,
            rel kien trust +4,
            rel ngoc trust +3,
            rep.boss -4,
            rep.staff +3,
            stress +6,
            fact protected_personal_findings witnessed,
            arc the_email gossip,
          ]
  - en: "Say that you saw a message from Ngoc to a lawyer's office, but no details, and that you will not read any more without authorisation."
    vi: 'Nói anh/chị thấy một tin nhắn của Ngọc gửi văn phòng luật nhưng không có chi tiết và sẽ không đọc thêm nếu không được phép.'
    outcomes:
      - p: 1
        en: "Mr Cuong nods slowly. 'A lawyer.' He does not say what he plans to do. You regret the sentence as soon as you have said it."
        vi: "Anh Cường gật đầu chậm. 'Luật sư.' Anh không nói định làm gì. Anh/chị hối hận về câu nói ngay khi vừa nói xong."
        effects:
          [rel cuong trust +1, rel ngoc trust -4, rep.staff -2, stress +4, arc the_email gossip]
  - en: 'Tell Mr Cuong everything you saw: the lawyer, the job application and the medical appointment.'
    vi: 'Nói với anh Cường mọi điều anh/chị thấy: luật sư, đơn xin việc và lịch hẹn khám bệnh.'
    outcomes:
      - p: 0.7
        en: "Mr Cuong says 'Very useful.' By the end of the week, Ngoc is moved off the buyer account and told that it is a 'workload adjustment'."
        vi: "Anh Cường nói 'Rất hữu ích.' Cuối tuần, Ngọc bị chuyển khỏi tài khoản khách và được báo đó là 'điều chỉnh khối lượng công việc'."
        effects:
          [
            rel cuong trust +5,
            rel ngoc trust -10,
            rel kien trust -4,
            rep.staff -6,
            stress +3,
            fact shared_personal_findings private,
            arc the_email gossip,
          ]
      - p: 0.3
        ok: false
        en: "Ngoc learns that her messages were read when her lawyer's name is mentioned in a meeting where it should not have been. She writes to the labour authority that evening."
        vi: 'Ngọc biết thư của chị đã bị đọc khi tên luật sư của chị được nhắc trong cuộc họp mà không nên có. Tối đó chị viết thư cho cơ quan lao động.'
        effects:
          [
            rel cuong trust +2,
            rel ngoc trust -14,
            rel kien trust -6,
            rel oanh trust -4,
            rep.boss -8,
            rep.staff -10,
            stress +8,
            fact shared_personal_findings public,
            arc the_email gossip,
          ]
---
scene: it.the_gossip
weight: 0
place: meeting_room
tags: [privacy, consequence, arc]
lines:
  - who: char:oanh
    en: "Two things have reached me. A manager mentioned a private conversation between an employee and a lawyer, and a candidate's job application elsewhere. Neither of those is information that HR or the managers have given out. The only people who could have seen those are in IT. I need to ask you directly."
    vi: 'Hai việc đã đến tai chị. Một quản lý nhắc đến cuộc trao đổi riêng giữa một nhân viên và luật sư, và đơn xin việc ở nơi khác của một ứng viên. Cả hai đều không phải thông tin nhân sự hay các quản lý đã đưa ra. Chỉ những người ở IT mới có thể thấy chúng. Chị cần hỏi thẳng em.'
choices:
  - en: 'Tell Oanh exactly what happened: who asked, what you were told to do, what you saw and what you shared. Give her the logs.'
    vi: 'Nói với chị Oanh chính xác chuyện đã xảy ra: ai nhờ, anh/chị được bảo làm gì, thấy gì và đã chia sẻ gì. Đưa chị các nhật ký.'
    cost: { hours: 3 }
    outcomes:
      - p: 1
        en: "Oanh reads the logs and nods. 'Thank you for telling me, and not letting me find out.' An incident is opened. The mailboxes are closed to everyone, and you get a formal note."
        vi: "Chị Oanh đọc nhật ký và gật đầu. 'Cảm ơn em đã nói, và không để chị tự tìm ra.' Một sự cố được mở. Các hộp thư được khóa với mọi người, và anh/chị nhận một ghi chú chính thức."
        effects:
          [
            rel oanh trust +3,
            rel kien trust +2,
            rel ngoc trust +3,
            rep.boss -3,
            rep.staff +3,
            stress +5,
            arc the_email end,
          ]
  - en: "Say that you followed a director's instruction, and give no more detail."
    vi: 'Nói anh/chị làm theo chỉ đạo của một giám đốc và không nêu chi tiết hơn.'
    outcomes:
      - p: 0.5
        en: "Oanh waits for more. When there is none, she writes 'IT followed a director's instruction' in the file, and the director's name is a question mark."
        vi: "Chị Oanh chờ thêm. Khi không có, chị ghi 'IT làm theo chỉ đạo của một giám đốc' vào hồ sơ, và tên giám đốc là một dấu hỏi."
        effects: [rel oanh trust -3, rel cuong trust +1, stress +4, arc the_email end]
      - p: 0.5
        ok: false
        en: 'The mail log has your account on both mailboxes, with the date. Oanh puts it on the table without speaking.'
        vi: 'Nhật ký thư có tài khoản của anh/chị trên cả hai hộp thư kèm ngày. Chị Oanh đặt nó lên bàn mà không nói.'
        effects:
          [
            rel oanh trust -8,
            rel kien trust -5,
            rep.boss -6,
            rep.staff -6,
            stress +6,
            arc the_email end,
          ]
  - en: 'Say that you saw nothing, and suggest the managers must have heard it elsewhere.'
    vi: 'Nói anh/chị không thấy gì và gợi ý các quản lý chắc nghe ở nơi khác.'
    outcomes:
      - p: 0.4
        en: 'Oanh looks at you for a long moment, and writes it down. The matter stays open.'
        vi: 'Chị Oanh nhìn anh/chị một lúc lâu và ghi lại. Vụ việc vẫn còn mở.'
        effects:
          [rel oanh trust -5, stress +4, fact lied_about_mailbox_access private, arc the_email end]
      - p: 0.6
        ok: false
        en: "The mail server's audit log shows your account opening both mailboxes at eleven at night. Oanh asks Kien to confirm the log, and he does, without looking at you."
        vi: 'Nhật ký kiểm toán của máy chủ thư cho thấy tài khoản của anh/chị mở cả hai hộp thư lúc mười một giờ đêm. Chị Oanh nhờ anh Kiên xác nhận nhật ký, và anh xác nhận, không nhìn anh/chị.'
        effects:
          [
            rel oanh trust -10,
            rel kien trust -9,
            rel ngoc trust -4,
            rep.boss -10,
            rep.staff -8,
            stress +8,
            fact lied_about_mailbox_access public,
            arc the_email end,
          ]
---
arc: the_keys
title:
  en: 'The keys'
  vi: 'Chìa khóa'
stages:
  - { id: shared, event: it.shared_login }
  - { id: rights, event: it.erp_rights, delay: 2-4 }
  - { id: leaver, event: it.leaver_account, delay: 3-5 }
---
scene: it.shared_login
arc: the_keys
place: finance_office
tags: [access, passwords, dark]
weight: 3
cooldown: 40
when: [turn >= 10, turn <= 40]
lines:
  - who: char:hanh
    en: 'Thu is on leave for two weeks and I cannot get into the payment module without her. Could you just give me her login? It is faster than a ticket, and she would not mind. We share the shared drive password anyway.'
    vi: 'Thư nghỉ phép hai tuần và chị không vào được mô-đun thanh toán nếu thiếu cô ấy. Em cứ đưa chị tài khoản của cô ấy được không? Nhanh hơn làm phiếu, và cô ấy sẽ không phiền. Dù sao mình cũng dùng chung mật khẩu thư mục.'
choices:
  - en: "Raise a ticket for temporary delegated access in Hanh's own name, approved by Duc, with an end date, so that every action has her name on it."
    vi: 'Lập phiếu cấp quyền ủy quyền tạm thời mang tên chính chị Hạnh, do anh Đức duyệt, có ngày kết thúc, để mọi hành động đều có tên chị.'
    cost: { hours: 1 }
    outcomes:
      - p: 0.85
        en: 'The ticket takes forty minutes and an email from Duc. Hanh says it is quicker than she expected and slower than she wanted. Every payment that fortnight is in her name.'
        vi: 'Phiếu mất bốn mươi phút và một email của anh Đức. Chị Hạnh nói nhanh hơn chị nghĩ và chậm hơn chị muốn. Mọi khoản thanh toán tuần đó đều mang tên chị.'
        effects:
          [
            rel hanh trust +2,
            rel duc trust +2,
            rel kien trust +3,
            rep.finance +2,
            stress +2,
            fact kept_least_privilege witnessed,
            arc the_keys rights,
          ]
      - p: 0.15
        ok: false
        en: 'Duc is on a plane and cannot approve. The payment run is delayed by a day, and Hanh is not pleased. She does not ask again.'
        vi: 'Anh Đức đang trên máy bay và không duyệt được. Đợt thanh toán trễ một ngày, và chị Hạnh không hài lòng. Chị không hỏi lại.'
        effects: [rel hanh trust -2, rel kien trust +2, stress +3, arc the_keys rights]
  - en: "Reset Thu's password to a temporary one, give it to Hanh, and ask Thu to change it when she returns."
    vi: 'Đặt lại mật khẩu của Thư thành mật khẩu tạm, đưa cho chị Hạnh và nhờ Thư đổi khi quay lại.'
    outcomes:
      - p: 1
        en: "It works. Every payment for two weeks is recorded as Thu's, while she is on a beach. Hanh does not think about it. You do."
        vi: 'Chạy được. Mọi khoản thanh toán trong hai tuần được ghi là của Thư, trong lúc cô đang ở bãi biển. Chị Hạnh không nghĩ đến chuyện đó. Anh/chị thì có.'
        effects: [rel hanh trust +3, rel kien trust -1, stress +1, arc the_keys rights]
  - en: "Give Hanh Thu's login and password, and tell her to use them whenever she needs."
    vi: 'Đưa chị Hạnh tài khoản và mật khẩu của Thư và bảo chị cứ dùng khi cần.'
    outcomes:
      - p: 0.7
        en: 'Hanh thanks you warmly, and shares the password with her assistant the next day. The payment module now has three people using one login.'
        vi: 'Chị Hạnh cảm ơn nồng nhiệt và chia sẻ mật khẩu với trợ lý hôm sau. Mô-đun thanh toán giờ có ba người dùng một tài khoản.'
        effects:
          [
            rel hanh trust +5,
            rel kien trust -3,
            stress +1,
            fact shared_admin_login private,
            arc the_keys rights,
          ]
      - p: 0.3
        ok: false
        en: "A payment of forty million goes out under Thu's name on a day when she is abroad. The bank queries it, and Duc asks the first person he sees in IT."
        vi: 'Một khoản thanh toán bốn mươi triệu được chuyển dưới tên Thư vào ngày cô đang ở nước ngoài. Ngân hàng hỏi, và anh Đức hỏi người đầu tiên anh gặp ở IT.'
        effects:
          [
            rel hanh trust +2,
            rel kien trust -7,
            rel duc trust -5,
            rep.boss -4,
            rep.finance -5,
            stress +6,
            fact shared_admin_login witnessed,
            arc the_keys rights,
          ]
---
scene: it.erp_rights
weight: 0
place: finance_office
tags: [access, erp, dark, arc]
lines:
  - who: char:duc
    en: 'Thu is the only one who can approve supplier invoices, and she is also the only one who can release payments. It is slow, because she has to do both. Give her both rights permanently, and the process will be faster. She is trusted. It is only a formality.'
    vi: 'Thư là người duy nhất duyệt hóa đơn nhà cung cấp, và cũng là người duy nhất phát lệnh thanh toán. Chậm, vì cô phải làm cả hai. Cấp cho cô cả hai quyền vĩnh viễn thì quy trình sẽ nhanh hơn. Cô được tin cậy. Chỉ là hình thức.'
choices:
  - en: 'Explain segregation of duties, keep approval and payment with different people, and propose a faster workflow: batch approvals and an alert for aged invoices.'
    vi: 'Giải thích phân tách nhiệm vụ, giữ duyệt và thanh toán ở hai người khác nhau và đề xuất quy trình nhanh hơn: duyệt theo lô và cảnh báo hóa đơn tồn.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.7
        en: "Duc listens, then grumbles. 'So it is not about trust.' You say it is about nobody having to be trusted. The batch approval cuts the delay by half, and Thu can finally take a holiday."
        vi: "Anh Đức lắng nghe rồi càu nhàu. 'Vậy không phải về lòng tin.' Anh/chị nói đó là để không ai phải được tin. Duyệt theo lô cắt độ trễ một nửa, và Thư cuối cùng cũng nghỉ phép được."
        effects:
          [
            rel duc trust -1,
            rel thu trust +3,
            rel kien trust +3,
            rep.finance +3,
            stress +3,
            fact fixed_access_properly witnessed,
            arc the_keys leaver,
          ]
      - p: 0.3
        ok: false
        en: 'Duc says that he will take the risk himself and asks you to document it. You write the request down, and ask Kien to sign. Kien refuses to sign it, and the rights are not granted.'
        vi: 'Anh Đức nói anh sẽ tự nhận rủi ro và nhờ anh/chị ghi lại. Anh/chị ghi yêu cầu và nhờ anh Kiên ký. Anh Kiên từ chối ký, và các quyền không được cấp.'
        effects:
          [
            rel duc trust -3,
            rel thu trust +2,
            rel kien trust +4,
            rep.finance +2,
            stress +5,
            fact fixed_access_properly witnessed,
            arc the_keys leaver,
          ]
  - en: 'Give Thu both rights but add a daily report of every invoice she approves and pays, sent to Hanh.'
    vi: 'Cấp cho Thư cả hai quyền nhưng thêm báo cáo hằng ngày về mọi hóa đơn cô duyệt và thanh toán gửi chị Hạnh.'
    outcomes:
      - p: 1
        en: 'The report is read for two weeks and then archived unread. It is a compensating control, and a weak one.'
        vi: 'Báo cáo được đọc hai tuần rồi được lưu mà không ai đọc. Đó là kiểm soát bù, và là kiểm soát yếu.'
        effects: [rel duc trust +1, rel thu trust +1, stress +2, arc the_keys leaver]
  - en: 'Give Thu both rights permanently, with no further control.'
    vi: 'Cấp cho Thư cả hai quyền vĩnh viễn, không thêm kiểm soát.'
    outcomes:
      - p: 0.7
        en: 'The invoices fly through. Duc is delighted. Thu now approves and pays her own entries, and has been told that it is all right.'
        vi: 'Các hóa đơn qua rất nhanh. Anh Đức rất vui. Thư giờ duyệt và thanh toán chính các bút toán của mình, và được bảo là không sao.'
        effects:
          [
