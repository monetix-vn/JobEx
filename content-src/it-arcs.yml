fact: refused_unauthorised_access
severity: 2
category: integrity
en: "you refused to open employees' mailboxes without written authorisation"
vi: 'bạn từ chối mở hộp thư của nhân viên khi không có ủy quyền bằng văn bản'
lesson:
  en: 'Holding the keys means being asked to use them in ways the policy does not allow. A refusal costs a hard conversation with a director, and protects the next employee whose mailbox is requested.'
