scene: it.tell_the_customers
weight: 0
place: meeting_room
tags: [security, disclosure, consequence, arc]
lines:
  - who: char:quoc
    en: "The forensic review is complete. The attackers had access to the finance share for nine days before they encrypted it. It included buyers' bank details, supplier contracts and some employee payroll data. We may be obliged to tell the buyers and the data protection authority. I would like to know what you recommend, and what the logs say."
    vi: 'Cuộc rà soát pháp y đã xong. Kẻ tấn công truy cập thư mục tài chính chín ngày trước khi mã hóa. Nó gồm thông tin ngân hàng của khách, hợp đồng nhà cung cấp và một số dữ liệu lương nhân viên. Có thể mình có nghĩa vụ báo cho khách và cơ quan bảo vệ dữ liệu. Anh muốn biết khuyến nghị của em và nhật ký nói gì.'
choices:
  - en: 'Recommend telling the buyers, the authority and the employees promptly, with the facts, what you are doing about it, and what they should watch for. Give Quoc the logs.'
    vi: 'Khuyến nghị báo cho khách, cơ quan và nhân viên kịp thời, kèm sự thật, điều anh/chị đang làm và điều họ nên theo dõi. Đưa anh Quốc các nhật ký.'
    cost: { hours: 3 }
    outcomes:
      - p: 0.8
        en: "The notices go out within the legal window. Anders writes back: 'Thank you for telling us before we read it elsewhere.' Several buyers ask for an audit, and none leaves."
        vi: "Các thông báo được gửi trong thời hạn luật định. Ông Anders viết lại: 'Cảm ơn đã báo trước khi chúng tôi đọc ở nơi khác.' Vài khách xin kiểm toán, và không ai rời đi."
        effects:
          [
            rel quoc trust +4,
            rel kien trust +3,
            rel duc trust -1,
            rep.boss +2,
            rep.buyer +3,
            rep.staff +3,
            stress +6,
            fact disclosed_breach witnessed,
            arc the_ransom end,
          ]
      - p: 0.2
        ok: false
        en: 'One buyer, upset about the delay in the business that follows, takes a third of its order elsewhere. The disclosure was correct, and the cost is real.'
        vi: 'Một khách, bực vì sự chậm trễ trong công việc sau đó, chuyển một phần ba đơn hàng đi nơi khác. Việc công bố là đúng, và cái giá là thật.'
        effects:
          [
            rel quoc trust +4,
            rel kien trust +3,
            rep.boss +1,
            rep.buyer -2,
            rep.staff +3,
            stress +7,
            fact disclosed_breach witnessed,
            arc the_ransom end,
          ]
  - en: 'Recommend notifying only the authority, in the minimum form, and not the buyers unless they ask.'
    vi: 'Khuyến nghị chỉ báo cơ quan, ở dạng tối thiểu, và không báo khách trừ khi họ hỏi.'
    outcomes:
      - p: 0.6
        en: 'The authority acknowledges the notice, and the buyers hear nothing. Quoc writes down the recommendation as yours, and the date.'
        vi: 'Cơ quan xác nhận đã nhận thông báo, và khách không nghe gì. Anh Quốc ghi khuyến nghị là của anh/chị, kèm ngày.'
        effects: [rel quoc trust -2, rel kien trust -1, stress +4, arc the_ransom end]
      - p: 0.4
        ok: false
        en: "A buyer's bank calls about unusual activity on an account, and the buyer asks whether the company has had a security incident. Anders asks Duc, and Duc asks you."
        vi: 'Ngân hàng của một khách gọi về hoạt động bất thường trên tài khoản, và khách hỏi công ty có xảy ra sự cố an ninh không. Ông Anders hỏi anh Đức, và anh Đức hỏi anh/chị.'
        effects:
          [
            rel quoc trust -4,
            rel kien trust -3,
            rel duc trust -3,
            rep.boss -5,
            rep.buyer -6,
            stress +6,
            arc the_ransom end,
          ]
  - en: 'Recommend telling nobody, and delete the logs that show the nine days.'
    vi: 'Khuyến nghị không báo ai và xóa các nhật ký cho thấy chín ngày đó.'
    outcomes:
      - p: 0.4
        en: 'The logs are deleted. Duc is relieved, and nobody outside the room knows. The nine days are a gap in the record, and a gap is an answer.'
        vi: 'Các nhật ký bị xóa. Anh Đức nhẹ nhõm, và không ai ngoài phòng biết. Chín ngày là một khoảng trống trong hồ sơ, và khoảng trống là một câu trả lời.'
        effects:
          [
