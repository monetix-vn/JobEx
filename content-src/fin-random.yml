fact: blamed_salesperson
severity: 4
category: integrity
en: 'you blamed a salesperson for an entry you made'
vi: 'bạn đổ lỗi cho nhân viên kinh doanh về một bút toán do bạn ghi'
lesson:
  en: 'You may have been asked, but you made the entry. Saying only that you followed instructions, when you could have refused, shifts what is yours onto someone else.'
  vi: 'Có thể bạn bị nhờ, nhưng bạn là người ghi. Chỉ nói rằng bạn làm theo chỉ dẫn, khi bạn có thể từ chối, là đẩy điều của mình sang người khác.'
traces:
  - { type: witness, visibility: 0.4, detectors: [boss] }
witnessed:
  boss: -4
  finance: -3
public:
  boss: -7
---
fact: blamed_thu
severity: 7
category: integrity
en: 'you blamed a junior colleague for decisions that were not hers'
vi: 'bạn đổ lỗi cho đồng nghiệp trẻ về những quyết định không phải của em'
lesson:
  en: 'Blaming the most junior person is the easiest thing in the room, and the most damaging. She holds the evidence, and she remembers who was kind to her.'
  vi: 'Đổ lỗi cho người ít thâm niên nhất là việc dễ nhất trong phòng, và gây hại nhất. Em nắm bằng chứng và nhớ ai đã tử tế với mình.'
traces:
  - { type: witness, visibility: 0.8, detectors: [internal_audit, boss, finance] }
witnessed:
  boss: -10
  finance: -10
public:
  boss: -16
