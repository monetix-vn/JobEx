fact: adjusted_for_covenant
severity: 7
category: integrity
en: 'you adjusted the accounts until a bank covenant was met'
vi: 'bạn điều chỉnh sổ sách cho đến khi đạt điều khoản cam kết với ngân hàng'
lesson:
  en: 'Adjusting numbers to satisfy a lender is misleading the lender, and it leaves the company borrowing on a picture that is not true.'
  vi: 'Điều chỉnh số liệu để thỏa mãn bên cho vay là đánh lừa họ, và khiến công ty vay dựa trên một bức tranh không đúng.'
traces:
  - { type: document, visibility: 0.7, detectors: [internal_audit, finance, boss] }
witnessed:
  boss: -8
  finance: -6
public:
  boss: -14
  buyer: -4
